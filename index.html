/* ---------- tabs ----------
   Tabs at the bottom of every army screen (Find · Units · Stratagems · Rules · Damage), ‹ › between
   datasheets, and tick boxes for the uses a rule allows per battle, kept until New game. */
// the tabs, and which one the current screen belongs to
const TABS = [['army', 'i-telescope', 'Find'], ['units', 'i-units', 'Units'], ['strats', 'i-cards', 'Stratagems'], ['rules', 'i-book', 'Rules'], ['damage', 'i-swords', 'Damage']];
const isTab = s => TABS.some(([k]) => k === s);
const tabOf = s => ({ unit:'units', pregame:'army', checklist:'army', bases:'army', ranged:'army', melee:'army', abilities:'army' })[s] || s;
const tabBar = () => '<div class="tabs">' + TABS.map(([s, ic, label]) => '<button data-tab="' + s + '"' + (tabOf(cur.s) === s ? ' class="on" aria-current="page"' : '') + ' aria-label="' + label + '"><svg class="ic" aria-hidden="true"><use href="#' + ic + '"/></svg></button>').join('') + '</div>';   // icons only; the name is the button's label
// uses per battle ticked off in this game (Bomb Squig: twice per battle, per unit), per army, until New game
const usedKey = () => 'wh-used-' + (cur.army || '');
const usedSet = () => new Set(Array.isArray(store.get(usedKey())) ? store.get(usedKey()) : []);
// how many uses per battle the printed limit allows, and whether they are the army's or each unit's
function perBattle(x, armyWide){
  const t = [x.tag, x.limit, x.restrictions, x.text, x.effect].filter(Boolean).join(' ');
  const m = /\b(once|twice|three times) per battle\b(?! round)/i.exec(t);
  if(!m) return null;
  return { n:{ once:1, twice:2, 'three times':3 }[m[1].toLowerCase()],
    army:!!armyWide || /per battle\b(?! round)[^.)]*\bper army\b/i.test(t) || /\bone (model|unit) from your army with this ability\b/i.test(t) };
}
// "You can only select each of these abilities once per battle" (Kindred Sorcery), "You can only select each combat doctrine once per
// battle" (Combat Doctrines): a limit on each option, not on the rule, so a box for each option ([name, uses]): its table's rows, else the
// options verify/derive.js reads from its text (CHECKLIST o), with the uses another rule of the list adds to one by name ("You can select
// the assault doctrine one additional time per battle", Assault Mastery); null for any other rule
const EACH_ONCE = /\bselect each\b[^.;]*?\bonce per battle\b(?! round)/i;
function eachOnce(r){
  const plainT = x => String((x && x.text) || '').replace(/\*\*|~~/g, '');
  if(!EACH_ONCE.test(plainT(r))) return null;
  const names = r.table ? r.table.map(o => String(o[0])) : (((D.checklist || {})['r|' + army().faction + '|' + r.name] || {}).o || []).map(o => o.n);
  if(!names.length) return null;
  const more = faction().armyRules.concat(detachments().flatMap(detRules)).flatMap(x => [...plainT(x).matchAll(/\bselect the ([^.;]+?) (one|two) additional times? per battle\b/gi)].map(m => [m[1].toLowerCase(), m[2].toLowerCase() === 'one' ? 1 : 2]));
  return names.map(n => [n, 1 + more.filter(([k]) => k === n.toLowerCase()).reduce((t, [, k]) => t + k, 0)]);
}
// what: the rule's name, for screen readers ("Bomb Squig used, 1 of 2")
const ticks = (key, n, label, what) => { const used = usedSet();
  return '<span class="ticks">' + (label ? '<i>' + esc(label) + '</i>' : '') + Array.from({ length:n }, (_, i) => { const k = key + '#' + i, on = used.has(k);
    return '<button class="tick' + (on ? ' on' : '') + '" data-tick="' + esc(k) + '" aria-pressed="' + on + '" aria-label="' + esc((what ? what + ' used' : 'Used') + (label ? ', ' + label : '') + (n > 1 ? ', ' + (i + 1) + ' of ' + n : '')) + '">' + (on ? '✓' : '') + '</button>'; }).join('') + '</span>'; };
// an ability's boxes on one unit: the army's set, or one set per unit (each copy of a ×N unit)
function abilityTicks(ab, u){
  const pb = perBattle(ab);
  if(!pb || !u || naReason(ab)) return '';
  if(pb.army) return ticks('a:' + ab.name, pb.n, '', ab.name);
  const c = u.copies || 1;
  return Array.from({ length:c }, (_, i) => ticks(copyKey(ab, u, i), pb.n, c > 1 ? 'Unit ' + (i + 1) : '', ab.name)).join('');
}
const copyKey = (ab, u, i) => 'a:' + ab.name + '|' + u.id + ((u.copies || 1) > 1 ? '.' + i : '');
// the units in the order of the Units list, for ‹ › on a datasheet
function unitFlip(u){
  const order = ROLE_ORDER.flatMap(r => army().units.filter(x => roleGroup(x) === r));
  const i = order.indexOf(u), prev = order[i - 1], next = order[i + 1];
  const b = (x, cls, label) => x ? '<button class="flip ' + cls + '" data-flip="' + esc(x.id) + '">' + label + '</button>' : '<span></span>';
  return '<div class="flips">' + b(prev, 'p', '‹ ' + esc(shortName(prev || {}))) + b(next, 'n', esc(shortName(next || {})) + ' ›') + '</div>';
}

/* ---------- navigation ----------
   A screen is { s, army, unit } plus d (its depth) and from (what Back returns to).
   Every step forward is a history entry, so the phone's back gesture walks back up. */
let cur = { s:'home', d:0 };
const plain = c => ({ s:c.s, army:c.army, unit:c.unit, d:c.d || 0, from:c.from, root:c.root });
const sameScreen = (a, b) => a && b && a.s === b.s && a.army === b.army && a.unit === b.unit;
const calm = c => c.s === 'home' || c.s === 'army' || c.s === 'settings';   // screens where an update reload loses nothing
// the open folds of the screen, by position (a screen renders the same each time), and putting them back
const openFolds = () => [...document.querySelectorAll('#view details')].map((d, i) => d.open ? i : -1).filter(i => i >= 0);
const reopen = list => { const all = document.querySelectorAll('#view details'); for(const i of list || []) if(all[i]) all[i].open = true; };
const spot = () => ({ y:scrollY, open:openFolds() });
const toSpot = st => { reopen(st && st.open); scrollTo(0, (st && st.y) || 0); };
function parentOf(c){
  if(c.s === 'unit') return { s:'units', army:c.army };
  if(c.s === 'home') return null;
  if(c.s === 'settings') return c.army ? { s:'army', army:c.army } : { s:'home' };
  if(isTab(c.s)) return ONLY ? null : { s:'home' };
  if(c.s === 'bases') return { s:'pregame', army:c.army };
  return { s:'army', army:c.army };
}
function titleOf(c){
  if(c.s === 'home') return 'Armies';
  if(c.s === 'settings') return 'Settings';
  if(c.s === 'strats') return 'Stratagems';
  if(c.s === 'army') return (armyById(c.army) || {}).name || '';
  if(c.s === 'unit') return ((armyById(c.army) || { units:[] }).units.find(u => u.id === c.unit) || {}).name || '';
  return SCREEN_TITLE[c.s] || '';
}
const backTitle = c => c ? BACK_TITLE[c.s] || titleOf(c) : '';
function valid(c){
  if(!c || !c.s) return false;
  if(c.s === 'home') return true;
  if(c.s === 'settings') return !c.army || !!armyById(c.army);
  const a = armyById(c.army);
  if(!a) return false;
  if(c.s === 'unit') return a.units.some(u => u.id === c.unit);
  return c.s === 'army' || hasOwn(SCREEN_TITLE, c.s);
}
// mode: push (default) | 'sheet' (replaces an open popup's entry) | 'replace' (no history to go back to)
let navAt = -1e9;   // when the screen last changed under your finger
function go(next, mode){
  navAt = performance.now();
  if(mode !== 'sheet'){ try { history.replaceState(Object.assign(plain(cur), spot()), ''); } catch(e){} }
  const d = mode === 'replace' ? (cur.d || 0) : (cur.d || 0) + 1;
  const from = mode === 'replace' ? (next.from || (next.s === 'home' ? undefined : backTitle(parentOf(next)))) : backTitle(cur);
  const root = isTab(next.s) ? d : next.army === cur.army ? cur.root : undefined;   // the depth of this screen's tab
  if(next.army !== cur.army) moreShown.clear();
  cur = Object.assign(plain(next), { d, from, root });
  try { mode ? history.replaceState(plain(cur), '') : history.pushState(plain(cur), ''); } catch(e){}
  if(updateReady && calm(cur)){ reloadNow(); return; }
  render(); scrollTo(0, 0);
}
let tabTo = null;   // the tab tapped on a screen below another tab; set while history steps back to that tab
const tabMemo = {};  // the last screen of each tab of each army (Units → the datasheet you were on), with its scroll spot
const memoKey = (armyId, tab) => (armyId || '') + '|' + tab;
// a tab's first screen, then the screen you were on in it (pushed, so Back returns to the first screen)
function openTab(t){
  const then = t.then; delete t.then;
  go(t, 'replace');
  if(then && valid(then)){ const keep = Object.assign({}, then); go(Object.assign(plain(then), { from:undefined })); toSpot(keep); }
}
function back(){
  if((cur.d || 0) > 0 && history.state && history.state.d === cur.d && !history.state.sheet){ history.back(); return; }
  const up = parentOf(cur);
  if(up) go(up, 'replace');
}
addEventListener('popstate', e => {
  const st = e.state;
  if(st && st.sheet){ if($('#sheetHost').hidden) history.back(); return; }   // stepped forward onto a closed popup: skip it
  hideSheet();
  navAt = performance.now();
  if(tabTo){ const t = tabTo; tabTo = null; if(valid(st)) cur = plain(st); openTab(t); return; }
  if(!valid(st)){ cur = ONLY ? { s:'army', army:ONLY.id, d:0 } : { s:'home', d:0 }; render(); return; }
  if(sameScreen(st, cur)){ cur.d = st.d || 0; cur.from = st.from; renderTop(); return; }   // only a popup closed
  cur = plain(st);
  if(updateReady && calm(cur)){ reloadNow(); return; }
  render(); toSpot(st);
});
// rebuild the history chain for a screen, so Back works after reopening the app
const EMBEDDED = (() => { try { return window.top !== window.self; } catch(e){ return true; } })();
if(EMBEDDED) document.documentElement.classList.add('embedded');
// installed on a phone's home screen: the screen's height in this orientation (see html.tall body in the styles)
function setScrH(){
  const lo = Math.min(screen.width, screen.height), hi = Math.max(screen.width, screen.height);
  document.documentElement.style.setProperty('--scr-h', (innerWidth > innerHeight ? lo : hi) + 'px');
}
if(!EMBEDDED && (matchMedia('(display-mode: standalone)').matches || navigator.standalone === true) && matchMedia('(pointer: coarse)').matches){
  document.documentElement.classList.add('tall'); setScrH(); addEventListener('resize', setScrH);
}
function restore(target){
  if(EMBEDDED){   // inside the Claude app: don't add entries to the host page's history
    cur = Object.assign(plain(target), { d:0, from:target.s === 'home' ? undefined : backTitle(parentOf(target)) });
    try { history.replaceState(plain(cur), ''); } catch(e){}
    render(); return;
  }
  const chain = [];
  for(let c = target; c; c = parentOf(c)) chain.unshift(plain(c));
  chain.forEach((c, i) => { c.d = i; c.from = i ? backTitle(chain[i - 1]) : undefined; c.root = isTab(c.s) ? i : i ? chain[i - 1].root : undefined; });
  try { history.replaceState(chain[0], ''); for(const c of chain.slice(1)) history.pushState(c, ''); } catch(e){}
  cur = chain[chain.length - 1];
  render();
}

/* ---------- army helpers ---------- */
const armyById = id => D.armies.find(a => a.id === id);
const army = () => armyById(cur.army) || D.armies[0];
const factionOf = a => D.factions[a.faction];
const faction = () => factionOf(army());
const detachmentsOf = a => a.detachments.map(id => Object.assign({ id }, factionOf(a).detachments[id])).filter(d => d.name);
const detachments = () => detachmentsOf(army());
const unitById = id => army().units.find(u => u.id === id);
const hasKw = (u, k) => u.kw.some(x => x.toLowerCase() === k.toLowerCase());
function matches(n, u){
  if(!n) return true;
  if(n.all && !n.all.every(k => hasKw(u, k))) return false;
  if(n.any && !n.any.some(k => hasKw(u, k))) return false;
  if(n.none && n.none.some(k => hasKw(u, k))) return false;
  if(n.unless && matches(n.unless, u)) return false;
  // rule: the unit's Rules line names one of these rules (a Chaos Knight's Super-Heavy Walker, or a Preyslayer's Mantle bearer's)
  if(n.rule && !n.rule.some(r => hasRule(u, r))) return false;
  if(n.attached && !u.leads) return false;   // "a friendly attached … unit": one with a leader or support character
  return true;
}
const eligible = (s, a) => (a || army()).units.filter(u => matches(s.needs, u));
// a stratagem whose TARGET is another unit of the list but whose effect changes this unit's attacks (help: Daemonic Fury, a BLOOD
// LEGIONS target and the WORLD EATERS unit within 6" it selects), as shield is for the defence
const helpedBy = (u, a) => allStratagems(a).filter(s => s.help && matches(s.help.to, u) && (a || army()).units.some(x => x !== u && matches(s.help.by, x)));
function allStratagems(a){
  a = a || army();
  const out = [];
  for(const d of detachmentsOf(a)) for(const s of d.stratagems) out.push(Object.assign({ src:d.name }, s));
  for(const s of D.coreStratagems) out.push(Object.assign({ src:'Core' }, s));
  return out;
}
const usableStrats = a => allStratagems(a).filter(s => eligible(s, a).length);
// units that share a name: the unit they are attached to, then which one ("Mek + Tankbustas (1 of 2)"),
// counted in list order (New Recruit's)
const sameName = (a, b) => (a.short || a.name) === (b.short || b.name) && (a.enhancement || '') === (b.enhancement || '');
function twinOf(u){
  const A = army();
  if(!A || !A.units.includes(u)) return null;
  const same = A.units.filter(x => sameName(x, u));
  if(same.length < 2) return null;
  const twins = same.filter(x => (x.leads || '') === (u.leads || '') && (x.upgrade || '') === (u.upgrade || ''));
  if(twins.length < 2) return { lead:u.leads || '', i:'1', n:1, first:1 };
  // numbered by units, not list entries: an entry of 2 identical units is "1–2 of 3", the next "3 of 3"
  const first = twins.slice(0, twins.indexOf(u)).reduce((t, x) => t + (x.copies || 1), 1), c = u.copies || 1;
  return { lead:u.leads || '', i:c > 1 ? first + '–' + (first + c - 1) : String(first), n:twins.reduce((t, x) => t + (x.copies || 1), 0), first };
}
const twinFirst = u => (twinOf(u) || { first:1 }).first;
const twinLabel = u => { const t = twinOf(u); return !t ? '' : (t.lead ? ' + ' + t.lead : '') + (t.n > 1 ? ' (' + t.i + ' of ' + t.n + ')' : ''); };
const shortName = u => (u.short || u.name) + (u.enhancement && !u.enhOn ? ' · ' + u.enhancement : '') + twinLabel(u);   // an enhancement on another character (enhOn) is not this name's
const unitCount = a => a.units.reduce((t, u) => t + (u.copies || 1), 0);
// whose an ability is: in an attached unit, the part its datasheet gives it to (ab.who: Hunters from the Warp is the Flesh Hounds',
// not Karanak's), else the unit
const abOwner = (u, ab) => { const own = ab && (u.leads || (u.also || []).length) && u.abilities.find(x => x.name === ab.name && x.text === ab.text);
  return own && own.who && own.who !== u.name ? own.who : u.short || u.name; };
// the names and counts of a summary: with ab, each unit as the part that has it (abOwner); copies: each copy of a ×N unit counted
const nameCounts = (units, ab, copies) => { const n = new Map();
  for(const u of units){ const k = ab ? abOwner(u, ab) : u.short || u.name; n.set(k, (n.get(k) || 0) + (copies ? u.copies || 1 : 1)); }
  return [...n]; };
// "Big Mek ×2, Killa Kans": unit names for a one-line summary (ab: the ability it names them for, abOwner)
function unitNames(units, ab){
  return nameCounts(units, ab).map(([k, c]) => k + (c > 1 ? ' ×' + c : '')).join(', ');
}
// the same as HTML, every copy of a ×N unit counted, the count as its pill ("Rendmaster on Blood Throne ×2": the Phase checklist)
const unitNamesX = (units, ab) => nameCounts(units, ab, true).map(([k, c]) => esc(k) + (c > 1 ? '<span class="x">×' + c + '</span>' : '')).join(', ');
// detachment rules that apply to a unit (by keyword)
// a detachment's rules: `rule`, then any further ones (`moreRules`: Blood Legion's Blood Tainted after Murdercall)
const detRules = d => d && d.rule ? [d.rule].concat(d.moreRules || []) : [];
const unitDetRules = u => detachments().flatMap(d => detRules(d).filter(r => r.needs && matches(r.needs, u)));
// the parts of a detachment rule that are for some of its units only (parts: Blood Tithe's Daemonic Rage and Boon of Blood are for
// BLOOD LEGIONS units), each with the rule it is part of
const unitDetParts = u => unitDetRules(u).flatMap(r => (r.parts || []).filter(p => matches(p.needs, u)).map(p => ({ rule:r, part:p })));
const allUnitRules = u => u.rules.concat(unitDetRules(u).map(r => r.name).filter(n => !u.rules.includes(n)));
const unitRules = u => allUnitRules(u).filter(r => !inertRule(r));   // the ones that do something in this list
// a rule of the unit only one of its models has (data.js partialRules: Canis Rex's Lone Operative is Sir Hekhtur's): that model
const partialWho = (u, label) => { const p = u.partialRules || {}; if(hasOwn(p, label)) return p[label];
  // (not another entry of the same Rules line: Trajann's own "Feel No Pain 5+" is not the unit's "Feel No Pain 5+*")
  const rl = u.rules || [], k = ruleKey(label), e = k && Object.entries(p).find(([r]) => ruleKey(r) === k && !(rl.includes(r) && rl.includes(label))); return e ? e[1] : ''; };
// "Canis Rex: Sir Hekhtur only" on a line of its own, "Canis Rex (Sir Hekhtur only)" in a list
const onlyTag = (u, label, inList) => !partialWho(u, label) ? '' : '<span class="from">' + (inList ? ' (' : ': ') + esc(partialWho(u, label)) + ' only' + (inList ? ')' : '') + '</span>';
// an army rule that needs units this army doesn't have, e.g. Bondsman with no ARMIGER models
function inertRule(name){
  const r = faction().armyRules.find(x => x.name === name);
  return !!(r && r.needs && !army().units.some(u => matches(r.needs, u)));
}
// an ability that can't be used in this list: the data says why, or it is a Bondsman ability with no ARMIGER
const naReason = ab => ab.na || (/bondsman/i.test(ab.tag || '') && inertRule('Bondsman') ? 'No ARMIGER models in this list' : '');
// rules other units give this one (Ghazghkull's aura, the Dreadherder's re-rolls)
function auraMods(u){
  const out = [];
  for(const src of army().units) for(const m of src.aura || []){
    const self = src === u;
    if((self && m.notSelf) || !matches(m.needs, u)) continue;
    out.push(Object.assign({}, m, { when:self && m.selfWhen ? m.selfWhen : m.when, src }));
  }
  return out;
}
// everything that changes this unit's attacks: its own abilities, detachment rules, auras
// a rule worded for squads ("below Starting Strength") reads in wounds for a one-model unit (r.mod.single):
// {half} = the most wounds it can have left and still be below half-strength
const halfBelow = u => Math.ceil((parseInt(u.stats[0].W, 10) || 0) / 2) - 1;
const singleMod = (m, u) => m.single && modelCount(u) === 1 ? Object.assign({}, m, { when:m.single.when, note:m.single.note.replace('{half}', halfBelow(u)) }) : m;
function unitMods(u, kind){
  const det = unitDetRules(u).filter(r => r.mod).map(r => Object.assign({ from:r.name, rule:r.name }, singleMod(r.mod, u)))
    .concat(unitDetParts(u).filter(x => x.part.mod).map(x => Object.assign({ from:x.rule.name, rule:x.rule.name }, x.part.mod)));
  for(const [k, list] of [['ranged', u.ranged], ['melee', u.melee]]){
    const lance = [...new Set((list || []).filter(w => w.kw.some(x => /^lance/i.test(x))).map(w => w.group || w.name))];
    if(lance.length) det.push({ kind:k, when:'Made a charge move this turn', note:andList(lance) + ' +1 to wound', from:'Lance', rule:'Lance' });
  }
  if(hasKw(u, 'Towering') && !hasKw(u, 'Aircraft') && D.rules['Plunging Fire']) det.push({ kind:'ranged', when:'Visible target within 12" with models on ground level (not AIRCRAFT)', note:'BS improved by 1', from:'Plunging Fire', rule:'Plunging Fire' });
  const strat = allStratagems().filter(s => s.mod && eligible(s).includes(u)).map(s => Object.assign({ from:s.name, strat:s.id, cp:s.cp }, s.mod))
    .concat(helpedBy(u).map(s => Object.assign({ from:s.name, strat:s.id, cp:s.cp }, s.help.mod)));
  return (u.mods || []).concat(det, auraMods(u), strat).filter(m => m.kind === kind || m.kind === 'all');
}
// the footnotes the weapon tables show (datasheet, Ranged and Melee screens): unitMods, and the Waaagh! army rule's "That unit's
// ranged attacks have [ASSAULT]" while riled up, for a unit with that rule some of whose ranged weapons lack [ASSAULT] (a weapon
// keyword only: the Damage tab has nothing to count for it)
const shownMods = (u, kind) => unitMods(u, kind).concat(kind === 'ranged' && u.rules.includes('Waaagh!') && (u.ranged || []).some(w => !w.kw.some(k => /^assault$/i.test(k)))
  ? [{ kind:'ranged', when:'Riled up', cond:'riled', note:'[ASSAULT]', from:'Waaagh!', rule:'Waaagh!' }] : []);
// phases and turn: turns can override the turn for one phase ("your Shooting phase or the Fight phase")
const phasesOf = x => x.phases || x.ph || [];
const phTurn = (x, p) => (x.turns && x.turns[p]) || x.turn || 'either';
// start-of-phase rules first, end-of-phase rules last
const timing = text => /^(once per [a-z ]+, )?(at )?(the )?start of/i.test(text || '') ? 0 : /^(once per [a-z ]+, )?(at )?(the )?end of/i.test(text || '') ? 2 : 1;
// "Movement · Their turn", "Any phase · Either turn", "Your Shooting / Fight (either turn)"
function whenTag(x){
  if(x.at) return x.at;
  const ph = phasesOf(x);
  if(!ph.length) return '';
  const t = ph.map(p => phTurn(x, p));
  if(t.every(v => v === t[0])) return (ph.length === PHASES.length ? 'Any phase' : ph.map(p => PHASE_NAME[p]).join(' / ')) + ' · ' + TURN_NAME[t[0]];
  return ph.map((p, i) => t[i] === 'your' ? 'Your ' + PHASE_NAME[p] : t[i] === 'opp' ? 'Their ' + PHASE_NAME[p] : PHASE_NAME[p] + ' (either turn)').join(' / ');
}
// weapons, counting a multi-profile weapon once
function weaponItems(list){
  const items = [];
  for(const w of list || []){
    const last = items[items.length - 1];
    if(w.group && last && last.group === w.group && last.who === w.who) last.profiles.push(w);
    else items.push({ group:w.group, who:w.who, n:w.n, profiles:[w] });
  }
  return items;
}
const weaponCount = (a, kind) => a.units.reduce((t, u) => t + weaponItems(u[kind]).length, 0);
// wargear New Recruit lists for the unit but on no models line (data.js `unplaced`): which models carry it is not said
const unplacedOf = u => (u.unplaced || []).map(name => { const x = [...(u.ranged || []), ...(u.melee || []), ...(u.abilities || [])].find(y => (y.group || y.name) === name) || {};
  const n = +x.n || 1; return { name, n, note:'New Recruit lists ' + (n > 1 ? 'them' : 'it') + ' for the ' + (x.who || u.name) + ', not which model' + (n > 1 ? 's carry them' : ' carries it') }; });
function nameTags(u, opts){
  const t = [];
  if(u.warlord) t.push('<span class="tg">Warlord' + (u.warlordOn ? ' (' + esc(u.warlordOn) + ')' : '') + '</span>');
  if(u.enhancement) t.push('<span class="tg">' + esc(u.enhancement + (u.enhOn ? ' (' + u.enhOn + ')' : '')) + '</span>');
  if(u.leads && !(opts && opts.noLeads)) t.push('<span class="tg m">+ ' + esc(partsAfter(u).join(' + ')) + '</span>');
  if(u.upgrade) t.push('<span class="tg">' + esc(u.upgrade) + '</span>');
  const tw = twinOf(u); if(tw && tw.n > 1) t.push('<span class="tg m">' + tw.i + ' of ' + tw.n + '</span>');
  if(u.copies > 1 && !(opts && opts.noCopies)) t.push('<span class="tg m">×' + esc(u.copies) + ' units</span>');
  return t.join('');
}
// (a copy the unit cannot use, na: its own key, so Find and its popup never merge it with a usable copy: Khârn's Icon of Khorne)
const abilityKey = ab => army().id + '|' + ab.name + '|' + ab.text + (ab.na ? '|na' : '');
// the units that took an enhancement; an UPGRADE (Supa-snazz Dakka) is on the unit it upgrades, the bodyguard
const holders = (a, name) => a.units.filter(u => u.enhancement === name || u.upgrade === name);
// which of several same-named units ("Chaos Terminators (1–2 of 3)"), or how many an entry is ("×2")
const unitNo = u => { const t = twinOf(u); return t && t.n > 1 ? ' (' + t.i + ' of ' + t.n + ')' : u.copies > 1 ? ' ×' + u.copies : ''; };
const holderName = (u, name) => u.upgrade === name && u.leads ? u.leads + ' (' + unitLabel(u) + unitNo(u) + ')' : u.enhOn && name === u.enhancement ? u.enhOn + ' (' + unitLabel(u) + unitNo(u) + ')' : unitLabel(u) + unitNo(u);

/* ---------- rules and rich text ---------- */
function ruleFor(label){
  const f = faction();
  let clean = String(label).replace(/^\[|\]$/g, '').replace(/\*$/, '').trim();
  for(const [re, key] of f.aliases || []) if(re.test(clean)){ clean = key; break; }
  const lc = clean.toLowerCase();
  // an army rule with a core ability's name (coreTwin: Imperial Knights' Super-heavy Walker) opens with that core ability
  const ar = f.armyRules.find(r => r.name.toLowerCase() === lc && !r.coreTwin);
  if(ar) return { name:ar.name, key:ar.name, text:ar.text, table:ar.table, tableAt:ar.tableAt, missing:ar.missing, note:ar.note, src:f.name + ' army rule' };
  for(const d of detachments()) for(const r of detRules(d)) if(r.name.toLowerCase() === lc) return { name:r.name, key:r.name, text:r.text, table:r.table, tableAt:r.tableAt, needs:r.needs, note:r.note, src:d.name + ' detachment rule' };
  const src = key => (D.ruleSrc || {})[key] || 'Core rule';   // the Orks terms say where they come from
  for(const [re, key] of D.ruleAliases) if(re.test(clean)) return { name:clean, key, text:D.rules[key], src:src(key) };
  if(D.rules[clean]) return { name:clean, key:clean, text:D.rules[clean], src:src(clean) };
  return null;
}
const ruleKey = label => (ruleFor(label) || {}).key;
// (not the end of a hyphenated word: "GRAV-ASSAULT" does not mention Assault; "ANTI-PSYKER" does mention Anti)
const mentions = (text, key) => new RegExp('(?<![\\w-])' + key.replace(/[-]/g, '.') + '\\b', 'i').test(text);
// the units in this army a core rule applies to: unit rules, weapon keywords, ability text
const CONCEPT = new Set(D.concepts || []);   // general terms (charge, destroyed…) that every unit "uses"
function ruleUsers(key){
  if(CONCEPT.has(key)) return [];
  return army().units.filter(u => unitRules(u).some(r => ruleKey(r) === key) ||
    [...(u.ranged || []), ...(u.melee || [])].some(w => w.kw.some(k => ruleKey(k) === key) || (w.hunter && key === 'Hunter')) ||
    u.abilities.some(ab => mentions(ab.text, key)));
}
// the units that use a core rule, each saying where it has it when that is only in one of its
// abilities ("Big Mek · Dreadherder (Dreadherder)": its Lone Operative is in that enhancement)
function usersVia(label, key){
  const us = ruleUsers(key);
  if(!us.length) return '';
  const own = u => unitRules(u).some(r => ruleKey(r) === key) || [...(u.ranged || []), ...(u.melee || [])].some(w => w.kw.some(k => ruleKey(k) === key) || (w.hunter && key === 'Hunter'));
  return '<p class="usedby"><span class="il">' + label + '</span>' + us.map(u => { if(own(u)) return unitLink(u) + onlyTag(u, key, true);
    const abs = u.abilities.filter(ab => mentions(ab.text, key)).map(ab => ab.name);
    return unitLink(u) + (abs.length ? ' <span class="from">(in ' + esc(abs.join(', ')) + ')</span>' : ''); }).join(', ') + '</p>';
}
// **bold** text; bold terms that name a rule (Deep Strike, riled up, …) open it when tapped; ~~struck~~ text
const inline = s => esc(s).replace(/~~(.+?)~~/g, '<s>$1</s>')
  .replace(/\*\*(.+?)\*\*/g, (m, t) => { const r = ruleFor(t); return r && r.key !== sheetRule ? '<b class="rl" role="button" tabindex="0" data-rule="' + t + '">' + t + '</b>' : '<b>' + t + '</b>'; });
function rt(text){
  const lines = String(text || '').split('\n');
  let html = '', list = [];
  const flush = () => { if(list.length){ html += '<ul>' + list.map(l => '<li>' + inline(l) + '</li>').join('') + '</ul>'; list = []; } };
  for(const raw of lines){
    const l = raw.trim();
    if(!l) continue;
    if(l.startsWith('- ')){ list.push(l.slice(2)); continue; }
    flush();
    html += /^\*[^*].*\*$/.test(l) ? '<p class="it">' + inline(l.slice(1, -1)) + '</p>' : '<p>' + inline(l) + '</p>';
  }
  flush();
  return '<div class="rt">' + html + '</div>';
}
const ttable = t => t.some(([k]) => String(k).length > 8)
  ? '<div class="tlist">' + t.map(([k, v]) => '<div><b>' + esc(k) + '</b>' + rt(v) + '</div>').join('') + '</div>'
  : '<div class="ttable">' + t.map(([k, v]) => '<span>' + esc(k) + '</span><span>' + inline(v) + '</span>').join('') + '</div>';
const unitLink = u => '<span class="link" role="button" tabindex="0" data-unit="' + esc(u.id) + '">' + esc(shortName(u)) + '</span>';
const usedBy = (label, units) => units.length ? '<p class="usedby"><span class="il">' + label + '</span>' + units.map(unitLink).join(', ') + '</p>' : '';
// an attached unit by all its parts ("Sorcerer + Rubric Marines"), where an ability's or a stratagem's users are listed
const wholeLink = u => u.leads ? linkTo('unit', u.id, unitLabel(u) + (u.enhancement && !u.enhOn ? ' · ' + u.enhancement : '') + unitNo(u)) : unitLink(u);

// every Force Disposition a list can lock: those its detachments allow (data.js, checked against BSData by verify/dispositions.js),
// in BSData's order; the one New Recruit printed for the list (a.disposition) is the chosen one
const DISP_ORDER = ['Disruption', 'Priority Assets', 'Purge the Foe', 'Take and Hold', 'Reconnaissance'];
const dispsOf = a => { const all = new Set(detachmentsOf(a).flatMap(d => d.dispositions || [])); if(a.disposition) all.add(a.disposition);
  return DISP_ORDER.filter(x => all.has(x)).concat([...all].filter(x => !DISP_ORDER.includes(x))); };

/* ---------- screen: armies ---------- */

const armyRow = a => '<button class="row arow" data-army="' + esc(a.id) + '"><span class="rb"><b>' + esc(a.name) + '<span class="apts">' + esc(a.pointsUsed) + ' pts</span></b>' +

// the lists grouped by faction (factions A to Z, lists in their own order), each under a band as the Units list's roles

// home filters: one faction, one detachment, one disposition at a time, kept on this phone
// (shown once there are more than two lists)
const HF_KEYS = ['faction', 'det', 'disp'];
const HF_LABEL = { faction:'Faction', det:'Detachment', disp:'Disposition' };
const hfOf = (a, k) => k === 'faction' ? [factionOf(a).name] : k === 'det' ? detachmentsOf(a).map(d => d.name) : dispsOf(a);   // disposition: any it can lock
function homeFilter(){
  if(D.armies.length <= 2) return {};
  const f = store.get('wh-home-filter'), out = {};
  // a value no list has any more (a list was removed) is dropped
  if(isObj(f)) for(const k of HF_KEYS) if(typeof f[k] === 'string' && D.armies.some(a => hfOf(a, k).includes(f[k]))) out[k] = f[k];
  return out;
}
const hfMatch = (a, f, skip) => HF_KEYS.every(k => k === skip || !f[k] || hfOf(a, k).includes(f[k]));
const homeFilters = f => '<div class="hfs">' + HF_KEYS.map(k => '<button class="hfc' + (f[k] ? ' on' : '') + '" data-hfopen="' + k + '" aria-label="' + HF_LABEL[k] + ': ' + esc(f[k] || 'all') + '">' +
    '<span>' + esc(f[k] || HF_LABEL[k]) + '</span>' + chev + '</button>').join('') +
  (Object.keys(f).length ? '<button class="hfx" data-hfclear>Clear</button>' : '') + '</div>';
// the choices: every value some list has, with how many lists it leaves given the other filters
function showHomeFilter(k){
  const f = homeFilter(), fac = new Map();
  for(const a of D.armies) for(const v of hfOf(a, k)) if(!fac.has(v)) fac.set(v, factionOf(a).name);
  const vals = [...fac.keys()].sort((x, y) => (k === 'det' ? fac.get(x).localeCompare(fac.get(y)) : 0) || x.localeCompare(y));
  const opt = (v, label, sub) => { const n = D.armies.filter(a => hfMatch(a, f, k) && (!v || hfOf(a, k).includes(v))).length, on = (f[k] || '') === v;
    return '<button class="row hfo' + (on ? ' on' : '') + '" data-hf="' + esc(k + '|' + v) + '" aria-pressed="' + on + '"' + (n || on ? '' : ' disabled') + '><span class="rb"><b>' + esc(label) + '</b>' +
      (sub ? '<span>' + esc(sub) + '</span>' : '') + '</span><span class="c">' + n + '</span>' + (on ? '<svg class="ic ok" aria-hidden="true"><use href="#i-check"/></svg>' : '<span class="ic"></span>') + '</button>'; };
  openSheet('Show armies by', HF_LABEL[k], '<div class="list hfl">' + opt('', 'Any ' + HF_LABEL[k].toLowerCase(), '') +
    vals.map(v => opt(v, v, k === 'det' ? fac.get(v) : '')).join('') + '</div>');
}

// random army: a reel of names that slows down and stops on one of the lists the filters show
function rollArmy(){
  const pool = D.armies.filter(a => hfMatch(a, homeFilter()));
  if(pool.length < 2) return;
  const pick = pool[Math.floor(Math.random() * pool.length)], H = 64;
  const reel = Array.from({ length:26 }, (_, i) => pool[(Math.floor(Math.random() * pool.length) + i) % pool.length]);
  reel.push(pick, pool[(pool.indexOf(pick) + 1) % pool.length]);   // the pick, with a name under it
  const item = a => '<div class="ri"><b>' + esc(a.name) + '</b><span>' + esc(factionOf(a).name) + '</span></div>';
  openSheet('', 'Random army', '<div class="reel" aria-hidden="true"><div class="rs">' + item(pool[pool.length - 1]) + reel.map(item).join('') + '</div></div>' +
    '<p class="rres" aria-live="polite"></p><div class="racts" hidden><button class="btn" data-army="' + esc(pick.id) + '">Open ' + esc(pick.name) + '</button><button class="btn2" data-roll>Roll again</button></div>');
  const strip = $('#sheetIn .rs'), stopAt = -(reel.length - 2) * H;   // the pick sits in the middle row
  const done = () => { $('#sheetIn .reel').classList.add('hit'); $('#sheetIn .rres').textContent = pick.name + ' · ' + factionOf(pick).name; $('#sheetIn .racts').hidden = false; };
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ strip.style.transform = 'translateY(' + stopAt + 'px)'; done(); return; }
  strip.getBoundingClientRect();
  strip.style.transition = 'transform 2.4s cubic-bezier(.12,.62,.16,1)';
  strip.style.transform = 'translateY(' + stopAt + 'px)';
  strip.addEventListener('transitionend', done, { once:true });
}

/* ---------- import a list from New Recruit ----------
   New Recruit's JSON export, from a file or pasted: import.js takes it only when every unit, option, enhancement and detachment in
   it is one the app's own lists have, exactly; otherwise nothing is added and each item it does not recognize is listed, one per
   line. An imported list is kept on this phone (the export, made again from this data.js at every start) and removed from its Overview. */
const importRow = () => '<div class="list imprt"><button class="row" data-import><svg class="ic" aria-hidden="true"><use href="#i-import"/></svg><span class="rb"><b>Import a list from New Recruit</b>' +
    '<span>Its JSON export</span></span>' + arrow + '</button>' +
  importStale.map(x => '<button class="row" data-impstale="' + esc(x.id) + '"><span class="rb"><b>' + esc(x.name) + '</b><span>Imported list: this version of the app no longer has all of it</span></span>' + arrow + '</button>').join('') + '</div>';
const today = () => new Date().toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
const firstUp = t => String(t).charAt(0).toUpperCase() + String(t).slice(1);
const impList = errors => '<ul class="impl">' + errors.map(e => '<li>' + esc(firstUp(e)) + '</li>').join('') + '</ul>';
function showImport(){
  openSheet('New Recruit', 'Import a list',
    '<p class="lead">In New Recruit, open the list, then Export and JSON. Choose that file here, or paste its text.</p>' +
    '<label class="btn2 impf"><input type="file" id="impFile" accept=".json,application/json">Choose the .json file</label>' +
    '<textarea id="impText" class="impt" rows="4" placeholder="…or paste the export here" aria-label="The New Recruit JSON export" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>' +
    '<button class="btn impgo" data-impgo>Import</button><div id="impOut" aria-live="polite"></div>' +
    '<p class="note">The list is taken only when every unit, option, enhancement and detachment in it is one that the app’s own checked lists have, exactly. Otherwise nothing is added, and each item the app does not recognize is listed. An imported list is kept on this phone.</p>');
}
function runImport(text){
  const out = $('#impOut');
  if(!out || !window.WH_IMPORT) return;
  if(!String(text || '').trim()){ out.innerHTML = '<div class="impno"><p class="qh">Nothing to import</p><p class="lead">Choose the .json file, or paste the export first.</p></div>'; return; }
  let json = null; try { json = JSON.parse(text); } catch(e){}
  const taken = new Set(D.armies.map(a => a.id).concat(importedKept().map(x => x.id)));
  const date = today();
  let r; try { r = WH_IMPORT.resolve(json || text, D, { date }); } catch(e){ r = { ok:false, errors:['not a New Recruit JSON export (it could not be read)'] }; }
  if(!r.ok){
    out.innerHTML = '<div class="impno"><p class="qh">Not imported · ' + r.errors.length + (r.errors.length === 1 ? ' item' : ' items') + ' not recognized</p>' + impList(r.errors) +
      '<p class="note">Nothing was added. The app takes a list only when it already has every part of it.</p></div>';
    out.scrollIntoView({ block:'nearest' });
    return;
  }
  const A = r.army; let id = A.id, k = 2; while(taken.has(id)) id = A.id + '-' + k++;
  A.id = id;
  try { store.set(IMPORT_KEY, importedKept().concat([{ id, name:A.name, date, json:WH_IMPORT.slim(json) }])); } catch(e){}
  const saved = importedKept().some(x => x.id === id);
  D.armies.push(A); ONLY = D.armies.length === 1 ? D.armies[0] : null;
  hideSheet(); go({ s:'army', army:id }, 'sheet');
  toast(saved ? 'Imported ' + A.name : 'Imported ' + A.name + ' for now: this phone could not keep it');
}
// an imported list's Overview ends with where it came from and its Remove (a confirm on the page, not a browser dialog)
const importedFoot = a => { const x = importedKept().find(y => y.id === a.id);
  return '<div class="sec-h"><h2>On this phone</h2></div><p class="note">Imported from New Recruit' + (x && x.date ? ' on ' + esc(x.date) : '') + ', made of units the app’s own lists have. ' +
    (x ? 'Kept on this phone only.' : 'This phone could not keep it: it is gone when the app next starts.') + '</p>' +
    '<div class="imprm" id="impRm">' + impRmBtn(a.id) + '</div>'; };
const impRmBtn = id => '<button class="btn2" data-imprm="' + esc(id) + '">Remove this list</button>';
function askRemove(id){
  const host = $('#impRm'), x = importedKept().find(y => y.id === id) || {}, a = armyById(id) || x;
  if(!host) return;
  host.innerHTML = '<p class="lead">Remove ' + esc(a.name || 'this list') + ' from this phone? You can import it again.</p><div class="racts"><button class="btn" data-imprmyes="' + esc(id) + '">Remove</button><button class="btn2" data-imprmno="' + esc(id) + '">Keep it</button></div>';
  const b = host.querySelector('[data-imprmno]'); if(b) b.focus({ preventScroll:true });
  host.scrollIntoView({ block:'center' });   // both buttons in sight, above the tab bar
}
function removeImported(id){
  const a = armyById(id), x = importedKept().find(y => y.id === id), name = (a || x || {}).name || 'the list';
  store.set(IMPORT_KEY, importedKept().filter(y => y.id !== id));
  const i = D.armies.findIndex(y => y.id === id && y.imported); if(i >= 0) D.armies.splice(i, 1);
  const j = importStale.findIndex(y => y.id === id); if(j >= 0) importStale.splice(j, 1);
  try { localStorage.removeItem('wh-used-' + id); localStorage.removeItem('wh-check-' + id); } catch(e){}   // its per-battle ticks and its Phase checklist boxes
  ONLY = D.armies.length === 1 ? D.armies[0] : null;
  hideSheet(); go({ s:'home' }, 'replace');

  const also = 'atk' in o ? dmCleanTicks(st, x.dropped.filter(d => !d.fact).map(d => d.ck + '|' + d.f + '|' + d.k)) : [];
  saveSession(); rerender();
  const nx = DM_UNDO.filter(y => y.army === dmMe().id).pop();
  // (short: with another change to undo, the toast names that one, as its Undo reverts it)

// your unit changed: a tick stays only where its rule still applies to the new unit. One the rules now rule out (it would become
// "counted by you") or with no rule for the new unit is dropped, and so is a weapon's or a pick's own choice with nothing left to
// choose. Every step's ticks, in the turn or not (a step taken out keeps its ticks for when it is added back). keep: ticks not to drop
// (put back by an Undo). Returns what was dropped: { ck, f, k, v, name, why }
function dmCleanTicks(st, keep){
  const out = [], kept = new Set(keep || []), d = st.dir;
  const ids = Object.keys(DM_STEPS).filter(id => isObj(st.ch[d + ':' + id]));
  if(!ids.length) return out;
  // the unit with every one of those steps in its turn (the charge as it is)
  const s2 = JSON.parse(JSON.stringify(st)), tr = isObj(st.turn[d]) ? st.turn[d] : {};
  s2.turn[d] = { shoot:ids.includes('shoot'), charge:!!tr.charge, fight:ids.includes('fight') };
  const plan = dmPlan(s2);
  if(!plan.P.ready) return out;
  const nm = dmName(plan.P.au, plan.P.A);
  for(const id of ids){ const ck = d + ':' + id, c = st.ch[ck], b = plan.beats.find(x => x.id === id);
    const drop = (f, k, said, why) => { if(kept.has(ck + '|' + f + '|' + k)) return; out.push({ ck, f, k, v:c[f][k], name:said, why, step:DM_STEPS[id].label }); delete c[f][k]; };
    if(!b){ // a step this unit cannot play: its ticks have nothing to count for
      for(const f of ['on', 'off', 'pick', 'val']) if(isObj(c[f])) for(const k of Object.keys(c[f])) drop(f, k, f === 'on' && c.on[k] === true && /^m:/.test(k) ? dmTickName(k) : '', 'no ' + DM_STEPS[id].label.toLowerCase() + ' for this unit');
      continue; }
    const M = b.M, items = new Map();
    for(const r of M.rules) items.set(r.k, { state:r.state, name:(r.m.cp ? r.m.cp + 'CP ' : '') + r.m.from, why:r.why });
    for(const x of M.sit) items.set(x.k, { state:'on', name:x.label });
    for(const c0 of M.weapons) for(const x of c0.lim) items.set(x.k, { state:'on', name:'' });
    if(isObj(c.on)) for(const [k, v] of Object.entries(c.on)){ const it = items.get(k);
      if(!it) drop('on', k, v === true && /^m:/.test(k) ? dmTickName(k) : '', 'not for ' + nm);
      else if(v === true && (it.state === 'out' || it.state === 'nc')) drop('on', k, it.name, it.why || 'not for ' + nm); }
    const wk = new Set(M.weapons.map(w => w.k));
    for(const f of ['off', 'pick']) if(isObj(c[f])) for(const k of Object.keys(c[f])) if(!wk.has(k)) drop(f, k, '', '');
    if(isObj(c.val)) for(const k of Object.keys(c.val)) if(/^(pick|dice):/.test(k) && !M.rules.some(x => x.pillKey === k || x.diceKey === k)) drop('val', k, '', '');
  }
  return out;
}
// a tick's rule, named from its key ("m:Kustom Dakka|…" → "Kustom Dakka")
const dmTickName = k => k.replace(/^m:/, '').replace(/^\d+CP /, '').split(/[|:]/)[0];
// the ticks dropped, in words: "1CP Kustom Dakka unticked (not for Gretchin)"
const dmDroppedWords = list => { const named = list.filter(d => d.name), nm = [...new Set(named.map(d => d.name.replace(/^\d+CP /, '')))];
  return named.length ? andList(nm) + ' unticked' + (nm.length === 1 && named[0].why ? ': ' + named[0].why : '') : ''; };
// your unit changed: the facts about it and the attack reset, every step: its own facts (riled up, stationary, on an objective, BATTLELINE
// or within 6"), the closest target, a charge, an objective of either, the half-range band, where it stands (Plunging Fire, close-quarters,
// indirect, the target engaged). The target set by hand and its own facts stay. Returns what was reset, as a dropped tick is
// ({ fact, d, who, k, v } or { ck, f, k, v }), with its name
const DM_PAIR_FACT = new Set(['closest', 'closest18', 'charged']);
const DM_FACT_SHORT = { closest:'closest target', closest18:'closest within 18"', charged:'charged this turn', objective:'on an objective', objectiveNotYours:'on an objective not yours',
  riled:'riled up', stationary:'remained stationary', battleline6:'BATTLELINE or within 6"' };
const DM_PAIR_TICK = { 'c:plunging':'Plunging Fire', 'c:cq':'close-quarters shooting', 'c:cqo':'close-quarters shooting', 'c:indirect':'indirect shooting', 'c:still':'remained stationary, target visible', 'c:engaged':'target engaged' };
function dmResetPair(st){
  const out = [], d = st.dir, F = isObj(st.facts[d]) ? st.facts[d] : {};
  for(const who of Object.keys(F)) if(isObj(F[who])) for(const k of Object.keys(F[who]))
    if(who === 'pair' || who === 'mine' || DM_PAIR_FACT.has(k)){ out.push({ fact:true, d, who, k, v:F[who][k], name:who === 'pair' && k === 'objective' ? 'on an objective' : DM_FACT_SHORT[k] || k }); delete F[who][k]; }
  for(const id of Object.keys(DM_STEPS)){ const ck = d + ':' + id, c = st.ch[ck]; if(!isObj(c)) continue;
    if(isObj(c.val) && 'half' in c.val){ out.push({ ck, f:'val', k:'half', v:c.val.half, name:'half range' }); delete c.val.half; }
    if(isObj(c.on)) for(const [k, name] of Object.entries(DM_PAIR_TICK)) if(k in c.on){ out.push({ ck, f:'on', k, v:c.on[k], name }); delete c.on[k]; } }
  return out;
}
const dmResetWords = list => { const nm = [...new Set(list.map(x => x.name))]; return nm.length ? 'reset: ' + andList(nm) : ''; };
// your unit picked: the turn keeps its shape (a step the new unit cannot play is dropped) and so do the ticks whose rule still applies
// (dmCleanTicks); the facts about the attack reset (dmResetPair). Returns the words for the toast and what was dropped
function dmSetUnit(st, id){
  st.atk = id;
  const u = dmPair(st).au, reset = dmResetPair(st), dropped = dmCleanTicks(st, []), w = dmDroppedWords(dropped), rw = dmResetWords(reset);
  // every unit change is said (and can be undone): the unit picked, what it dropped and what it reset
  const nm = u ? dmName(u) : '', said = (w ? [w] : []).concat(rw ? [rw] : []);
  return { words:(said.length ? (said.join(' ').includes(nm) ? said : [nm].concat(said)) : [nm + ' picked']).join(' · '), dropped:dropped.concat(reset) };
}
// a turn starts as the mode given when the unit has weapons for it, else Shoot for a unit with ranged weapons, else Fight
function dmStart(P, mode){
  const au = P && P.au, can = m => !au || m === 'both' || dmArmed(au, m === 'shoot' ? 'ranged' : 'melee');
  return dmModeTurn(DM_MODES.includes(mode) && can(mode) ? mode : au && !dmArmed(au, 'ranged') && dmArmed(au, 'melee') ? 'fight' : 'shoot');
}
// a turn stored by the earlier screen (its steps: shoot, charge, fight, back), read as a mode (Shoot and Fight together: Both; a Fight
// keeps its charge as "Charged this turn"); a turn of "they attack" is dropped
function dmModeOld(st){
  delete st.turn.them; delete st.step.them;
  const t = st.turn.me;
  if(!isObj(t) || DM_MODES.includes(t.mode)) return;
  const m = dmModeOf(t);
  if(m) st.turn.me = dmModeTurn(m, m === 'fight' ? { fc:!!t.charge } : {}); else delete st.turn.me;
  st.step.me = '';
}

/* ---- popups: the working of the step shown, the pickers ---- */
function dmWorkSheet(){
  const C = DM_CTX; if(!C || !C.A) return;
  const { A, st, plan } = C, b = plan.beats[plan.k], n = WH_CALC.fmt, p = WH_CALC.fmtStep, both = plan.both;
  // Both: each part's working, the shooting's then the fight's; the chances at the end of the fight
  const parts = both ? plan.beats.map((bb, i) => [bb, A.parts[i]]).filter(x => x[1]) : [[b, A]];
  const last = parts[parts.length - 1][1];
  let h = '';
  if(A.models > 1){
    const rb = last.rb, atLeast = k => rb.dist.slice(k).reduce((t, q) => t + q, 0);
    const ks = []; for(let k = 1; k <= A.models; k++){ const v = atLeast(k); if((v < 0.995 && v >= 0.005) || k === A.models || (v >= 0.995 && atLeast(k + 1) < 0.995)) ks.push(k); }
    h += '<h3 class="dmh3">Chance to have destroyed at least' + (both ? ' (by the end of the fight)' : plan.k ? ' (by the end of this step)' : '') + '</h3><div class="dmbars">' + ks.map(k => { const v = atLeast(k);
      return '<div class="dmbar"><span class="k">' + k + (k === A.models ? ' (all)' : '') + '</span><span class="tr"><i style="width:' + Math.max(1, Math.round(v * 100)) + '%"></i></span><span class="v">' + dmPct(v) + '</span></div>'; }).join('') + '</div>';
  }
  const cells = v => ['attacks', 'hits', 'wounds', 'through', 'dmg'].map(k => '<span class="num">' + n(k === 'through' ? v.unsaved + v.mortals : v[k]) + '</span>').join('');
  parts.forEach(([bb, Ap], pi) => {
    const M = bb.M, rb = Ap.rb, x = Ap.x;
    h += '<h3 class="dmh3">' + (both ? (bb.id === 'shoot' ? 'The shooting' : 'The fight') + ': each weapon, step by step' : 'Each weapon, step by step') + '</h3><p class="note dmwn">Exact averages against the unit as it was at the start of the turn, the same every time; tap a row for each step. *Dmg is damage before allocation: damage past a model’s wounds is lost (05.04), so the wounds lost can be less.</p><div class="dmwk"><div class="dmwh"><span></span><span>Att.</span><span>Hits</span><span>Wnds</span><span>Thru</span><span>Dmg*</span></div>';
    M.input.groups.forEach((g, i) => {
      const e = x.groups[i], s = rb.groups[i];
      if(e.out){ h += '<div class="dmr out"><span class="n">' + esc(g.name) + '<small>left out: ' + esc(e.out) + '</small></span></div>'; return; }
      const gone = s.gone >= 0.005 ? 'the unit is destroyed before these attacks in ' + dmPct(s.gone) + ' of the games' : '';
      h += '<details class="dmr"><summary><span class="n">' + esc(g.name) + (gone ? '<small>' + esc(gone) + '</small>' : '') + '</span>' + cells(e) + '</summary><div class="body">' +
        e.steps.map(q => '<p>' + esc(q.t).replace(/^([A-Z][a-z]+(?: roll| re-roll)?):/, '<b>$1:</b>') + '</p>').join('') +
        (gone ? '<p><b>Played out:</b> ' + esc(gone) + '; the dice give this weapon ' + n(s.unsaved + s.mortals) + ' through and ' + n(s.dmg) + ' wounds lost on average.</p>' : '') + '</div></details>';
    });
    const T = x.total, later = both ? pi > 0 : plan.k > 0;
    h += '<details class="dmr tot" open><summary><span class="n">Total</span>' + cells({ attacks:T.attacks, hits:T.hits, wounds:T.wounds, unsaved:T.through, mortals:0, dmg:T.dmg }) + '</summary><div class="body">' +
      '<p><b>Before allocation:</b> ' + p(T.attacks) + ' attacks → ' + p(T.hits) + ' hits → ' + p(T.wounds) + ' wounds → ' + p(T.through) + ' get through → ' + p(T.dmg) + ' damage (the rows added up).</p>' +
      '<p><b>Played out:</b> the target has ' + dmPlural(x.target.models, 'model', 'models') + ' with ' + dmPlural(x.target.wounds, 'wound', 'wounds') + ' in all' + (later ? ', less what the shooting did' : '') + '. Damage beyond a model’s wounds is lost, and attacks after the unit is destroyed are lost (05.04), so models destroyed, wounds lost and the chances come from the dice: 10,000 games, the same dice for the same picks' + (plan.beats.length > 1 ? ', the fight in the same games as the shooting before it' : '') + '. ' +
      'On average ' + n(Ap.killed) + ' of ' + Ap.models + ' destroyed in ' + (both ? 'the ' + (bb.id === 'shoot' ? 'shooting' : 'fight') : 'this step') + ', ' + dmPlural(+n(Ap.lost), 'wound', 'wounds') + ' lost; the unit is destroyed by its end in ' + dmPct(Ap.wipe) + ' of the games.</p>' +
      '<p><b>Why the two differ:</b> “get through” is an exact average before allocation, as if every attack found a model; “destroyed” is played out, where damage past a model’s wounds is lost, a model takes several attacks, and the attacks after the unit is gone are lost. The games themselves have a margin here of about ±' + n(dmMargin(rb)) + ' models.</p></div></details></div>';
    if(M.notes.length) h += M.notes.map(t => '<p class="note">' + esc(t) + '</p>').join('');
  });
  if(both){ const pv = dmPartsF(parts.map(([, Ap]) => A.one ? Ap.lost : Ap.killed), A.one ? A.lost : A.killed);
    h += '<p class="note">Both: ' + esc(parts.map(([bb], i) => (bb.id === 'shoot' ? 'the shooting ' : 'the fight ') + pv[i]).join(' + ')) + ' = ' + n(A.one ? A.lost : A.killed) + (A.one ? ' wounds lost' : ' destroyed') + ' on average, in the same games.</p>'; }
  h += dmHow(parts.map(([bb]) => bb.M), st, parts.map(([, Ap]) => Ap.rb), plan);
  openSheet((both ? 'Both' : b.label) + ' · the working', dmName(b.atk.u, b.atk.army) + ' → ' + dmTypedLine(st), h);
}
// the dice's own margin for the models destroyed by a step's end: two standard errors of the mean over its games
const dmMargin = rb => { const p = rb.dist || []; let m = 0, q = 0; p.forEach((v, k) => { m += k * v; q += k * k * v; }); return 2 * Math.sqrt(Math.max(0, q - m * m) / DM_X); };

async function askKeySave(){
  const k = ($('#askKey') || {}).value || '';
  if(!/^sk-ant-\S{20,}$/.test(k.trim())){ toast('That does not look like an Anthropic API key (sk-ant-…)'); return; }
  try { const { checkKey } = await askMod(); await checkKey({ key:k.trim() }); }
  catch(e){ toast(e && e.status === 401 ? 'Anthropic did not accept this key' : 'Could not check the key: ' + ((e && e.message) || 'no connection')); return; }
  store.set('wh-ask', Object.assign(askCfg(), { key:k.trim() })); rerender(); toast('Key saved on this phone');

/* ---------- search over everything in one army ---------- */
const KIND_ORDER = ['Units','Weapons','Stratagems','Abilities','Rules'];
// shorthand players type; a value with spaces must appear as that phrase
const SYNONYM = { their:'opponent', strat:'stratagem', strats:'stratagem', fnp:'feel no pain', inv:'invulnerable', invul:'invulnerable', invuln:'invulnerable',
  dev:'devastating', devs:'devastating', ld:'leadership', cqc:'close-quarters', lethals:'lethal hits', sus:'sustained hits', ds:'deep strike', 'lone-op':'lone operative', loneop:'lone operative', dp:'daemon prince', tfex:'tyrannofex' };
// lower-case, no apostrophes, and "waaagh"/"waagh" alike; hyphens are indexed both ways
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\*\*|~~/g, '').replace(/[’‘'`´]/g, '').replace(/a{2,}/g, 'a');
const hay = (...parts) => { const t = norm(parts.filter(Boolean).join(' ')); return t + ' ' + t.replace(/-/g, '') + ' ' + t.replace(/-/g, ' '); };
const statLineText = s => 'M ' + s.M + ' · T ' + s.T + ' · Sv ' + s.Sv + ' · W ' + s.W + ' · Ld ' + s.Ld + ' · OC ' + s.OC + (s.InSv !== '–' ? ' · Inv ' + s.InSv : '');
function weaponStatText(w, kind){
  // "Dmg 3", not "D 3": a flat Damage of 3 must not read as D3
  return [kind === 'ranged' ? w.range : 'Melee', 'A ' + w.A, kind === 'ranged' ? 'BS ' + w.BS : 'WS ' + w.WS, 'S ' + w.S, 'AP ' + w.AP, 'Dmg ' + w.D].join(' · ');
}
const indexCache = new Map();
const abilityIndex = new Map();
function searchIndex(){
  const a = army();
  if(indexCache.has(a.id)) return indexCache.get(a.id);
  const out = [];
  const add = e => { e.hay += ' ' + norm(e.title).replace(/[\s-]/g, ''); out.push(e); };
  for(const u of a.units){
    const st = u.stats.map(s => ['t' + s.T, 'w' + s.W, 'm' + s.M, 'sv' + s.Sv, 'base ' + s.base].join(' ')).join(' ');
    add({ kind:'Units', title:u.name, s1:u.stats.map(statLineText).join(' / '),
      sub:[u.role, u.pts + ' pts', u.warlord ? 'Warlord' : '', u.enhancement, u.leads ? attachText(u) : ''].filter(Boolean).join(' · '),
      hay:hay(u.name, u.short, u.role, u.kw.join(' '), u.models.join(' '), u.enhancement, u.warlord ? 'warlord' : '', unitRules(u).join(' '),
        u.abilities.map(ab => ab.def).join(' '), st, 'stats save toughness wounds move leadership', u.stats.some(s => s.InSv !== '–') ? 'invulnerable' : ''),
      act:{ unit:u.id } });
  }
  // weapons: identical profiles on twin units are listed once
  const wmap = new Map();
  for(const u of a.units) for(const kind of ['ranged','melee']) for(const w of u[kind] || []){
    const title = w.group ? w.group + ' – ' + w.name : w.name;
    const s1 = weaponStatText(w, kind);
    const key = title + '|' + s1 + '|' + u.name;
    const kws = (w.hunter ? [HUNTER_KW] : []).concat(w.kw);
    const vm = (u.mods || []).find(m => m.weapon === w.name && rowMod(m, u));
    if(wmap.has(key)){ wmap.get(key).units.push(u); continue; }
    const e = { kind:'Weapons', title, s1, units:[u], kws, vm, who:w.who, hay:hay(title, kind, 'weapon', kws.join(' '), u.name, u.short, w.who), act:{ unit:u.id, sec:kind } };
    wmap.set(key, e); add(e);
  }
  for(const e of wmap.values()){
    e.sub = e.units.map(shortName).join(', ') + (e.who && e.who !== e.units[0].name ? ' (' + e.who + ')' : '') + (e.kws.length ? ' · ' + e.kws.join(', ') : '') +
      (e.vm ? ' · ' + Object.entries(e.vm.set).map(([k, v]) => k + ' ' + v).join(' ') + ' ' + e.vm.when : '');
  }
  for(const u of a.units) for(const ab of u.abilities){
    const key = abilityKey(ab);
    if(abilityIndex.has(key)){ abilityIndex.get(key).units.push(u); continue; }
    const e = { kind:'Abilities', title:ab.name, ab, units:[u], hay:hay(ab.name, 'ability', ab.text, ab.tag, ab.who, ab.def, u.name), act:{ ability:key } };
    abilityIndex.set(key, e); add(e);
  }
  for(const e of abilityIndex.values()) e.sub = unitNames(e.units, e.ab) + (e.ab.tag ? ' · ' + e.ab.tag : '') + (e.ab.ph ? ' · ' + whenTag(e.ab) : '') + (e.ab.na ? ' · ' + e.ab.na : '');
  for(const s of allStratagems(a)){
    add({ kind:'Stratagems', title:s.name, sub:s.cp + 'CP · ' + (s.src === 'Core' ? 'Core' : s.src) + ' · ' + stratWhenLine(s) + (eligible(s, a).length ? '' : ' · no unit in this list can use it'),
      hay:hay(s.name, 'stratagem', s.when, s.target, s.effect, s.limit, s.restrictions, s.src, s.src === 'Core' ? 'core' : 'detachment', s.phases.map(p => PHASE_NAME[p]).join(' '), TURN_NAME[s.turn], s.turn === 'opp' ? 'opponent' : ''), act:{ strat:s.id } });
  }
  const f = factionOf(a);
  const tableText = t => (t || []).map(r => r.join(' ')).join(' ');
  for(const r of f.armyRules) add({ kind:'Rules', title:r.name, sub:f.name + ' army rule' + (r.tag ? ' · ' + r.tag : ''), hay:hay(r.name, r.text, tableText(r.table), r.tag, 'army rule', (f.aliases || []).map(x => x[0].source).join(' ')), act:{ rule:r.name } });
  for(const d of detachmentsOf(a)){
    for(const r of detRules(d)) add({ kind:'Rules', title:r.name, sub:d.name + ' detachment rule', hay:hay(r.name, r.text, tableText(r.table), d.name, 'detachment rule'), act:{ rule:r.name } });
    for(const e of d.enhancements){
      const hs = holders(a, e.name);
      add({ kind:'Rules', title:e.name, sub:(e.upgrade ? 'Upgrade' : 'Enhancement') + ' · ' + d.name + (e.pts ? ' · ' + e.pts + ' pts' : '') + (hs.length ? ' · on ' + hs.map(u => holderName(u, e.name)).join(', ') : ' · not in this list'), hay:hay(e.name, e.text, d.name, 'enhancement', e.upgrade ? 'upgrade' : ''), act:{ enh:d.id + '|' + e.name } });
    }
  }
  // a faction's own term (Pulse Jet Move, Supa-hazardous) only in a list a unit of which uses it, as on the Rules tab
  for(const key of Object.keys(D.rules)) if(!(D.ruleSrc || {})[key] || ruleUsers(key).length)
    add({ kind:'Rules', title:key, sub:(D.ruleSrc || {})[key] || 'Core rule', hay:hay(key, D.rules[key], 'core rule keyword'), act:{ rule:key } });
  indexCache.set(a.id, out);
  return out;
}
// a search word close enough to a word in the text: a plural, or 1 typo (2 for long words)
function near(w, t){
  if(w.startsWith(t) || (t.length > 3 && t.endsWith('s') && w.startsWith(t.slice(0, -1)))) return true;
  const k = t.length >= 7 ? 2 : t.length >= 4 ? 1 : 0;
  if(!k || Math.abs(w.length - t.length) > k) return false;
  let prev = Array.from({ length:t.length + 1 }, (x, j) => j);
  for(let i = 1; i <= w.length; i++){
    const row = [i];
    for(let j = 1; j <= t.length; j++) row[j] = Math.min(prev[j] + 1, row[j - 1] + 1, prev[j - 1] + (w[i - 1] === t[j - 1] ? 0 : 1));
    if(Math.min(...row) > k) return false;
    prev = row;
  }
  return prev[t.length] <= k;
}
// wrap each search word found in the title in <mark>, escaping everything else
function highlight(text, toks){
  const parts = toks.filter(t => t.length > 1).map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  if(!parts.length) return esc(text);
  return String(text).split(new RegExp('(' + parts.join('|') + ')', 'gi')).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}
function renderFinder(){
  const res = $('#qres');
  if(!res) return;
  const q = (query[army().id] || '').trim();
  $('#armyMenu').hidden = !!q;
  $('#armyHead').hidden = !!q;
  if(!q){ res.innerHTML = ''; return; }
  // each word as typed, or its shorthand meaning ("their" also finds "opponent", and still "Thin Their Ranks")
  const toks = norm(q).split(/\s+/).filter(t => /[a-z0-9]/.test(t)).map(t => t.replace(/-/g, ''));
  const alts = toks.map(t => hasOwn(SYNONYM, t) ? [t, SYNONYM[t].replace(/-/g, '')] : [t]);
  const nq = toks.join(' ');
  if(!toks.length){ res.innerHTML = '<div class="empty">Type a name, keyword or rule.</div>'; return; }
  const scored = e => { const tl = norm(e.title).replace(/-/g, '');
    return Object.assign({ score: tl.startsWith(nq) || tl.split(' ').some(w => w.startsWith(nq)) ? 0 : tl.includes(nq) ? 1 : toks.every(t => tl.includes(t)) ? 2 : 3 }, e); };
  const found = list => list.filter(e => alts.every(a => a.some(t => e.hay.includes(t)))).map(scored);
  // nothing found: forgive a plural and a typo or two ("rubrics", "ghazkull")
  const close = list => list.filter(e => { const words = e.words || (e.words = [...new Set(e.hay.split(/[^a-z0-9]+/).filter(Boolean))]);
    return alts.every(a => a.some(t => words.some(w => near(w, t)))); }).map(e => Object.assign({ score:4 }, e));
  let hits = found(searchIndex());
  if(!hits.length) hits = close(searchIndex());
  for(const [re, key] of faction().aliases || []) if(re.test(q)){
    const r = hits.find(e => e.kind === 'Rules' && e.act.rule === key) || searchIndex().find(e => e.kind === 'Rules' && e.act.rule === key);
    if(r){ const i = hits.indexOf(r); if(i >= 0) hits.splice(i, 1); hits.unshift(Object.assign({}, r, { score:-1 })); }
  }
  if(!hits.length){ res.innerHTML = '<div class="empty">Nothing in ' + esc(army().name) + ' matches “' + esc(q) + '”.</div>'; return; }
  const groupsOf = list => { const g = KIND_ORDER.map(k => ({ k, list:list.filter(e => e.kind === k).sort((x, y) => x.score - y.score) })).filter(g => g.list.length);
    return g.sort((x, y) => x.list[0].score - y.list[0].score || KIND_ORDER.indexOf(x.k) - KIND_ORDER.indexOf(y.k)); };
  const words = q.split(/\s+/);
  const html = g => {
    const limit = moreShown.has(g.k) ? Infinity : 6;
    return '<div class="rg"><div class="lbl">' + g.k + ' · ' + g.list.length + '</div>' +
      g.list.slice(0, limit).map(e => {
        const act = e.act;
        const attrs = (act.strat ? 'data-strat="' + esc(act.strat) + '"' : act.rule ? 'data-rule="' + esc(act.rule) + '"' : act.ability ? 'data-ability="' + esc(act.ability) + '"' :
          act.enh ? 'data-enh="' + esc(act.enh) + '"' : 'data-unit="' + esc(act.unit) + '"' + (act.sec ? ' data-sec="' + esc(act.sec) + '"' : ''));
        return '<button class="res" ' + attrs + '><b>' + highlight(e.title, words) + '</b>' + (e.s1 ? '<span class="s1">' + esc(e.s1) + '</span>' : '') + '<span>' + esc(e.sub) + '</span></button>';
      }).join('') +
      (g.list.length > limit ? '<button class="more" data-more="' + esc(g.k) + '">Show ' + (g.list.length - limit) + ' more</button>' : '') + '</div>';
  };
  res.innerHTML = groupsOf(hits).map(html).join('');
}

/* ---------- screen: unit list ---------- */
const UNIT_COLS = ['M','T','Sv','W','LD','OC','InSv'];
const unitsSubbar = () => '<div class="uh"><span class="n">Unit</span>' + UNIT_COLS.map(c => '<span>' + c + '</span>').join('') + '<span class="p">Pts</span></div>';
// the stats of one profile, one cell per column (a value a rule of the list changed is marked)
const statCells = s => ['M','T','Sv','W','Ld','OC','InSv'].map(k => '<span class="sc">' + (s.from && s.from[k] ? '<i class="gvl">' + esc(s[k]) + '</i>' : esc(s[k])) + '</span>').join('');
// how many models a stats row is for: its printed "×N", else the models lines with its name, the bodyguard's other models (a
// Kaptin) on its last row ("Flash Gitz" ×10: 1 Kaptin and 9 Flash Gitz; "Rubric Marine" ×4: the two loadouts)
function rowCounts(u){
  const chars = new Set(charsOf(u).map(c => c.name)), stem = x => x.toLowerCase().replace(/ w\/.*$/, '').replace(/ \(.*\)$/, '').replace(/s$/, '');
  const rows = u.stats.map(s => ({ s, name:stem(s.name.replace(/ ×\d+$/, '')), fixed:/ ×\d+$/.test(s.name), n:+((/ ×(\d+)$/.exec(s.name) || [])[1] || 0) }));
  const longest = list => list.sort((x, y) => y.name.length - x.name.length)[0];
  // first the lines a row has the name of (a "×N" row of that count before one without: "3× Deathwatch Terminator w/ Heavy Weapon" is
  // the "Deathwatch Terminator ×3" row, "1× Deathwatch Terminator (Storm Shield)" the other); the models the "×N" rows already count
  // are not given to another row ("Heavy intercessor Squad ×4" counts the four lines without a row of their own)
  const lines = u.models.map(line => ({ k:parseInt(line, 10) || 1, nm:stem(line.replace(/^\d+× /, '')) }));
  const total = lines.reduce((t, l) => t + l.k, 0), fixedN = rows.filter(r => r.fixed).reduce((t, r) => t + r.n, 0);
  let placed = fixedN;
  const rest = [];
  for(const l of lines){
    const same = rows.filter(r => r.name === l.nm), hit = same.find(r => r.fixed && r.n === l.k && !r.used) || same.find(r => !r.fixed) || same.find(r => r.fixed);
    if(hit && hit.fixed){ hit.used = true; continue; }
    if(hit){ hit.n += l.k; placed += l.k; continue; }
    rest.push(l);
  }
  for(const l of rest){
    if(placed >= total) break;
    const hit = longest(rows.filter(r => l.nm.startsWith(r.name))) || longest(rows.filter(r => r.name.startsWith(l.nm)))
      || rows.filter(r => !r.fixed && !chars.has(r.s.name)).slice(-1)[0];
    if(hit && !hit.fixed){ hit.n += l.k; placed += l.k; }
  }
  return new Map(rows.map(r => [r.s, r.n]));
}
function screenUnits(){
  const a = army(), groups = {};
  for(const u of a.units){ const r = roleGroup(u); (groups[r] = groups[r] || []).push(u); }
  return ROLE_ORDER.filter(r => groups[r]).map(r => '<h2 class="rgh"><span>' + ROLE_LABEL[r] + '</span><span class="c">' + groups[r].reduce((t, u) => t + (u.copies || 1), 0) + '</span></h2><div class="list ul">' + groups[r].map(u => {
    // one model type: its count goes after the name ("Gretchin ×10"), like a weapon count
    const one = u.models.length === 1 && u.models[0].match(/^(\d+)× /);
    const n = one && one[1] !== '1' ? '<span class="x">×' + one[1] + '</span>' : '';
    // one models line, and a unit of the same name with another one ("1 of 2", "2 of 2"): that line's loadout tells them apart
    const apart = one && a.units.some(x => x !== u && sameName(x, u) && x.models.join('|') !== u.models.join('|')) ? ((/ \(([^)]+)\)$/.exec(u.models[0]) || [])[1] || u.models[0].replace(/^\d+× /, '')) : '';
    const lead = u.leads ? '<span class="lead">+ ' + esc(partsAfter(u).join(' + ')) + '</span>' : '';   // an attached unit names its other parts as loud as its leader
    // more than one stats row (an attached unit, Squighog Boyz' Nob, Canis Rex and Sir Hekhtur): one line per row, under the name,
    // with how many models it is for
    const subs = u.stats.length > 1, cnt = subs ? rowCounts(u) : null;
    const subName = s => esc(s.name).replace(/ ×(\d+)$/, '<span class="x">×$1</span>') + (!/ ×\d+$/.test(s.name) && cnt.get(s) > 1 ? '<span class="x">×' + cnt.get(s) + '</span>' : '');
    const tags = nameTags(u, { noLeads:true, noCopies:true });   // how many of it: on the points ("2×215")
    return '<button class="urow' + (subs ? ' att' : '') + '" data-unit="' + esc(u.id) + '"><span class="un"><b>' + esc(u.name) + '</b>' + n + lead +
      (tags ? '<span class="utg">' + tags + '</span>' : '') + (!one && !u.leads && !subs ? '<span class="meta">' + esc(u.models.join(', ')) + '</span>' : apart ? '<span class="meta">' + esc(apart) + '</span>' : '') + '</span>' +
      (subs ? '' : statCells(u.stats[0])) + '<span class="pts">' + (u.copies > 1 ? esc(u.copies) + '×' : '') + esc(u.pts) + '</span>' +
      (subs ? u.stats.map(s => '<span class="sn">' + subName(s) + '</span>' + statCells(s)).join('') : '') + '</button>';
  }).join('') + '</div>').join('');
}

/* ---------- weapon tables ---------- */
const colHeader = kind => '<div class="wh ' + kind + '"><span class="n">Weapon</span>' + (kind === 'ranged' ? ['RNG','A','BS','S','AP','D'] : ['A','WS','S','AP','D']).map(c => '<span>' + c + '</span>').join('') + '</div>';
// where a footnote's rule comes from, as a link to its text
function modFrom(m, u){
  const link = (attr, val, label) => '<span class="link" role="button" tabindex="0" data-' + attr + '="' + esc(val) + '">' + esc(label) + '</span>';
  if(m.rule) return link('rule', m.rule, m.from);
  if(m.strat) return link('strat', m.strat, m.cp + 'CP ' + m.from);
  if(m.src && m.src !== u) return link('unit', m.src.id, m.from);   // the condition already names the unit
  const ab = (m.src || u).abilities.find(a => a.name === m.from);
  return ab ? link('ability', abilityKey(ab), m.from) : esc(m.from);
}
// AP -2 improved by 1 is AP -3
function weaponBlock(it, keys, mods, u){
  const cell = (v, cls) => '<span>' + (cls ? '<i class="' + cls + '">' + esc(v) + '</i>' : esc(v)) + '</span>';
  const wide = keys[0] === 'none';   // datasheet melee rows: no range column, the name can use it
  const row = (label, cells, p) => '<div class="wr' + (p ? ' p' : '') + '"><span class="n' + (wide ? ' n2' : '') + '">' + label + '</span>' + (wide ? cells.slice(1) : cells).join('') + '</div>';
  const gv = (w, k) => granted(w, k, u, esc(w[k]), (KEY_LABEL[k] || k) + ' ' + w[k]);
  const plainCells = w => keys.map(k => '<span>' + gv(w, k) + '</span>');
  // a keyword printed twice (Hunter's Eye's [IGNORES COVER] appended to a heavy flamer that has it): shown once, the weapon's own
  const kwl = w => (w.kw || []).length ? '<div class="kwl">' + w.kw.filter((x, i) => w.kw.indexOf(x) === i).map(x => w.from && w.from[x] && w.kw.lastIndexOf(x) === w.kw.indexOf(x) ? '<span class="gk' + (wideGrant(w.from[x], u) ? ' w' : '') + '" data-rule="' + esc(x) + '"' + grantAttr(w.from[x], u, x) + '>' + esc(x) + '</span>'
    : '<span role="button" tabindex="0" data-rule="' + esc(x) + '">' + esc(x) + '</span>').join(', ') + '</div>' : '';
  // "Khornate eviscerator ×4": the count wraps with the last word, never alone
  const named = (name, n) => { if(!n) return esc(name); const i = name.lastIndexOf(' '); return esc(name.slice(0, i + 1)) + '<span class="nw">' + esc(name.slice(i + 1)) + '<span class="x">×' + esc(n) + '</span></span>'; };
  const prof = name => '<span class="ar">➤</span>' + esc(name);
  const w0 = it.profiles[0];
  // an ability that changes this weapon against some targets: one row, the value and the change in the cell

  const first = x => { const ph = phasesOf(x); return ph.length === PHASES.length ? 99 : PHASES.findIndex(([k]) => k === ph[0]); };
  const ord = list => list.map((x, i) => [x, i]).sort((a, b) => first(a[0]) - first(b[0]) || a[1] - b[1]).map(x => x[0]);

  return '<div class="dkv sl" id="sec-strats"><span class="dk">Stratagems</span><span class="dv">' + groups.filter(([, l]) => l.length).map(([n, l]) =>
