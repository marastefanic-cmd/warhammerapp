/* ---------- screens: weapons and abilities by unit ---------- */
const band = u => '<button class="band" data-unit="' + esc(u.id) + '"><b>' + esc(u.name) + '</b><span class="tgs">' + nameTags(u) + '</span>' + arrow + '</button>';
function screenWeapons(kind){
  const list = army().units.filter(u => (u[kind] || []).length);
  if(!list.length) return '<div class="empty">No ' + kind + ' weapons in this army.</div>';
  return '<div class="slice">' + list.map(u => '<section class="us">' + band(u) + weaponTable(u[kind], kind, shownMods(u, kind), u, false) + '</section>').join('') + '</div>';
}
const screenAbilities = () => '<div class="slice">' + army().units.filter(u => u.abilities.length).map(u => '<section class="us">' + band(u) + abilityRows(u.abilities, u) + '</section>').join('') + '</div>';

/* ---------- stratagems ---------- */
const stratWhenLine = s => [whenTag(s), s.limit, s.cpNote].filter(Boolean).join(' · ');
// the units of this list that can be its target ("any unit" when all can)
const stratUsers = s => eligible(s).filter(u => !(s.id === 'fire-overwatch' && !(u.ranged || []).length));   // a unit with no gun can be picked but cannot shoot (04.01.01)
// what a stratagem's TARGET needs that no unit here has (e.g. TRANSPORT)
const lacks = s => { const n = s.needs || {}, us = army().units, lack = (n.all || []).filter(k => !us.some(u => hasKw(u, k)));
  if(lack.length) return lack.join(', ').toUpperCase();
  if(n.any && !us.some(u => n.any.some(k => hasKw(u, k)))) return n.any.join(' or ').toUpperCase();
  if(n.attached && !us.some(u => matches(n, u))) return 'an attached unit';
  const ex = (n.none || []).filter(k => us.length && us.every(u => hasKw(u, k)));
  return ex.length ? 'it excludes ' + ex.join('/').toUpperCase() + ' units, and every unit here is ' + ex.join('/').toUpperCase() : ''; };
// an attached unit's characters: its own name first, then `also` (a Warboss leading the Breaka Boyz a Bigboss supports)
const charsOf = u => u.leads ? [{ name:u.name, support:!!u.support }].concat((u.also || []).map(c => ({ name:c.name, support:!!c.support }))) : [];
const partsAfter = u => (u.also || []).map(c => c.name).concat(u.leads ? [u.leads] : []);   // what "+ …" names after the unit's name
const unitLabel = u => [u.name].concat(partsAfter(u)).join(' + ');
// "supporting Tankbustas"; with two characters "Bigboss supporting, Warboss leading Breaka Boyz"
const attachText = u => { const cs = charsOf(u); return cs.length > 1 ? cs.map(c => c.name + (c.support ? ' supporting' : ' leading')).join(', ') + ' ' + u.leads : (u.support ? 'supporting ' : 'leading ') + u.leads; };
// which character or part a models line belongs to (null outside attached units)
const whoOfLine = (u, i) => { const cs = charsOf(u); return !cs.length ? null : i < cs.length ? cs[i].name : u.leads; };
const labelList = units => { const n = new Map(); for(const u of units){ const k = unitLabel(u); n.set(k, (n.get(k) || 0) + (u.copies || 1)); }
  return [...n].map(([k, c]) => k + (c > 1 ? '\u00a0×' + c : '')).join(', '); };
function usersLine(s){
  const el = stratUsers(s), all = army().units;
  if(!el.length) return 'No unit in this list can use it' + (lacks(s) ? (/^it excludes /.test(lacks(s)) ? ': ' + lacks(s) : ' (needs ' + lacks(s) + ')') : '');
  if(el.length === all.length) return 'Any unit';
  const out = all.filter(u => !el.includes(u));
  return out.length <= 2 && all.length >= 5 ? 'All but ' + labelList(out) : labelList(el);
}
// "End of their Movement", "Your Shooting", "Fight", "Any phase": from WHEN, as on a datasheet row
const stratWhenShort = s => { const m = /^(start|end) of /i.exec(s.when || ''), w = shortWhen(s); return m && !/^any/i.test(w) ? m[1][0].toUpperCase() + m[1].slice(1).toLowerCase() + ' of ' + w.replace(/^(Your|Their)/, x => x.toLowerCase()) : w; };
// the row says what it does (gist, from its EFFECT), when, and which of your units can use it
const stratHead = s => { const pb = perBattle(s);
  return '<span class="cp' + (s.cp >= 2 ? ' hot' : '') + '">' + esc(s.cp) + '<small>CP</small></span><span class="sh"><b>' + esc(s.name) + '</b>' +
  (s.gist ? '<span class="sg">' + esc(s.gist) + '</span>' : '') + '<span class="sw"><em>' + esc([stratWhenShort(s), s.limit, s.cpNote].filter(Boolean).join(' · ')) + '</em> ' + esc(usersLine(s)) + '</span>' +
  (pb ? ticks('s:' + s.id, pb.n, '', s.name) : '') + '</span>'; };
// a rule whose wording allows two readings: settle it with the opponent before the game
function stratBody(s){
  const el = stratUsers(s);
  return '<div><span class="il">When</span>' + rt(s.when) + '</div><p><span class="il">Target</span>' + inline(s.target) + '</p>' +
    '<div><span class="il">Effect</span>' + rt(s.effect) + '</div>' +
    (s.restrictions ? '<p><span class="il">Restrictions</span>' + inline(s.restrictions) + '</p>' : '') +
    (s.note ? '<p class="note it">' + esc(s.note) + '</p>' : '') +
    '<p class="usedby"><span class="il">Used by</span>' + (!el.length ? 'no unit in this list' + (lacks(s) ? (/^it excludes /.test(lacks(s)) ? ': ' + esc(lacks(s)) : ' (needs ' + esc(lacks(s)) + ')') : '') : el.length === army().units.length ? 'any unit' : el.map(wholeLink).join(', ')) + '</p>';
}
const stratItem = s => '<details class="strat' + (stratUsers(s).length ? '' : ' none') + '" data-strat-id="' + esc(s.id) + '"' + (openStrats.has(s.id) ? ' open' : '') + '><summary>' + stratHead(s) + chev + '</summary><div class="sb">' + stratBody(s) + '</div></details>';
// every stratagem this list can use, by detachment, in phase order (Command first, any-phase ones last)
function screenStrats(){
  const shown = allStratagems();
  const first = x => { const ph = phasesOf(x); return ph.length === PHASES.length ? 99 : PHASES.findIndex(([k]) => k === ph[0]); };
  // the ones a unit here can use first, in phase order; then the ones none can (greyed, they say what they need)
  const order = list => list.map((s, i) => [s, i]).sort((x, y) => (eligible(x[0]).length ? 0 : 1) - (eligible(y[0]).length ? 0 : 1) || first(x[0]) - first(y[0]) || x[1] - y[1]).map(x => x[0]);
  const expand = shown.length ? '<button class="textbtn" data-expand>' + (shown.every(s => openStrats.has(s.id)) ? 'Collapse all' : 'Expand all') + '</button>' : '';
  let h = expand ? '<div class="tools">' + expand + '</div>' : '';
  for(const [name, list] of detachments().map(d => [d.name, shown.filter(s => s.src === d.name)]).concat([['Core stratagems', shown.filter(s => s.src === 'Core')]])){
    if(list.length) h += '<div class="sec-h"><h2>' + esc(name) + '</h2><span class="c">' + list.length + '</span></div><div class="list">' + order(list).map(stratItem).join('') + '</div>';
  }
  if(!shown.length) h += '<div class="empty">No stratagems.</div>';
  const notes = [];
  const gaps = detachments().filter(d => (d.missing || []).includes('stratagems')).map(d => d.name);
  if(gaps.length) notes.unshift(gaps.join(' and ') + ' stratagems aren’t in the app yet: they need the Wahapedia page.');
  const none = detachments().filter(d => !(d.stratagems || []).length && !(d.missing || []).includes('stratagems')).map(d => d.name);
  if(none.length) notes.unshift(none.join(' and ') + (none.length > 1 ? ' have' : ' has') + ' no stratagems (a rule and enhancements only).');
  notes.push('Stratagem text: GW’s Faction Pack where it prints the detachment, otherwise Wahapedia; checked word for word.');
  return h + notes.map(n => '<p class="note">' + esc(n) + '</p>').join('');
}

/* ---------- screen: bases & proxies ----------
   For proxy models on the right bases: how many bases of each size the army needs, and per
   unit one line per kind of model with what to write on its base. The most common model of a
   squad is "standard"; the others say what they have that it doesn't (a weapon, an icon, the
   champion). Leaders and single models get their name, enhancement and Warlord. */
const modelCount = u => u.models.reduce((t, m) => t + (parseInt(m, 10) || 1), 0);
const lineParts = m => { const x = /^(\d+)× (.+?)(?: \(([^)]+)\))?$/.exec(m) || [, '1', m]; return { n:+x[1], name:x[2], extra:x[3] || '' }; };
const baseName = name => name.replace(/ w\/.*$/, '');
// a model of a profile that carries wargear GW gives its own base is on that base (baseWith: the Skitarii Rangers' transuranic arquebus)
const withGear = (s, u, line) => { const g = ((u.gear || [])[line] || []).map(norm), k = Object.keys(s.baseWith || {}).find(x => g.includes(norm(x))); return k ? s.baseWith[k] : s.base; };
function baseOf(u, name, line){
  if(u.stats.length === 1) return withGear(u.stats[0], u, line);
  let rows = u.stats.map(s => ({ s, n:norm(s.name.replace(/ ×\d+$/, '')) }));
  const nm = norm(baseName(name));
  // in an attached unit the first models lines are the characters; the others are bodyguard models
  const nc = charsOf(u).length;
  if(u.leads && line >= nc && !rows.some(r => r.n === nm)) rows = rows.filter(r => !u.models.slice(0, nc).some(m => r.n === norm(baseName(lineParts(m).name))));
  const pre = (a, b) => { let i = 0; while(i < a.length && a[i] === b[i]) i++; return i; };
  const hit = rows.find(r => r.n === nm) || rows.find(r => nm.startsWith(r.n) || r.n.startsWith(nm)) || rows.slice().sort((x, y) => pre(y.n, nm) - pre(x.n, nm))[0];
  return withGear(hit.s, u, line);
}
function proxyLines(u){
  const lines = u.models.map((m, i) => Object.assign(lineParts(m), { gear:(u.gear || [])[i] || [], base:baseOf(u, lineParts(m).name, i) }));
  // the Warlord and the enhancement on the character that has them (warlordOn / enhOn), else the first
  const on = (field, i) => u[field] ? whoOfLine(u, i) === u[field] : i === 0;
  const tagOf = i => [u.warlord && on('warlordOn', i) ? 'Warlord' : '', u.enhancement && on('enhOn', i) ? u.enhancement : ''].filter(Boolean);
  // the unit's short name is the first character's only
  const own = (l, words, i) => [i === 0 && l.name !== u.name && u.short ? u.short : baseName(l.name)].concat(words).join(' · ');
  if(lines.length === 1 && lines[0].n === 1) return [Object.assign(lines[0], { mark:own(lines[0], tagOf(0), 0), lead:true })];
  const nc = u.leads ? charsOf(u).length : 0;
  const body = lines.slice(nc);
  lines.slice(0, nc).forEach((l, i) => Object.assign(l, { mark:own(l, tagOf(i), i), lead:true }));
  const std = body.slice().sort((x, y) => y.n - x.n)[0];
  for(const l of body){
    if(l === std){ l.mark = 'standard'; l.std = true; continue; }
    const sb = baseName(std.name), lb = baseName(l.name);
    const named = lb === sb ? '' : lb.startsWith(sb + ' ') ? lb.slice(sb.length + 1) : lb;
    const cnt = (list, g) => list.filter(x => x === g).length;
    const more = [...new Set(l.gear)].filter(g => cnt(l.gear, g) > cnt(std.gear, g)).map(g => cnt(l.gear, g) > 1 ? cnt(l.gear, g) + '× ' + g : g);
    // a line named as the standard one: also what it has less of (a Boy with only a Slugga is not "standard")
    const less = named ? [] : [...new Set(std.gear)].filter(g => cnt(l.gear, g) < cnt(std.gear, g)).map(g => cnt(l.gear, g) ? cnt(l.gear, g) + '× ' + g : 'no ' + g);
    l.mark = [named, more.join(' + '), less.join(', '), l.extra].filter(Boolean).join(' · ') || 'standard';
  }
  return lines;
}
function screenBases(){
  const a = army(), total = new Map();
  const units = ROLE_ORDER.flatMap(r => a.units.filter(u => roleGroup(u) === r));
  const cards = units.map(u => {
    const lines = proxyLines(u), c = u.copies || 1;
    for(const l of lines) if(/\d/.test(l.base)) total.set(l.base, (total.get(l.base) || 0) + l.n * c);   // "Hull": no base
    return '<div class="px"><div class="pxh">' + linkTo('unit', u.id, u.name + (u.enhancement && !u.enhOn ? ' · ' + u.enhancement : '')) + (u.leads ? '<span class="tg m">+ ' + esc(partsAfter(u).join(' + ')) + '</span>' : '') +
      (c > 1 ? '<span class="tg m">' + c + ' units: mark them apart (' + Array.from({ length:c }, (_, i) => i + twinFirst(u)).join(', ') + ')</span>'
        : twinOf(u) && twinOf(u).n > 1 ? '<span class="tg m">' + twinOf(u).i + ' of ' + twinOf(u).n + '</span>' : '') + '</div>' +
      lines.map(l => '<div class="pxl"><span class="pxn">' + l.n + '× <b>' + esc(/\d/.test(l.base) ? l.base : 'no base') + '</b></span><span class="pxm' + (l.std ? ' std' : '') + '">' + esc(l.mark) +
        (l.std && l.gear.length ? ' <i>' + esc(l.gear.join(', ')) + '</i>' : '') + '</span></div>').join('') +
      unplacedOf(u).map(x => '<div class="pxl"><span></span><span class="pxm">' + esc(x.n + '× ' + x.name + ': ' + x.note) + '</span></div>').join('') + '</div>';
  });
  const sizes = [...total].sort((x, y) => (parseFloat(x[0]) || 999) - (parseFloat(y[0]) || 999));
  return '<p class="lbl grp-h">Bases to print</p><p class="pxt">' + sizes.map(([b, n]) => '<span><b>' + n + '×</b> ' + esc(b) + '</span>').join('') + '</p>' +
    '<p class="lbl grp-h">What to write on each base</p><div class="list">' + cards.join('') + '</div>' +
    '<p class="note">From the New Recruit list: model counts and loadouts per model, base sizes from GW’s base size guide (Event Companion; Wahapedia’s datasheet where it has none).</p>';
}

/* ---------- screen: before the battle ----------
   Everything decided or set up before the first turn, and every once-per-battle resource,
   gathered from the list: the paper has it spread over many pages. Every line opens its full text. */
// a selection New Recruit prints ("Code Chivalric: Deed, Quality") that is only the names of an army rule's parts: every
// part is the first word of some of its table rows ("Deed 1–2 · …", "Quality 1–2 · …")
const ruleParts = (f, k, v) => { const r = f.armyRules.find(x => x.name === k); if(!r || !r.table) return false;
  const parts = new Set(r.table.map(([l]) => String(l).split(/\s/)[0].toLowerCase())); return String(v).split(/,\s*/).every(p => parts.has(p.trim().toLowerCase())); };
// "deploy" as the step (Deploy Armies, deployed, deployment), not "deployment zone" (that is where, not when)
const PREGAME_RE = /before the battle|declare battle formations|read mission objectives|pre-?battle|\bdeploy(?!ment zone)|redeploy|infiltrat/i;
function screenPregame(){
  const a = army(), f = faction(), units = a.units;
  const row = (k, v) => v ? '<div class="pgr"><span class="pgk">' + k + '</span><span class="pgv">' + v + '</span></div>' : '';
  const sec = (title, body) => body ? '<div class="sec-h"><h2>' + title + '</h2></div><div class="pg">' + body + '</div>' : '';
  // the same ability on several units is one line: "Singular Purpose · Assimilator (280), Norn Emissary ×2"
  const group = list => { const m = new Map(); for(const [u, ab] of list){ const k = ab.name + '|' + ab.text; if(!m.has(k)) m.set(k, { ab, units:[] }); m.get(k).units.push(u); } return [...m.values()]; };
  const abLine = g => linkTo('ability', abilityKey(g.ab), g.ab.name) + ' <span class="from">· ' + esc(unitNames(g.units, g.ab)) + '</span>';
  const rulesOf = units.length ? f.armyRules.filter(r => !inertRule(r.name)).map(r => ({ r, src:f.name + ' army rule' }))
    .concat(detachments().flatMap(d => detRules(d).map(r => ({ r, src:d.name })))) : [];
  const ruleLine = x => linkTo('rule', x.r.name, x.r.name) + ' <span class="from">· ' + esc(x.src) + '</span>';
  const nameLink = u => linkTo('unit', u.id, u.short || u.name);   // without its enhancement: the line says it
  // a unit's short name, or its full one when another unit of the list has that short name too (Big Mek Dakkarig, Big Mek in Mega Armour)
  const ownName = u => u.short && units.some(x => x !== u && (x.short || x.name) === u.short && x.name !== u.name) ? u.name : u.short || u.name;
  const allAbs = units.flatMap(u => u.abilities.filter(ab => !naReason(ab)).map(ab => [u, ab]));
  // Deep Strike (24.09) and Scouts (24.31) work only if every model in the unit has them; u.partialRules names
  // the rules only some models of an attached unit have (Slaughterbound's Scouts 6": its Exalted Eightbound have none)
  const everyModel = (u, test) => unitRules(u).some(test) && !Object.keys(u.partialRules || {}).some(test);
  // rules resolved before Declare Battle Formations (Code Chivalric: end of the Read Mission Objectives step)
  const early = rulesOf.filter(x => /read mission objectives/i.test(x.r.text));

  // your list
  const warlord = units.filter(u => u.warlord);
  const enh = units.flatMap(u => [u.enhancement, u.upgrade].filter(Boolean).map(n => { const d = detachments().find(x => (x.enhancements || []).some(e => e.name === n)), e = d && d.enhancements.find(x => x.name === n);
    return (d ? linkTo('enh', d.id + '|' + n, n) : esc(n)) + (n === u.upgrade ? ' <span class="from">(upgrade)</span>' : '') + (e && e.pts ? ' <span class="from">' + e.pts + ' pts</span>' : '') + ' on ' + (n === u.enhancement && u.enhOn ? linkTo('unit', u.id, u.enhOn) : n === u.upgrade && u.leads ? linkTo('unit', u.id, u.leads) : linkTo('unit', u.id, ownName(u) + unitNo(u))); }));
  const led = units.filter(u => u.leads).flatMap(u => charsOf(u).map((c, i) => (i ? linkTo('unit', u.id, c.name) : nameLink(u)) + (c.support ? ' supports ' : ' leads ') + esc(u.leads) + (u.copies > 1 ? ' <span class="from">×' + u.copies + ' units</span>' : '')));
  let h = sec('Your list',
    row('Warlord', warlord.map(u => u.warlordOn ? linkTo('unit', u.id, u.warlordOn) + ' <span class="from">(' + esc(unitLabel(u)) + ')</span>' : unitLink(u)).join(', ')) +
    row('Enhance&shy;ments', enh.join('<br>')) +
    row('Attached', led.join('<br>')) +
    row('Detach&shy;ments', detachments().map(d => (d.rule ? linkTo('rule', d.rule.name, d.name) : esc(d.name)) + (d.dp ? ' <span class="from">(' + d.dp + ' DP)</span>' : '')).join(', ')) +
    row('Disposi&shy;tions', dispText(a)) +
    // the other selections New Recruit prints under the army name, as printed; one that only names the parts of an army
    // rule ("Code Chivalric: Deed, Quality", each part's table rows) is no pick: that rule is under Army rules
    Object.entries(a.config || {}).filter(([k, v]) => !ruleParts(f, k, v)).map(([k, v]) => row(esc(k), esc(v))).join('') +
    row('Points', esc(a.pointsUsed + ' / ' + a.points + ' · ' + a.battleSize)));
  // the army rules and the detachment rules, folded: each opens to its text (the detachment's row as on the Rules tab)
  const detRows = detachments().flatMap(d => detRules(d).map(r => ruleRow(r.name, metaLine(esc(d.name), r.ph ? esc(shortWhen(r)) : ''),
    (r.note ? '<p class="note it">' + esc(r.note) + '</p>' : '') + textWithTable(r) + usedBy('Applies to', units.filter(u => matches(r.needs, u)))))).join('');
  h += f.armyRules.length || detRows ? '<div class="sec-h"><h2>' + (detRows ? 'Army and detachment rules' : 'Army rules') + '</h2></div><div class="abl">' + armyRuleRows(f) + detRows + '</div>' : '';

  const earlyAbs = group(allAbs.filter(([u, ab]) => /read mission objectives/i.test(ab.text)));
  h += sec('Read Mission Objectives step', row('Rules', early.map(ruleLine).join('<br>')) + row('Abilities', earlyAbs.map(abLine).join('<br>')));

  // declare battle formations: reserves and transports
  const ds = units.filter(u => everyModel(u, r => ruleKey(r) === 'Deep Strike'));
  const dsPts = ds.reduce((t, u) => t + (u.pts || 0) * (u.copies || 1), 0);
  const transports = units.filter(u => hasKw(u, 'Transport')).map(u => { const ab = u.abilities.find(x => /transport capacity/i.test(x.text)); return unitLink(u) + (ab ? ': <span class="from">' + inline(ab.text.replace(/(^|\n)\*([^*\n][^\n]*[^*\n])\*(?=\n|$)/g, '$1$2').replace(/\n(- )?/g, ' ')) + '</span>' : ''); });
  h += sec('Declare battle formations',
    row(linkTo('rule', 'Deep Strike', 'Deep Strike'), ds.map(u => (u.leads ? linkTo('unit', u.id, unitLabel(u)) : unitLink(u)) + ' <span class="from">' + u.pts + ' pts' + (u.copies > 1 ? ' each, ×' + u.copies : '') + '</span>').join('<br>') + (ds.length > 1 ? '<br><span class="from">All of them: ' + dsPts + ' pts</span>' : '')) +
    row('Transports', transports.join('<br>')));

  // deployment and pre-battle abilities
  const scouts = units.filter(u => everyModel(u, r => /^scouts|^infiltrators/i.test(r)));
  const scoutRules = u => unitRules(u).filter(r => /^scouts|^infiltrators/i.test(r));
  const scoutKeys = [...new Set(scouts.flatMap(u => scoutRules(u).map(ruleKey)))].sort((x, y) => (x === 'Scouts' ? 0 : 1) - (y === 'Scouts' ? 0 : 1));
  const pre = group(allAbs.filter(([u, ab]) => PREGAME_RE.test(ab.text) && !/start of the first battle round|read mission objectives/i.test(ab.text)));
  h += sec('Deployment and pre-battle abilities',

    const trig = secs(e), act = Object.entries(ckMap(e.u)).flatMap(([p, t]) => turns(t).map(w => p + '|' + w)).filter(s => !trig.includes(s));
    // once per battle: where it is used from (its trigger, its rule's, or else where its effect is used)
    if(it.once){ const via = e.via ? secs(e.via) : []; for(const s of trig.length ? trig : via.length ? via : act) for(const [b, l] of it.once) put(s, 'once', tl(b, l)); continue; }
    for(const s of trig) put(s, 'todo', tl(ckTick(s + '|' + it.id, it.what, it.n), it.line));
    for(const s of act) put(s, 'active', tl(ckTick(s + '|' + it.id, it.what, it.n), it.line));
  }
  const GROUPS = [['todo', 'To do now', 'to do'], ['active', 'Active now', 'active'], ['once', 'Once per battle', 'once per battle'], ['rules', 'Rules', 'rules'], ['abs', 'Abilities', 'abilities']];
  const phaseSecs = PHASES.flatMap(([p]) => [p + '|your', p + '|opp']);
  // the moments in the order of the game: before the phases, after Fight · Their turn (the end of your turn, of your opponent's, of the round)
  const order = ['Start of the first battle round', 'Start of the battle round'].filter(s => sec[s]).concat(phaseSecs, ['End of your turn', 'End of your opponent’s turn', 'End of the battle round', 'unclear', 'none'].filter(s => sec[s]));
  const title = s => s === 'unclear' ? 'When unclear' : s === 'none' ? 'No phase' : s.includes('|') ? PHASE_NAME[s.split('|')[0]] + ' · ' + TURN_NAME[s.split('|')[1]] : s;
  // each section a fold, as the Overview's rules: its name, and on the line under it how many lines each part has
  const fold = s => { const g = sec[s] || {}, parts = GROUPS.filter(([k]) => g[k]), k = 'ck|' + a.id + '|' + s;
    return '<details class="ab rr" data-ckfold="' + esc(k) + '"' + (openStrats.has(k) ? ' open' : '') + '><summary><span class="an"><b>' + esc(title(s)) + '</b><span class="rs">' +
      (parts.length ? metaLine(...parts.map(([x, , w]) => g[x].length + ' ' + w)) : 'nothing') + '</span></span>' + chev + '</summary><div class="body">' +
      (parts.length ? parts.map(([x, l]) => '<div class="ckg"><p class="qh">' + l + '</p>' + g[x].join('') + '</div>').join('') : '<p class="note">Nothing in this list.</p>') + '</div></details>'; };
  return '<div class="ckl"><div class="sec-h"><h2>Phase by phase</h2><button class="textbtn" data-ckreset>Reset</button></div><div class="abl">' + order.map(fold).join('') + '</div>' +
    '<p class="note">Listed: what you must remember when the game reaches a moment: a rule or ability whose own words name the start or end of a battle round, turn or phase, a Command phase, or another phase with a choice (To do now there; a rule listed only through such options is listed once, as the rule), and once-per-battle uses (Once per battle, their box only). Active now: what the others put in force, where it is used and for as long as their words say: their options, the ability they select, and a rule they name in bold as a state units are in (Riled up), unless its own trigger is a unit activation. What activating a unit triggers (selected to shoot, fight or move; each time it attacks, is targeted or destroys) is on its datasheet. When unclear: listed, but no phase can be read from its words. No phase: listed, with no phase. Each line opens the full text. Stratagems are on the Stratagems tab. Reset clears the boxes here, not the once-per-battle ones.</p></div>';
}

/* ---------- screen: rules & keywords ---------- */
const xp = (name, sub, tags, body, open) => '<details class="xp"' + (open ? ' open' : '') + '><summary><span class="xh"><b>' + esc(name) + '</b>' + (sub ? '<span>' + esc(sub) + '</span>' : '') + '</span>' +
  (tags || '') + chev + '</summary><div class="body">' + body + '</div></details>';
// the core rules a player looks up every game, from the Core Rules (07 The Battle Round, 08 Command
// Phase, 05 Attack Sequence; the dice in its tables are pictures, read from the printed page)
/* ---------- screen: rules ----------
   The rules of this list, laid out like a datasheet: a heading per section, a chip per
   detachment, one row per rule (its timing on the right, its text one tap away). The core
   rules the army uses are folded at the bottom, for reference. */
// a rule row: its name, and under it what kind of rule it is and when (the datasheet's second line)
function ruleRow(name, meta, body, cls){
  return '<details class="ab rr' + (cls ? ' ' + cls : '') + '"><summary><span class="an"><b>' + esc(name) + '</b>' + (meta ? '<span class="rs">' + meta + '</span>' : '') + '</span>' +
    chev + '</summary><div class="body">' + body + '</div></details>';
}
const metaLine = (...parts) => parts.filter(Boolean).join(' <span class="sep">·</span> ');
// a rules text with its table where the source prints it: tableAt = the number of text lines before it
// (Try Dat Button!: "…have the relevant rule(s):", the table, then the hazard-roll line)
function textWithTable(r){
  if(!r.table) return rt(r.text);
  const lines = String(r.text || '').split('\n'), at = r.tableAt == null ? lines.length : r.tableAt;
  return rt(lines.slice(0, at).join('\n')) + ttable(r.table) + (at < lines.length ? rt(lines.slice(at).join('\n')) : '');
}
// the army rules, each folded to its name, when it applies and whether any unit of this list has it
function armyRuleRows(f){
  return f.armyRules.map(r => {
    const once = r.tag && /^(once|twice) per /i.test(r.tag) ? r.tag : '';
    return ruleRow(r.name, metaLine(once ? '<span class="tg once">' + esc(once) + '</span>' : r.tag ? esc(r.tag) : '', r.ph ? esc(shortWhen(r)) : '', inertRule(r.name) ? 'no unit in this list it applies to' : ''),
      (r.note ? '<p class="note it">' + esc(r.note) + '</p>' : '') + textWithTable(r) + ((r.missing || []).length ? '<p class="note">Not in the app yet: the ' + esc(r.missing.join(' and ')) + ' (they need that Wahapedia page).</p>' : '') +
      (r.coreTwin ? '<p class="usedby"><span class="il">Core rule</span>' + linkTo('rule', r.coreTwin, r.coreTwin) + '</p>' : ''), inertRule(r.name) ? 'na' : '');
  }).join('');
}
function screenRules(){
  const f = faction(), a = army(), dets = detachments();
  const note = r => r.note ? '<p class="note it">' + esc(r.note) + '</p>' : '';
  const when = r => r.ph ? esc(shortWhen(r)) : '';
  const first = x => { const ph = phasesOf(x); return ph.length === PHASES.length ? 99 : PHASES.findIndex(([k]) => k === ph[0]); };
  let h = '<div class="rules"><div class="ds-meta"><span>' + esc(f.name + ' · ' + a.disposition) + '</span></div>';
  // army rules, and the faction's own terms this list uses (Pulse Jet Move)
  const terms = Object.keys(D.ruleSrc || {}).filter(k => /army rule/i.test(D.ruleSrc[k]) && ruleUsers(k).length);
  h += '<div class="dsec"><h2 class="lbl">Army rules</h2><div class="abl">' + armyRuleRows(f) + terms.map(k => ruleRow(k, metaLine(esc(D.ruleSrc[k].replace(/^.*?\((.*)\)$/, '$1'))), rt(D.rules[k]) + usedBy('Used by', ruleUsers(k)))).join('') + '</div></div>';
  // detachments: the rule, the enhancements this list takes (and who has them), the others, its stratagems
  h += '<div class="dsec"><h2 class="lbl">Detachments</h2>';
  for(const d of dets){
    const mine = d.enhancements.filter(e => holders(a, e.name).length), other = d.enhancements.filter(e => !holders(a, e.name).length);
    const gap = (d.missing || []).includes('enhancements') ? '<p class="note">The other ' + esc(d.name) + ' enhancements aren’t in the app yet: they need the Wahapedia page.</p>' : '';
    // in the Stratagems tab's order: phase order, the ones no unit can use last
    const strats = (d.stratagems || []).map((x, i) => [x, i]).sort((x, y) => (eligible(x[0]).length ? 0 : 1) - (eligible(y[0]).length ? 0 : 1) || first(x[0]) - first(y[0]) || x[1] - y[1]).map(x => x[0]);
    h += '<h3 class="who">' + esc(d.name) + '</h3><div class="abl">' +
      detRules(d).map(r => ruleRow(r.name, metaLine('Detachment rule', when(r)),
        note(r) + textWithTable(r) + usedBy('Applies to', a.units.filter(u => matches(r.needs, u))))).join('') +
      mine.map(e => { const hs = holders(a, e.name); return ruleRow(e.name, metaLine('<span class="tg">' + (e.upgrade ? 'Upgrade' : 'Enhancement') + '</span>', e.pts ? esc(e.pts) + ' pts' : '', 'on ' + esc(hs.map(u => holderName(u, e.name)).join(', '))),
        rt(e.text) + '<p class="usedby"><span class="il">On</span>' + hs.map(u => linkTo('unit', u.id, holderName(u, e.name))).join(', ') + '</p>'); }).join('') +
      (other.length ? ruleRow('Other enhancements', metaLine(other.length + ' not in this list'),
        other.map(e => '<div class="sub"><b class="nm">' + esc(e.name) + '</b>' + (e.pts ? ' <span class="tg m">' + esc(e.pts) + ' pts</span>' : '') + rt(e.text) + '</div>').join(''), 'oth') : '') +
      '</div><p class="dline rs"><span class="il">Stratagems</span>' + (strats.length ? strats.map(st => eligible(st).length ? linkTo('strat', st.id, st.name) : '<span class="none">' + linkTo('strat', st.id, st.name) + ' <span class="from">(no unit in this list)</span></span>').join(', ') : 'none (a rule and enhancements only)') + '</p>' + gap;
  }
  h += '</div>';
  // which unit has which core rule (Lone Operative, Deep Strike, Leader…): from its datasheet, or from one of its
  // abilities, quoted, since the ability says when. The rule's own text is one tap away, not written out here;
  // weapon keywords are on the weapons
  const used = new Map();
  const add = label => { const r = ruleFor(label); if(r && r.src === 'Core rule' && !used.has(r.key)) used.set(r.key, r); };
  for(const u of a.units){
    for(const r of unitRules(u)) add(r);
    for(const ab of u.abilities) for(const key of Object.keys(D.rules)) if(!CONCEPT.has(key) && mentions(ab.text, key)) add(key);
  }
  const weaponKw = new Set(a.units.flatMap(u => [...(u.ranged || []), ...(u.melee || [])].flatMap(w => w.kw.map(ruleKey).concat(w.hunter ? ['Hunter'] : []))));
  // an ability's words on its line, its bullets kept ("select one of the following:" and the two choices)
  const quoted = t => { let h = '', list = [];
    const flush = () => { if(list.length){ h += '<ul>' + list.map(l => '<li>' + inline(l) + '</li>').join('') + '</ul>'; list = []; } };
    for(const l of t.replace(/(^|\n)\*([^*\n][^\n]*[^*\n])\*(?=\n|$)/g, '$1$2').split('\n')){ if(l.startsWith('- ')) list.push(l.slice(2)); else { flush(); h += (h ? ' ' : '') + inline(l); } }
    flush(); return h; };
  // an attached unit is named whole; Leader and Support name the character who has it ("Warboss leads Breaka Boyz")
  const who = (u, key) => { if(!u.leads) return unitLink(u);
    const cs = key === 'Leader' || key === 'Support' ? charsOf(u).filter(c => c.support === (key === 'Support')) : [];
    return cs.length ? linkTo('unit', u.id, cs.map(c => c.name).join(' and ')) + ' ' + (key === 'Support' ? 'supports ' : 'leads ') + esc(u.leads) : linkTo('unit', u.id, unitLabel(u)); };
  const holdersOf = key => a.units.flatMap(u => {
    const own = unitRules(u).filter(r => ruleKey(r) === key);
    // from an ability: the unit, then the ability and its words (they say when)
    const abs = u.abilities.filter(ab => mentions(ab.text, key)).map(ab => { const na = naReason(ab);
      return '<span class="urq">' + linkTo('ability', abilityKey(ab), ab.name) + (na ? ' <i>(' + esc(na) + ')</i>' : '') + ': ' + quoted(ab.text) + '</span>'; }).join('');
    // "Deadly Demise D3", "Feel No Pain 5+": the value after the unit
    // a rule only one model has: which ("Canis Rex: Sir Hekhtur only")
    // a rule with no value ("Feel No Pain" on the Norn Emissary): the abilities that give it, too
    const bare = own.length && own.every(r => r.toLowerCase() === key.toLowerCase());
    if(own.length) return [who(u, key) + own.filter(r => r.toLowerCase() !== key.toLowerCase()).map(r => ' <span class="from">' + esc(r.toLowerCase().startsWith(key.toLowerCase()) ? r.slice(key.length).trim() : r) + '</span>').join('') + onlyTag(u, key) + (bare ? abs : '')];
    return abs ? [who(u, key) + abs] : [];
  });
  const ur = [...used.values()].filter(r => !weaponKw.has(r.key)).sort((x, y) => x.key.localeCompare(y.key));
  if(ur.length) h += '<div class="dsec"><h2 class="lbl">Unit rules</h2><div class="urs">' + ur.map(r => '<div class="urr"><span class="urn">' + linkTo('rule', r.key, r.key) + '</span>' +
    holdersOf(r.key).map(l => '<div class="uru">' + l + '</div>').join('') + '</div>').join('') + '</div></div>';
  return h + '</div>';
}

function jumpTo(id, instant){

/* ---------- popup sheet ---------- */
let sheetReturn = null, sheetRule = null, sheetNow = null;
const sheetStack = [];   // the popups under this one (a rule opened from a rule): "‹ Deep Strike" goes back
function openSheet(label, title, html, popped){
  const nested = !$('#sheetHost').hidden;
  navAt = performance.now();
  if(!nested){ sheetReturn = document.activeElement; sheetStack.length = 0; }
  else if(!popped && sheetNow) sheetStack.push(sheetNow);
  sheetNow = [label, title, html];
  const prev = sheetStack[sheetStack.length - 1];
  $('#sheetIn').innerHTML = '<div class="grab" aria-hidden="true"></div>' + (prev ? '<button class="sback" data-sback>‹ ' + esc(prev[1]) + '</button>' : '') +
    (label ? '<p class="lbl">' + label + '</p>' : '') + '<h2 id="sheetTitle">' + esc(title) + '</h2>' + html;
  $('#sheetHost').hidden = false;
  document.documentElement.classList.add('lock');
  $('#top').inert = true; $('#view').inert = true; $('#bbar').inert = true;
  $('#sheetIn').scrollTop = 0;
  $('#sheet').focus();
  try {
    if(!nested) history.replaceState(Object.assign(plain(cur), spot()), '');
    const st = Object.assign(plain(cur), { sheet:1 }); nested && history.state && history.state.sheet ? history.replaceState(st, '') : history.pushState(st, '');
  } catch(e){}
}
function hideSheet(){
  if($('#sheetHost').hidden) return;
  sheetStack.length = 0; sheetNow = null;
  $('#sheetHost').hidden = true;
  $('#sheet').style.removeProperty('--drag');
  document.documentElement.classList.remove('lock');
  $('#top').inert = false; $('#view').inert = false; $('#bbar').inert = false;
  if(sheetReturn && sheetReturn.isConnected) sheetReturn.focus({ preventScroll:true });
}
function closeSheet(){
  if($('#sheetHost').hidden) return;
  hideSheet();
  try { if(history.state && history.state.sheet) history.back(); } catch(e){}
}
function showRule(label){
  const r = ruleFor(label);

  sheetRule = r.key;   // the rule's own name inside its text is not a link to itself
  const kws = army().units.flatMap(u => [...(u.ranged || []), ...(u.melee || [])].flatMap(w => w.kw)).join(' ').toLowerCase();
  const text = r.text.split('\n').filter(l => { const m = /^\*App note[^\n]*suffix “([^”]+)”/.exec(l); return !m || kws.includes(m[1].toLowerCase()); }).join('\n');
  const body = textWithTable({ text, table:r.table, tableAt:r.tableAt });

// "Granted by": the rule(s) behind a marked value, their text, then the keyword's own rule
function grantSource(name, u){

// the options an ability asks the player to select from ("select one of the abilities in the X section", "select one X
// ability"): the unit's abilities printed under that section (who "Crimson King", "Wrathful Presence: pick one"), else the
// ability named X, whose text holds them (Rod of the War Forge: Icon of War). An ability that lists them itself has none here
function pickOptions(ab, u){
  const m = /\bselect one of the abilities in the (.+?) section\b/i.exec(ab.text) || /\bselect one ([^.,;]+?) ability\b/i.exec(ab.text);

  else { const last = store.get('wh-last'); restore(valid(last) ? last : ONLY ? { s:'army', army:ONLY.id } : { s:'home' }); if(valid(last)) toSpot(last); }
  checkForUpdate(true);
  keepAwake();
}
const hot = window.claude && window.claude.hot;
if(hot && hot.snapshot){ try { hot.snapshot(() => ({ cur:plain(cur), y:scrollY, open:[...openStrats], query })); } catch(e){} }
if(hot && hot.ready) hot.ready(start); else start(hot && hot.data ? hot.data : null);
