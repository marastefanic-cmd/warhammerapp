// a search word close enough to a word in the text: a plural, or 1 typo (2 for long words)
function near(w, t){
  if(w.startsWith(t) || (t.length > 3 && t.endsWith('s') && w.startsWith(t.slice(0, -1)))) return true;
  const k = t.length >= 7 ? 2 : t.length >= 4 ? 1 : 0;
  if(!k || Math.abs(w.length - t.length) > k) return false;
  let prev = Array.from({ length:t.length + 1 }, (x, j) => j);
  for(let i = 1; i <= w.length; i++){
    const row = [i];
    for(let j = 1; j <= t.length; j++) row[j] = Math.min(prev[j] + 1, row[j - 1] + 1, prev[j - 1] + (w[i - 1] === t[j - 1] ? 0 : 1));
    if(Math.min(...row) > k) return false;
    prev = row;
  }
  return prev[t.length] <= k;
}
// wrap each search word found in the title in <mark>, escaping everything else
function highlight(text, toks){
  const parts = toks.filter(t => t.length > 1).map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  if(!parts.length) return esc(text);
  return String(text).split(new RegExp('(' + parts.join('|') + ')', 'gi')).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}
// the other list of the game, searched too: the opponent picked on Find, or yours while you look at theirs (never the same list)
const gameOther = a => { if(peeking(a)) return mineList(); const o = oppOf(a); return o && o !== a ? o : null; };
function renderFinder(){
  const res = $('#qres');

  const toks = norm(q).split(/\s+/).filter(t => /[a-z0-9]/.test(t)).map(t => t.replace(/-/g, ''));
  const alts = toks.map(t => hasOwn(SYNONYM, t) ? [t, SYNONYM[t].replace(/-/g, '')] : [t]);

  const close = list => list.filter(e => { const words = e.words || (e.words = [...new Set(e.hay.split(/[^a-z0-9]+/).filter(Boolean))]);
    return alts.every(a => a.some(t => words.some(w => near(w, t)))); }).map(e => Object.assign({ score:4 }, e));

  const groupsOf = list => { const g = KIND_ORDER.map(k => ({ k, list:list.filter(e => e.kind === k).sort((x, y) => x.score - y.score) })).filter(g => g.list.length);
    return g.sort((x, y) => x.list[0].score - y.list[0].score || KIND_ORDER.indexOf(x.k) - KIND_ORDER.indexOf(y.k)); };
  const words = q.split(/\s+/);
  const whose = O && O === mineList() ? 'Your' : 'Their';
  const html = (g, L) => {
    const mk = (L ? 'o:' : '') + g.k, limit = moreShown.has(mk) ? Infinity : 6;
    return '<div class="rg' + (L ? ' oth' : '') + '"><div class="lbl">' + (L ? esc(whose + ' ' + g.k.toLowerCase() + ' (' + L.name + ')') : g.k) + ' · ' + g.list.length + '</div>' +
      g.list.slice(0, limit).map(e => {
        const act = e.act;
        const attrs = (L ? 'data-their="' + esc(L.id) + '" ' : '') + (act.strat ? 'data-strat="' + esc(act.strat) + '"' : act.rule ? 'data-rule="' + esc(act.rule) + '"' : act.ability ? 'data-ability="' + esc(act.ability) + '"' :
          act.enh ? 'data-enh="' + esc(act.enh) + '"' : 'data-unit="' + esc(act.unit) + '"' + (act.sec ? ' data-sec="' + esc(act.sec) + '"' : ''));
        return '<button class="res" ' + attrs + '><b>' + highlight(e.title, words) + '</b>' + (e.s1 ? '<span class="s1">' + esc(e.s1) + '</span>' : '') + '<span>' + esc(e.sub) + '</span></button>';
      }).join('') +
      (g.list.length > limit ? '<button class="more" data-more="' + esc(mk) + '">Show ' + (g.list.length - limit) + ' more</button>' : '') + '</div>';
  };
  res.innerHTML = groupsOf(hits).map(g => html(g, null)).join('') + groupsOf(oHits).map(g => html(g, O)).join('');

/* ---------- stratagems ---------- */
const stratWhenLine = s => [whenTag(s), s.limit, s.cpNote].filter(Boolean).join(' · ');

const lacks = s => { const n = s.needs || {}, us = army().units, lack = (n.all || []).filter(k => !us.some(u => hasKw(u, k)));

  if(n.any && !us.some(u => n.any.some(k => hasKw(u, k)))) return n.any.join(' or ').toUpperCase();
  if(n.attached && !us.some(u => matches(n, u))) return 'an attached unit';
  const ex = (n.none || []).filter(k => us.length && us.every(u => hasKw(u, k)));

const unitLabel = u => [u.name].concat(partsAfter(u)).join(' + ');
// "supporting Tankbustas"; with two characters "Bigboss supporting, Warboss leading Breaka Boyz"
const attachText = u => { const cs = charsOf(u); return cs.length > 1 ? cs.map(c => c.name + (c.support ? ' supporting' : ' leading')).join(', ') + ' ' + u.leads : (u.support ? 'supporting ' : 'leading ') + u.leads; };
// which character or part a models line belongs to (null outside attached units)
const whoOfLine = (u, i) => { const cs = charsOf(u); return !cs.length ? null : i < cs.length ? cs[i].name : u.leads; };

/* ---------- screen: bases & proxies ----------
   For proxy models on the right bases: how many bases of each size the army needs, and per
   unit one line per kind of model with what to write on its base. The most common model of a
   squad is "standard"; the others say what they have that it doesn't (a weapon, an icon, the
   champion). Leaders and single models get their name, enhancement and Warlord. */
const modelCount = u => u.models.reduce((t, m) => t + (parseInt(m, 10) || 1), 0);
const lineParts = m => { const x = /^(\d+)× (.+?)(?: \(([^)]+)\))?$/.exec(m) || [, '1', m]; return { n:+x[1], name:x[2], extra:x[3] || '' }; };

function baseOf(u, name, line){
  if(u.stats.length === 1) return u.stats[0].base;
  let rows = u.stats.map(s => ({ s, n:norm(s.name.replace(/ ×\d+$/, '')) }));
  const nm = norm(baseName(name));
  // in an attached unit the first models lines are the characters; the others are bodyguard models
  const nc = charsOf(u).length;
  if(u.leads && line >= nc && !rows.some(r => r.n === nm)) rows = rows.filter(r => !u.models.slice(0, nc).some(m => r.n === norm(baseName(lineParts(m).name))));
  const pre = (a, b) => { let i = 0; while(i < a.length && a[i] === b[i]) i++; return i; };
  const hit = rows.find(r => r.n === nm) || rows.find(r => nm.startsWith(r.n) || r.n.startsWith(nm)) || rows.slice().sort((x, y) => pre(y.n, nm) - pre(x.n, nm))[0];
  return hit.s.base;
}
function proxyLines(u){
  const lines = u.models.map((m, i) => Object.assign(lineParts(m), { gear:(u.gear || [])[i] || [], base:baseOf(u, lineParts(m).name, i) }));
  // the Warlord and the enhancement on the character that has them (warlordOn / enhOn), else the first
  const on = (field, i) => u[field] ? whoOfLine(u, i) === u[field] : i === 0;
  const tagOf = i => [u.warlord && on('warlordOn', i) ? 'Warlord' : '', u.enhancement && on('enhOn', i) ? u.enhancement : ''].filter(Boolean);
  // the unit's short name is the first character's only
  const own = (l, words, i) => [i === 0 && l.name !== u.name && u.short ? u.short : baseName(l.name)].concat(words).join(' · ');
  if(lines.length === 1 && lines[0].n === 1) return [Object.assign(lines[0], { mark:own(lines[0], tagOf(0), 0), lead:true })];
  const nc = u.leads ? charsOf(u).length : 0;
  const body = lines.slice(nc);
  lines.slice(0, nc).forEach((l, i) => Object.assign(l, { mark:own(l, tagOf(i), i), lead:true }));
  const std = body.slice().sort((x, y) => y.n - x.n)[0];
  for(const l of body){
    if(l === std){ l.mark = 'standard'; l.std = true; continue; }
    const sb = baseName(std.name), lb = baseName(l.name);
    const named = lb === sb ? '' : lb.startsWith(sb + ' ') ? lb.slice(sb.length + 1) : lb;
    const cnt = (list, g) => list.filter(x => x === g).length;
    const more = [...new Set(l.gear)].filter(g => cnt(l.gear, g) > cnt(std.gear, g)).map(g => cnt(l.gear, g) > 1 ? cnt(l.gear, g) + '× ' + g : g);
    // a line named as the standard one: also what it has less of (a Boy with only a Slugga is not "standard")
    const less = named ? [] : [...new Set(std.gear)].filter(g => cnt(l.gear, g) < cnt(std.gear, g)).map(g => cnt(l.gear, g) ? cnt(l.gear, g) + '× ' + g : 'no ' + g);
    l.mark = [named, more.join(' + '), less.join(', '), l.extra].filter(Boolean).join(' · ') || 'standard';

}
function screenBases(){

    return '<div class="px"><div class="pxh">' + linkTo('unit', u.id, u.name + (u.enhancement && !u.enhOn ? ' · ' + u.enhancement : '')) + (u.leads ? '<span class="tg m">+ ' + esc(partsAfter(u).join(' + ')) + '</span>' : '') +
      (c > 1 ? '<span class="tg m">' + c + ' units: mark them apart (' + Array.from({ length:c }, (_, i) => i + twinFirst(u)).join(', ') + ')</span>'
        : twinOf(u) && twinOf(u).n > 1 ? '<span class="tg m">' + twinOf(u).i + ' of ' + twinOf(u).n + '</span>' : '') + '</div>' +
      lines.map(l => '<div class="pxl"><span class="pxn">' + l.n + '× <b>' + esc(/\d/.test(l.base) ? l.base : 'no base') + '</b></span><span class="pxm' + (l.std ? ' std' : '') + '">' + esc(l.mark) +

/* ---------- screen: before the battle ----------

// a selection New Recruit prints ("Code Chivalric: Deed, Quality") that is only the names of an army rule's parts: every
// part is the first word of some of its table rows ("Deed 1–2 · …", "Quality 1–2 · …")
const ruleParts = (f, k, v) => { const r = f.armyRules.find(x => x.name === k); if(!r || !r.table) return false;
  const parts = new Set(r.table.map(([l]) => String(l).split(/\s/)[0].toLowerCase())); return String(v).split(/,\s*/).every(p => parts.has(p.trim().toLowerCase())); };
// "deploy" as the step (Deploy Armies, deployed, deployment), not "deployment zone" (that is where, not when)
const PREGAME_RE = /before the battle|declare battle formations|read mission objectives|pre-?battle|\bdeploy(?!ment zone)|redeploy|infiltrat/i;
function screenPregame(){
  const a = army(), f = faction(), units = a.units;
  const row = (k, v) => v ? '<div class="pgr"><span class="pgk">' + k + '</span><span class="pgv">' + v + '</span></div>' : '';
  const sec = (title, body) => body ? '<div class="sec-h"><h2>' + title + '</h2></div><div class="pg">' + body + '</div>' : '';
  // the same ability on several units is one line: "Singular Purpose · Assimilator (280), Norn Emissary ×2"
  const group = list => { const m = new Map(); for(const [u, ab] of list){ const k = ab.name + '|' + ab.text; if(!m.has(k)) m.set(k, { ab, units:[] }); m.get(k).units.push(u); } return [...m.values()]; };
  const abLine = g => linkTo('ability', abilityKey(g.ab), g.ab.name) + ' <span class="from">· ' + esc(unitNames(g.units)) + '</span>';
  const rulesOf = units.length ? f.armyRules.filter(r => !inertRule(r.name)).map(r => ({ r, src:f.name + ' army rule' }))
    .concat(detachments().filter(d => d.rule).map(d => ({ r:d.rule, src:d.name }))) : [];
  const ruleLine = x => linkTo('rule', x.r.name, x.r.name) + ' <span class="from">· ' + esc(x.src) + '</span>';
  const nameLink = u => linkTo('unit', u.id, u.short || u.name);   // without its enhancement: the line says it
  const allAbs = units.flatMap(u => u.abilities.filter(ab => !naReason(ab)).map(ab => [u, ab]));
  // Deep Strike (24.09) and Scouts (24.31) work only if every model in the unit has them; u.partialRules names
  // the rules only some models of an attached unit have (Slaughterbound's Scouts 6": its Exalted Eightbound have none)
  const everyModel = (u, test) => unitRules(u).some(test) && !Object.keys(u.partialRules || {}).some(test);
  // rules resolved before Declare Battle Formations (Code Chivalric: end of the Read Mission Objectives step)
  const early = rulesOf.filter(x => /read mission objectives/i.test(x.r.text));

  // your list
  const warlord = units.filter(u => u.warlord);
  const enh = units.flatMap(u => [u.enhancement, u.upgrade].filter(Boolean).map(n => { const d = detachments().find(x => (x.enhancements || []).some(e => e.name === n)), e = d && d.enhancements.find(x => x.name === n);
    return (d ? linkTo('enh', d.id + '|' + n, n) : esc(n)) + (n === u.upgrade ? ' <span class="from">(upgrade)</span>' : '') + (e && e.pts ? ' <span class="from">' + e.pts + ' pts</span>' : '') + ' on ' + (n === u.enhancement && u.enhOn ? linkTo('unit', u.id, u.enhOn) : n === u.upgrade && u.leads ? linkTo('unit', u.id, u.leads) : linkTo('unit', u.id, (u.short || u.name) + unitNo(u))); }));
  const led = units.filter(u => u.leads).flatMap(u => charsOf(u).map((c, i) => (i ? linkTo('unit', u.id, c.name) : nameLink(u)) + (c.support ? ' supports ' : ' leads ') + esc(u.leads) + (u.copies > 1 ? ' <span class="from">×' + u.copies + ' units</span>' : '')));
  // the opponent's list, opened from yours (Find's Opponent's list row): theirs, not yours
  let h = sec(peeking(a) ? 'Their list' : 'Your list',
    row('Warlord', warlord.map(u => u.warlordOn ? linkTo('unit', u.id, u.warlordOn) + ' <span class="from">(' + esc(unitLabel(u)) + ')</span>' : unitLink(u)).join(', ')) +
    row('Enhance&shy;ments', enh.join('<br>')) +
    row('Attached', led.join('<br>')) +
    row('Detach&shy;ments', detachments().map(d => (d.rule ? linkTo('rule', d.rule.name, d.name) : esc(d.name)) + (d.dp ? ' <span class="from">(' + d.dp + ' DP)</span>' : '')).join(', ') + (a.disposition ? '<br><span class="from">Disposition:</span> ' + esc(a.disposition) : '')) +
    // the other selections New Recruit prints under the army name, as printed; one that only names the parts of an army
    // rule ("Code Chivalric: Deed, Quality", each part's table rows) is no pick: that rule is under Army rules
    Object.entries(a.config || {}).filter(([k, v]) => !ruleParts(f, k, v)).map(([k, v]) => row(esc(k), esc(v))).join('') +
    row('Points', esc(a.pointsUsed + ' / ' + a.points + ' · ' + a.battleSize)));
  // the army rules, folded: each opens to its text
  h += f.armyRules.length ? '<div class="sec-h"><h2>Army rules</h2></div><div class="abl">' + armyRuleRows(f) + '</div>' : '';

  const earlyAbs = group(allAbs.filter(([u, ab]) => /read mission objectives/i.test(ab.text)));
  h += sec('Read Mission Objectives step', row('Rules', early.map(ruleLine).join('<br>')) + row('Abilities', earlyAbs.map(abLine).join('<br>')));

  // declare battle formations: reserves and transports
  const ds = units.filter(u => everyModel(u, r => ruleKey(r) === 'Deep Strike'));
  const dsPts = ds.reduce((t, u) => t + (u.pts || 0) * (u.copies || 1), 0);
  const transports = units.filter(u => hasKw(u, 'Transport')).map(u => { const ab = u.abilities.find(x => /transport capacity/i.test(x.text)); return unitLink(u) + (ab ? ': <span class="from">' + inline(ab.text.replace(/(^|\n)\*([^*\n][^\n]*[^*\n])\*(?=\n|$)/g, '$1$2').replace(/\n(- )?/g, ' ')) + '</span>' : ''); });
  h += sec('Declare battle formations',
    row(linkTo('rule', 'Deep Strike', 'Deep Strike'), ds.map(u => (u.leads ? linkTo('unit', u.id, unitLabel(u)) : unitLink(u)) + ' <span class="from">' + u.pts + ' pts' + (u.copies > 1 ? ' each, ×' + u.copies : '') + '</span>').join('<br>') + (ds.length > 1 ? '<br><span class="from">All of them: ' + dsPts + ' pts</span>' : '')) +
    row('Transports', transports.join('<br>')));

  // deployment and pre-battle abilities
  const scouts = units.filter(u => everyModel(u, r => /^scouts|^infiltrators/i.test(r)));
  const scoutRules = u => unitRules(u).filter(r => /^scouts|^infiltrators/i.test(r));
  const scoutKeys = [...new Set(scouts.flatMap(u => scoutRules(u).map(ruleKey)))].sort((x, y) => (x === 'Scouts' ? 0 : 1) - (y === 'Scouts' ? 0 : 1));
  const pre = group(allAbs.filter(([u, ab]) => PREGAME_RE.test(ab.text) && !/start of the first battle round|read mission objectives/i.test(ab.text)));
  h += sec('Deployment and pre-battle abilities',
    row(scoutKeys.map(k => linkTo('rule', k, k)).join(' and '), scouts.map(u => unitLink(u) + ' <span class="from">' + scoutRules(u).map(r => linkTo('rule', r, r)).join(', ') + '</span>').join('<br>')) +
    row('Abilities', pre.map(abLine).join('<br>')) +
    row('Rules', rulesOf.filter(x => PREGAME_RE.test(x.r.text) && !early.includes(x)).map(ruleLine).join('<br>')));

  // decided at the start of the battle (before the first battle round: Aegis Protocol, Code Chivalric's Deed 1–2, a row of its
  // table), of the first battle round or of every battle round
  const START = /\bstart of the battle\b(?! round)/i;
  const atStart = rulesOf.flatMap(x => { const rows = START.test(x.r.text) ? [] : (x.r.table || []).filter(([, t]) => START.test(t)).map(([l]) => String(l).split(' · ')[0]);
    return START.test(x.r.text) || rows.length ? [linkTo('rule', x.r.name, x.r.name) + ' <span class="from">' + (rows.length ? '(' + esc(rows.join(', ')) + ') ' : '') + '· ' + esc(x.src) + '</span>'] : []; })
    .concat(group(allAbs.filter(([u, ab]) => START.test(ab.text))).map(abLine));
  const first = group(allAbs.filter(([u, ab]) => /start of the first battle round/i.test(ab.text)));
  const round = rulesOf.filter(x => /start of (the|each|every) battle round/i.test(x.r.text)).map(ruleLine)
    .concat(group(allAbs.filter(([u, ab]) => /start of (the|each|every) battle round/i.test(ab.text) && !/start of the first battle round/i.test(ab.text))).map(abLine));
  const firstRules = rulesOf.filter(x => /start of the first battle round/i.test(x.r.text)).map(ruleLine);
  h += sec('Start of the battle round', row('Start of the battle', atStart.join('<br>')) + row('First round', firstRules.concat(first.map(abLine)).join('<br>')) + row('Every round', round.join('<br>')));

  // uses per battle: the resources you spend, ticked off until New game
  // a rule that gives units a "(Once per battle, per unit)" ability (Higher Imperatives) is ticked on those units, not here
  const ruleOnce = r => perBattle(r) && !/per battle\b(?! round)[^.)]*\bper unit\b/i.test(r.text || '');
  const onceRules = f.armyRules.filter(r => !inertRule(r.name) && ruleOnce(r)).map(r => ({ r, src:f.name + ' army rule' }))
    .concat(detachments().filter(d => d.rule && ruleOnce(d.rule)).map(d => ({ r:d.rule, src:d.name })));
  const tl = (boxes, text) => '<div class="tl">' + boxes + '<span>' + text + '</span></div>';
  const ruleTicks = x => { const r = x.r, pb = perBattle(r, true);
    // "You can only select each of these abilities once per battle" (Kindred Sorcery): a box per option
    if(/\beach of these [a-z ]+ once per battle/i.test(r.text) && r.table) return '<div class="tl"><span>' + ruleLine(x) + ':</span></div>' + r.table.map(o => tl(ticks('r:' + r.name + ':' + o[0], 1, '', o[0]), esc(o[0]))).join('');
    return tl(ticks('r:' + r.name, pb.n, '', r.name), ruleLine(x)); };
  const onceAbs = group(allAbs.filter(([u, ab]) => perBattle(ab)));
  const abTicks = g => perBattle(g.ab).army ? tl(abilityTicks(g.ab, g.units[0]), abLine(g) + ' <span class="tg once">per army</span>')
    : g.units.flatMap(u => Array.from({ length:u.copies || 1 }, (_, i) => tl(ticks(copyKey(g.ab, u, i), perBattle(g.ab).n, '', g.ab.name + (u.copies > 1 ? ', Unit ' + (i + 1) : '')),
        linkTo('ability', abilityKey(g.ab), g.ab.name) + ' · ' + linkTo('unit', u.id, unitLabel(u)) + (u.copies > 1 ? ' <span class="from">· Unit ' + (i + 1) + '</span>' : '')))).join('');
  const onceStrats = allStratagems().filter(s => eligible(s).length && perBattle(s));
  h += sec('Uses per battle',
    row('Rules', onceRules.map(ruleTicks).join('')) +
    row('Abilities', onceAbs.map(abTicks).join('')) +
    row('Strata&shy;gems', onceStrats.map(s => tl(ticks('s:' + s.id, perBattle(s, true).n, '', s.name), linkTo('strat', s.id, s.cp + 'CP ' + s.name))).join('')));
  if(onceRules.length || onceAbs.length || onceStrats.length) h = h.replace(/(<div class="sec-h"><h2>Uses per battle<\/h2>)/, '$1<button class="textbtn" data-newgame>New game</button>');
  return h + '<p class="note">Gathered from this list’s datasheets and rules; each line opens the full text.</p>';
}

/* ---------- screen: the Game tracker (a row on Find, like the Damage calculator) ----------
   Everything for running a game, and only here: the battle round, whose turn and the phase; both players' CP and VP; the
   choices this list's rules ask for (the Oath, Blessings, Doctrina Imperatives…), kept for the game; what this list (and,
   folded, the opponent's) can do in the phase shown; the Event Companion's mission sequence with this list's numbers.
   Every rules sentence is a quote (data.js GAME, or the list's own rules); what the screen works out is marked as an app note.
   The game is kept on this phone under the list you opened (yours); your opponent's list, opened from yours, shows the same
   game from their side. Its uses per battle are the Overview's ticks (the same storage), which its New game also clears.
   Nothing here changes a datasheet or any other screen. */
const gameOwner = a => peeking(a) ? mineList() : a;   // whose game this is: your list's, also when you look at your opponent's
const gameKey = a => 'wh-game-' + gameOwner(a).id;
// { round 1–5, half 0|1 (the first or the second turn of the round), first: the side that takes the first turn, ph: the phase,
//   cp / vp per side, picks[side][choice key][round, or 0 for the battle] = { group: option name(s), 'rolled:group', 'target:group' } }
function gameOf(a){
  const g = store.get(gameKey(a)), o = isObj(g) ? g : {}, n = (v, lo, hi, d) => Number.isInteger(v) && v >= lo && v <= hi ? v : d;
  const two = (x, hi) => ({ mine:n((x || {}).mine, 0, hi, 0), opp:n((x || {}).opp, 0, hi, 0) });
  return { round:n(o.round, 1, 5, 1), half:n(o.half, 0, 1, 0), first:o.first === 'opp' ? 'opp' : 'mine', ph:hasOwn(PHASE_NAME, o.ph) ? o.ph : 'command',
    cp:two(o.cp, 99), vp:two(o.vp, 999), picks:isObj(o.picks) ? o.picks : {} };
}
const gameSave = (a, g) => store.set(gameKey(a), g);
const gSide = a => a === gameOwner(a) ? 'mine' : 'opp';            // the side of the list on screen
const gOther = s => s === 'mine' ? 'opp' : 'mine';
const gTurnSide = g => g.half ? gOther(g.first) : g.first;           // whose turn it is
const gList = (a, s) => s === 'mine' ? gameOwner(a) : oppOf(gameOwner(a)) || null;   // a side's list (none picked yet: null)
// the Game tracker's New game: this game's round, turn, CP, VP and choices, and the uses per battle of both its lists (the
// Overview's tick boxes, the same storage); returns the undo. The Overview's own New game clears its list's uses per battle only
function newGame(a){
  const o = gameOwner(a), opp = oppOf(o);
  const keys = [gameKey(a), 'wh-used-' + o.id].concat(opp && opp !== o ? ['wh-used-' + opp.id] : []);
  const was = keys.map(k => [k, store.get(k, null)]);
  store.set(keys[0], null); for(const k of keys.slice(1)) store.set(k, []);
  return () => { for(const [k, v] of was) store.set(k, v); };
}

// ---- the choices a list's rules ask for ----
// A rule whose words have the player select (or activate) one, or up to two, of its options and say how long the pick
// lasts: until the end of the battle (or "for the coming battle"), for the battle round (until its end or the start of the
// next), until the start of this side's next Command phase (which is not the battle round for the player who goes second),
// or until another is picked ("remains in that protocol until it enters a different one"). Its options, in its own words: its table (Doctrina Imperatives; Code Chivalric's Deeds and
// Qualities by their D6 results), the abilities of the section it names ("the abilities in the Crimson King section": the
// abilities listed under that name, or the bold-named parts of the ability of that name), or its own bullets (Battle
// Protocols, Singular Purpose). A rule that has a unit or a model picked but no options (Omnissiah's Blessing) is not one.
const GC_SEL = /\b(?:select|activate)\s+(one|up to two|up to three)\b([^.]*)/gi;
function gcLasts(t){
  if(/\buntil the end of the battle(?! round)|\bfor the coming battle\b/i.test(t)) return 'battle';
  if(/\buntil the (?:end of the battle round|start of the next battle round)\b/i.test(t)) return 'round';
  if(/\buntil the start of your next command phase\b/i.test(t)) return 'command';
  if(/\bremains in that [a-z]+ until it enters a different one\b/i.test(t)) return 'kept';
  return '';
}
// "**Mantra of Discipline:** …" parts of a text, each with the "- " lines under it
function gcParts(text){
  const out = [];
  for(const raw of String(text || '').split('\n')){
    const l = raw.trim(), m = /^\*\*([^*]+?):\*\*\s*/.exec(l);
    if(m) out.push({ name:m[1], text:l });
    else if(out.length && /^- /.test(l)) out[out.length - 1].text += '\n' + l;
  }
  return out;
}
// "- **Protector Protocol:** …" or "- Select one enemy unit. …" lines
const gcBullets = text => String(text || '').split('\n').map(l => l.trim()).filter(l => /^- /.test(l)).map(l => {
  const b = /^- \*\*([^*]+?):\*\*/.exec(l), s = /^- ([^.:]+)[.:]/.exec(l);
  return { name:b ? b[1] : s ? s[1] : l.slice(2), text:l.slice(2) }; });
// a table's rows as options: "Deed 1–2 · We vow to lay low the tyrant…" is option 1–2 of the Deeds; "Unbridled Bloodlust ·
// double 1+" is the option Unbridled Bloodlust
function gcTable(table){
  const rows = table.map(([k, v]) => { const d = /^(\S+) (\d[–-]\d) · (.*)$/.exec(k), p = String(k).split(' · ');
    return d ? { group:d[1], name:d[2], title:d[3], text:v, row:k } : { group:'', name:p[0], title:p.slice(1).join(' · '), text:v, row:k }; });
  return [...new Set(rows.map(r => r.group))].map(g => ({ name:g, opts:rows.filter(r => r.group === g) }));
}
function gcOptions(x, u){
  const t = x.text || '', sel = [...t.matchAll(GC_SEL)];
  if(!sel.length) return null;
  if(x.table && x.table.length){
    const groups = gcTable(x.table);
    if(sel.some(m => /\bbelow\b/i.test(m[2]) || groups.some(g => g.name && new RegExp('^\\s*' + g.name + '\\b', 'i').test(m[2])))) return groups;
  }
  for(const m of sel){
    const sec = /^\s*(?:of the abilities in the )?(.+?) (?:section|ability)\b/i.exec(m[2]);
    if(sec && u){
      const N = sec[1].replace(/\*\*/g, '').trim();
      const whos = u.abilities.filter(ab => ab.who && (ab.who === N || ab.who.startsWith(N + ':')));
      if(whos.length) return [{ name:'', opts:whos.map(ab => ({ name:ab.name, text:ab.text, ab })) }];
      const host = u.abilities.find(ab => ab.name === N), parts = host ? gcParts(host.text) : [];
      if(parts.length > 1) return [{ name:'', opts:parts, host }];
    }
    if(/\b(?:of the following|listed below|from those listed below)\b/i.test(m[2])){ const b = gcBullets(t); if(b.length > 1) return [{ name:'', opts:b }]; }
  }
  return null;
}
// when the pick is made, in the rule's words: the start of the sentence that has the player select, or the first time the text names
// (the sentence is found in the text without its ** marks, the text it is read from)
const gcWhen = x => {
  const t = String(x.text || '').replace(/\*\*/g, ''), at = ([...t.matchAll(GC_SEL)][0] || { index:0 }).index, s0 = t.lastIndexOf('.', at) + 1, sen = t.slice(s0).trim();
  const own = /^(?:if your army faction is [^,]+, )?((?:at the (?:start|end) of|in) [^,]+),/i.exec(sen);
  const any = /\b(at the (?:start|end) of (?:the |your |each |every )?[^,.]+|in your [a-z ]+? phase)/i.exec(t);
  const w = own ? own[1] : any ? any[1] : x.at || '';
  return w ? w.charAt(0).toUpperCase() + w.slice(1) : '';
};
// a unit as the Overview names it: the attached unit whole, its enhancement, which of several ("Norn Assimilator (1 of 2)")
const gUnitName = u => unitLabel(u) + (u.enhancement && !u.enhOn ? ' · ' + u.enhancement : '') + unitNo(u).replace(/ ×\d+$/, '');
function gameChoices(a){
  return inArmy(a, () => {
    const f = faction(), out = [];
    const add = (x, key, src, link, u, i) => {
      const lasts = gcLasts(x.text || ''), groups = lasts && gcOptions(x, u);
      if(!groups) return;
      const m = [...String(x.text || '').matchAll(GC_SEL)][0];
      out.push({ key, name:x.name, src, link, lasts, groups, unit:u || null, copy:i || 0, when:gcWhen(x, m.index),
        max:{ 'up to two':2, 'up to three':3 }[m[1].toLowerCase()] || 1, rolled:/\brandomly select\b/i.test(x.text),
        state:(/\byour army becomes ([A-Z][a-z]+)\b/.exec(x.text) || [])[1] || '', once:/\bselect each of these [a-z ]+ once per battle\b/i.test(x.text), rule:x });
    };
    for(const r of f.armyRules) if(!inertRule(r.name)) add(r, 'r:' + r.name, f.name + ' army rule', ['rule', r.name]);
    for(const d of detachments()) if(d.rule && army().units.some(u => matches(d.rule.needs, u))) add(d.rule, 'r:' + d.rule.name, d.name + ' detachment rule', ['rule', d.rule.name]);
    for(const u of army().units) for(const ab of u.abilities){
      if(naReason(ab)) continue;
      const c = u.copies || 1;
      for(let i = 0; i < c; i++) add(ab, copyKey(ab, u, i), gUnitName(u) + (c > 1 ? ' · Unit ' + (i + 1) : ''), ['ability', abilityKey(ab)], u, i);
    }
    // an option of another choice of the same unit (a Crimson King ability, Wrathful Presence: pick one) is not a choice itself
    return out.filter(c => !c.unit || !out.some(o => o !== c && o.unit === c.unit && o.groups.some(gr => gr.opts.some(x => x.ab === c.rule))));
  });
}
// the round a pick is kept under: 0 for the battle, else the battle round; one until this side's next Command phase, the round of
// this side's last Command phase (in the first turn of a round, for the player who goes second, the round before); a pick kept
// until changed is the last one made
const gcRound = (c, g, side) => c.lasts === 'battle' ? '0' : c.lasts === 'command' ? String(Math.max(1, g.half >= ((side || 'mine') === g.first ? 0 : 1) ? g.round : g.round - 1)) : String(g.round);
function gcPick(c, g, side){
  const all = ((g.picks[side] || {})[c.key]) || {};
  if(c.lasts === 'command'){ const R = gcRound(c, g, side); return { v:all[R] || {}, since:R === String(g.round) ? null : +R, all }; }
  if(c.lasts !== 'kept') return { v:all[gcRound(c, g, side)] || {}, since:null, all };
  for(let r = g.round; r >= 1; r--) if(isObj(all[r]) && Object.keys(all[r]).length) return { v:all[r], since:r === g.round ? null : r, all };
  // none picked yet: the option the rule's words start the battle in ("At the start of the battle, … that unit enters Aegis Protocols")
  const m = /\b[Aa]t the start of the battle, [^.]*?\benters (?:the )?([A-Z][\w’']*(?: [A-Z][\w’']*)*)/.exec(String(c.rule.text || '').replace(/\*\*/g, ''));
  const gr = c.groups[0], o = m && gr.opts.find(x => m[1].toLowerCase().startsWith(x.name.toLowerCase()));
  return o ? { v:{ [gr.name]:o.name }, since:'start', all } : { v:{}, since:null, all };
}
const gcNames = v => [].concat(v == null ? [] : v);
// the units a picked option has the player select from the opponent's army ("select one CHARACTER model in your opponent's
// army", "select one enemy unit"), when their list is picked
function gcTargets(text, opp){
  if(!opp) return null;
  const t = String(text || '').replace(/\*\*/g, ''), m = /\bselect one (?:([A-Z][A-Z -]*[A-Z]) )?(?:model|unit) (?:in|from) your opponent[’']s army\b|\bselect one (enemy) unit\b/i.exec(t);
  if(!m) return null;
  const kw = m[1] && m[1] === m[1].toUpperCase() ? m[1] : '';
  return inArmy(opp, () => opp.units.filter(u => !kw || hasKw(u, kw)).map(u => ({ id:u.id, name:shortName(u) })));
}

// ---- what a list can do in a phase ----
// A rule, ability or stratagem is in a phase of a turn when its phase tags say so (ph/phases, turn/turns, and an army
// rule's reminders), read here from the data itself. It sits in the step its own words name: "At the start of your Command
// phase" → Start of Command Phase, "At the end of …" → the end, anything else during the phase; a rule for every phase is
// "Any phase". What is triggered outside the players' turns is shown in the battle round's first Command phase, for both
// lists whatever their turn tags: "At the start of the battle round" (or an `at` of that) under Start of Battle Round, and in
// the first battle round also "At the start of the first battle round" and "At the start of the battle" (Battle Protocols'
// Aegis Protocol); in a later Command phase such a rule is shown only when its words also name the Command phase ("In your
// Command phase, … select one protocol"). The end of a turn ("At the end of your opponent's turn") is shown at the end of
// that turn's Fight phase. A rule with no phase tags is shown where its own first words put it ("At the end of your

const G_STEP = /^(?:\((?:once|twice) per [^)]*\) )?(?:(?:once per [a-z ]+|if your army faction is [^,]+), )?(?:at )?(?:the )?(start|end) of (?:(your opponent[’']s |your |the |each |every |any )?(command|movement|shooting|charge|fight) phase|(?:your opponent[’']s |your |the |each |a )?(first battle round|battle round|battle|turn|phase))\b/i;

  const m = G_STEP.exec(gText(x));

  const w = m[4].toLowerCase();
  if(w === 'battle round' || w === 'first battle round') return se === 'start' ? (w === 'first battle round' ? 'first' : 'round') : 'roundEnd';

// third pick replaces the first; Rolled, the state (Honoured) and their unit go on and off. The options a rule lets you pick
// once per battle (Kindred Sorcery) are the Overview's ticks for them: picking one ticks it, unpicking it unticks it
function gamePick(a, spec){
  let k, R, grp, opt;
  try { [k, R, grp, opt] = JSON.parse(spec); } catch(e){ return; }
  const g = gameOf(a), side = gSide(a), c = gameChoices(a).find(x => x.key === k);
  if(!c) return;
  const P = g.picks[side] = isObj(g.picks[side]) ? g.picks[side] : {}, all = P[k] = isObj(P[k]) ? P[k] : {}, v = all[R] = isObj(all[R]) ? all[R] : {};
  if(/^(rolled|target):|^state$/.test(grp)){ const x = opt || true; if(v[grp] === x) delete v[grp]; else v[grp] = x; }
  else {
    const was = gcNames(v[grp]), next = was.includes(opt) ? was.filter(x => x !== opt) : c.max > 1 ? was.concat(opt).slice(-c.max) : [opt];
    if(next.length) v[grp] = c.max > 1 ? next : next[0]; else delete v[grp];
    if(!next.includes(opt) || c.max === 1) delete v['target:' + grp];   // another option: its unit is picked again
    const gr = c.groups.find(x => x.name === grp);
    if(c.once && gr){ const used = usedSet();
      for(const o of gr.opts){ const tk = 'r:' + c.name + ':' + o.row + '#0', other = Object.entries(all).some(([r, x]) => r !== R && gcNames((x || {})[grp]).includes(o.name));
        if(next.includes(o.name)) used.add(tk); else if(was.includes(o.name) && !other) used.delete(tk); }
      store.set(usedKey(), [...used]); }
  }
  if(!Object.keys(v).length) delete all[R];
  gameSave(a, g);
}

// a rule row: its name, and under it what kind of rule it is and when (the datasheet's second line)
function ruleRow(name, meta, body, cls){
  return '<details class="ab rr' + (cls ? ' ' + cls : '') + '"><summary><span class="an"><b>' + esc(name) + '</b>' + (meta ? '<span class="rs">' + meta + '</span>' : '') + '</span>' +

const metaLine = (...parts) => parts.filter(Boolean).join(' <span class="sep">·</span> ');

// (Try Dat Button!: "…have the relevant rule(s):", the table, then the hazard-roll line)
function textWithTable(r){
  if(!r.table) return rt(r.text);
  const lines = String(r.text || '').split('\n'), at = r.tableAt == null ? lines.length : r.tableAt;
  return rt(lines.slice(0, at).join('\n')) + ttable(r.table) + (at < lines.length ? rt(lines.slice(at).join('\n')) : '');
}
// the army rules, each folded to its name, when it applies and whether any unit of this list has it
function armyRuleRows(f){

    return ruleRow(r.name, metaLine(once ? '<span class="tg once">' + esc(once) + '</span>' : r.tag ? esc(r.tag) : '', r.ph ? esc(shortWhen(r)) : '', inertRule(r.name) ? 'no unit in this list it applies to' : ''),

      (r.coreTwin ? '<p class="usedby"><span class="il">Core rule</span>' + linkTo('rule', r.coreTwin, r.coreTwin) + '</p>' : ''), inertRule(r.name) ? 'na' : '');

// drag the sheet down to close it
(() => {
  const sh = $('#sheet');
  let y0 = null, dy = 0;
  sh.addEventListener('touchstart', e => { y0 = $('#sheetIn').scrollTop <= 0 ? e.touches[0].clientY : null; dy = 0; }, { passive:true });
  sh.addEventListener('touchmove', e => {
    if(y0 == null) return;

    if(dy < 0){ y0 = null; dy = 0; sh.classList.remove('drag'); sh.style.removeProperty('--drag'); return; }
    sh.classList.add('drag'); sh.style.setProperty('--drag', dy + 'px');

    sh.classList.remove('drag');
    if(y0 != null && dy > 90) closeSheet(); else sh.style.removeProperty('--drag');

function dmToast(m, undo){

  const t = $('#toast'), tabs = $('#bbar .tabs'), tr = tabs && tabs.getClientRects().length ? tabs.getBoundingClientRect() : null;

  t.classList.add('show', 'dmt'); t.classList.toggle('act', !!undo); t.classList.remove('fit', 'wrap');

  const tm = t.querySelector('.tm'); if(tm && tm.scrollWidth > tm.clientWidth + 1){ t.classList.add('fit'); if(tm.scrollWidth > tm.clientWidth + 1) t.classList.add('wrap'); }

// a typed target's number box selects its number when tapped, so typing replaces it ("10" over 5 is 10, not 510)
let dmTyFocus = 0, dmTyKeep = false;
document.addEventListener('focusin', e => { const t = e.target; if(!t.matches || !t.matches('[data-dmtyped]')) return;
  if(dmTyKeep){ dmTyKeep = false; return; }   // focus put back after a redraw while typing: the caret stays where it was
  dmTyFocus = performance.now(); const sel = () => { try { t.setSelectionRange(0, t.value.length); } catch(err){ t.select(); } }; sel(); setTimeout(sel, 0); });
for(const ev of ['mouseup', 'pointerup']) document.addEventListener(ev, e => { const t = e.target;
  if(t.matches && t.matches('[data-dmtyped]') && performance.now() - dmTyFocus < 400 && e.cancelable){ e.preventDefault(); try { t.setSelectionRange(0, t.value.length); } catch(err){} } }, { passive:false });
// a typed target's number counts while it is typed (a phone's keypad has no Enter), a quarter of a second after the last key, as
// the steppers do; the field keeps the focus and the caret
// (the field being typed in is never rewritten nor selected: the screen is redrawn around it, dmRedrawAround)
let dmTyT = null;
document.addEventListener('input', e => { const t = e.target; if(!t.matches || !t.matches('[data-dmtyped]')) return;
  const k = t.dataset.dmtyped, ok = dmTypedOk(k, t.value), h = $('#dmTyHint');
  if(h){ h.hidden = ok; h.textContent = ok ? '' : DM_TY_HINT[k] + ' · ' + (t.value.trim() ? '“' + t.value.trim() + '” is not counted' : 'type a number') + '; leaving the field puts back ' + (v => k === 'n' || k === 'T' || k === 'W' ? v : v ? v + '+' : 'none')(dmTypedVals(dmState())[k]); }
  clearTimeout(dmTyT);
  if(!ok) return;
  dmTyT = setTimeout(() => { if(!t.isConnected) return; const st = dmState(), was = JSON.stringify(st.typed);
    dmTypedSet(st, k, t.value); if(JSON.stringify(st.typed) === was) return;
    saveSession(); dmRedrawAround(t); }, 250); });
// the Damage tab drawn again with one element kept as it is (the typed target's fields while one is typed in): every other part
// replaced, the strip too
function dmRedrawAround(el){
  const keep = el.closest('#dmTyped'), v = $('#view');
  if(!keep || keep.parentElement !== v || cur.s !== 'damage'){ rerender(); return; }
  const y = scrollY, tpl = document.createElement('template'); tpl.innerHTML = screenDamage();
  const fresh = [...tpl.content.children], at = fresh.findIndex(x => x.id === 'dmTyped');
  if(at < 0){ rerender(); return; }
  for(const x of [...v.children]) if(x !== keep) x.remove();
  fresh.slice(0, at).forEach(x => v.insertBefore(x, keep)); fresh.slice(at + 1).forEach(x => v.appendChild(x));
  // the other fields and the keywords, as counted now
  const nk = fresh[at];
  for(const f of nk.querySelectorAll('[data-dmtyped]')){ const o = keep.querySelector('[data-dmtyped="' + f.dataset.dmtyped + '"]'); if(o && o !== el) o.value = f.value; }
  const kw = keep.querySelector('.dmtkw'), nkw = nk.querySelector('.dmtkw'); if(kw && nkw) kw.innerHTML = nkw.innerHTML;
  const s = $('#dmStrip'); if(s){ const mini = s.classList.contains('mini'); s.outerHTML = dmStripHtml(); if(mini) $('#dmStrip').classList.add('mini'); measure(); }
  scrollTo(0, y);
}
// a typed target's number, typed: kept once the field is left (the next field tapped keeps the focus)
document.addEventListener('change', e => {
  const t = e.target;
  if(!t.matches || !t.matches('[data-dmtyped]')) return;
  // an entry the field cannot count is not kept: leaving puts back the value counted, as its hint says (never clamped)
  if(dmTypedOk(t.dataset.dmtyped, t.value)) dmTypedSet(dmState(), t.dataset.dmtyped, t.value);
  saveSession();
  setTimeout(() => { const a = document.activeElement, next = a && a.dataset ? a.dataset.dmtyped : null; rerender();
    if(next){ const f = $('[data-dmtyped="' + next + '"]'); if(f){ f.focus({ preventScroll:true }); f.select(); } } }, 0);
});
// remember expanded stratagem cards
document.addEventListener('toggle', e => {
  const d = e.target;
  if(!d.dataset) return;
  if(d.hasAttribute('data-dmfold')){ dmState().fold[d.dataset.dmfold] = d.open; saveSession(); return; }   // the Damage tab's folds stay as left
  if(d.hasAttribute('data-gfold')){ sess.gfold = Object.assign(isObj(sess.gfold) ? sess.gfold : {}, { [d.dataset.gfold]:d.open }); saveSession(); return; }   // and the Game tracker's
  if(d.dataset.stratId){
    if(d.open) openStrats.add(d.dataset.stratId); else openStrats.delete(d.dataset.stratId);
    saveSession();
    const x = $('#view [data-expand]');
    if(x) x.textContent = $$('#view details.strat').every(c => c.open) ? 'Collapse all' : 'Expand all';
  }
}, true);
$('#sheetBack').addEventListener('click', closeSheet);
addEventListener('keydown', e => {
  const t = e.target;
  if(t.id === 'askQ' && e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); askSend(); return; }
  if((e.key === 'Enter' || e.key === ' ') && t.matches && t.matches('[role="button"]')){ e.preventDefault(); t.click(); return; }
  if(e.key !== 'Escape') return;
  if(t.matches && t.matches('input, textarea')){ t.blur(); return; }
  if(!$('#sheetHost').hidden) closeSheet(); else if(cur.s !== 'home') back();
});
addEventListener('resize', measure);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
document.addEventListener('touchstart', () => {}, { passive:true });   // lets :active styles show on iOS

/* ---------- install + live updates ---------- */
const INSTALLED = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const ON_SITE = /github\.io$|^localhost$|^127\.0\.0\.1$/.test(location.hostname);
const SITE_URL = 'https://marastefanic-cmd.github.io/warhammerapp/';
function installText(){
  if(INSTALLED) return 'Installed on this phone. It updates itself each time you open it.';
  if(ON_SITE) return 'Put it on your home screen: Safari → Share → Add to Home Screen.';
  return 'Phone app: open <a class="link" href="' + SITE_URL + '" target="_blank" rel="noopener">' + SITE_URL.replace('https://', '') + '</a> in Safari, then Share → Add to Home Screen.';
}
// the home-screen app has no browser back gesture: swipe in from the left edge to go back
if(INSTALLED){
  let sx = null, sy = 0;
  addEventListener('touchstart', e => { const t = e.touches[0]; sx = t.clientX < 24 && $('#sheetHost').hidden && cur.s !== 'home' ? t.clientX : null; sy = t.clientY; }, { passive:true });
  addEventListener('touchend', e => { if(sx == null) return; const t = e.changedTouches[0]; if(t.clientX - sx > 70 && Math.abs(t.clientY - sy) < 50) back(); sx = null; }, { passive:true });
}
try { if(ON_SITE && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch(e){}
// the installed copy compares its build stamp with the site's. On opening it reloads at once;
// later it waits until you are back on the army list or the menu, so it never moves you mid-read.
let updateReady = null;
// one reload per new version (a retry after two minutes, in case the first got a stale page);
// if nothing can be stored, never reload, rather than reload forever
const RELOAD_KEY = 'wh-reloaded-for';
function reloadedRecently(v){
  for(const k of ['sessionStorage','localStorage']){
    try { const r = JSON.parse(window[k].getItem(RELOAD_KEY) || 'null'); if(r && r.v === v && Date.now() - r.at < 120000) return true; } catch(e){}
  }
  return false;
}
function markReload(v){
  for(const k of ['sessionStorage','localStorage']){
    try { window[k].setItem(RELOAD_KEY, JSON.stringify({ v, at:Date.now() })); if(JSON.parse(window[k].getItem(RELOAD_KEY)).v === v) return true; } catch(e){}
  }
  return false;
}
function reloadNow(){
  if(!markReload(updateReady)){ updateReady = null; return; }
  try { history.replaceState(Object.assign(plain(cur), spot()), ''); } catch(e){}
  saveSession();
  location.reload();
}
async function checkForUpdate(atStart){
  if(!ON_SITE || !BUILD) return;
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache:'no-store' });
    if(!r.ok) return;
    const v = (await r.json()).version;
    if(!v || v === BUILD || reloadedRecently(v)) return;
    updateReady = v;
    if(atStart || (calm(cur) && $('#sheetHost').hidden && document.activeElement !== $('#armyQ'))) reloadNow();
  } catch(e){}
}
function saveSpot(){
  const sp = spot();
  try { if(!(history.state && history.state.sheet)) history.replaceState(Object.assign(plain(cur), sp), ''); } catch(e){}
  store.set('wh-last', Object.assign(plain(cur), sp));
}
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') checkForUpdate(false); else saveSpot(); });
addEventListener('pagehide', saveSpot);

/* ---------- boot ---------- */
try { history.scrollRestoration = 'manual'; } catch(e){}
// keep the current history entry if it is a screen (a reload), otherwise rebuild the last screen's chain
function start(snap){
  const st = history.state;
  if(snap && snap.open){ snap.open.forEach(id => openStrats.add(id)); Object.assign(query, snap.query || {}); }
  if(st && valid(st)){   // a reload: this entry is the screen (with a popup open, the screen under it)
    cur = plain(st);
    if(st.sheet){ try { history.replaceState(plain(cur), ''); } catch(e){} }
    render(); toSpot(st);
  }
  else if(snap && valid(snap.cur)){ restore(snap.cur); toSpot(snap); }
  else { const last = store.get('wh-last'); restore(valid(last) ? last : ONLY ? { s:'army', army:ONLY.id } : { s:'home' }); if(valid(last)) toSpot(last); }
  checkForUpdate(true);
  keepAwake();
}
const hot = window.claude && window.claude.hot;
if(hot && hot.snapshot){ try { hot.snapshot(() => ({ cur:plain(cur), y:scrollY, open:[...openStrats], query })); } catch(e){} }
if(hot && hot.ready) hot.ready(start); else start(hot && hot.data ? hot.data : null);
</script>
