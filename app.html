    const abil = phaseItems().filter(fits).map((a, i) => [a, i]).sort((x, y) => timing(x[0].text) - timing(y[0].text) || x[1] - y[1]).map(x => x[0]);
    if(rem.length || abil.length) h += '<div class="sec-h"><h2>Also this phase</h2>' + (abil.length ? '<span class="c">' + abil.length + (abil.length === 1 ? ' ability' : ' abilities') + '</span>' : '') + '</div>' + rem.join('') +
      (abil.length ? '<div class="list">' + abil.map(a => xp(a.name, a.sub, a.tag ? '<span class="tg m">' + esc(a.tag) + '</span>' : '',
        rt(a.text) + (a.table ? ttable(a.table) : '') + usedBy('Units', a.units), false)).join('') + '</div>' : '');
    // when the opponent shoots or fights, the questions are "what's your save, can I see it"
    if((p === 'shooting' || p === 'fight') && filt.turn !== 'your') h += '<div class="sec-h"><h2>When targeted</h2></div>' + defenceList();
  }
  const notes = [];
  const gaps = detachments().filter(d => (d.missing || []).includes('stratagems')).map(d => d.name);
  if(gaps.length) notes.unshift(gaps.join(' and ') + ' stratagems aren’t in the app yet: they need the Wahapedia page.');
  if(blocked.length) notes.push('Not shown, no unit here can use ' + (blocked.length === 1 ? 'it' : 'them') + ': ' + blocked.join(', ') + '.');
  notes.push('All stratagem text is Wahapedia’s wording.');
  return h + notes.map(n => '<p class="note">' + esc(n) + '</p>').join('');
}

/* ---------- screen: bases & proxies ----------
   For proxy models on the right bases: how many bases of each size the army needs, and per
   unit one line per kind of model with what to write on its base. The most common model of a
   squad is "standard"; the others say what they have that it doesn't (a weapon, an icon, the
   champion). Leaders and single models get their name, enhancement and Warlord. */
const modelCount = u => u.models.reduce((t, m) => t + (parseInt(m, 10) || 1), 0);
const lineParts = m => { const x = /^(\d+)× (.+?)(?: \(([^)]+)\))?$/.exec(m) || [, '1', m]; return { n:+x[1], name:x[2], extra:x[3] || '' }; };
const baseName = name => name.replace(/ w\/.*$/, '');
function baseOf(u, name){
  if(u.stats.length === 1) return u.stats[0].base;
  const nm = norm(baseName(name)), rows = u.stats.map(s => ({ s, n:norm(s.name.replace(/ ×\d+$/, '')) }));
  const pre = (a, b) => { let i = 0; while(i < a.length && a[i] === b[i]) i++; return i; };
  const hit = rows.find(r => r.n === nm) || rows.find(r => nm.startsWith(r.n) || r.n.startsWith(nm)) || rows.slice().sort((x, y) => pre(y.n, nm) - pre(x.n, nm))[0];
  return hit.s.base;
}
function proxyLines(u){
  const lines = u.models.map((m, i) => Object.assign(lineParts(m), { gear:(u.gear || [])[i] || [], base:baseOf(u, lineParts(m).name) }));
  const tag = [u.warlord ? 'Warlord' : '', u.enhancement].filter(Boolean);
  const own = (l, words) => [l.name === u.name || !u.short ? baseName(l.name) : u.short].concat(words).join(' · ');
  if(lines.length === 1 && lines[0].n === 1) return [Object.assign(lines[0], { mark:own(lines[0], tag), lead:true })];
  const body = u.leads ? lines.slice(1) : lines;
  if(u.leads) Object.assign(lines[0], { mark:own(lines[0], tag), lead:true });
  const std = body.slice().sort((x, y) => y.n - x.n)[0];
  for(const l of body){
    if(l === std){ l.mark = 'standard'; l.std = true; continue; }
    const sb = baseName(std.name), lb = baseName(l.name);
    const named = lb === sb ? '' : lb.startsWith(sb + ' ') ? lb.slice(sb.length + 1) : lb;
    const more = l.gear.filter(g => !std.gear.includes(g));
    l.mark = [named, more.join(' + '), l.extra].filter(Boolean).join(' · ') || 'standard';
  }
  return lines;
}
function screenBases(){
  const a = army(), total = new Map();
  const units = ROLE_ORDER.flatMap(r => a.units.filter(u => (ROLE_ORDER.includes(u.role) ? u.role : 'Other') === r));
  const cards = units.map(u => {
    const lines = proxyLines(u), c = u.copies || 1;
    for(const l of lines) if(/\d/.test(l.base)) total.set(l.base, (total.get(l.base) || 0) + l.n * c);   // "Hull": no base
    return '<div class="px"><div class="pxh">' + unitLink(u) + (u.leads ? '<span class="tg m">+ ' + esc(u.leads) + '</span>' : '') +
      (c > 1 ? '<span class="tg m">' + c + ' units: mark them apart (1, 2' + (c > 2 ? ', 3' : '') + ')</span>' : '') + '</div>' +
      lines.map(l => '<div class="pxl"><span class="pxn">' + l.n + '× <b>' + esc(/\d/.test(l.base) ? l.base : 'no base') + '</b></span><span class="pxm' + (l.std ? ' std' : '') + '">' + esc(l.mark) +
        (l.std && l.gear.length ? ' <i>' + esc(l.gear.join(', ')) + '</i>' : '') + '</span></div>').join('') + '</div>';
  });
  const sizes = [...total].sort((x, y) => (parseFloat(x[0]) || 999) - (parseFloat(y[0]) || 999));
  return '<p class="lbl grp-h">Bases to print</p><p class="pxt">' + sizes.map(([b, n]) => '<span><b>' + n + '×</b> ' + esc(b) + '</span>').join('') + '</p>' +
    '<p class="lbl grp-h">What to write on each base</p><div class="list">' + cards.join('') + '</div>' +
    '<p class="note">From the New Recruit list: model counts and loadouts per model, base sizes from the datasheets.</p>';
}

/* ---------- screen: rules & keywords ---------- */
const xp = (name, sub, tags, body, open) => '<details class="xp"' + (open ? ' open' : '') + '><summary><span class="xh"><b>' + esc(name) + '</b>' + (sub ? '<span>' + esc(sub) + '</span>' : '') + '</span>' +
  (tags || '') + chev + '</summary><div class="body">' + body + '</div></details>';
function screenRules(){
  const f = faction(), a = army();
  const taken = new Map(a.units.filter(u => u.enhancement).map(u => [u.enhancement, u]));
  let h = '<div class="sec-h"><h2>Army rules</h2></div><div class="list">' +
    f.armyRules.map((r, i) => xp(r.name, r.ph ? whenTag(r) : '', r.tag ? '<span class="tg m">' + esc(r.tag) + '</span>' : '', rt(r.text) + (r.table ? ttable(r.table) : '') +
      ((r.missing || []).length ? '<p class="note">Not in the app yet: the ' + esc(r.missing.join(' and ')) + ' (they need that Wahapedia page).</p>' : ''), false)).join('') + '</div>';
  for(const d of detachments()){
    const mine = d.enhancements.filter(e => taken.has(e.name)), other = d.enhancements.filter(e => !taken.has(e.name));
    const gap = (d.missing || []).includes('enhancements') ? '<p class="note">The other ' + esc(d.name) + ' enhancements aren’t in the app yet: they need the Wahapedia page.</p>' : '';
    h += '<div class="sec-h"><h2>' + esc(d.name) + '</h2></div><div class="list">' +
      (d.rule ? xp(d.rule.name, 'Detachment rule', '', rt(d.rule.text) + (d.rule.table ? ttable(d.rule.table) : '') + usedBy('Applies to', a.units.filter(u => matches(d.rule.needs, u))), false) : '') +
      mine.map(e => xp(e.name, 'Enhancement' + (e.pts ? ' · ' + e.pts + ' pts' : ''), '', rt(e.text) + usedBy('On', [taken.get(e.name)]), false)).join('') +
      (other.length ? xp('Other enhancements', other.length + ' not in this list', '',
        other.map(e => '<div class="sub"><b class="nm">' + esc(e.name) + '</b>' + (e.pts ? ' <span class="tg m">' + esc(e.pts) + ' pts</span>' : '') + rt(e.text) + '</div>').join(''), false) : '') +
      '</div>' + gap;
  }
  // the core rules and weapon keywords this army actually uses, each listed once
  const used = new Map();
  const note = (label, kind) => {
    const r = ruleFor(label);
    if(!r || r.src !== 'Core rule') return;
    const e = used.get(r.key) || { r, kind, labels:new Set() };
    if(kind === 'weapon') e.kind = 'weapon';
    if(label.toLowerCase() !== r.key.toLowerCase()) e.labels.add(label);
    used.set(r.key, e);
  };
  for(const u of a.units){
    for(const r of unitRules(u)) note(r, 'ability');
    for(const w of [...(u.ranged || []), ...(u.melee || [])]){ for(const k of w.kw) note(k, 'weapon'); if(w.hunter) note('Hunter', 'weapon'); }
    for(const ab of u.abilities) for(const key of Object.keys(D.rules)) if(!CONCEPT.has(key) && mentions(ab.text, key)) note(key, 'ability');
  }
  const gloss = kind => [...used.values()].filter(e => e.kind === kind).sort((x, y) => x.r.key.localeCompare(y.r.key))
    .map(e => xp(e.r.key, e.labels.size ? [...e.labels].sort().join(', ') : '', '', rt(e.r.text) + usedBy('In this army', ruleUsers(e.r.key)), false)).join('');
  h += '<div class="sec-h"><h2>Unit rules</h2></div><div class="list">' + gloss('ability') + '</div>';
  h += '<div class="sec-h"><h2>Weapon keywords</h2></div><div class="list">' + gloss('weapon') + '</div>';
  return h + '<p class="note">Force disposition: ' + esc(a.disposition) + '.</p>';
}

/* ---------- render ---------- */
function render(){
  renderTop();
  const v = $('#view'), s = cur.s;
  let sub = '', bot = '';
  if(s === 'home') v.innerHTML = screenHome();
  else if(s === 'army') v.innerHTML = screenArmy();
  else if(s === 'units'){ v.innerHTML = screenUnits(); sub = unitsSubbar(); }
  else if(s === 'unit') v.innerHTML = screenUnit();
  else if(s === 'strats'){ v.innerHTML = screenStrats(); bot = stratFilters(); }
  else if(s === 'ranged' || s === 'melee'){ v.innerHTML = screenWeapons(s); sub = '<div class="wt ' + s + '">' + colHeader(s) + '</div>'; }
  else if(s === 'abilities') v.innerHTML = screenAbilities();
  else if(s === 'rules') v.innerHTML = screenRules();
  else if(s === 'bases') v.innerHTML = screenBases();
  setBar('subbar', sub);
  setBar('bbar', bot);
  measure();
  if(s === 'army'){
    const i = $('#armyQ');
    i.value = query[army().id] || '';
    const sync = () => { query[army().id] = i.value; moreShown.clear(); renderFinder(); saveSession(); };
    i.addEventListener('input', sync);
    i.addEventListener('search', sync);   // the clear button and Escape empty the box without an input event
    i.addEventListener('keydown', e => { if(e.key === 'Enter') i.blur(); });
    renderFinder();
    if(focusSearch){ focusSearch = false; i.focus(); i.select(); }
  }
  store.set('wh-last', plain(cur));
}
// re-render the same screen in place, keeping the scroll position
function rerender(){ const y = scrollY; render(); scrollTo(0, y); }
function jumpTo(id, instant){
  const sec = $('#sec-' + id);
  if(!sec) return;
  if(sec.tagName === 'DETAILS') sec.open = true;
  measure();
  sec.scrollIntoView({ behavior:instant || matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start' });
}

/* ---------- popup sheet ---------- */
let sheetReturn = null, sheetRule = null;
function openSheet(label, title, html){
  const nested = !$('#sheetHost').hidden;
  navAt = performance.now();
  if(!nested) sheetReturn = document.activeElement;
  $('#sheetIn').innerHTML = '<div class="grab" aria-hidden="true"></div>' + (label ? '<p class="lbl">' + label + '</p>' : '') + '<h2 id="sheetTitle">' + esc(title) + '</h2>' + html;
  $('#sheetHost').hidden = false;
  document.documentElement.classList.add('lock');
  $('#top').inert = true; $('#view').inert = true; $('#bbar').inert = true;
  $('#sheetIn').scrollTop = 0;
  $('#sheet').focus();
  try { const st = Object.assign(plain(cur), { sheet:1 }); nested && history.state && history.state.sheet ? history.replaceState(st, '') : history.pushState(st, ''); } catch(e){}
}
function hideSheet(){
  if($('#sheetHost').hidden) return;
  $('#sheetHost').hidden = true;
  $('#sheet').style.removeProperty('--drag');
  document.documentElement.classList.remove('lock');
  $('#top').inert = false; $('#view').inert = false; $('#bbar').inert = false;
  if(sheetReturn && sheetReturn.isConnected) sheetReturn.focus({ preventScroll:true });
}
function closeSheet(){
  if($('#sheetHost').hidden) return;
  hideSheet();
  try { if(history.state && history.state.sheet) history.back(); } catch(e){}
}
function showRule(label){
  const r = ruleFor(label);
  if(!r){ toast('No rule text stored for ' + label); return; }
  const users = r.src === 'Core rule' ? ruleUsers(r.key) : r.needs ? army().units.filter(u => matches(r.needs, u)) : [];
  sheetRule = r.key;   // the rule's own name inside its text is not a link to itself
  const body = rt(r.text) + (r.table ? ttable(r.table) : '');
  sheetRule = null;
  const gap = (r.missing || []).length ? '<p class="note">Not in the app yet: the ' + esc(r.missing.join(' and ')) + '.</p>' : '';
  openSheet(esc(r.src), CONCEPT.has(r.key) ? r.key : r.name, body + (r.note ? '<p class="note it">' + esc(r.note) + '</p>' : '') + gap + usedBy('In this army', users));
}
function showStrat(id){
  const s = allStratagems().find(x => x.id === id);
  if(s) openSheet(esc(s.cp + 'CP · ' + stratWhenLine(s)), s.name, '<div class="sb">' + stratBody(s) + '</div>');
}
function showAbility(key){
  searchIndex();
  const e = abilityIndex.get(key);
  if(e) openSheet(esc(['Ability', e.ab.tag, e.ab.ph ? whenTag(e.ab) : ''].filter(Boolean).join(' · ')), e.ab.name, rt(e.ab.text) + usedBy('Unit', e.units));
}
function showEnhancement(key){
  const [did, name] = key.split('|');
  const d = detachments().find(x => x.id === did), e = d && d.enhancements.find(x => x.name === name);
  if(!e) return;
  const u = army().units.find(x => x.enhancement === name);
  openSheet(esc('Enhancement · ' + d.name + (e.pts ? ' · ' + e.pts + ' pts' : '')), e.name, rt(e.text) + (u ? usedBy('On', [u]) : '<p class="usedby">Not in this list.</p>'));
}
// drag the sheet down to close it
(() => {
  const sh = $('#sheet');
  let y0 = null, dy = 0;
  sh.addEventListener('touchstart', e => { y0 = $('#sheetIn').scrollTop <= 0 ? e.touches[0].clientY : null; dy = 0; }, { passive:true });
  sh.addEventListener('touchmove', e => {
    if(y0 == null) return;
    dy = e.touches[0].clientY - y0;
    if(dy < 0){ y0 = null; dy = 0; sh.classList.remove('drag'); sh.style.removeProperty('--drag'); return; }
    sh.classList.add('drag'); sh.style.setProperty('--drag', dy + 'px');
  }, { passive:true });
  sh.addEventListener('touchend', () => {
    sh.classList.remove('drag');
    if(y0 != null && dy > 90) closeSheet(); else sh.style.removeProperty('--drag');
    y0 = null;
  });
  $('#sheetBack').addEventListener('touchmove', e => e.preventDefault(), { passive:false });
})();

let tt = null;
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2200); }

/* ---------- events ---------- */
// a quick double tap must not also hit whatever the new screen put under your finger
document.addEventListener('click', e => {
  if(performance.now() - navAt < 350 && !e.target.closest('[data-close]')){ e.preventDefault(); e.stopPropagation(); }
}, true);
document.addEventListener('click', e => {
  const el = e.target.closest('button, [role="button"]');
  if(!el) return;
  const inSheet = !!el.closest('#sheetHost');
  const ds = el.dataset;
  if(el.hasAttribute('data-close')){ closeSheet(); return; }
  if(el.hasAttribute('data-back')){ back(); return; }
  if(el.hasAttribute('data-find')){ focusSearch = true; go({ s:'army', army:army().id }); return; }
  if(ds.army){ go({ s:'army', army:ds.army }); return; }
  if(ds.go){ go({ s:ds.go, army:army().id }); return; }
  if(ds.unit){
    const next = { s:'unit', army:army().id, unit:ds.unit };
    if(sameScreen(next, cur)){ if(inSheet) closeSheet(); if(ds.sec) jumpTo(ds.sec, true); else scrollTo(0, 0); return; }
    if(inSheet){ hideSheet(); go(next, 'sheet'); } else go(next);
    if(ds.sec) jumpTo(ds.sec, true);
    return;
  }
  if(ds.rule){ e.preventDefault(); showRule(ds.rule); return; }
  if(ds.strat){ e.preventDefault(); showStrat(ds.strat); return; }
  if(ds.ability){ showAbility(ds.ability); return; }
  if(ds.enh){ showEnhancement(ds.enh); return; }
  if(ds.kw){ showKeywords(ds.kw); return; }
  if(ds.phase){ filt.phase = ds.phase; saveSession(); rerender(); return; }
  if(ds.turn){ filt.turn = ds.turn; saveSession(); rerender(); return; }
  if(ds.more){ moreShown.add(ds.more); renderFinder(); return; }
  if(el.hasAttribute('data-expand')){
    const cards = $$('#view details.strat');
    const openAll = cards.some(d => !d.open);
    cards.forEach(d => d.open = openAll);
    el.textContent = openAll ? 'Collapse all' : 'Expand all';
  }
});
// remember expanded stratagem cards
document.addEventListener('toggle', e => {
  const d = e.target;
  if(!d.dataset) return;
  if(d.dataset.stratId){
    if(d.open) openStrats.add(d.dataset.stratId); else openStrats.delete(d.dataset.stratId);
    saveSession();
    const x = $('#view [data-expand]');
    if(x) x.textContent = $$('#view details.strat').every(c => c.open) ? 'Collapse all' : 'Expand all';
  }
}, true);
$('#sheetBack').addEventListener('click', closeSheet);
addEventListener('keydown', e => {
  const t = e.target;
  if((e.key === 'Enter' || e.key === ' ') && t.matches && t.matches('[role="button"]')){ e.preventDefault(); t.click(); return; }
  if(e.key !== 'Escape') return;
  if(t.matches && t.matches('input, textarea')){ t.blur(); return; }
  if(!$('#sheetHost').hidden) closeSheet(); else if(cur.s !== 'home') back();
});
addEventListener('resize', measure);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
document.addEventListener('touchstart', () => {}, { passive:true });   // lets :active styles show on iOS

/* ---------- install + live updates ---------- */
const INSTALLED = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const ON_SITE = /github\.io$|^localhost$|^127\.0\.0\.1$/.test(location.hostname);
const SITE_URL = 'https://marastefanic-cmd.github.io/warhammerapp/';
function installText(){
  if(INSTALLED) return 'Installed on this phone. It updates itself each time you open it.';
  if(ON_SITE) return 'Put it on your home screen: Safari → Share → Add to Home Screen.';
  return 'Phone app: open <a class="link" href="' + SITE_URL + '" target="_blank" rel="noopener">' + SITE_URL.replace('https://', '') + '</a> in Safari, then Share → Add to Home Screen.';
}
// the home-screen app has no browser back gesture: swipe in from the left edge to go back
if(INSTALLED){
  let sx = null, sy = 0;
  addEventListener('touchstart', e => { const t = e.touches[0]; sx = t.clientX < 24 && $('#sheetHost').hidden && cur.s !== 'home' ? t.clientX : null; sy = t.clientY; }, { passive:true });
  addEventListener('touchend', e => { if(sx == null) return; const t = e.changedTouches[0]; if(t.clientX - sx > 70 && Math.abs(t.clientY - sy) < 50) back(); sx = null; }, { passive:true });
}
if(ON_SITE && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
// the installed copy compares its build stamp with the site's. On opening it reloads at once;
// later it waits until you are back on the army list or the menu, so it never moves you mid-read.
let updateReady = null;
// one reload per new version (a retry after two minutes, in case the first got a stale page);
// if nothing can be stored, never reload, rather than reload forever
const RELOAD_KEY = 'wh-reloaded-for';
function reloadedRecently(v){
  for(const k of ['sessionStorage','localStorage']){
    try { const r = JSON.parse(window[k].getItem(RELOAD_KEY) || 'null'); if(r && r.v === v && Date.now() - r.at < 120000) return true; } catch(e){}
  }
  return false;
}
function markReload(v){
  for(const k of ['sessionStorage','localStorage']){
    try { window[k].setItem(RELOAD_KEY, JSON.stringify({ v, at:Date.now() })); if(JSON.parse(window[k].getItem(RELOAD_KEY)).v === v) return true; } catch(e){}
  }
  return false;
}
function reloadNow(){
  if(!markReload(updateReady)){ updateReady = null; return; }
  try { history.replaceState(Object.assign(plain(cur), { y:scrollY }), ''); } catch(e){}
  saveSession();
  location.reload();
}
async function checkForUpdate(atStart){
  if(!ON_SITE || !BUILD) return;
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache:'no-store' });
    if(!r.ok) return;
    const v = (await r.json()).version;
    if(!v || v === BUILD || reloadedRecently(v)) return;
    updateReady = v;
    if(atStart || calm(cur)) reloadNow();
  } catch(e){}
}
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') checkForUpdate(false); });

/* ---------- boot ---------- */
try { history.scrollRestoration = 'manual'; } catch(e){}
// keep the current history entry if it is a screen (a reload), otherwise rebuild the last screen's chain
function start(snap){
  const st = history.state;
  if(snap && snap.filt){ Object.assign(filt, snap.filt); (snap.open || []).forEach(id => openStrats.add(id)); Object.assign(query, snap.query); }
  if(st && valid(st)){   // a reload: this entry is the screen (with a popup open, the screen under it)
    cur = plain(st);
    if(st.sheet){ try { history.replaceState(plain(cur), ''); } catch(e){} }
    render(); if(st.y) scrollTo(0, st.y);
  }
  else if(snap && valid(snap.cur)){ restore(snap.cur); if(snap.y) scrollTo(0, snap.y); }
  else { const last = store.get('wh-last'); restore(valid(last) ? last : { s:'home' }); }
  checkForUpdate(true);
}
const hot = window.claude && window.claude.hot;
if(hot && hot.snapshot){ try { hot.snapshot(() => ({ cur:plain(cur), y:scrollY, filt, open:[...openStrats], query })); } catch(e){} }
if(hot && hot.ready) hot.ready(start); else start(hot && hot.data ? hot.data : null);
</script>
