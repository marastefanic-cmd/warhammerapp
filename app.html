<meta charset="utf-8">
<title>Waaagh Codex</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Waaagh Codex: a drill-down reference sheet.
   Armies -> army (search + menu) -> Units | Stratagems | Ranged | Melee | Abilities | Rules
   -> unit datasheet, which fits one screen with the long text folded away. A sticky top bar
   (back, centred title, search) can carry column labels; the stratagem filters sit in a bar
   at the bottom, under your thumb. One dark graphite look; orange marks what you can tap
   and what matters. */
:root{
  color-scheme: dark;
  --bg:#161616;
  --surface:#1f1f1f;     /* multi-profile weapons, cards */
  --surface2:#2a2a2a;    /* bands, selected controls */
  --line:#363636;
  --fg:#ededed;
  --fg2:#c4c4c4;         /* weapon keywords */
  --muted:#9c9c9c;
  --accent:#ff8a2a;      /* orange */
  --accent-ink:#1c0d00;  /* text on orange */
  --shadow:0 10px 30px rgba(0,0,0,.5);
  --f-head:'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  --f-body:'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --hdr:53px;            /* measured height of the sticky top bar */
  --bb:0px;              /* measured height of the bottom bar (0 when there is none) */
  --top:calc(env(safe-area-inset-top, 0px) + var(--hdr));
  --safe-b:env(safe-area-inset-bottom, 0px);
}

*{box-sizing:border-box}
html,body{margin:0}
html{touch-action:manipulation}
html.lock, html.lock body{overflow:hidden}
[hidden]{display:none !important}
body{
  background:var(--bg); color:var(--fg);
  font:16px/1.45 var(--f-body);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-bottom:calc(32px + max(var(--bb), var(--safe-b)));
  -webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;
}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); z-index:30; background:var(--bg)}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; text-align:inherit}
input{font:inherit; color:var(--fg)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
b{font-weight:700}
s{text-decoration-thickness:2px; text-decoration-color:var(--accent)}
h1,h2,h3,p{margin:0}
.wrap{max-width:720px; margin:0 auto}
.num{font-variant-numeric:tabular-nums}
[role="button"]{cursor:pointer}

/* ---------- type roles ---------- */
.lbl{font:600 11px/1.2 var(--f-head); letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.note{font-size:13px; line-height:1.4; color:var(--muted); margin-top:10px}
.note.it{font-style:italic; margin-top:0}
.tg{font:600 12px/1.2 var(--f-body); color:var(--accent); white-space:nowrap}
.tg.m{color:var(--muted)}
.link{color:var(--fg); text-decoration:underline dotted; text-decoration-color:var(--accent); text-underline-offset:3px; padding:2px 0 8px}
.link:active{color:var(--accent)}
.chev{width:18px; height:18px; flex:none; color:var(--muted); transition:transform .15s ease}
details[open] > summary .chev{transform:rotate(180deg)}
.go{width:18px; height:18px; flex:none; color:var(--muted); transform:rotate(-90deg)}
summary{list-style:none; cursor:pointer}
summary::-webkit-details-marker{display:none}
.rt p{margin:0 0 5px} .rt p:last-child{margin-bottom:0}
.rt ul{margin:2px 0 5px; padding-left:18px} .rt li{margin:1px 0}
.rt .it{font-style:italic; color:var(--muted)}
.rt b.rl{padding:1px 0 9px; text-decoration:underline dotted; text-decoration-color:var(--accent); text-underline-offset:3px}
.ttable{display:grid; grid-template-columns:auto 1fr; gap:3px 12px; margin-top:6px}
.ttable span:nth-child(odd){font:700 15px var(--f-head); color:var(--accent)}
.tlist{margin-top:6px; display:grid; gap:6px}
.tlist > div{border-left:2px solid var(--line); padding-left:8px}
.tlist b{font:700 15px/1.2 var(--f-head); letter-spacing:.02em; color:var(--fg)}
.tlist > div > b:first-child{color:var(--accent)}
.empty{padding:20px 12px; text-align:center; color:var(--muted)}
.il{font:600 11px/1 var(--f-head); letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-right:6px}
.usedby{font-size:13.5px; color:var(--muted)}
.pg{border-top:1px solid var(--line)}
.pgr{display:grid; grid-template-columns:92px minmax(0,1fr); gap:0 10px; padding:7px 2px 6px; border-bottom:1px solid var(--line)}
.pgk{font:600 11.5px/1.35 var(--f-head); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); padding-top:3px; hyphens:manual}
.pgv{font-size:14.5px; line-height:1.55; min-width:0}
.pgv .from{color:var(--muted)}
.askl{padding:8px 2px 7px; border-bottom:1px solid var(--line); font-size:14px; line-height:1.5}
.askl > span:last-child{color:var(--fg2)}
.ask{margin-top:10px; border-left:2px solid var(--accent); padding:1px 0 1px 8px; font-size:13.5px; line-height:1.45; color:var(--fg2)}
.ask b{color:var(--fg)}

/* ---------- top bar ---------- */
.top{position:sticky; top:env(safe-area-inset-top, 0px); z-index:20; background:var(--bg); border-bottom:1px solid var(--line);
  margin:0 calc(-1 * max(16px, env(safe-area-inset-right, 0px))) 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding:0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px))}
.top-in{max-width:720px; margin:0 auto; display:grid; grid-template-columns:minmax(64px,1fr) auto minmax(64px,1fr); align-items:center; gap:8px; min-height:52px}
.back{justify-self:start; display:flex; align-items:center; gap:2px; min-height:44px; max-width:100%; min-width:0; padding-right:6px;
  color:var(--accent); font:700 15px/1 var(--f-head); letter-spacing:.06em; text-transform:uppercase}
.back:active{opacity:.6}
.back svg{width:20px; height:20px; flex:none; margin-left:-4px}
.back span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ttl{min-width:0; max-width:58vw; text-align:center; font:700 clamp(15px, 4.6vw, 18px)/1.05 var(--f-head); letter-spacing:.03em; overflow:hidden; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2}
.icon-btn{justify-self:end; width:44px; height:44px; display:grid; place-items:center; color:var(--fg); margin-right:-10px}
.icon-btn:active{color:var(--accent)}
.icon-btn svg{width:20px; height:20px}
.subbar{padding-bottom:5px}

/* ---------- bottom bar: stratagem filters ---------- */
.bbar{position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--bg); border-top:1px solid var(--line);
  padding:6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + var(--safe-b)) max(16px, env(safe-area-inset-left, 0px))}

/* ---------- lists ---------- */
.list{border-top:1px solid var(--line)}
.row{display:flex; align-items:center; gap:12px; width:100%; min-height:48px; padding:9px 2px; border-bottom:1px solid var(--line); text-align:left}
.row:active, .urow:active, .res:active, .band:active{background:var(--surface)}
.row .ic{width:20px; height:20px; flex:none; color:var(--muted)}
.row .rb{flex:1; min-width:0; display:grid; gap:1px}
.row .rb b{font:700 17px/1.15 var(--f-head); letter-spacing:.02em}
.row .rb span{font-size:13px; color:var(--muted)}
.row .c{font:600 14px var(--f-head); color:var(--muted); font-variant-numeric:tabular-nums}
.grp-h{margin:16px 0 4px}
.pxt{display:flex; flex-wrap:wrap; gap:4px 14px; font:600 15px/1.4 var(--f-head); font-variant-numeric:tabular-nums}
.pxt b{color:var(--accent)}
.px{padding:7px 2px 6px; border-bottom:1px solid var(--line)}
.pxh{display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 8px; margin-bottom:2px}
.pxh .link{font:700 16px/1.2 var(--f-head); letter-spacing:.02em}
.pxl{display:grid; grid-template-columns:96px minmax(0,1fr); gap:6px; font-size:14px; line-height:1.35; padding:1px 0}
.pxn{font:600 14px/1.35 var(--f-head); font-variant-numeric:tabular-nums; color:var(--fg2)}
.pxn b{color:var(--fg)}
.pxm.std{color:var(--muted)}
.pxm i{font-style:normal; color:var(--muted); font-size:12.5px}
.arow{padding:10px 2px 11px}
.arow .rb{gap:5px}
.arow .rb b{display:flex; align-items:baseline; gap:10px; font-size:19px}
.arow .apts{font:600 13px var(--f-head); color:var(--muted); letter-spacing:.02em}
.tags{display:flex; flex-wrap:wrap; gap:4px}
.row .rb .t{font:700 12px/1 var(--f-head); letter-spacing:.06em; text-transform:uppercase; color:var(--fg2); background:var(--surface2); border-radius:5px; padding:4px 6px 3px}
.row .rb .t.f{color:var(--accent-ink); background:var(--accent)}
.row .rb .t.d{color:var(--muted); background:none; box-shadow:inset 0 0 0 1px var(--line)}
.army-sub{font-size:13.5px; line-height:1.4; color:var(--muted)}

/* ---------- search ---------- */
.search{display:flex; align-items:center; gap:8px; margin:12px 0 4px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:0 12px}
.search:focus-within{border-color:var(--accent)}
.search svg{width:18px; height:18px; color:var(--muted); flex:none}
.search input{flex:1; min-width:0; border:0; background:none; padding:11px 0; outline:none}
.search input::placeholder{color:var(--muted)}
.rg{margin-top:12px}
.rg .lbl{padding-bottom:4px; border-bottom:1px solid var(--line)}
.res{display:grid; gap:1px; width:100%; text-align:left; padding:8px 2px; border-bottom:1px solid var(--line)}
.res b{font:700 16.5px/1.15 var(--f-head); letter-spacing:.02em}
.res .s1{font:700 14px/1.3 var(--f-head); letter-spacing:.02em; font-variant-numeric:tabular-nums}
.res span{font-size:13px; line-height:1.35; color:var(--muted)}
.res mark{background:none; color:var(--accent)}
.more{width:100%; min-height:40px; text-align:left; padding:0 2px; font:700 13px var(--f-head); letter-spacing:.06em; text-transform:uppercase; color:var(--accent)}

/* ---------- unit list: a roster table, column labels once in the top bar ---------- */
.urow{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:0 10px; align-items:baseline; width:100%; text-align:left; padding:6px 2px 5px; border-bottom:1px solid var(--line)}
.urow .un{display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 8px; min-width:0}
.urow .un b{font:700 16.5px/1.15 var(--f-head); letter-spacing:.02em}
.urow .un .x{margin-left:0}
.nw{white-space:nowrap}
.urow .pts{font:600 15px var(--f-head); color:var(--muted); font-variant-numeric:tabular-nums}
.urow .meta{grid-column:1 / -1; font-size:12.5px; color:var(--muted); line-height:1.3}
.sline, .uh{display:grid; grid-template-columns:repeat(7, minmax(0, 44px))}
.sline{grid-column:1 / -1; font:700 15px/1.25 var(--f-head); font-variant-numeric:tabular-nums}
.slab{grid-column:1 / -1; display:flex; align-items:center; margin-top:7px; font:700 13px/1.2 var(--f-head); letter-spacing:.07em; text-transform:uppercase; color:var(--fg)}
.slab .x{margin-left:7px; padding:1px 5px 0; font-size:13px}
.urow .un .lead{font:700 16.5px/1.15 var(--f-head); letter-spacing:.02em; color:var(--fg2)}
.urow.att .sline{padding-left:0}
.uh{padding:0 2px; font:600 11px/1 var(--f-head); letter-spacing:.1em; color:var(--muted); text-transform:uppercase}

/* ---------- datasheet ---------- */
.ds-meta{display:flex; flex-wrap:wrap; gap:2px 10px; align-items:baseline; padding:8px 0 6px; font-size:13px; color:var(--muted)}
.statwrap{scroll-margin-top:calc(var(--top) + 4px)}
.st{display:grid; align-items:stretch; border-radius:6px; overflow:hidden; background:var(--surface)}
.st > span{text-align:center; padding:5px 0; font:700 18px/1 var(--f-head); border-top:1px solid var(--line); min-width:0; font-variant-numeric:tabular-nums}
.st > span.h{font:600 11px/1 var(--f-head); letter-spacing:.1em; color:var(--muted); border-top:0; padding:6px 0 4px; background:var(--surface2)}
.st > span.n{text-align:left; padding-left:8px; font:600 14px/1.15 var(--f-head); display:flex; align-items:center; letter-spacing:.01em}
.def{margin-top:6px; border-left:2px solid var(--accent); padding:1px 0 1px 8px; font-size:13px; line-height:1.4}
.def.dmg{border-left-color:var(--muted)}
.dsl{margin-top:5px; font-size:12.5px; color:var(--muted); line-height:1.35}
.dsec{margin-top:12px}
.dsec > .lbl{padding-bottom:3px}
.dline{padding:5px 2px; border-bottom:1px solid var(--line); font-size:14px; line-height:1.5}
.dline .sep{color:var(--muted)}
.lbn{margin-left:8px; text-transform:none; letter-spacing:.02em; font:500 11.5px/1.2 var(--f-head)}
.lbn .link{color:var(--muted)}
.dline .link{white-space:nowrap}
.dsec > .dline:first-child{border-top:1px solid var(--line)}
.dsec + .dsec{margin-top:0}
.dsec + .dsec > .dline:first-child{border-top:0}
/* one-line rows that open: abilities, keywords */
.abl{border-top:1px solid var(--line)}
.ab.pf{border-bottom:1px solid var(--line)}
.ab.pf > summary{min-height:34px}
.ab.pf .pfl{font-size:12.5px; color:var(--fg2)}
.ab.pf .wh.both{position:static; box-shadow:none}
.ab{border-bottom:1px solid var(--line)}
.ab > summary{display:flex; align-items:center; gap:8px; min-height:34px; padding:3px 2px}
.ab > summary:active{background:var(--surface)}
.ab > summary .an{flex:1; min-width:0; display:flex; flex-wrap:wrap; align-items:baseline; gap:0 8px}
.ab > summary b{font:700 15px/1.2 var(--f-head); letter-spacing:.02em}
.ab > summary b.kh{font:600 11px/1.2 var(--f-head); letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.ab > summary small{font:600 11px var(--f-head); letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.ab > summary .aw{font-size:12.5px; color:var(--muted); white-space:nowrap; text-align:right}
.ab[open] > summary b{color:var(--accent)}
.ab.na > summary b{color:var(--muted)}
.ab .tg.once{color:var(--fg2); font-weight:500}
.ab > .body{padding:0 2px 10px; font-size:14.5px; line-height:1.42}
.ab .abt{font-size:12.5px; color:var(--muted); margin-bottom:3px}

/* weapon tables: one weapon = one hairline-separated row (stats + a quiet keyword line).
   Shading means one thing only: these profiles are one weapon, pick one.
   Rules that change the attacks are footnotes under the table. */
.wt{display:grid}
.wr, .wh{display:grid; align-items:baseline; column-gap:2px}
.ranged .wr, .wh.ranged, .both .wr, .wh.both{grid-template-columns:minmax(0,1fr) 32px 44px 28px 26px 28px 36px}
.melee .wr, .wh.melee{grid-template-columns:minmax(0,1fr) 44px 28px 26px 28px 36px}
.wh{padding:0 6px 3px; font:600 11px/1 var(--f-head); letter-spacing:.1em; color:var(--muted); text-align:center; text-transform:uppercase}
.wh .n{text-align:left}
.wh.both{position:sticky; top:var(--top); z-index:3; background:var(--bg); padding-top:8px; box-shadow:0 1px 0 var(--line)}
.wh.both .n{color:var(--fg)}
/* datasheet heading levels: unit name (top bar) > section (Ranged, Melee, Abilities, Rules, Stratagems) > model chip (.who) > weapon name */
.wh.both .n, .ab.pf > summary b.kh, .dsec > .lbl, .dsec .dline > .il, .sec-h h2, .lbl.grp-h{font:700 15.5px/1.1 var(--f-head); letter-spacing:.1em; text-transform:uppercase; color:var(--fg)}
.wh.both{align-items:baseline}
.anc{scroll-margin-top:var(--top)}
.wt.both{margin-top:12px}
.use{padding:4px 6px 3px; font-size:12.5px; line-height:1.35; color:var(--fg2)}
.use b{color:var(--accent); font-weight:600}
.use b.m{color:var(--fg)}
.uv{text-decoration:underline dotted; text-decoration-color:var(--accent); text-underline-offset:3px}
.mod .sc{font:600 10.5px var(--f-head); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-right:5px}
.wb{padding:4px 6px 3px; border-top:1px solid var(--line)}
.wb:has(> .wr .x){padding:5px 6px 4px}   /* a row with a count pill gets room to breathe */
.wr > span.n2{grid-column:span 2}
.wh > span.n2{grid-column:span 2}
.cr{display:inline-block; font:600 10.5px/1.2 var(--f-head); letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin-left:6px}
.use.gw{padding-left:0; margin-top:10px}
.use.gw .who{display:inline-block; margin:0 7px 0 0; vertical-align:1px}
.wh + .wb, .who + .wb, .use + .wb, .wb:first-child, .wb.g, .wb.g + .wb{border-top:0}
.wb.g{background:var(--surface); border-radius:6px; margin:3px 0}
.wr > span{font:700 15.5px/1.25 var(--f-head); text-align:center; min-width:0; font-variant-numeric:tabular-nums}
.wr > span.n{text-align:left; padding-right:6px; font:600 15px/1.2 var(--f-head); letter-spacing:.01em}
.wr.p > span.n{padding-left:8px}
.wr.p + .wr.p, .kwl + .wr.p{margin-top:4px}
.ar{color:var(--muted); margin-right:3px; font-size:12px}
/* a count ("×5"): its own small pill, clear of the name */
.x{display:inline-block; margin-left:8px; padding:2px 6px 1px; border-radius:5px; box-shadow:inset 0 0 0 1.5px #5c5c5c; color:var(--fg); font:700 14px/1.1 var(--f-head); letter-spacing:.04em; white-space:nowrap; font-variant-numeric:tabular-nums}
.tq{font:600 10.5px/1 var(--f-head); letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin-left:6px; white-space:nowrap; display:inline-block}
.wn{font:600 15px/1.2 var(--f-head); letter-spacing:.01em; margin-bottom:2px}
.wn small{font:600 11px/1 var(--f-head); letter-spacing:.09em; text-transform:uppercase; color:var(--muted); margin-left:8px}
.kwl{font:600 11px/1.3 var(--f-head); letter-spacing:.04em; text-transform:uppercase; color:var(--muted)}
.wr.p + .kwl{padding-left:8px}
.kwl [data-rule]{color:var(--fg2); white-space:nowrap; padding:1px 0 13px; text-decoration:underline dotted; text-decoration-color:var(--accent); text-underline-offset:2px}
.kwl [data-rule]:active{color:var(--accent)}
.wr i.hi{font-style:normal; display:inline-block; min-width:26px; padding:1px 4px; border-radius:5px; background:var(--accent); color:var(--accent-ink)}
.wr i.alt{font-style:normal; color:var(--accent)}
.varc{padding-top:1px; font-size:12.5px; line-height:1.35; color:var(--muted)}
.varc b{color:var(--accent); font:700 13.5px var(--f-head)}
.mods{margin-top:6px; display:grid; gap:4px}
.mods.all{margin:10px 0 2px}
.mods.all > .il{margin:0 0 1px}
.mod{border-left:2px solid var(--accent); padding:1px 0 1px 8px; font-size:13px; line-height:1.35}
.mod .from{color:var(--muted)}
/* whose weapons these are (leader vs bodyguard): a chip, not a whisper */
.who{display:inline-block; justify-self:start; margin:12px 0 4px; padding:4px 8px 3px; border-radius:4px; border:1px solid var(--line); background:var(--surface2); font:700 14px/1 var(--f-head); letter-spacing:.08em; text-transform:uppercase; color:var(--fg)}
/* phones under 360px: narrower columns (after the rules it overrides) */
@media (max-width:359px){
  .ranged .wr, .wh.ranged, .both .wr, .wh.both{grid-template-columns:minmax(0,1fr) 28px 38px 24px 22px 26px 30px}
  .melee .wr, .wh.melee{grid-template-columns:minmax(0,1fr) 38px 24px 22px 26px 30px}
  .wr.p > span.n{padding-left:2px}
  .ar{margin-right:1px; font-size:10px}
  .wr > span.n, .st > span.n{overflow-wrap:anywhere}
  .st > span.n{font-size:13px; padding-left:6px}
  .x{margin-left:6px; padding:1px 4px 0; font-size:13px}
}
/* slice screens: one band per unit, pinned until the next unit's band pushes it off */
.us{padding-bottom:4px}
.band{position:sticky; top:var(--top); z-index:4; display:flex; align-items:baseline; gap:8px; width:100%; min-height:40px; margin-top:12px; padding:9px 10px 8px;
  background:var(--surface2); text-align:left; border-radius:6px}
.band b{font:700 16.5px/1.15 var(--f-head); letter-spacing:.02em}
.band{flex-wrap:nowrap; row-gap:2px}
.band b{min-width:0}
.band .tgs{flex:1 1 auto; min-width:0; display:flex; flex-wrap:wrap; gap:0 8px}
.band .go{align-self:center; color:var(--accent); flex:none; margin-left:auto}
.slice > .us:first-child .band{margin-top:4px}
.band + .wt, .band + .al{margin-top:4px}
.subbar .wh{padding-bottom:0}
/* abilities */
.al > div{padding:7px 0; border-top:1px solid var(--line)}
.al > div:first-child{border-top:0; padding-top:2px}
.al .ah{display:flex; flex-wrap:wrap; align-items:baseline; gap:1px 8px; margin-bottom:2px}

.al .rt{font-size:14.5px; line-height:1.4}
.kwline{font-size:14px; line-height:1.5; color:var(--muted)}

/* ---------- stratagems ---------- */
.filt{display:grid; gap:4px}
.seg, .pgrid{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(0,1fr); gap:3px}
.seg button, .pgrid button{min-height:36px; border-radius:7px; font:700 13px/1 var(--f-head); letter-spacing:.04em; text-transform:uppercase; color:var(--muted); text-align:center; background:var(--surface)}
.seg button:active, .pgrid button:active{background:var(--surface2)}
.seg button[aria-pressed="true"], .pgrid button[aria-pressed="true"]{background:var(--surface2); color:var(--fg); box-shadow:inset 0 0 0 1px var(--line)}
.seg button.on, .pgrid button.on{background:var(--accent); color:var(--accent-ink); box-shadow:none}
.tools{display:flex; justify-content:flex-end; margin:2px 0 -8px}
.qh{margin:10px 0 3px; font:700 12px/1.2 var(--f-head); letter-spacing:.09em; text-transform:uppercase; color:var(--fg)}
.qh:first-child{margin-top:2px}
.qol{margin:0; padding-left:20px}
.qtab{display:grid; grid-template-columns:auto 1fr; gap:2px 14px; font-variant-numeric:tabular-nums}
.qtab span:nth-child(odd){font:700 15px/1.35 var(--f-head); color:var(--accent)}
.row .c.on{color:var(--accent)}
.verif{display:flex; align-items:center; gap:10px; width:100%; margin-top:14px; padding:10px 10px; border-radius:6px; background:var(--surface); text-align:left; font-size:13.5px; line-height:1.35; color:var(--fg2)}
.verif .ic{color:#5fc27a; flex:none}
.verif b{color:var(--fg); font-weight:600}
.verif > span{flex:1}
.vchk{margin:3px 0; font-size:14px; line-height:1.45}

.nextph{display:block; width:100%; min-height:48px; margin:14px 0 4px; border-radius:6px; background:var(--surface2); font:700 15px/1 var(--f-head); letter-spacing:.06em; text-transform:uppercase; color:var(--accent)}
.textbtn{min-height:40px; font:700 12.5px/1 var(--f-head); letter-spacing:.07em; text-transform:uppercase; color:var(--accent)}
.sec-h{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:16px 0 4px}
.sec-h h2{margin:0}
.sec-h .c{font:600 13px var(--f-head); color:var(--muted)}
.strat{border-bottom:1px solid var(--line)}
.strat > summary, .shead{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:10px; align-items:center; padding:7px 2px; min-height:48px}
.strat > summary:active, .xp > summary:active{background:var(--surface)}
.cp{width:32px; height:32px; border-radius:7px; background:var(--surface2); display:grid; place-content:center; text-align:center; font:700 17px/1 var(--f-head); font-variant-numeric:tabular-nums}
.cp small{display:block; font-size:9px; letter-spacing:.1em; color:var(--muted); margin-top:1px}
.cp.hot{background:var(--accent); color:var(--accent-ink)}
.cp.hot small{color:var(--accent-ink)}
.sh{display:grid; gap:1px; min-width:0}
.sh b{font:700 16.5px/1.15 var(--f-head); letter-spacing:.02em}
.sh span{font-size:12.5px; color:var(--muted)}
.sb{padding:0 2px 10px 44px; font-size:14.5px; line-height:1.45; display:grid; gap:5px}
.sb > div > .rt, .sb > div > .rt > p:first-child{display:inline}

.dl > div:first-child{border-top:1px solid var(--line)}
.dl .link{font:700 15.5px/1.2 var(--f-head); letter-spacing:.02em; justify-self:start; padding:2px 0 8px}
.dl i{font-style:normal; font:600 11px var(--f-head); letter-spacing:.08em; color:var(--muted); margin-right:2px}
.dl .sv{font:700 14.5px var(--f-head); font-variant-numeric:tabular-nums}

/* ---------- rules ---------- */
.xp{border-bottom:1px solid var(--line)}
.xp > summary{display:flex; align-items:center; gap:10px; min-height:44px; padding:7px 2px}
.xp > summary .xh{flex:1; min-width:0; display:grid; gap:1px}
.xp > summary b{font:700 16.5px/1.15 var(--f-head); letter-spacing:.02em}
.xp > summary .xh span{font-size:12.5px; color:var(--muted)}
.xp > .body{padding:0 2px 10px; font-size:14.5px; line-height:1.45}
.xp > .body .sub + .sub{margin-top:10px; padding-top:10px; border-top:1px solid var(--line)}
.xp > .body .sub b.nm{font:700 15.5px/1.2 var(--f-head); letter-spacing:.02em}
.xp > .body .usedby{margin-top:6px}

/* ---------- popup sheet ---------- */
.sheet-host{position:fixed; inset:0; z-index:60}
.sheet-back{position:absolute; inset:0; background:rgba(0,0,0,.55)}
.sheet{position:absolute; left:0; right:0; bottom:0; max-height:82%; display:flex; flex-direction:column; background:var(--surface);
  border-radius:16px 16px 0 0; box-shadow:var(--shadow); outline:none; transform:translateY(var(--drag, 0px)); transition:transform .18s ease}
.sheet.drag{transition:none}
.sh-in{flex:1 1 auto; min-height:0; overflow:auto; overscroll-behavior:contain; padding:8px max(18px, env(safe-area-inset-right, 0px)) 4px max(18px, env(safe-area-inset-left, 0px))}
.sh-foot{flex:none; padding:8px max(18px, env(safe-area-inset-right, 0px)) calc(12px + var(--safe-b)) max(18px, env(safe-area-inset-left, 0px)); border-top:1px solid var(--line)}
.sheet .grab{width:40px; height:4px; border-radius:2px; background:var(--line); margin:4px auto 10px}
.sheet h2{font:700 22px/1.1 var(--f-head); letter-spacing:.02em; margin:4px 0 8px}
.sback{min-height:36px; padding:0 2px; font:700 13px var(--f-head); letter-spacing:.06em; text-transform:uppercase; color:var(--accent)}
.sheet .rt{font-size:15px; line-height:1.45}
.sheet .usedby{margin-top:8px}
.sheet .close{display:flex; align-items:center; justify-content:center; width:100%; min-height:44px; border-radius:10px; background:var(--surface2);
  font:700 14px/1 var(--f-head); letter-spacing:.07em; text-transform:uppercase}
.sheet .close:active{background:var(--line)}
@media (min-width:700px){ .sheet{left:50%; right:auto; width:620px; transform:translateX(-50%) translateY(var(--drag, 0px)); bottom:24px; border-radius:16px} }

.toast{position:fixed; left:50%; bottom:calc(16px + max(var(--bb), var(--safe-b))); transform:translateX(-50%); z-index:70; background:var(--fg); color:var(--bg);
  font:700 15px/1.2 var(--f-head); letter-spacing:.04em; padding:10px 16px; border-radius:10px; opacity:0; pointer-events:none; transition:opacity .2s; max-width:86%; text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }

<script>
'use strict';
const D = window.WH_DATA;
const BUILD = window.WH_BUILD || '';      // set by build.js on the installable copy
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const keep = area => ({
  get(k, d){ try { const v = window[area].getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { window[area].setItem(k, JSON.stringify(v)); } catch(e){} }
});
const store = keep('localStorage'), session = keep('sessionStorage');

const PHASES = [['command','Command','Cmd'], ['movement','Movement','Move'], ['shooting','Shooting','Shoot'], ['charge','Charge','Charge'], ['fight','Fight','Fight']];
const PHASE_NAME = Object.fromEntries(PHASES.map(([k, l]) => [k, l]));
const TURN_FILTER = [['all','Any turn'], ['your','Your turn'], ['opp','Their turn']];
const TURN_NAME = { your:'Your turn', opp:'Their turn', either:'Either turn' };
const ROLE_ORDER = ['Epic Hero','Character','Battleline','Infantry','Mounted','Beast','Swarm','Monster','Vehicle','Dedicated Transport','Fortification','Other'];
const ROLE_LABEL = { 'Epic Hero':'Epic Heroes', 'Character':'Characters', 'Battleline':'Battleline', 'Infantry':'Infantry', 'Mounted':'Mounted', 'Beast':'Beasts', 'Swarm':'Swarms',
  'Monster':'Monsters', 'Vehicle':'Vehicles', 'Dedicated Transport':'Dedicated Transports', 'Fortification':'Fortifications', 'Other':'Other' };
const SCREEN_TITLE = { pregame:'Before the battle', units:'Units', strats:'Stratagems', ranged:'Ranged weapons', melee:'Melee weapons', abilities:'Abilities', rules:'Rules & keywords', bases:'Bases & proxies' };
const BACK_TITLE = { pregame:'Pre-game', ranged:'Ranged', melee:'Melee', rules:'Rules', bases:'Bases' };
const HUNTER_KW = 'HUNTER: MONSTER/VEHICLE';
const KEY_LABEL = { range:'RNG', A:'A', BS:'BS', WS:'WS', S:'S', AP:'AP', D:'D' };
const chev = '<svg class="chev" aria-hidden="true"><use href="#i-down"/></svg>';
const arrow = '<svg class="go" aria-hidden="true"><use href="#i-down"/></svg>';

/* ---------- state ---------- */
const isObj = v => !!v && typeof v === 'object' && !Array.isArray(v);
const hasOwn = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
// filters, open cards and search text last for this session, so an update reload keeps them
const sess = isObj(session.get('wh-session')) ? session.get('wh-session') : {};
const filt = Object.assign({ phase:'all', turn:'all' }, isObj(sess.filt) ? sess.filt : {});
const openStrats = new Set(Array.isArray(sess.open) ? sess.open : []);
const query = Object.assign({}, isObj(sess.query) ? sess.query : {});
const saveSession = () => session.set('wh-session', { filt, open:[...openStrats], query });
const moreShown = new Set();                 // search groups you expanded
let focusSearch = false;

/* ---------- navigation ----------
   A screen is { s, army, unit } plus d (its depth) and from (what Back returns to).
   Every step forward is a history entry, so the phone's back gesture walks back up. */
let cur = { s:'home', d:0 };
const plain = c => ({ s:c.s, army:c.army, unit:c.unit, d:c.d || 0, from:c.from });
const sameScreen = (a, b) => a && b && a.s === b.s && a.army === b.army && a.unit === b.unit;
const calm = c => c.s === 'home' || c.s === 'army';   // screens where an update reload loses nothing
// the open folds of the screen, by position (a screen renders the same each time), and putting them back
const openFolds = () => [...document.querySelectorAll('#view details')].map((d, i) => d.open ? i : -1).filter(i => i >= 0);
const reopen = list => { const all = document.querySelectorAll('#view details'); for(const i of list || []) if(all[i]) all[i].open = true; };
const spot = () => ({ y:scrollY, open:openFolds() });
const toSpot = st => { reopen(st && st.open); scrollTo(0, (st && st.y) || 0); };
function parentOf(c){
  if(c.s === 'unit') return { s:'units', army:c.army };
  if(c.s === 'home' || c.s === 'army') return { s:'home' };
  return { s:'army', army:c.army };
}
function titleOf(c){
  if(c.s === 'home') return 'Armies';
  if(c.s === 'army') return (armyById(c.army) || {}).name || '';
  if(c.s === 'unit') return ((armyById(c.army) || { units:[] }).units.find(u => u.id === c.unit) || {}).name || '';
  return SCREEN_TITLE[c.s] || '';
}
const backTitle = c => BACK_TITLE[c.s] || titleOf(c);
function valid(c){
  if(!c || !c.s) return false;
  if(c.s === 'home') return true;
  const a = armyById(c.army);
  if(!a) return false;
  if(c.s === 'unit') return a.units.some(u => u.id === c.unit);
  return c.s === 'army' || hasOwn(SCREEN_TITLE, c.s);
}
// mode: push (default) | 'sheet' (replaces an open popup's entry) | 'replace' (no history to go back to)
let navAt = -1e9;   // when the screen last changed under your finger
function go(next, mode){
  navAt = performance.now();
  if(mode !== 'sheet'){ try { history.replaceState(Object.assign(plain(cur), spot()), ''); } catch(e){} }
  const d = mode === 'replace' ? (cur.d || 0) : (cur.d || 0) + 1;
  const from = mode === 'replace' ? (next.s === 'home' ? undefined : backTitle(parentOf(next))) : backTitle(cur);
  if(next.army !== cur.army) moreShown.clear();
  cur = Object.assign(plain(next), { d, from });
  try { mode ? history.replaceState(plain(cur), '') : history.pushState(plain(cur), ''); } catch(e){}
  if(updateReady && calm(cur)){ reloadNow(); return; }
  render(); scrollTo(0, 0);
}
function back(){
  if((cur.d || 0) > 0 && history.state && history.state.d === cur.d && !history.state.sheet){ history.back(); return; }
  go(parentOf(cur), 'replace');
}
addEventListener('popstate', e => {
  const st = e.state;
  if(st && st.sheet){ if($('#sheetHost').hidden) history.back(); return; }   // stepped forward onto a closed popup: skip it
  hideSheet();
  navAt = performance.now();
  if(!valid(st)){ cur = { s:'home', d:0 }; render(); return; }
  if(sameScreen(st, cur)){ cur.d = st.d || 0; cur.from = st.from; renderTop(); return; }   // only a popup closed
  cur = plain(st);
  if(updateReady && calm(cur)){ reloadNow(); return; }
  render(); toSpot(st);
});
// rebuild the history chain for a screen, so Back works after reopening the app
const EMBEDDED = (() => { try { return window.top !== window.self; } catch(e){ return true; } })();
function restore(target){
  if(EMBEDDED){   // inside the Claude app: don't add entries to the host page's history
    cur = Object.assign(plain(target), { d:0, from:target.s === 'home' ? undefined : backTitle(parentOf(target)) });
    try { history.replaceState(plain(cur), ''); } catch(e){}
    render(); return;
  }
  const chain = [];
  for(let c = target; c; c = c.s === 'home' ? null : parentOf(c)) chain.unshift(plain(c));
  chain.forEach((c, i) => { c.d = i; c.from = i ? backTitle(chain[i - 1]) : undefined; });
  try { history.replaceState(chain[0], ''); for(const c of chain.slice(1)) history.pushState(c, ''); } catch(e){}
  cur = chain[chain.length - 1];
  render();
}

/* ---------- army helpers ---------- */
const armyById = id => D.armies.find(a => a.id === id);
const army = () => armyById(cur.army) || D.armies[0];
const factionOf = a => D.factions[a.faction];
const faction = () => factionOf(army());
const detachmentsOf = a => a.detachments.map(id => Object.assign({ id }, factionOf(a).detachments[id])).filter(d => d.name);
const detachments = () => detachmentsOf(army());
const unitById = id => army().units.find(u => u.id === id);
const hasKw = (u, k) => u.kw.some(x => x.toLowerCase() === k.toLowerCase());
function matches(n, u){
  if(!n) return true;
  if(n.all && !n.all.every(k => hasKw(u, k))) return false;
  if(n.any && !n.any.some(k => hasKw(u, k))) return false;
  if(n.none && n.none.some(k => hasKw(u, k))) return false;
  if(n.unless && matches(n.unless, u)) return false;
  return true;
}
const eligible = (s, a) => (a || army()).units.filter(u => matches(s.needs, u));
const keywordGated = s => !!(s.needs && (s.needs.all || s.needs.any));
function allStratagems(a){
  a = a || army();
  const out = [];
  for(const d of detachmentsOf(a)) for(const s of d.stratagems) out.push(Object.assign({ src:d.name }, s));
  for(const s of D.coreStratagems) out.push(Object.assign({ src:'Core' }, s));
  return out;
}
const usableStrats = a => allStratagems(a).filter(s => eligible(s, a).length);
const shortName = u => (u.short || u.name) + (u.enhancement ? ' · ' + u.enhancement : '');
const unitCount = a => a.units.reduce((t, u) => t + (u.copies || 1), 0);
// "Big Mek ×2, Killa Kans": unit names for a one-line summary
function unitNames(units){
  const n = new Map();
  for(const u of units){ const k = u.short || u.name; n.set(k, (n.get(k) || 0) + 1); }
  return [...n].map(([k, c]) => k + (c > 1 ? ' ×' + c : '')).join(', ');
}
// detachment rules that apply to a unit (by keyword)
const unitDetRules = u => detachments().filter(d => d.rule && d.rule.needs && matches(d.rule.needs, u)).map(d => d.rule);
const unitRules = u => u.rules.concat(unitDetRules(u).map(r => r.name).filter(n => !u.rules.includes(n))).filter(r => !inertRule(r));
// an army rule that needs units this army doesn't have, e.g. Bondsman with no ARMIGER models
function inertRule(name){
  const r = faction().armyRules.find(x => x.name === name);
  return !!(r && r.needs && !army().units.some(u => matches(r.needs, u)));
}
// an ability that can't be used in this list: the data says why, or it is a Bondsman ability with no ARMIGER
const naReason = ab => ab.na || (/bondsman/i.test(ab.tag || '') && inertRule('Bondsman') ? 'No ARMIGER models in this list' : '');
// rules other units give this one (Ghazghkull's aura, the Dreadherder's re-rolls)
function auraMods(u){
  const out = [];
  for(const src of army().units) for(const m of src.aura || []){
    const self = src === u;
    if((self && m.notSelf) || !matches(m.needs, u)) continue;
    out.push(Object.assign({}, m, { when:self && m.selfWhen ? m.selfWhen : m.when, src }));
  }
  return out;
}
// everything that changes this unit's attacks: its own abilities, detachment rules, auras
// a rule worded for squads ("below Starting Strength") reads in wounds for a one-model unit (r.mod.single):
// {half} = the most wounds it can have left and still be below half-strength
const halfBelow = u => Math.ceil((parseInt(u.stats[0].W, 10) || 0) / 2) - 1;
const singleMod = (m, u) => m.single && modelCount(u) === 1 ? Object.assign({}, m, { when:m.single.when, note:m.single.note.replace('{half}', halfBelow(u)) }) : m;
function unitMods(u, kind){
  const det = unitDetRules(u).filter(r => r.mod).map(r => Object.assign({ from:r.name, rule:r.name }, singleMod(r.mod, u)));
  const lance = [...new Set((u.melee || []).filter(w => w.kw.some(k => /^lance/i.test(k))).map(w => w.group || w.name))];
  if(lance.length) det.push({ kind:'melee', when:'Made a charge move this turn', note:andList(lance) + ' +1 to wound', from:'Lance', rule:'Lance' });
  if(hasKw(u, 'Towering') && !hasKw(u, 'Aircraft') && D.rules['Plunging Fire']) det.push({ kind:'ranged', when:'Visible target within 12" with models on ground level (not AIRCRAFT)', note:'BS improved by 1', from:'Plunging Fire', rule:'Plunging Fire' });
  const strat = allStratagems().filter(s => s.mod && eligible(s).includes(u)).map(s => Object.assign({ from:s.name, strat:s.id, cp:s.cp }, s.mod));
  return (u.mods || []).concat(det, auraMods(u), strat).filter(m => m.kind === kind || m.kind === 'all');
}
// phases and turn: turns can override the turn for one phase ("your Shooting phase or the Fight phase")
const phasesOf = x => x.phases || x.ph || [];
const phTurn = (x, p) => (x.turns && x.turns[p]) || x.turn || 'either';
// start-of-phase rules first, end-of-phase rules last
const timing = text => /^(once per [a-z ]+, )?(at )?(the )?start of/i.test(text || '') ? 0 : /^(once per [a-z ]+, )?(at )?(the )?end of/i.test(text || '') ? 2 : 1;
// "Movement · Their turn", "Any phase · Either turn", "Your Shooting / Fight (either turn)"
function whenTag(x){
  const ph = phasesOf(x);
  if(!ph.length) return '';
  const t = ph.map(p => phTurn(x, p));
  if(t.every(v => v === t[0])) return (ph.length === PHASES.length ? 'Any phase' : ph.map(p => PHASE_NAME[p]).join(' / ')) + ' · ' + TURN_NAME[t[0]];
  return ph.map((p, i) => t[i] === 'your' ? 'Your ' + PHASE_NAME[p] : t[i] === 'opp' ? 'Their ' + PHASE_NAME[p] : PHASE_NAME[p] + ' (either turn)').join(' / ');
}
// weapons, counting a multi-profile weapon once
function weaponItems(list){
  const items = [];
  for(const w of list || []){
    const last = items[items.length - 1];
    if(w.group && last && last.group === w.group && last.who === w.who) last.profiles.push(w);

}
const weaponCount = (a, kind) => a.units.reduce((t, u) => t + weaponItems(u[kind]).length, 0);

}
const abilityKey = ab => army().id + '|' + ab.name + '|' + ab.text;

/* ---------- rules and rich text ---------- */
function ruleFor(label){
  const f = faction();
  let clean = String(label).replace(/^\[|\]$/g, '').replace(/\*$/, '').trim();
  for(const [re, key] of f.aliases || []) if(re.test(clean)){ clean = key; break; }
  const lc = clean.toLowerCase();
  const ar = f.armyRules.find(r => r.name.toLowerCase() === lc);
  if(ar) return { name:ar.name, key:ar.name, text:ar.text, table:ar.table, missing:ar.missing, note:ar.note, ask:ar.ask, src:f.name + ' army rule' };
  for(const d of detachments()) if(d.rule && d.rule.name.toLowerCase() === lc) return { name:d.rule.name, key:d.rule.name, text:d.rule.text, table:d.rule.table, needs:d.rule.needs, note:d.rule.note, ask:d.rule.ask, src:d.name + ' detachment rule' };
  for(const [re, key] of D.ruleAliases) if(re.test(clean)) return { name:clean, key, text:D.rules[key], src:'Core rule' };
  if(D.rules[clean]) return { name:clean, key:clean, text:D.rules[clean], src:'Core rule' };
  return null;
}
const ruleKey = label => (ruleFor(label) || {}).key;
const mentions = (text, key) => new RegExp('\\b' + key.replace(/[-]/g, '.') + '\\b', 'i').test(text);
// the units in this army a core rule applies to: unit rules, weapon keywords, ability text
const CONCEPT = new Set(D.concepts || []);   // general terms (charge, destroyed…) that every unit "uses"
function ruleUsers(key){
  if(CONCEPT.has(key)) return [];
  return army().units.filter(u => unitRules(u).some(r => ruleKey(r) === key) ||
    [...(u.ranged || []), ...(u.melee || [])].some(w => w.kw.some(k => ruleKey(k) === key) || (w.hunter && key === 'Hunter')) ||
    u.abilities.some(ab => mentions(ab.text, key)));
}
// **bold** text; bold terms that name a rule (Deep Strike, riled up, …) open it when tapped; ~~struck~~ text
const inline = s => esc(s).replace(/~~(.+?)~~/g, '<s>$1</s>')
  .replace(/\*\*(.+?)\*\*/g, (m, t) => { const r = ruleFor(t); return r && r.key !== sheetRule ? '<b class="rl" role="button" tabindex="0" data-rule="' + t + '">' + t + '</b>' : '<b>' + t + '</b>'; });
function rt(text){
  const lines = String(text || '').split('\n');
  let html = '', list = [];
  const flush = () => { if(list.length){ html += '<ul>' + list.map(l => '<li>' + inline(l) + '</li>').join('') + '</ul>'; list = []; } };
  for(const raw of lines){
    const l = raw.trim();
    if(!l) continue;
    if(l.startsWith('- ')){ list.push(l.slice(2)); continue; }
    flush();
    html += /^\*[^*].*\*$/.test(l) ? '<p class="it">' + inline(l.slice(1, -1)) + '</p>' : '<p>' + inline(l) + '</p>';
  }
  flush();
  return '<div class="rt">' + html + '</div>';
}

/* ---------- search over everything in one army ---------- */
const KIND_ORDER = ['Units','Weapons','Stratagems','Abilities','Rules'];
// shorthand players type; a value with spaces must appear as that phrase
const SYNONYM = { their:'opponent', strat:'stratagem', strats:'stratagem', fnp:'feel no pain', inv:'invulnerable', invul:'invulnerable', invuln:'invulnerable',
  dev:'devastating', devs:'devastating', ld:'leadership', cqc:'close-quarters', lethals:'lethal hits', sus:'sustained hits', ds:'deep strike', 'lone-op':'lone operative', loneop:'lone operative', dp:'daemon prince', tfex:'tyrannofex' };
// lower-case, no apostrophes, and "waaagh"/"waagh" alike; hyphens are indexed both ways
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\*\*|~~/g, '').replace(/[’‘'`´]/g, '').replace(/a{2,}/g, 'a');
const hay = (...parts) => { const t = norm(parts.filter(Boolean).join(' ')); return t + ' ' + t.replace(/-/g, '') + ' ' + t.replace(/-/g, ' '); };
const statLineText = s => 'M ' + s.M + ' · T ' + s.T + ' · Sv ' + s.Sv + ' · W ' + s.W + ' · Ld ' + s.Ld + ' · OC ' + s.OC + (s.InSv !== '–' ? ' · Inv ' + s.InSv : '');
function weaponStatText(w, kind){
  return [kind === 'ranged' ? w.range : 'Melee', 'A ' + w.A, kind === 'ranged' ? 'BS ' + w.BS : 'WS ' + w.WS, 'S ' + w.S, 'AP ' + w.AP, 'D ' + w.D].join(' · ');
}
const indexCache = new Map();
const abilityIndex = new Map();
function searchIndex(){
  const a = army();
  if(indexCache.has(a.id)) return indexCache.get(a.id);
  const out = [];
  const add = e => { e.hay += ' ' + norm(e.title).replace(/[\s-]/g, ''); out.push(e); };
  for(const u of a.units){
    const st = u.stats.map(s => ['t' + s.T, 'w' + s.W, 'm' + s.M, 'sv' + s.Sv, 'base ' + s.base].join(' ')).join(' ');
    add({ kind:'Units', title:u.name, s1:u.stats.map(statLineText).join(' / '),
      sub:[u.role, u.pts + ' pts', u.warlord ? 'Warlord' : '', u.enhancement, u.leads ? 'leading ' + u.leads : ''].filter(Boolean).join(' · '),
      hay:hay(u.name, u.short, u.role, u.kw.join(' '), u.models.join(' '), u.enhancement, u.warlord ? 'warlord' : '', unitRules(u).join(' '),
        u.abilities.map(ab => ab.def).join(' '), st, 'stats save toughness wounds move leadership', u.stats.some(s => s.InSv !== '–') ? 'invulnerable' : ''),
      act:{ unit:u.id } });
  }
  // weapons: identical profiles on twin units are listed once
  const wmap = new Map();
  for(const u of a.units) for(const kind of ['ranged','melee']) for(const w of u[kind] || []){
    const title = w.group ? w.group + ' – ' + w.name : w.name;
    const s1 = weaponStatText(w, kind);
    const key = title + '|' + s1 + '|' + u.name;
    const kws = (w.hunter ? [HUNTER_KW] : []).concat(w.kw);
    const vm = (u.mods || []).find(m => m.weapon === w.name && m.set);
    if(wmap.has(key)){ wmap.get(key).units.push(u); continue; }
    const e = { kind:'Weapons', title, s1, units:[u], kws, vm, who:w.who, hay:hay(title, kind, 'weapon', kws.join(' '), u.name, u.short, w.who), act:{ unit:u.id, sec:kind } };
    wmap.set(key, e); add(e);
  }
  for(const e of wmap.values()){
    e.sub = e.units.map(shortName).join(', ') + (e.who && e.who !== e.units[0].name ? ' (' + e.who + ')' : '') + (e.kws.length ? ' · ' + e.kws.join(', ') : '') +
      (e.vm ? ' · ' + Object.entries(e.vm.set).map(([k, v]) => k + ' ' + v).join(' ') + ' ' + e.vm.when : '');
  }
  for(const u of a.units) for(const ab of u.abilities){
    const key = abilityKey(ab);
    if(abilityIndex.has(key)){ abilityIndex.get(key).units.push(u); continue; }
    const e = { kind:'Abilities', title:ab.name, ab, units:[u], hay:hay(ab.name, 'ability', ab.text, ab.tag, ab.who, ab.def, u.name), act:{ ability:key } };
    abilityIndex.set(key, e); add(e);
  }
  for(const e of abilityIndex.values()) e.sub = unitNames(e.units) + (e.ab.tag ? ' · ' + e.ab.tag : '') + (e.ab.ph ? ' · ' + whenTag(e.ab) : '');
  for(const s of usableStrats(a)){
    add({ kind:'Stratagems', title:s.name, sub:s.cp + 'CP · ' + (s.src === 'Core' ? 'Core' : s.src) + ' · ' + stratWhenLine(s),
      hay:hay(s.name, 'stratagem', s.when, s.target, s.effect, s.limit, s.restrictions, s.src, s.src === 'Core' ? 'core' : 'detachment', s.phases.map(p => PHASE_NAME[p]).join(' '), TURN_NAME[s.turn], s.turn === 'opp' ? 'opponent' : ''), act:{ strat:s.id } });
  }
  const f = factionOf(a);
  const tableText = t => (t || []).map(r => r.join(' ')).join(' ');
  for(const r of f.armyRules) add({ kind:'Rules', title:r.name, sub:f.name + ' army rule' + (r.tag ? ' · ' + r.tag : ''), hay:hay(r.name, r.text, tableText(r.table), r.tag, 'army rule', (f.aliases || []).map(x => x[0].source).join(' ')), act:{ rule:r.name } });
  for(const d of detachmentsOf(a)){
    if(d.rule) add({ kind:'Rules', title:d.rule.name, sub:d.name + ' detachment rule', hay:hay(d.rule.name, d.rule.text, tableText(d.rule.table), d.name, 'detachment rule'), act:{ rule:d.rule.name } });
    for(const e of d.enhancements){
      const u = a.units.find(x => x.enhancement === e.name);
      add({ kind:'Rules', title:e.name, sub:'Enhancement · ' + d.name + (u ? ' · on ' + u.name : e.pts ? ' · ' + e.pts + ' pts' : ''), hay:hay(e.name, e.text, d.name, 'enhancement'), act:{ enh:d.id + '|' + e.name } });
    }
  }
  for(const key of Object.keys(D.rules)) add({ kind:'Rules', title:key, sub:'Core rule', hay:hay(key, D.rules[key], 'core rule keyword'), act:{ rule:key } });
  indexCache.set(a.id, out);
  return out;
}
// a search word close enough to a word in the text: a plural, or 1 typo (2 for long words)
function near(w, t){
  if(w.startsWith(t) || (t.length > 3 && t.endsWith('s') && w.startsWith(t.slice(0, -1)))) return true;
  const k = t.length >= 7 ? 2 : t.length >= 4 ? 1 : 0;
  if(!k || Math.abs(w.length - t.length) > k) return false;
  let prev = Array.from({ length:t.length + 1 }, (x, j) => j);
  for(let i = 1; i <= w.length; i++){
    const row = [i];
    for(let j = 1; j <= t.length; j++) row[j] = Math.min(prev[j] + 1, row[j - 1] + 1, prev[j - 1] + (w[i - 1] === t[j - 1] ? 0 : 1));
    if(Math.min(...row) > k) return false;
    prev = row;
  }
  return prev[t.length] <= k;
}
// wrap each search word found in the title in <mark>, escaping everything else
function highlight(text, toks){
  const parts = toks.filter(t => t.length > 1).map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  if(!parts.length) return esc(text);
  return String(text).split(new RegExp('(' + parts.join('|') + ')', 'gi')).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}
function renderFinder(){
  const res = $('#qres');
  if(!res) return;
  const q = (query[army().id] || '').trim();
  $('#armyMenu').hidden = !!q;
  $('#armyHead').hidden = !!q;
  if(!q){ res.innerHTML = ''; return; }
  // each word as typed, or its shorthand meaning ("their" also finds "opponent", and still "Thin Their Ranks")
  const toks = norm(q).split(/\s+/).filter(t => /[a-z0-9]/.test(t)).map(t => t.replace(/-/g, ''));
  const alts = toks.map(t => hasOwn(SYNONYM, t) ? [t, SYNONYM[t].replace(/-/g, '')] : [t]);
  const nq = toks.join(' ');
  if(!toks.length){ res.innerHTML = '<div class="empty">Type a name, keyword or rule.</div>'; return; }
  const hits = searchIndex().filter(e => alts.every(a => a.some(t => e.hay.includes(t)))).map(e => {
    const tl = norm(e.title).replace(/-/g, '');
    return Object.assign({ score: tl.startsWith(nq) || tl.split(' ').some(w => w.startsWith(nq)) ? 0 : tl.includes(nq) ? 1 : toks.every(t => tl.includes(t)) ? 2 : 3 }, e);
  });
  // nothing found: forgive a plural and a typo or two ("rubrics", "ghazkull")
  if(!hits.length) for(const e of searchIndex()){
    const words = e.words || (e.words = [...new Set(e.hay.split(/[^a-z0-9]+/).filter(Boolean))]);
    if(alts.every(a => a.some(t => words.some(w => near(w, t))))) hits.push(Object.assign({ score:4 }, e));
  }
  for(const [re, key] of faction().aliases || []) if(re.test(q)){
    const r = hits.find(e => e.kind === 'Rules' && e.act.rule === key) || searchIndex().find(e => e.kind === 'Rules' && e.act.rule === key);
    if(r){ const i = hits.indexOf(r); if(i >= 0) hits.splice(i, 1); hits.unshift(Object.assign({}, r, { score:-1 })); }
  }
  if(!hits.length){ res.innerHTML = '<div class="empty">Nothing in ' + esc(army().name) + ' matches “' + esc(q) + '”.</div>'; return; }
  const groups = KIND_ORDER.map(k => ({ k, list:hits.filter(e => e.kind === k).sort((x, y) => x.score - y.score) })).filter(g => g.list.length);
  groups.sort((x, y) => x.list[0].score - y.list[0].score || KIND_ORDER.indexOf(x.k) - KIND_ORDER.indexOf(y.k));
  const words = q.split(/\s+/);
  res.innerHTML = groups.map(g => {
    const limit = moreShown.has(g.k) ? Infinity : 6;
    return '<div class="rg"><div class="lbl">' + g.k + ' · ' + g.list.length + '</div>' +
      g.list.slice(0, limit).map(e => {

// where a footnote's rule comes from, as a link to its text

const RANGED_KEYS = ['range','A','BS','S','AP','D'], MELEE_KEYS = ['A','WS','S','AP','D'];

const itemName = it => it.group || it.profiles[0].name;

  if(other.length === 1){ const w = ea.length === 1 ? 'both' : 'all of these'; return v('Fights with ' + w + ':', 'fights with ' + w + ':') + ' ' + nm(other)[0] + extra + '.'; }

// the line under a weapons heading that says which of them a model uses
function useLine(items, kind, u, part){

  if(lines.length > 1) for(const it of items){ const ls = lines.filter(l => l.set.includes(it)); if(!it.n && !it.carrier && ls.length === 1 && /^1× /.test(u.models[ls[0].i])) it.carrier = ls[0].who.replace(/ w\/.*$/, ''); }

function weaponRows(list, keys, mods, u, kind){

// one kind of weapon for one unit (the Ranged and Melee screens)
function weaponTable(list, kind, mods, u){

// the datasheet: ranged and melee in one table with the same columns, each footnote once
function unitWeapons(u){
  const r = u.ranged || [], m = u.melee || [];

  } else if(r.length) h += head('ranged', 'Ranged', ['RNG','A','BS','S','AP','D']) + weaponRows(r, RANGED_KEYS, mr, u, 'ranged');

    seen.add(k);

}

/* ---------- screen: datasheet ----------
   Everything a player checks mid-game fits on one screen: stats, what protects the unit,

// "Their Movement", "Your Shooting · Fight", "Any phase"
function shortWhen(x){
  const ph = phasesOf(x);

  if(ph.length === PHASES.length) return 'Any phase';
  return ph.map(p => ({ your:'Your ', opp:'Their ' }[phTurn(x, p)] || '') + PHASE_NAME[p]).join(' · ');
}
// one line per ability: its name and when it triggers; tap to read it

// (from the tag, a "(Once per …)" in the text, or a text that starts "Once per …,")
const onceTag = ab => {

  for(const src of [ab.tag || '', (/\((once per [^)]+)\)/i.exec(t) || [])[1] || '', (/^once per [^,.]+(, per (army|unit))?/i.exec(t) || [])[0] || '']){
    const m = /once per (battle round|battle|phase|turn)(, per (army|unit))?/i.exec(src);

};
// abilities of one model (the leader, the champion) or one choice ("Crimson King: pick one") sit

function abilityRows(abs){
  const whos = [...new Set(abs.map(ab => ab.who || ''))].sort((x, y) => (x ? 1 : 0) - (y ? 1 : 0));
  if(whos.length > 1 || whos[0]) return whos.map(w => (w ? '<div class="who">' + esc(w) + '</div>' : '') + abilityList(abs.filter(ab => (ab.who || '') === w))).join('');

}
function abilityList(abs){

    return '<details class="ab' + (na ? ' na' : '') + '"><summary><span class="an"><b>' + esc(ab.name) + '</b>' +
      (ab.tag === 'Enhancement' ? '<span class="tg">Enhancement</span>' : '') + (once ? '<span class="tg once">' + esc(once) + '</span>' : '') + (na ? '<span class="tg m">not usable here</span>' : '') + '</span>' +
      (ab.ph && !na ? '<span class="aw">' + esc(shortWhen(ab)) + '</span>' : '') + chev + '</summary><div class="body">' +
      (na ? '<p class="abt"><i>' + esc(na) + '</i></p>' : '') + (meta.length ? '<p class="abt">' + meta.map(esc).join(' · ') + '</p>' : '') + rt(ab.text) + '</div></details>';

// what matters when this unit is shot or fought: FNP, Lone Operative, -1 AP, the riled-up save.
// Each entry knows where it comes from, so the datasheet can link it.
// ph: only what works in that phase (a Fight-phase stratagem isn't offered against shooting)
function defenceItems(u, ph){

  for(const ab of u.abilities) if(ab.def && !naReason(ab) && !(ph && ab.defPh && !ab.defPh.includes(ph))) out.push({ t:ab.def, a:'ability', v:abilityKey(ab) });

const modelsText = u => u.models.map(esc).join(' · ') + (u.ptsNote ? ' · ' + esc(u.ptsNote) + ' pts' : '');

const band = u => '<button class="band" data-unit="' + esc(u.id) + '"><b>' + esc(u.name) + '</b><span class="tgs">' + nameTags(u) + '</span>' + arrow + '</button>';
function screenWeapons(kind){

/* ---------- stratagems ---------- */
const stratWhenLine = s => [whenTag(s), s.limit, s.cpNote].filter(Boolean).join(' · ');
const stratHead = s => '<span class="cp' + (s.cp >= 2 ? ' hot' : '') + '">' + esc(s.cp) + '<small>CP</small></span><span class="sh"><b>' + esc(s.name) + '</b><span>' + esc(stratWhenLine(s)) + '</span></span>';
// a rule whose wording allows two readings: settle it with the opponent before the game
const askNote = x => x && x.ask ? '<p class="ask"><b>Agree with your opponent:</b> ' + esc(x.ask) + '</p>' : '';
function stratBody(s){
  const el = eligible(s).filter(u => !(s.id === 'fire-overwatch' && !(u.ranged || []).length));   // a unit with no gun can be picked but cannot shoot (04.01.01)
  return '<div><span class="il">When</span>' + rt(s.when) + '</div><p><span class="il">Target</span>' + inline(s.target) + '</p>' +
    '<div><span class="il">Effect</span>' + rt(s.effect) + '</div>' +

const stratItem = s => '<details class="strat" data-strat-id="' + esc(s.id) + '"' + (openStrats.has(s.id) ? ' open' : '') + '><summary>' + stratHead(s) + chev + '</summary><div class="sb">' + stratBody(s) + '</div></details>';
const turnOk = t => filt.turn === 'all' || !t || t === 'either' || filt.turn === t;
// does a stratagem or ability fall under the phase and turn filters
function fits(x){
  const ph = phasesOf(x);
  if(filt.phase === 'all') return ph.some(p => turnOk(phTurn(x, p)));
  return ph.includes(filt.phase) && turnOk(phTurn(x, filt.phase));
}
// in a phase view: start-of-phase first, end-of-phase last, any-phase stratagems after the rest
const phaseOrder = (x, text) => (phasesOf(x).length === PHASES.length ? 10 : 0) + timing(text);
// core rules a unit has that do something in a phase
const CORE_PHASED = { 'Deep Strike':{ ph:['movement'], turn:'either' }, 'Harpooned':{ ph:['charge'], turn:'your' }, 'Super-Heavy Walker':{ ph:['movement'], turn:'your' }, 'Firing Deck':{ ph:['shooting'], turn:'your' } };
function phaseItems(){
  const out = [], f = faction(), units = army().units;
  for(const r of f.armyRules) if(r.ph && !inertRule(r.name)) out.push({ name:r.name, text:r.text, note:r.note, table:r.table, tag:r.tag, ph:r.ph, turn:r.turn, turns:r.turns, sub:f.name + ' army rule', units:[] });
  for(const d of detachments()) if(d.rule && d.rule.ph){
    const us = units.filter(u => matches(d.rule.needs, u));
    if(us.length) out.push({ name:d.rule.name, text:d.rule.text, note:d.rule.note, tag:d.rule.tag, table:d.rule.table, ph:d.rule.ph, turn:d.rule.turn, turns:d.rule.turns, sub:d.name + ' rule · ' + unitNames(us), units:us });
  }
  for(const u of units) for(const ab of u.abilities){
    if(!ab.ph || naReason(ab)) continue;
    const key = ab.name + '|' + ab.text;
    let e = out.find(x => x.key === key);
    if(!e){ e = { key, name:ab.name, text:ab.text, tag:ab.tag, ph:ab.ph, turn:ab.turn, turns:ab.turns, units:[] }; out.push(e); }
    e.units.push(u);
  }
  for(const [key, when] of Object.entries(CORE_PHASED)){
    const us = units.filter(u => unitRules(u).some(r => ruleKey(r) === key) || [...(u.ranged || []), ...(u.melee || [])].some(w => w.kw.some(k => ruleKey(k) === key)));
    if(us.length && D.rules[key]) out.push(Object.assign({ name:key, text:D.rules[key], sub:'Core rule · ' + unitNames(us), units:us }, when));
  }
  for(const e of out) if(!e.sub) e.sub = unitNames(e.units);
  return out;
}
// the opponent is attacking: each unit's toughness, saves and what protects it
function defenceList(){
  const units = army().units, all = units.map(u => defences(u, filt.phase === 'all' ? null : filt.phase));
  const every = all[0].filter(t => units.length > 1 && all.every(d => d.includes(t)));   // e.g. a stratagem any unit can take: said once
  return (every.length ? '<p class="rem"><b>Every unit:</b> ' + every.map(esc).join(' · ') + '</p>' : '') + '<div class="dl">' + units.map((u, i) => {
    const multi = u.stats.length > 1;
    const st = u.stats.map(s => (multi ? esc(s.name.replace(/ ×\d+$/, '')) + ' ' : '') + '<i>T</i>' + esc(s.T) + ' <i>SV</i>' + esc(s.Sv) + (s.InSv !== '–' ? ' <i>INV</i>' + esc(s.InSv) : '') + ' <i>W</i>' + esc(s.W)).join(' / ');
    const d = all[i].filter(t => !every.includes(t));
    return '<div>' + unitLink(u) + '<span class="sv">' + st + '</span>' + (d.length ? '<span>' + d.map(esc).join(' · ') + '</span>' : '') + '</div>';
  }).join('') + '</div>';
}
// the phase after this one: your Fight is followed by their Command, their Fight by your next turn
function nextPhase(){
  const i = PHASES.findIndex(([k]) => k === filt.phase);
  if(i < 0) return '';
  const last = i === PHASES.length - 1, turn = last && filt.turn !== 'all' ? (filt.turn === 'your' ? 'opp' : 'your') : filt.turn;
  const [k, label] = PHASES[last ? 0 : i + 1];
  return '<button class="nextph" data-next="' + k + '|' + turn + '">Next: ' + ({ your:'Your ', opp:'Their ' }[turn] || '') + label + ' <span aria-hidden="true">›</span></button>';
}
function stratFilters(){
  const btn = (attr, k, label, sel) => '<button data-' + attr + '="' + k + '" aria-pressed="' + (sel === k) + '"' + (sel === k && k !== 'all' ? ' class="on"' : '') + '>' + label + '</button>';
  return '<div class="filt"><div class="seg" role="group" aria-label="Whose turn">' + TURN_FILTER.map(([k, l]) => btn('turn', k, l, filt.turn)).join('') + '</div>' +
    '<div class="pgrid" role="group" aria-label="Phase">' + [['all','All','All']].concat(PHASES).map(([k, , s]) => btn('phase', k, s, filt.phase)).join('') + '</div></div>';
}
function screenStrats(){
  const p = filt.phase;
  const shown = allStratagems().filter(fits);
  const usable = shown.filter(s => eligible(s).length);
  // stratagems no unit here can use, and the keyword each one is missing
  const blocked = shown.filter(s => !eligible(s).length).map(s => {
    const n = s.needs || {}, lack = (n.all || []).filter(k => !army().units.some(u => hasKw(u, k)));
    return s.name + (lack.length ? ' (' + lack.join(', ').toUpperCase() + ')' : n.any ? ' (' + n.any.join(' or ').toUpperCase() + ')' : '');
  });
  const order = list => p === 'all' ? list : list.map((s, i) => [s, i]).sort((x, y) => phaseOrder(x[0], x[0].when) - phaseOrder(y[0], y[0].when) || x[1] - y[1]).map(x => x[0]);
  let h = usable.length ? '<div class="tools"><button class="textbtn" data-expand>' + (usable.every(s => openStrats.has(s.id)) ? 'Collapse all' : 'Expand all') + '</button></div>' : '';
  for(const [name, list] of detachments().map(d => [d.name, usable.filter(s => s.src === d.name)]).concat([['Core stratagems', usable.filter(s => s.src === 'Core')]])){
    if(list.length) h += '<div class="sec-h"><h2>' + esc(name) + '</h2><span class="c">' + list.length + '</span></div><div class="list">' + order(list).map(stratItem).join('') + '</div>';
  }
  if(!usable.length) h += '<div class="empty">No stratagems for this phase and turn.</div>';
  if(p !== 'all'){
    const rem = faction().armyRules.flatMap(r => (r.remind || []).filter(fits).map(x => '<div class="rem"><span class="link" role="button" tabindex="0" data-rule="' + esc(r.name) + '">' + esc(r.name) + '</span> ' + esc(x.text) + '</div>'));
    const anyPh = a => phasesOf(a).length === PHASES.length ? 1 : 0;   // "any phase" abilities after the ones for this phase
    const abil = phaseItems().filter(fits).map((a, i) => [a, i]).sort((x, y) => anyPh(x[0]) - anyPh(y[0]) || timing(x[0].text) - timing(y[0].text) || x[1] - y[1]).map(x => x[0]);
    if(rem.length || abil.length) h += '<div class="sec-h"><h2>Also this phase</h2>' + (abil.length ? '<span class="c">' + abil.length + (abil.length === 1 ? ' ability' : ' abilities') + '</span>' : '') + '</div>' + rem.join('') +
      (abil.length ? '<div class="list">' + abil.map(a => xp(a.name, a.sub, a.tag ? '<span class="tg m">' + esc(a.tag) + '</span>' : '',
        (a.note ? '<p class="note it">' + esc(a.note) + '</p>' : '') + rt(a.text) + (a.table ? ttable(a.table) : '') + usedBy('Units', a.units), false)).join('') + '</div>' : '');
    // when the opponent shoots or fights, the questions are "what's your save, can I see it"
    if((p === 'shooting' || p === 'fight') && filt.turn !== 'your') h += '<div class="sec-h"><h2>When targeted</h2></div>' + defenceList();
  }
  const notes = [];
  const gaps = detachments().filter(d => (d.missing || []).includes('stratagems')).map(d => d.name);
  if(gaps.length) notes.unshift(gaps.join(' and ') + ' stratagems aren’t in the app yet: they need the Wahapedia page.');
  const none = detachments().filter(d => !(d.stratagems || []).length && !(d.missing || []).includes('stratagems')).map(d => d.name);
  if(none.length) notes.unshift(none.join(' and ') + (none.length > 1 ? ' have' : ' has') + ' no stratagems (a rule and enhancements only).');
  if(blocked.length) notes.push('Not shown, no unit here can use ' + (blocked.length === 1 ? 'it' : 'them') + ': ' + blocked.join(', ') + '.');
  notes.push('All stratagem text is Wahapedia’s wording.');
  return h + nextPhase() + notes.map(n => '<p class="note">' + esc(n) + '</p>').join('');
}

/* ---------- screen: bases & proxies ----------
   For proxy models on the right bases: how many bases of each size the army needs, and per
   unit one line per kind of model with what to write on its base. The most common model of a
   squad is "standard"; the others say what they have that it doesn't (a weapon, an icon, the
   champion). Leaders and single models get their name, enhancement and Warlord. */
const modelCount = u => u.models.reduce((t, m) => t + (parseInt(m, 10) || 1), 0);
const lineParts = m => { const x = /^(\d+)× (.+?)(?: \(([^)]+)\))?$/.exec(m) || [, '1', m]; return { n:+x[1], name:x[2], extra:x[3] || '' }; };
const baseName = name => name.replace(/ w\/.*$/, '');
function baseOf(u, name){
  if(u.stats.length === 1) return u.stats[0].base;
  const nm = norm(baseName(name)), rows = u.stats.map(s => ({ s, n:norm(s.name.replace(/ ×\d+$/, '')) }));
  const pre = (a, b) => { let i = 0; while(i < a.length && a[i] === b[i]) i++; return i; };
  const hit = rows.find(r => r.n === nm) || rows.find(r => nm.startsWith(r.n) || r.n.startsWith(nm)) || rows.slice().sort((x, y) => pre(y.n, nm) - pre(x.n, nm))[0];
  return hit.s.base;
}
function proxyLines(u){
  const lines = u.models.map((m, i) => Object.assign(lineParts(m), { gear:(u.gear || [])[i] || [], base:baseOf(u, lineParts(m).name) }));
  const tag = [u.warlord ? 'Warlord' : '', u.enhancement].filter(Boolean);
  const own = (l, words) => [l.name === u.name || !u.short ? baseName(l.name) : u.short].concat(words).join(' · ');
  if(lines.length === 1 && lines[0].n === 1) return [Object.assign(lines[0], { mark:own(lines[0], tag), lead:true })];
  const body = u.leads ? lines.slice(1) : lines;
  if(u.leads) Object.assign(lines[0], { mark:own(lines[0], tag), lead:true });
  const std = body.slice().sort((x, y) => y.n - x.n)[0];
  for(const l of body){
    if(l === std){ l.mark = 'standard'; l.std = true; continue; }
    const sb = baseName(std.name), lb = baseName(l.name);
    const named = lb === sb ? '' : lb.startsWith(sb + ' ') ? lb.slice(sb.length + 1) : lb;
    const more = l.gear.filter(g => !std.gear.includes(g));
    l.mark = [named, more.join(' + '), l.extra].filter(Boolean).join(' · ') || 'standard';
  }
  return lines;
}
function screenBases(){
  const a = army(), total = new Map();
  const units = ROLE_ORDER.flatMap(r => a.units.filter(u => (ROLE_ORDER.includes(u.role) ? u.role : 'Other') === r));
  const cards = units.map(u => {
    const lines = proxyLines(u), c = u.copies || 1;
    for(const l of lines) if(/\d/.test(l.base)) total.set(l.base, (total.get(l.base) || 0) + l.n * c);   // "Hull": no base
    return '<div class="px"><div class="pxh">' + unitLink(u) + (u.leads ? '<span class="tg m">+ ' + esc(u.leads) + '</span>' : '') +
      (c > 1 ? '<span class="tg m">' + c + ' units: mark them apart (1, 2' + (c > 2 ? ', 3' : '') + ')</span>' : '') + '</div>' +
      lines.map(l => '<div class="pxl"><span class="pxn">' + l.n + '× <b>' + esc(/\d/.test(l.base) ? l.base : 'no base') + '</b></span><span class="pxm' + (l.std ? ' std' : '') + '">' + esc(l.mark) +
        (l.std && l.gear.length ? ' <i>' + esc(l.gear.join(', ')) + '</i>' : '') + '</span></div>').join('') + '</div>';
  });
  const sizes = [...total].sort((x, y) => (parseFloat(x[0]) || 999) - (parseFloat(y[0]) || 999));
  return '<p class="lbl grp-h">Bases to print</p><p class="pxt">' + sizes.map(([b, n]) => '<span><b>' + n + '×</b> ' + esc(b) + '</span>').join('') + '</p>' +
    '<p class="lbl grp-h">What to write on each base</p><div class="list">' + cards.join('') + '</div>' +
    '<p class="note">From the New Recruit list: model counts and loadouts per model, base sizes from the datasheets.</p>';
}

/* ---------- screen: before the battle ----------
   Everything decided or set up before the first turn, and every once-per-battle resource,
   gathered from the list: the paper has it spread over many pages. Every line opens its full text. */
const PREGAME_RE = /before the battle|declare battle formations|read mission objectives|pre-?battle|\bdeploy|redeploy|infiltrat/i;
function screenPregame(){
  const a = army(), f = faction(), units = a.units;
  const row = (k, v) => v ? '<div class="pgr"><span class="pgk">' + k + '</span><span class="pgv">' + v + '</span></div>' : '';
  const sec = (title, body) => body ? '<div class="sec-h"><h2>' + title + '</h2></div><div class="pg">' + body + '</div>' : '';
  // the same ability on several units is one line: "Singular Purpose · Assimilator (280), Norn Emissary ×2"
  const group = list => { const m = new Map(); for(const [u, ab] of list){ const k = ab.name + '|' + ab.text; if(!m.has(k)) m.set(k, { ab, units:[] }); m.get(k).units.push(u); } return [...m.values()]; };
  const abLine = g => linkTo('ability', abilityKey(g.ab), g.ab.name) + ' <span class="from">· ' + esc(unitNames(g.units)) + '</span>';
  const rulesOf = units.length ? f.armyRules.filter(r => !inertRule(r.name)).map(r => ({ r, src:f.name + ' army rule' }))
    .concat(detachments().filter(d => d.rule).map(d => ({ r:d.rule, src:d.name }))) : [];
  const ruleLine = x => linkTo('rule', x.r.name, x.r.name) + ' <span class="from">· ' + esc(x.src) + '</span>';
  const nameLink = u => linkTo('unit', u.id, u.short || u.name);   // without its enhancement: the line says it
  const allAbs = units.flatMap(u => u.abilities.filter(ab => !naReason(ab)).map(ab => [u, ab]));

  // your list
  const warlord = units.filter(u => u.warlord);
  const enh = units.filter(u => u.enhancement).map(u => { const d = detachments().find(x => x.enhancements.some(e => e.name === u.enhancement)), e = d && d.enhancements.find(x => x.name === u.enhancement);
    return (d ? linkTo('enh', d.id + '|' + u.enhancement, u.enhancement) : esc(u.enhancement)) + (e && e.pts ? ' <span class="from">' + e.pts + ' pts</span>' : '') + ' on ' + nameLink(u); });
  const led = units.filter(u => u.leads).map(u => nameLink(u) + ' leads ' + esc(u.leads));
  let h = sec('Your list',
    row('Warlord', warlord.map(unitLink).join(', ')) +
    row('Enhance&shy;ments', enh.join('<br>')) +
    row('Attached', led.join('<br>')) +
    row('Detach&shy;ments', esc(detachments().map(d => d.name + (d.dp ? ' (' + d.dp + ' DP)' : '')).join(', ')) + (a.disposition ? '<br><span class="from">Disposition:</span> ' + esc(a.disposition) : '')) +
    row('Points', esc(a.pointsUsed + ' / ' + a.points + ' · ' + a.battleSize)));

  // declare battle formations: reserves and transports
  const ds = units.filter(u => unitRules(u).some(r => ruleKey(r) === 'Deep Strike'));
  const dsPts = ds.reduce((t, u) => t + (u.pts || 0) * (u.copies || 1), 0), half = Math.floor(a.points / 2);
  const transports = units.filter(u => hasKw(u, 'Transport')).map(u => { const ab = u.abilities.find(x => /transport capacity/i.test(x.text)); return unitLink(u) + (ab ? ': <span class="from">' + rt(ab.text).replace(/^<p>|<\/p>$/g, '') + '</span>' : ''); });
  h += sec('Declare battle formations',
    row('Reserves', linkTo('rule', 'Strategic Reserves', 'Strategic reserves') + ': up to ' + half + ' pts (half the ' + a.points + ' limit). Unless a rule says otherwise, they arrive from battle round 2, and any not on the table by the end of round 3 are destroyed (not repositioned units, nor units in a TRANSPORT that arrived).' +
      (ds.length ? '<br><span class="from">Can ' + linkTo('rule', 'Deep Strike', 'Deep Strike') + ':</span> ' + ds.map(u => unitLink(u) + ' <span class="from">' + u.pts + ' pts' + (u.copies > 1 ? ' each' : '') + '</span>').join(', ') + (ds.length > 1 ? ' <span class="from">(all: ' + dsPts + ' pts)</span>' : '') : '')) +
    row('Transports', transports.join('<br>')));

  // deployment and pre-battle abilities
  const scouts = units.filter(u => unitRules(u).some(r => /^scouts|^infiltrators/i.test(r)));
  const pre = group(allAbs.filter(([u, ab]) => PREGAME_RE.test(ab.text) && !/start of the first battle round/i.test(ab.text)));
  h += sec('Deploying',
    row('Scouts', scouts.map(u => unitLink(u) + ' <span class="from">' + esc(unitRules(u).filter(r => /^scouts|^infiltrators/i.test(r)).join(', ')) + '</span>').join('<br>')) +
    row('Abilities', pre.map(abLine).join('<br>')) +
    row('Rules', rulesOf.filter(x => PREGAME_RE.test(x.r.text)).map(ruleLine).join('<br>')));

  // decided at the start of the battle or of every battle round
  const first = group(allAbs.filter(([u, ab]) => /start of the first battle round/i.test(ab.text)));
  const round = rulesOf.filter(x => /start of (the|each|every) battle round/i.test(x.r.text)).map(ruleLine)
    .concat(group(allAbs.filter(([u, ab]) => /start of (the|each|every) battle round/i.test(ab.text) && !/first battle round/i.test(ab.text))).map(abLine));
  h += sec('Start of the battle', row('Round 1', first.map(abLine).join('<br>')) + row('Every round', round.join('<br>')));

  // once per battle: the resources you spend once
  const onceB = x => /once per battle(?! round)/i.test(x);
  const onceRules = f.armyRules.filter(r => !inertRule(r.name) && onceB((r.tag || '') + ' ' + r.text)).map(r => ({ r, src:f.name + ' army rule' }))
    .concat(detachments().filter(d => d.rule && onceB(d.rule.text)).map(d => ({ r:d.rule, src:d.name })));
  const onceAbs = group(allAbs.filter(([u, ab]) => onceB((ab.tag || '') + ' ' + ab.text)));
  const onceStrats = allStratagems().filter(s => eligible(s).length && onceB([s.limit, s.restrictions, s.effect].join(' ')));
  h += sec('Once per battle',
    row('Rules', onceRules.map(ruleLine).join('<br>')) +
    row('Abilities', onceAbs.map(g => abLine(g) + (/per army/i.test(onceTag(g.ab)) ? ' <span class="tg once">per army</span>' : '')).join('<br>')) +
    row('Strata&shy;gems', onceStrats.map(s => linkTo('strat', s.id, s.cp + 'CP ' + s.name)).join('<br>')));
  // rules this list uses whose wording allows two readings
  const asks = rulesOf.filter(x => x.r.ask).map(x => [linkTo('rule', x.r.name, x.r.name), x.r.ask])
    .concat(group(allAbs.filter(([u, ab]) => ab.ask)).map(g => [linkTo('ability', abilityKey(g.ab), g.ab.name), g.ab.ask]))
    .concat(allStratagems().filter(s => s.ask && eligible(s).length).map(s => [linkTo('strat', s.id, s.name), s.ask]));
  h += asks.length ? '<div class="sec-h"><h2>Agree with your opponent</h2></div><div class="pg">' + asks.map(([l, q]) => '<p class="askl">' + l + ' <span>' + esc(q) + '</span></p>').join('') + '</div>' : '';
  return h + '<p class="note">Gathered from this list’s datasheets and rules; each line opens the full text.</p>';
}

/* ---------- screen: rules & keywords ---------- */
const xp = (name, sub, tags, body, open) => '<details class="xp"' + (open ? ' open' : '') + '><summary><span class="xh"><b>' + esc(name) + '</b>' + (sub ? '<span>' + esc(sub) + '</span>' : '') + '</span>' +

// the core rules a player looks up every game, from the Core Rules (07 The Battle Round, 08 Command
// Phase, 05 Attack Sequence; the dice in its tables are pictures, read from the printed page)
function quickRef(){

  return xp('Quick reference', 'Turn order · Command phase · hit, wound and save rolls', '',
    '<p class="qh">Battle round (07)</p><p>Start of battle round → both players take a turn (the mission says who goes first) → end of battle round.</p>' +

      '<li>' + linkTo('rule', 'Battle-shock', 'Battle-shock') + ': a roll for each of your units that is battle-shocked or at or below ' + linkTo('rule', 'Starting Strength', 'half-strength') + '.</li>' +
      '<li>Command abilities.</li><li>End-of-phase rules.</li></ol>' +
    '<p class="qh">Hit roll (05.01)</p>' + tr([['Unmodified 1', 'fails'], ['Unmodified 6', 'critical hit'], ['≥ BS / WS', 'hit']]) +
    '<p class="qh">Wound roll (05.02)</p>' + tr([['Unmodified 1', 'fails'], ['Unmodified 6', 'critical wound'], ['S ≥ 2× T', '2+'], ['S > T', '3+'], ['S = T', '4+'], ['S < T', '5+'], ['S ≤ ½ T', '6+']]) +
    '<p class="qh">Save roll (05.03, 05.04)</p>' + tr([['Unmodified 1', 'damage'], ['≥ InSv', 'saved (AP does not apply)'], ['≥ Sv after AP', 'saved'], ['Otherwise', 'the model loses D wounds']]) +
    '<p class="note">Allocation: a group of models with a wounded model takes attacks first; CHARACTER models come after all others.</p>', false);
}
function screenRules(){
  const f = faction(), a = army();
  const taken = new Map(a.units.filter(u => u.enhancement).map(u => [u.enhancement, u]));
  let h = '<div class="list">' + quickRef() + '</div><div class="sec-h"><h2>Army rules</h2></div><div class="list">' +
    f.armyRules.map((r, i) => xp(r.name, r.ph ? whenTag(r) : '', r.tag ? '<span class="tg m">' + esc(r.tag) + '</span>' : '', (r.note ? '<p class="note it">' + esc(r.note) + '</p>' : '') + rt(r.text) + (r.table ? ttable(r.table) : '') +
      ((r.missing || []).length ? '<p class="note">Not in the app yet: the ' + esc(r.missing.join(' and ')) + ' (they need that Wahapedia page).</p>' : ''), false)).join('') + '</div>';
  for(const d of detachments()){
    const mine = d.enhancements.filter(e => taken.has(e.name)), other = d.enhancements.filter(e => !taken.has(e.name));
    const gap = (d.missing || []).includes('enhancements') ? '<p class="note">The other ' + esc(d.name) + ' enhancements aren’t in the app yet: they need the Wahapedia page.</p>' : '';
    h += '<div class="sec-h"><h2>' + esc(d.name) + '</h2></div><div class="list">' +
      (d.rule ? xp(d.rule.name, 'Detachment rule', '', (d.rule.note ? '<p class="note it">' + esc(d.rule.note) + '</p>' : '') + rt(d.rule.text) + (d.rule.table ? ttable(d.rule.table) : '') + usedBy('Applies to', a.units.filter(u => matches(d.rule.needs, u))), false) : '') +
      mine.map(e => xp(e.name, 'Enhancement' + (e.pts ? ' · ' + e.pts + ' pts' : ''), '', rt(e.text) + usedBy('On', [taken.get(e.name)]), false)).join('') +
      (other.length ? xp('Other enhancements', other.length + ' not in this list', '',
        other.map(e => '<div class="sub"><b class="nm">' + esc(e.name) + '</b>' + (e.pts ? ' <span class="tg m">' + esc(e.pts) + ' pts</span>' : '') + rt(e.text) + '</div>').join(''), false) : '') +
      '</div>' + gap;
  }
  // the core rules and weapon keywords this army actually uses, each listed once
  const used = new Map();
  const note = (label, kind) => {
    const r = ruleFor(label);
    if(!r || r.src !== 'Core rule') return;
    const e = used.get(r.key) || { r, kind, labels:new Set() };
    if(kind === 'weapon') e.kind = 'weapon';
    if(label.toLowerCase() !== r.key.toLowerCase()) e.labels.add(label);
    used.set(r.key, e);
  };
  for(const u of a.units){
    for(const r of unitRules(u)) note(r, 'ability');
    for(const w of [...(u.ranged || []), ...(u.melee || [])]){ for(const k of w.kw) note(k, 'weapon'); if(w.hunter) note('Hunter', 'weapon'); }
    for(const ab of u.abilities) for(const key of Object.keys(D.rules)) if(!CONCEPT.has(key) && mentions(ab.text, key)) note(key, 'ability');
  }
  const gloss = kind => [...used.values()].filter(e => e.kind === kind).sort((x, y) => x.r.key.localeCompare(y.r.key))
    .map(e => xp(e.r.key, e.labels.size ? [...e.labels].sort().join(', ') : '', '', rt(e.r.text) + usedBy('In this army', ruleUsers(e.r.key)), false)).join('');
  h += '<div class="sec-h"><h2>Unit rules</h2></div><div class="list">' + gloss('ability') + '</div>';
  h += '<div class="sec-h"><h2>Weapon keywords</h2></div><div class="list">' + gloss('weapon') + '</div>';
  return h + '<p class="note">Force disposition: ' + esc(a.disposition) + '.</p>';
}

function jumpTo(id, instant){
