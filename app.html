<style>
/* Kunnin’ Kodex: a drill-down reference sheet for one army list.
   Tabs: Overview | Units | Stratagems | Rules | Find (search + menu: Ranged, Melee, Abilities,
   Bases); Units -> unit datasheet, which fits one screen with the long text folded away. A sticky
   top bar (back, centred title, search) can carry column labels; each tab remembers its screen. One dark graphite look; orange marks what you can tap
   and what matters. */
:root{
  color-scheme: dark;
  --bg:#161616;
  --surface:#1f1f1f;     /* multi-profile weapons, cards */
  --surface2:#2a2a2a;    /* bands, selected controls */
  --line:#363636;
  --fg:#ededed;
  --fg2:#c4c4c4;         /* weapon keywords */
  --muted:#9c9c9c;
  --accent:#ff8a2a;      /* orange */
  --accent-ink:#1c0d00;  /* text on orange */
  --count-line:#5c5c5c;  /* the ring of a count pill ("×5") */
  --pill-line:#3e3e3e;   /* the ring of a keyword pill */
  --ok:#5fc27a;          /* the "Checked" tick */
  /* datasheet headings: the unit's band (also the role bands of the Units list), a section's band
     with its column labels, a table's header row */
  --ds-band:#4c5056; --ds-band-fg:#f3f3f3;
  --ds-h2:#2c2e32; --ds-h2-fg:#f1f1f1; --ds-h2-col:#cfcfcf;
  --ds-head:#262626; --ds-head-fg:#c4c4c4;
  --ds-edge:linear-gradient(to bottom, color-mix(in srgb, var(--accent) 100%, transparent) 0, color-mix(in srgb, var(--accent) 62%, transparent) 6%,
    color-mix(in srgb, var(--accent) 34%, transparent) 12%, color-mix(in srgb, var(--accent) 16%, transparent) 22%, color-mix(in srgb, var(--accent) 6%, transparent) 34%, transparent 50%);
  /* other colour schemes (picked on the home screen) override these: THEMES in the script */
  --shadow:0 10px 30px rgba(0,0,0,.5);
  --f-head:'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  --f-body:'Atkinson Hyperlegible Next', system-ui, -apple-system, 'Segoe UI', sans-serif;   /* built for legibility */
  --hdr:53px;            /* measured height of the sticky top bar */
  --bb:0px;              /* measured height of the bottom bar (0 when there is none) */
  --top:calc(env(safe-area-inset-top, 0px) + var(--hdr));
  --safe-b:env(safe-area-inset-bottom, 0px);
}

*{box-sizing:border-box}
html,body{margin:0}
html{touch-action:manipulation; background:var(--bg)}
/* inside Claude (the artifact) the app is a frame on claude.ai's page: scrolling past either end must not pull
   claude.ai's page along (its own background, and the tab bar moving with the frame) */
html.embedded, html.embedded body{overscroll-behavior:none}
html.lock, html.lock body{overflow:hidden}
[hidden]{display:none !important}
body{
  background:var(--bg); color:var(--fg);
  font:16px/1.45 var(--f-body);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-bottom:calc(32px + max(var(--bb), var(--safe-b)));
  -webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;
}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); z-index:30; background:var(--bg)}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; text-align:inherit}
input{font:inherit; color:var(--fg)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
b{font-weight:700}
s{text-decoration-thickness:2px; text-decoration-color:var(--accent)}
h1,h2,h3,p{margin:0}
.wrap{max-width:720px; margin:0 auto}
.num{font-variant-numeric:tabular-nums}
[role="button"]{cursor:pointer}

/* ---------- type roles ---------- */
.lbl{font:600 11px/1.2 var(--f-head); letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.note{font-size:13px; line-height:1.4; color:var(--muted); margin-top:10px}
.note.it{font-style:italic; margin-top:0}
.tg{font:600 12px/1.2 var(--f-body); color:var(--accent); white-space:nowrap}
.tg.m{color:var(--muted)}
.link{color:var(--fg); text-decoration:underline dotted; text-decoration-color:var(--accent); text-underline-offset:3px; padding:2px 0 8px}
.link:active{color:var(--accent)}
.chev{width:18px; height:18px; flex:none; color:var(--muted); transition:transform .15s ease}
details[open] > summary .chev{transform:rotate(180deg)}
.go{width:18px; height:18px; flex:none; color:var(--muted); transform:rotate(-90deg)}
summary{list-style:none; cursor:pointer}
summary::-webkit-details-marker{display:none}
.rt p{margin:0 0 5px} .rt p:last-child{margin-bottom:0}
.rt ul{margin:2px 0 5px; padding-left:18px} .rt li{margin:1px 0}
.rt .it{font-style:italic; color:var(--muted)}
b.rl{padding:1px 0 9px; text-decoration:underline dotted; text-decoration-color:var(--accent); text-underline-offset:3px}
.ttable{display:grid; grid-template-columns:auto 1fr; gap:3px 12px; margin-top:6px}
.ttable span:nth-child(odd){font:700 15px var(--f-head); color:var(--accent)}
.tlist{margin-top:6px; display:grid; gap:6px}
.tlist > div{border-left:2px solid var(--line); padding-left:8px}
.tlist b{font:700 15px/1.2 var(--f-head); letter-spacing:.02em; color:var(--fg)}
.tlist > div > b:first-child{color:var(--accent)}
.empty{padding:20px 12px; text-align:center; color:var(--muted)}
.il{font:600 11px/1 var(--f-head); letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-right:6px}
.usedby{font-size:13.5px; color:var(--muted)}
.pg{border-top:1px solid var(--line)}
.pgr{display:grid; grid-template-columns:92px minmax(0,1fr); gap:0 10px; padding:7px 2px 6px; border-bottom:1px solid var(--line)}
.pgk{font:600 11.5px/1.35 var(--f-head); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); padding-top:3px; hyphens:manual}
.pgv{font-size:14.5px; line-height:1.55; min-width:0}
.pgv .from{color:var(--muted)}

/* ---------- top bar ---------- */
.top{position:sticky; top:env(safe-area-inset-top, 0px); z-index:20; background:var(--bg); border-bottom:1px solid var(--line);
  margin:0 calc(-1 * max(16px, env(safe-area-inset-right, 0px))) 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding:0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px))}
.top-in{max-width:720px; margin:0 auto; display:grid; grid-template-columns:minmax(64px,1fr) auto minmax(64px,1fr); align-items:center; gap:8px; min-height:52px}
.back{justify-self:start; display:flex; align-items:center; gap:2px; min-height:44px; max-width:100%; min-width:0; padding-right:6px;
  color:var(--accent); font:700 15px/1 var(--f-head); letter-spacing:.06em; text-transform:uppercase}
.back:active{opacity:.6}
.back svg{width:20px; height:20px; flex:none; margin-left:-4px}
.back span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ttl{min-width:0; max-width:58vw; text-align:center; font:700 clamp(15px, 4.6vw, 18px)/1.05 var(--f-head); letter-spacing:.03em; overflow:hidden; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2}
.ttl .brand{display:inline-flex; align-items:center; gap:9px; vertical-align:middle}
.ttl .lg{width:28px; height:28px; flex:none}
.icon-btn{justify-self:end; width:44px; height:44px; display:grid; place-items:center; color:var(--fg); margin-right:-10px}
.icon-btn:active{color:var(--accent)}
.icon-btn svg{width:20px; height:20px}
.subbar{padding-bottom:5px}

/* ---------- bottom bar: stratagem filters ---------- */
.bbar{position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--bg); border-top:1px solid var(--line);
  padding:6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + var(--safe-b)) max(16px, env(safe-area-inset-left, 0px))}

/* ---------- lists ---------- */
.list{border-top:1px solid var(--line)}
.row{display:flex; align-items:center; gap:12px; width:100%; min-height:48px; padding:9px 2px; border-bottom:1px solid var(--line); text-align:left}
.row:active, .urow:active, .res:active, .band:active{background:var(--surface)}
.row .ic{width:20px; height:20px; flex:none; color:var(--muted)}
.row .rb{flex:1; min-width:0; display:grid; gap:1px}
.row .rb b{font:700 17px/1.15 var(--f-head); letter-spacing:.02em}
.row .rb span{font-size:13px; color:var(--muted)}
.row .c{font:600 14px var(--f-head); color:var(--muted); font-variant-numeric:tabular-nums}
.grp-h{margin:16px 0 4px}
.pxt{display:flex; flex-wrap:wrap; gap:4px 14px; font:600 15px/1.4 var(--f-head); font-variant-numeric:tabular-nums}
.pxt b{color:var(--accent)}
.px{padding:7px 2px 6px; border-bottom:1px solid var(--line)}
.pxh{display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 8px; margin-bottom:2px}
.pxh .link{font:700 16px/1.2 var(--f-head); letter-spacing:.02em}
.pxl{display:grid; grid-template-columns:96px minmax(0,1fr); gap:6px; font-size:14px; line-height:1.35; padding:1px 0}
.pxn{font:600 14px/1.35 var(--f-head); font-variant-numeric:tabular-nums; color:var(--fg2)}
.pxn b{color:var(--fg)}
.pxm.std{color:var(--muted)}
.pxm i{font-style:normal; color:var(--muted); font-size:12.5px}
.arow{padding:10px 2px 11px}
.arow .rb{gap:5px}
.arow .rb b{display:flex; align-items:baseline; gap:10px; font-size:19px}
.arow .apts{font:600 13px var(--f-head); color:var(--muted); letter-spacing:.02em}
.tags{display:flex; flex-wrap:wrap; gap:4px}
.row .rb .t{font:700 12px/1 var(--f-head); letter-spacing:.06em; text-transform:uppercase; color:var(--fg2); background:var(--surface2); border-radius:5px; padding:4px 6px 3px}
.row .rb .t.f{color:var(--accent-ink); background:var(--accent)}
.row .rb .t.d{color:var(--muted); background:none; box-shadow:inset 0 0 0 1px var(--line)}
.army-sub{font-size:13.5px; line-height:1.4; color:var(--muted)}
.army-sub.peek{color:var(--accent); font-weight:600}
.rowpair{display:flex; align-items:stretch}
.rowpair .row{flex:1; min-width:0}
.rowpair .chg{flex:none; padding:0 4px 0 14px; border-bottom:1px solid var(--line); font:600 14px var(--f-head); letter-spacing:.02em; color:var(--accent)}

/* ---------- search ---------- */
.search{display:flex; align-items:center; gap:8px; margin:12px 0 4px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:0 12px}
.search:focus-within{border-color:var(--accent)}
.search svg{width:18px; height:18px; color:var(--muted); flex:none}
.search input{flex:1; min-width:0; border:0; background:none; padding:11px 0; outline:none}
.search input::placeholder{color:var(--muted)}
.rg{margin-top:12px}
.rg .lbl{padding-bottom:4px; border-bottom:1px solid var(--line)}
.res{display:grid; gap:1px; width:100%; text-align:left; padding:8px 2px; border-bottom:1px solid var(--line)}
.res b{font:700 16.5px/1.15 var(--f-head); letter-spacing:.02em}
.res .s1{font:700 14px/1.3 var(--f-head); letter-spacing:.02em; font-variant-numeric:tabular-nums}
.res span{font-size:13px; line-height:1.35; color:var(--muted)}
.res mark{background:none; color:var(--accent)}
.more{width:100%; min-height:40px; text-align:left; padding:0 2px; font:700 13px var(--f-head); letter-spacing:.06em; text-transform:uppercase; color:var(--accent)}

/* ---------- unit list: a roster, as New Recruit's: a band per role, one row per unit with its
   stats on the name's line (an attached unit: one line per model type, under its name), points last ---------- */
:root{ --uc:minmax(0,1fr) repeat(7, 26px) 44px }
@media (max-width:359px){ :root{ --uc:minmax(0,1fr) repeat(7, 23px) 38px } }
.uh, .urow{display:grid; grid-template-columns:var(--uc); align-items:baseline}
.uh{padding:2px 2px 0; font:500 11.5px/1.2 var(--f-body); color:var(--muted); text-align:center}
.uh .n{text-align:left}
.uh .p, .urow .pts{text-align:right}
.rgh{display:flex; justify-content:space-between; align-items:baseline; margin:16px 0 0; padding:6px 10px 5px; background:var(--ds-band); color:var(--ds-band-fg);
  font:700 14px/1.1 var(--f-head); letter-spacing:.1em; text-transform:uppercase; clip-path:polygon(7px 0, calc(100% - 7px) 0, 100% 7px, 100% 100%, 0 100%, 0 7px)}
.rgh:first-child{margin-top:10px}
.rgh .c{font:600 13px/1 var(--f-head); letter-spacing:.04em; opacity:.8}
.list.ul{border-top:0}
.urow{width:100%; text-align:left; padding:7px 2px 6px; border-bottom:1px solid var(--line); row-gap:1px}
.urow .un{display:flex; flex-wrap:wrap; align-items:baseline; gap:0 6px; min-width:0; padding-right:6px}
.urow.att .un{grid-column:1 / 9}
.urow .un b{font:700 16.5px/1.2 var(--f-head); letter-spacing:.02em}
.urow .un .x{margin-left:0; font-size:13px}
.urow .un .lead{margin:0; font:700 16.5px/1.2 var(--f-head); letter-spacing:.02em; color:var(--fg)}
.urow .utg{flex-basis:100%; display:flex; flex-wrap:wrap; gap:0 8px}
.urow .utg .tg{white-space:normal; font-size:12.5px}
.urow .meta{flex-basis:100%; font-size:12.5px; color:var(--muted); line-height:1.3}
.urow .sc{font:700 15.5px/1.2 var(--f-head); text-align:center; font-variant-numeric:tabular-nums; min-width:0}
.urow .pts{grid-column:9; font:600 14.5px/1.2 var(--f-head); color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap}
.urow .sn{grid-column:1; display:block; padding-left:12px; font:600 14px/1.25 var(--f-head); letter-spacing:.01em; color:var(--fg); min-width:0}
.urow .sn .x{margin-left:5px; font-size:12px}
.nw{white-space:nowrap}
@media (max-width:359px){ .urow .sc{font-size:14.5px} .urow .un b, .urow .un .lead{font-size:15.5px} .urow .sn{padding-left:8px; font-size:13px} }

/* ---------- datasheet ---------- */
.ds-meta{display:flex; flex-wrap:wrap; gap:2px 10px; align-items:baseline; padding:8px 0 6px; font-size:13px; color:var(--muted)}
.statwrap{scroll-margin-top:calc(var(--top) + 4px)}
.st{display:grid; align-items:stretch; border-radius:6px; overflow:hidden; background:var(--surface)}
.st > span{text-align:center; padding:5px 0; font:700 18px/1 var(--f-head); border-top:1px solid var(--line); min-width:0; font-variant-numeric:tabular-nums}
.st > span.h{font:600 11px/1 var(--f-head); letter-spacing:.1em; color:var(--muted); border-top:0; padding:6px 0 4px; background:var(--surface2)}
.st > span.n{text-align:left; padding-left:8px; font:600 14px/1.15 var(--f-head); display:flex; align-items:center; letter-spacing:.01em}
.def{margin-top:6px; border-left:2px solid var(--accent); padding:1px 0 1px 8px; font-size:13px; line-height:1.4}
.def.dmg{border-left-color:var(--muted)}
.dsl{margin-top:5px; font-size:12.5px; color:var(--muted); line-height:1.35}
.dsec{margin-top:12px}
.dsec > .lbl{padding-bottom:3px}
.dline{padding:5px 2px; border-bottom:1px solid var(--line); font-size:14px; line-height:1.5}
.dline .sep{color:var(--muted)}
.lbn{margin-left:8px; text-transform:none; letter-spacing:.02em; font:500 11.5px/1.2 var(--f-head)}
.lbn .link{color:var(--muted)}
.dline .link{white-space:nowrap}
.dsec > .dline:first-child{border-top:1px solid var(--line)}
.dsec + .dsec{margin-top:0}
.dsec + .dsec > .dline:first-child{border-top:0}
/* one-line rows that open: abilities, keywords */
.abl{border-top:1px solid var(--line)}
.ab.pf{border-bottom:1px solid var(--line)}
.ab.pf > summary{min-height:34px}
.ab.pf .pfl{font-size:12.5px; color:var(--fg2)}
.ab.pf .wh.both{position:static; box-shadow:none}
.ab{border-bottom:1px solid var(--line)}
.ab > summary{display:flex; align-items:center; gap:8px; min-height:34px; padding:3px 2px}
.ab > summary:active{background:var(--surface)}
.ab > summary .an{flex:1 1 0; min-width:0; display:flex; flex-wrap:wrap; align-items:baseline; gap:0 8px}
.ab > summary b{font:700 15px/1.2 var(--f-head); letter-spacing:.02em}
.ab > summary b.kh{font:600 11px/1.2 var(--f-head); letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.ab > summary small{font:600 11px var(--f-head); letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.ab > summary .aw{font-size:12.5px; color:var(--muted); text-align:right; flex:0 0 auto; max-width:52%}   /* breaks only between a phase's runs */
.ab .tg.once, .ab.na .an .tg.m{white-space:normal}   /* a long "not usable here" reason wraps on a small phone */
.ab[open] > summary b{color:var(--accent)}
.ab.na > summary b{color:var(--muted)}
.ab .tg.once{color:var(--fg2); font-weight:500}
.ab > .body{padding:0 2px 10px; font-size:14.5px; line-height:1.42}
.ab .abt{font-size:12.5px; color:var(--muted); margin-bottom:3px}

/* weapon tables: one weapon = one hairline-separated row (stats + a quiet keyword line), all alike.
   ➤ before profiles: pick one of them; + before profiles: all of them fire.
   Between rows: "or" = a model uses one of these, "+" = on top (extra attacks), nothing = both are used.
   Rules that change the attacks are footnotes under the table. */
.wt{display:grid}
.wr, .wh{display:grid; align-items:baseline; column-gap:2px}
.ranged .wr, .wh.ranged, .both .wr, .wh.both{grid-template-columns:minmax(0,1fr) 32px 44px 28px 26px 28px 36px}
.melee .wr, .wh.melee{grid-template-columns:minmax(0,1fr) 44px 28px 26px 28px 36px}
.wh{padding:0 6px 3px; font:600 11px/1 var(--f-head); letter-spacing:.1em; color:var(--muted); text-align:center; text-transform:uppercase}
.wh .n{text-align:left}
.wh.both{position:sticky; top:var(--top); z-index:3; background:var(--bg); padding-top:8px; box-shadow:0 1px 0 var(--line)}
.wh.both .n{color:var(--fg)}
/* datasheet heading levels: unit name (top bar) > section (Ranged, Melee, Abilities, Rules, Stratagems) > model chip (.who) > weapon name */
.wh.both .n, .ab.pf > summary b.kh, .dsec > .lbl, .dsec .dline > .il, .sec-h h2, .lbl.grp-h{font:700 15.5px/1.1 var(--f-head); letter-spacing:.1em; text-transform:uppercase; color:var(--fg)}
.wh.both{align-items:baseline}
.anc{scroll-margin-top:var(--top)}
.wt.both{margin-top:12px}
.use{padding:4px 6px 3px; font-size:12.5px; line-height:1.35; color:var(--fg2)}
.use b{color:var(--accent); font-weight:600}
.use b.m{color:var(--fg)}
.uv{text-decoration:underline dotted; text-decoration-color:var(--accent); text-underline-offset:3px}
.mod .sc{font:600 10.5px var(--f-head); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-right:5px}
.wb{padding:4px 6px 3px; border-top:1px solid var(--line)}
.wb:has(> .wr .x){padding:5px 6px 4px}   /* a row with a count pill gets room to breathe */
.wr > span.n2{grid-column:span 2}
.wh > span.n2{grid-column:span 2}
.cr{display:inline-block; font:600 10.5px/1.2 var(--f-head); letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin-left:6px}
.use.gw{padding-left:0; margin-top:10px}
.use.gw .who{display:inline-block; margin:0 7px 0 0; vertical-align:1px}
.wh + .wb, .who + .wb, .use + .wb, .wb:first-child{border-top:0}
.wj{display:flex; align-items:center; gap:7px; margin:1px 6px; font:600 11.5px/1.2 var(--f-head); letter-spacing:.08em; text-transform:uppercase; color:var(--accent)}
.wj::before, .wj::after{content:''; flex:1; border-top:1px dashed var(--line)}
.wj::before{flex:0 0 14px}
.wj i{font-style:normal; color:var(--muted); letter-spacing:.06em}
.wj + .wb{border-top:0}
/* the models box at the top of a datasheet, as New Recruit lists the models */
.mdl{margin:4px 0 10px}
.ml{padding:4px 0; line-height:1.3}
.ml + .ml{border-top:1px solid var(--line)}
.mn{font-weight:600}
.mlt{font-size:12.5px; margin-left:8px}
.mg{display:block; font-size:13px; color:var(--muted)}
.wr > span{font:700 15.5px/1.25 var(--f-head); text-align:center; min-width:0; font-variant-numeric:tabular-nums}
.wr > span.n{text-align:left; padding-right:6px; font:600 15px/1.2 var(--f-head); letter-spacing:.01em}
.wr.p > span.n{padding-left:8px}
.wr.p + .wr.p, .kwl + .wr.p{margin-top:4px}
.ar{color:var(--muted); margin-right:3px; font-size:12px}
/* a count ("×5"): its own small pill, the figures centred in it both ways. text-box trims the line to
   the figures' own height (cap height to baseline), so the space around them is the padding alone;
   the right padding gives back the letter spacing after the last figure. Sizes are in em, so a
   smaller pill (a stats row, a model line) stays centred too. */
.x{display:inline-block; margin-left:8px; padding:.32em calc(.42em - .04em) .32em .42em; border-radius:5px; box-shadow:inset 0 0 0 1.5px var(--count-line); color:var(--fg);
  font:700 14px/1 var(--f-head); letter-spacing:.04em; white-space:nowrap; font-variant-numeric:tabular-nums; text-box:trim-both cap alphabetic}
@supports not (text-box:trim-both cap alphabetic){ .x{padding-top:.17em; padding-bottom:.17em} }   /* untrimmed, the figures sit centred in the 1em line */
.tq{font:600 10.5px/1 var(--f-head); letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin-left:6px; white-space:nowrap; display:inline-block}
.wn{font:600 15px/1.2 var(--f-head); letter-spacing:.01em; margin-bottom:2px}
.wn small.fa{color:var(--accent)}
.wn small{font:600 11px/1 var(--f-head); letter-spacing:.09em; text-transform:uppercase; color:var(--muted); margin-left:8px}
.kwl{font:600 12px/1.35 var(--f-head); letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.wr.p + .kwl{padding-left:8px}
.kwl [data-rule]{color:var(--fg2); white-space:nowrap; padding:1px 0 13px; text-decoration:underline dotted; text-decoration-color:var(--accent); text-underline-offset:2px}
.kwl [data-rule]:active{color:var(--accent)}
.kwl .gk, .gv{color:var(--accent); text-decoration:underline dotted; text-decoration-color:var(--accent); text-underline-offset:2px; cursor:pointer}
.kwl .gk{white-space:nowrap; padding:1px 0 13px}
.gv{font:inherit; white-space:nowrap; position:relative}
.gv::after{position:absolute; top:-3px; right:-7px}
.kwl .gk.w, .gv.w{color:inherit}
.kwl .gk::after, .gv::after{content:'+'; font:700 9px/1 var(--f-head); vertical-align:super; margin-left:1px; text-decoration:none; display:inline-block}
.mod .cpb{display:inline-block; margin-right:3px; padding:0 5px; border-radius:4px; background:var(--surface2); font:700 12.5px/1.45 var(--f-head); letter-spacing:.03em; color:var(--fg)}
.msep{display:flex; align-items:center; gap:6px; margin:8px 0 3px; font:600 11.5px/1.2 var(--f-head); letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.msep::after{content:''; flex:1; border-top:1px solid var(--line)}
.strat.none .sh b{color:var(--muted)}
.strat[open] .sh span.sg{display:none}
.strat.none .sh span.sg{color:var(--muted)}
.strat > summary{align-items:start}
.strat > summary .cp{margin-top:2px}
.sh span.sw em{font-style:normal; font-weight:600; color:var(--fg2); margin-right:3px}
.sh .ticks{margin-top:4px}
.sh span.sg{font-size:13.5px; line-height:1.32; color:var(--fg2); margin:1px 0}
.rules .dsec{margin-top:22px}
.rules h2.lbl, .rules h3.who{margin-bottom:0}
.rules h2.lbl{margin-top:0}
.ab.rr > summary .an{flex-direction:column; align-items:flex-start; gap:1px}
.ab.rr .rs{font-size:12.5px; color:var(--muted)} .ab.rr .rs .tg{font-size:12.5px}
.ab.rr.na > summary b{color:var(--muted)}
.rules .dline.rs .none .link{color:var(--muted)}
.rules .who{margin-top:14px}
.rules .dline.rs{font-size:13.5px}
.rules .dline.rs > .il{font:600 11px/1.2 var(--f-head); letter-spacing:.1em; color:var(--muted); margin-right:6px}
.gvl{font-style:normal; position:relative} .gvl::after{content:'+'; position:absolute; top:-3px; right:-7px; font:700 9px/1 var(--f-head); color:var(--accent)}
.dline.sl p{margin:3px 0 0} .dline.sl .sln{font:600 11.5px/1.2 var(--f-head); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-right:4px}
.abl .xp{border-bottom:1px solid var(--line)}
.urs{border-top:1px solid var(--line)}
.urr{padding:6px 2px 7px; border-bottom:1px solid var(--line)}
.urn .link{font:700 16px/1.2 var(--f-head); letter-spacing:.02em}
.uru{margin:2px 0 0 12px; font-size:14px; line-height:1.45}
.urq{display:block; margin-top:1px; font-size:13px; line-height:1.4; color:var(--muted)}
.urq .link{color:var(--fg2)}
.uru .from{color:var(--muted)}
.gsrc{margin:6px 0 10px; padding:8px 10px; border-left:3px solid var(--accent); background:var(--surface); border-radius:0 8px 8px 0}
.gh{margin:0 0 4px} .gh .tg{margin-left:4px}
.gw2{margin:0 0 4px; font-size:12.5px; color:var(--muted)}
.gown{margin-top:16px; padding-top:10px; border-top:1px solid var(--line); color:var(--fg2)}
.gown, .gown .rt, .gown p, .gown li{font-size:13px; line-height:1.4}
.wr i.hi{font-style:normal; display:inline-block; min-width:26px; padding:1px 4px; border-radius:5px; background:var(--accent); color:var(--accent-ink)}
.wr i.hb{display:block; font:700 12px/1.1 var(--f-head); font-style:normal; color:var(--accent)}
.wr i.alt{font-style:normal; color:var(--accent)}
.varc{padding-top:1px; font-size:12.5px; line-height:1.35; color:var(--muted)}
.varc b{color:var(--accent); font:700 13.5px var(--f-head)}
.mods{margin-top:6px; display:grid; gap:4px}
.mods.all{margin:10px 0 2px}
.mods.all > .il{margin:0 0 1px}
.mod{border-left:2px solid var(--accent); padding:1px 0 1px 8px; font-size:13px; line-height:1.35}
.mod .from{color:var(--muted)}
/* whose weapons these are (leader vs bodyguard): a chip, not a whisper */
.who{display:inline-block; justify-self:start; margin:12px 0 4px; padding:4px 8px 3px; border-radius:4px; border:1px solid var(--line); background:var(--surface2); font:700 14px/1 var(--f-head); letter-spacing:.08em; text-transform:uppercase; color:var(--fg)}
/* phones under 360px: narrower columns (after the rules it overrides) */
@media (max-width:359px){
  .ranged .wr, .wh.ranged, .both .wr, .wh.both{grid-template-columns:minmax(0,1fr) 28px 38px 24px 22px 26px 30px}
  .melee .wr, .wh.melee{grid-template-columns:minmax(0,1fr) 38px 24px 22px 26px 30px}
  .wr.p > span.n{padding-left:2px}
  .ar{margin-right:1px; font-size:10px}
  .wr > span.n, .st > span.n{overflow-wrap:anywhere}
  .st > span.n{font-size:13px; padding-left:6px}
  .x{margin-left:6px; font-size:13px}
}
/* ---------- the datasheet as New Recruit draws it: one framed sheet of table sections ----------
   a slate band (points, name), grey header rows that carry the column labels, hairline rows,
   whose a row is after its name in grey ("- Mek"), and the keywords at the bottom as pills */
/* heading levels: the unit (its band) > a section box (Ranged Weapons, Melee Weapons, Abilities: its own box, a gap
   above, an angled darker band) > a table header (Models, Unit: grey row) > a part of the unit (Mek, Tankbustas, Whole unit) */
.ds{margin-top:8px}
.dbx{--ch:7px; border:1px solid var(--line); border-top:0; border-radius:0 0 3px 3px;
  clip-path:polygon(var(--ch) 0, calc(100% - var(--ch)) 0, 100% var(--ch), 100% 100%, 0 100%, 0 var(--ch))}   /* the side lines start where the angled corner meets them */
.ds > .dbx:first-child{--ch:9px}
.dbx.dft{clip-path:none}
.ds .dbx + .dbx{margin-top:14px}
.dbx.dft{border-top:1px solid var(--line); border-radius:3px}
.dh2, .ds .dbx > .wh.both, .ds .dbx > .ab.pf > summary{margin:0 -1px; background:var(--ds-h2); clip-path:polygon(7px 0, calc(100% - 7px) 0, 100% 7px, 100% 100%, 0 100%, 0 7px)}
.dh2{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:2px 8px; padding:8px 11px 6px}
.ds .dbx > .wh.both{padding:8px 11px 6px}
.dh2 > span:first-child, .ds .dbx > .wh.both .n, .ds .dbx > .ab.pf > summary b.kh{font:700 14.5px/1.15 var(--f-head); letter-spacing:.07em; text-transform:uppercase; color:var(--ds-h2-fg)}
.ds .dbx > .wh.both > span:not(.n){color:var(--ds-h2-col)}
.dh2 + .mods, .dh2 + .abl{border-top:0}
.ds .dbx > .ab.pf{border-top:0}
.dsh{display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:2px 12px; margin:0 -1px; padding:7px 12px 6px;
  background:var(--ds-band); color:var(--ds-band-fg); clip-path:polygon(9px 0, calc(100% - 9px) 0, 100% 9px, 100% 100%, 0 100%, 0 9px)}
.dpts{font:700 15px/1.15 var(--f-head); letter-spacing:.06em; text-transform:uppercase; white-space:nowrap}
.dsn{flex:1 1 auto; min-width:0; text-align:left; font:700 15px/1.15 var(--f-head); letter-spacing:.08em; text-transform:uppercase}
.dpts{margin-left:auto}
.dsm{display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 10px; padding:5px 10px; font-size:12.5px; line-height:1.35; color:var(--muted)}
.dhd, .ds .st > span.h, .ds .wh.both > span, .ds .wh.both .n, .dk{font:500 12.5px/1.2 var(--f-body); letter-spacing:0; text-transform:none; color:var(--ds-head-fg)}
.dhd{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:2px 8px; padding:5px 10px 4px; background:var(--ds-head)}
.dhd .lbn{margin:0; font:inherit; font-size:12px}
.ds .mdl .dhd, .ds .ml{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:0 10px}
.ds .ml{padding:5px 10px; border-top:1px solid var(--line); font-size:13.5px; line-height:1.3}
.ds .dhd + .ml{border-top:0}
.ds .mn{font-weight:600}
.ds .mg{display:block; font-size:13px; color:var(--fg2)}
.ds .mlt{display:block; margin:1px 0 0; font-size:13px}
.ds .mlt::before{content:'• '; color:var(--muted)}
.ds .st{border-radius:0; background:none}
.ds .st > span{display:flex; align-items:center; justify-content:center; padding:5px 0; font:700 17px/1 var(--f-head); border-top:1px solid var(--line)}
.ds .st > span.h{padding:5px 0 4px; border-top:0; background:var(--ds-head)}
.ds .st > span.h.n{justify-content:flex-start; padding-left:10px}
.ds .st > span.n{flex-direction:column; align-items:flex-start; gap:1px; padding:4px 4px 4px 10px}
.ds .st > span.n b{font:600 14.5px/1.15 var(--f-head); letter-spacing:.01em}
.ds .st > span.n .x{margin-left:6px; font-size:13px}
.ds .st > span.n small{font:500 11.5px/1.1 var(--f-body); color:var(--muted)}
.dnt{padding:0 10px 7px; border-top:1px solid var(--line)}
.dnt:empty{display:none}
.dnt > :first-child{margin-top:6px}
.ds .wh.both{padding:5px 10px 4px; background:var(--ds-head); box-shadow:none}
.ds .wh.both .n{white-space:nowrap}
.ds .wb, .ds .wb:has(> .wr .x){padding:5px 10px 4px}
.ds .who{display:block; justify-self:stretch; margin:0; padding:5px 10px 3px; border:0; border-top:1px solid var(--line); border-radius:0; background:var(--surface); font:600 12.5px/1.2 var(--f-head); letter-spacing:.08em; color:var(--fg2)}
.ds .who + .wb{border-top:0}
.ds .wj{margin:1px 10px}
.ds .use{padding:4px 10px 3px}
.ds .mods{margin:0; padding:7px 10px 8px; border-top:1px solid var(--line)}
.ds .mods.all{margin:0}
.ds .msep{margin:4px 0 1px}
.ds .mod{font-size:12.5px} .ds .mod b{font-weight:600}
.ds .ab.pf{border-bottom:0; border-top:1px solid var(--line)}
.ds .ab.pf > summary{padding:4px 10px; background:var(--ds-head)}
.ds .ab.pf > summary b.kh{font:500 12.5px/1.2 var(--f-body); letter-spacing:0; text-transform:none; color:var(--ds-head-fg)}
.ds .ab.pf .wh.both{background:none; padding-top:4px}
.ds .abl{border-top:0}
.ds .ab > summary{padding:4px 10px; min-height:38px}
.ds .ab > .body{padding:0 10px 10px}
.ds .abl .ab:last-child{border-bottom:0}
.awho{font-size:13px; color:var(--muted)}
.ds .an .awho{margin-left:-3px}
.dft{border-top:1px solid var(--line)}
.dkv{display:grid; grid-template-columns:86px minmax(0,1fr)}
.dkv + .dkv{border-top:1px solid var(--line)}
.dk{padding:7px 6px 6px 10px; background:var(--ds-head)}
.dv{min-width:0; padding:5px 10px 6px; font-size:14px; line-height:1.5}
.dv p{margin:0} .dv p + p{margin-top:2px}
.dv .sln{font:600 11.5px/1.2 var(--f-head); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-right:4px}
.dv .link{white-space:nowrap}
.pills{display:flex; flex-wrap:wrap; gap:5px; padding:2px 0}
.pill{display:inline-block; padding:4px 9px 3px; border-radius:999px; background:var(--surface2); box-shadow:inset 0 0 0 1px var(--pill-line); font:600 12px/1.2 var(--f-head); letter-spacing:.06em; text-transform:uppercase; color:var(--fg2)}
.kwn{display:block; margin-top:4px; font-size:12px; line-height:1.35; color:var(--muted)}
@media (max-width:359px){
  .ds .st > span{font-size:16px}
  .ds .st > span.h{font-size:11px}
  .ds .st > span.n{padding-left:8px}
  .dhd, .ds .wh.both, .ds .wb, .ds .wb:has(> .wr .x), .ds .ml, .ds .ab > summary, .ds .ab > .body, .dsm, .ds .mods, .ds .who, .dnt, .dv{padding-left:8px; padding-right:8px}
  .ds .wh.both > span{font-size:11px}
  .dkv{grid-template-columns:74px minmax(0,1fr)}
  .ds .ml{grid-template-columns:minmax(0,1fr)}
  .ds .mdl .dhd{display:flex}
  .ds .wh.both .n{font-size:12px}
  .ds .dbx > .wh.both .n{font-size:13px; white-space:normal}
  .ds .dbx > .wh.both, .dh2{padding-left:9px; padding-right:9px}
  .dk{padding-left:8px}
}
/* every band (the unit's, a section's, a role's on the Units list) is lit from its top edge in the accent */
.ds .dsh, .dh2, .ds .dbx > .wh.both, .ds .dbx > .ab.pf > summary, .rgh{background-image:var(--ds-edge)}
/* slice screens: one band per unit, pinned until the next unit's band pushes it off */
.us{padding-bottom:4px}
.band{position:sticky; top:var(--top); z-index:4; display:flex; align-items:baseline; gap:8px; width:100%; min-height:40px; margin-top:12px; padding:9px 10px 8px;
  background:var(--surface2); text-align:left; border-radius:6px}
.band b{font:700 16.5px/1.15 var(--f-head); letter-spacing:.02em}
.band{flex-wrap:nowrap; row-gap:2px}
.band b{min-width:0}
.band .tgs{flex:1 1 auto; min-width:0; display:flex; flex-wrap:wrap; gap:0 8px}
.band .tgs .tg{white-space:normal}
.band .go{align-self:center; color:var(--accent); flex:none; margin-left:auto}
.slice > .us:first-child .band{margin-top:4px}
.band + .wt, .band + .al{margin-top:4px}
.subbar .wh{padding-bottom:0}
/* abilities */
.al > div{padding:7px 0; border-top:1px solid var(--line)}
.al > div:first-child{border-top:0; padding-top:2px}
.al .ah{display:flex; flex-wrap:wrap; align-items:baseline; gap:1px 8px; margin-bottom:2px}
.al .ah b{font:700 16px/1.2 var(--f-head); letter-spacing:.02em}
.al .rt{font-size:14.5px; line-height:1.4}
.kwline{font-size:14px; line-height:1.5; color:var(--muted)}

/* ---------- stratagems ---------- */
.tools{display:flex; justify-content:flex-end; margin:2px 0 -8px}
.qh{margin:10px 0 3px; font:700 12px/1.2 var(--f-head); letter-spacing:.09em; text-transform:uppercase; color:var(--fg)}
.qh:first-child{margin-top:2px}
.qol{margin:0; padding-left:20px}
.qtab{display:grid; grid-template-columns:auto 1fr; gap:2px 14px; font-variant-numeric:tabular-nums}
.qtab span:nth-child(odd){font:700 15px/1.35 var(--f-head); color:var(--accent)}
.row .c.on{color:var(--accent)}
.verif{display:flex; align-items:center; gap:10px; width:100%; margin-top:14px; padding:10px 10px; border-radius:6px; background:var(--surface); text-align:left; font-size:13.5px; line-height:1.35; color:var(--fg2)}
.verif .ic{width:22px; height:22px; color:var(--ok); flex:none}
.verif b{color:var(--fg); font-weight:600}
.verif > span{flex:1; min-width:0; white-space:normal}
.vchk{margin:3px 0; font-size:14px; line-height:1.45}
.vchk b{font-weight:600}
/* home: filters, random army */
.hfs{display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 2px}
.hfc{display:inline-flex; align-items:center; gap:3px; min-height:36px; max-width:100%; padding:0 6px 0 11px; border-radius:18px; box-shadow:inset 0 0 0 1px var(--line); background:var(--surface);
  font:700 13.5px/1 var(--f-head); letter-spacing:.06em; text-transform:uppercase; color:var(--fg2)}
.hfc span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0}
.hfc.on{background:var(--accent); color:var(--accent-ink); box-shadow:none}
.hfc.on .chev{color:inherit}
.hfc:active{opacity:.75}
.hfx{min-height:36px; padding:0 8px; font:700 13.5px/1 var(--f-head); letter-spacing:.06em; text-transform:uppercase; color:var(--accent)}
.hlh{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:12px 0 4px}
.hlh .grp-h{margin:0}
.hfn{margin-left:6px; color:var(--muted); letter-spacing:.06em}
.rnd{display:inline-flex; align-items:center; gap:6px; min-height:36px; margin:0 -4px 0 0; padding:0 6px; font:700 13.5px/1 var(--f-head); letter-spacing:.06em; text-transform:uppercase; color:var(--accent)}
.rnd .ic{width:18px; height:18px}
.rnd:active{opacity:.6}
.hfl .row{padding-right:4px}
.hfl .row[disabled]{opacity:.4}
.hfl .row .ic{width:20px; height:20px}
.hfl .row .ok{color:var(--accent)}
.hfl .row.on b{color:var(--accent)}
.reel{position:relative; height:192px; margin:14px 0 4px; overflow:hidden; border-radius:8px; background:var(--surface);
  -webkit-mask-image:linear-gradient(transparent, #000 30%, #000 70%, transparent); mask-image:linear-gradient(transparent, #000 30%, #000 70%, transparent)}
.reel::after{content:""; position:absolute; left:0; right:0; top:64px; height:64px; box-shadow:inset 0 1px 0 var(--accent), inset 0 -1px 0 var(--accent); pointer-events:none; transition:background .3s}
.reel.hit::after{background:color-mix(in srgb, var(--accent) 14%, transparent)}
.rs{will-change:transform}
.ri{height:64px; display:grid; align-content:center; justify-items:center; gap:3px; padding:0 12px; text-align:center}
.ri b{font:700 21px/1.1 var(--f-head); letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%}
.ri span{font:600 12px/1 var(--f-head); letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.rres{min-height:1px; position:absolute; width:1px; overflow:hidden; clip:rect(0 0 0 0)}
.racts{display:grid; gap:8px; margin-top:14px}
.btn{min-height:48px; padding:0 14px; text-align:center; border-radius:8px; background:var(--accent); color:var(--accent-ink); font:700 16px/1.1 var(--f-head); letter-spacing:.04em}
.btn2{min-height:44px; padding:0 14px; text-align:center; border-radius:8px; box-shadow:inset 0 0 0 1px var(--line); color:var(--fg); font:700 15px/1 var(--f-head); letter-spacing:.06em; text-transform:uppercase}
.btn:active, .btn2:active{opacity:.75}
/* damage calculator: the sentence, the answer (pinned), what changes it */
.dmsen{margin-top:8px}
.dml1{display:grid; grid-template-columns:44px minmax(0,1fr); align-items:center; column-gap:6px}
.dmwd{font:600 12px/1 var(--f-head); letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.dmtok{display:flex; align-items:center; gap:8px; min-height:46px; padding:6px 0; border-bottom:1px solid var(--line); text-align:left; min-width:0}
.dmtok b{flex:1; min-width:0; font:700 21px/1.12 var(--f-head); letter-spacing:.01em; text-decoration:underline dotted; text-decoration-color:var(--accent); text-underline-offset:4px}
.dmtok.empty b{color:var(--accent); text-decoration:none}
.dmtok:active{background:var(--surface)}
.dmvb{padding:8px 0}
.dmvb > :nth-child(2){justify-self:start}
.dmverb{display:inline-flex; border-radius:8px; box-shadow:inset 0 0 0 1px var(--line); overflow:hidden}
.dmverb button{min-height:38px; padding:0 16px; font:700 14px/1 var(--f-head); letter-spacing:.06em; text-transform:uppercase; color:var(--fg2)}
.dmverb button + button{box-shadow:inset 1px 0 0 var(--line)}
.dmverb button.on{background:var(--accent); color:var(--accent-ink)}
.dmvb{grid-template-columns:44px auto 1fr}
.dmswap{justify-self:end; display:inline-flex; align-items:center; gap:5px; min-height:38px; padding:0 2px 0 8px; font:700 13px/1 var(--f-head); letter-spacing:.06em; text-transform:uppercase; color:var(--accent)}
.dmswap .ic{width:17px; height:17px}
.dmswap[disabled]{color:var(--muted); opacity:.6}
.dmts{margin:4px 0 0 50px; font-size:12.5px; line-height:1.35; color:var(--muted)}
.dmans{position:sticky; top:var(--top); z-index:5; margin:12px -6px 0; padding:9px 12px 10px; border-radius:10px; background:var(--surface); box-shadow:0 1px 0 var(--line), 0 8px 18px rgba(0,0,0,.28)}
.dmans.static{position:static}
.dmctx{display:none; margin:0 0 2px; font:600 12px/1.2 var(--f-head); letter-spacing:.04em; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.dmans.stuck .dmctx{display:block}
.dmans.stuck .dmbig > b{font-size:38px}
.dmans.stuck .dmab{min-height:34px; padding-top:3px; padding-bottom:3px}
.dmans.stuck .dmab small{display:none}
.dmans.stuck .dmab#dmBackBtn small{display:block}
.dmans.stuck .dmacts2{margin-top:7px}
.dmbig{display:flex; align-items:baseline; gap:10px; width:100%; text-align:left}
.dmbig > b{font:700 46px/.95 var(--f-head); color:var(--accent); font-variant-numeric:tabular-nums}
.dmbig > b.chg{animation:dmflash .7s ease-out}
@keyframes dmflash{0%{color:var(--fg); transform:scale(1.06)} 100%{color:var(--accent); transform:none}}
.dmbig > span{min-width:0; font:700 17px/1.15 var(--f-head); letter-spacing:.02em}
.dmbig > span small{display:block; margin-top:2px; font:400 12.5px/1.3 var(--f-body); letter-spacing:0; color:var(--muted)}
.dmchar{margin-top:5px; font-size:13px; line-height:1.35; color:var(--fg2)}
.dmchar b{color:var(--accent); font:700 14px var(--f-head)}
.dmmsg{font-size:14.5px; line-height:1.45; color:var(--fg2)}
.dmchips{display:flex; flex-wrap:wrap; align-items:center; gap:5px; margin-top:8px}
.dmchip{display:inline-flex; align-items:center; gap:4px; max-width:100%; min-height:28px; padding:3px 9px; border-radius:999px; background:var(--accent); color:var(--accent-ink);
  font:700 12px/1.15 var(--f-head); letter-spacing:.04em; text-align:left}
.dmchip i{font-style:normal; font-size:14px; opacity:.7; margin-right:-2px}
.dmchip.auto{background:none; color:var(--fg); box-shadow:inset 0 0 0 1.5px var(--accent)}
.dmchip.info, .dmchip.none{background:var(--surface2); color:var(--fg2)}
.dmchip.none{font-weight:600}
.dmnc, .dmreset{min-height:28px; padding:0 4px; font:700 12px/1 var(--f-head); letter-spacing:.06em; text-transform:uppercase; color:var(--accent)}
.dmreset{margin-left:auto; color:var(--muted)}
.dmacts2{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:9px}
.dmab{display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; column-gap:4px; min-height:42px; padding:5px 8px 5px 10px; border-radius:8px; background:var(--surface2); text-align:left}
.dmab span{font:700 14px/1.1 var(--f-head); letter-spacing:.05em; text-transform:uppercase}
.dmab small{grid-column:1; font-size:12px; line-height:1.2; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.dmab .chev{grid-column:2; grid-row:1 / span 2; transform:rotate(-90deg)}
.dmab:active{background:var(--line)}
.dmacts{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
.dmacts .btn, .dmacts .btn2{flex:1 1 140px}
.dmh{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin:20px 0 2px; font:700 15.5px/1.1 var(--f-head); letter-spacing:.1em; text-transform:uppercase; color:var(--fg)}
.dmh small{font:600 11px/1 var(--f-head); letter-spacing:.08em; color:var(--muted)}
.dmh3{display:flex; align-items:baseline; gap:8px; margin:16px 0 0; padding-bottom:5px; border-bottom:1px solid var(--line); font:700 12.5px/1.2 var(--f-head); letter-spacing:.1em; text-transform:uppercase; color:var(--fg2)}
.dmh3 small{font:500 12px/1.2 var(--f-body); letter-spacing:0; text-transform:none; color:var(--muted)}
.dmsec .dmh3{margin-top:14px}
.dmlv{display:grid; grid-template-columns:20px minmax(0,1fr) auto; align-items:start; gap:0 10px; width:100%; padding:9px 2px 9px; border-bottom:1px solid var(--line); text-align:left}
.dmlv:active{background:var(--surface)}
.dmlv .ck{width:20px; height:20px; margin-top:1px; border-radius:5px; box-shadow:inset 0 0 0 1.5px var(--muted); display:grid; place-items:center}
.dmlv.on .ck{background:var(--accent); box-shadow:none}
.dmlv.on .ck::after{content:''; width:10px; height:5px; margin-top:-3px; border:solid var(--accent-ink); border-width:0 0 2.5px 2.5px; transform:rotate(-45deg)}
.dmlv.rad .ck{border-radius:50%}
.dmlv.rad.on .ck{background:none; box-shadow:inset 0 0 0 2px var(--accent)}
.dmlv.rad.on .ck::after{width:10px; height:10px; margin:0; border:0; border-radius:50%; background:var(--accent); transform:none}
.dmlv .lb{display:grid; gap:2px; min-width:0}
.dmlv .lb b{font:700 15.5px/1.2 var(--f-head); letter-spacing:.02em}
.dmlv .lb small{font-size:12.5px; line-height:1.35; color:var(--muted)}
.dmlv .lb small .warn{color:var(--fg2)}
.dmlv .why{display:flex; flex-wrap:wrap; gap:2px 6px; align-items:baseline; color:var(--fg2)}
.dmlv .why:empty{display:none}
.dmlv .why .nw2{color:var(--fg2); font-style:italic}
.sd{display:inline-block; padding:1px 4px 0; border-radius:4px; box-shadow:inset 0 0 0 1px var(--line); font:600 10.5px/1.3 var(--f-head); letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.dmlv .fx{display:grid; justify-items:end; align-content:start; min-width:50px; padding-top:1px; text-align:right}
.fxv{font:700 19px/1 var(--f-head); font-variant-numeric:tabular-nums; color:var(--fg)}
.fxv.up{color:var(--accent)}
.fxv.z{color:var(--muted)}
.fxv.est{opacity:.55}
.fxv.wait{color:var(--muted); letter-spacing:.1em}
.fxv.now{font:700 11px/1.6 var(--f-head); letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.dmlv .fx small.alt{color:var(--fg2); letter-spacing:.03em}
.dmlv .fx small{margin-top:2px; font:600 10.5px/1.1 var(--f-head); letter-spacing:.05em; text-transform:uppercase; color:var(--muted); white-space:nowrap}
.best{display:inline-block; margin-top:3px; padding:2px 5px 1px; border-radius:4px; background:var(--accent); color:var(--accent-ink); font:700 10px/1.1 var(--f-head); font-style:normal; letter-spacing:.06em; text-transform:uppercase; white-space:nowrap}
.dmprof{display:flex; flex-wrap:wrap; align-items:center; gap:6px; padding:2px 2px 10px 30px; border-bottom:1px solid var(--line); margin-top:-4px}
.dmpl{flex-basis:100%; font:600 10.5px/1.2 var(--f-head); letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.dmpp{display:grid; justify-items:start; gap:1px; min-height:42px; padding:5px 10px; border-radius:8px; box-shadow:inset 0 0 0 1px var(--line); text-align:left}
.dmpp b{font:700 14px/1.1 var(--f-head); letter-spacing:.02em}
.dmpp em{display:flex; align-items:baseline; gap:5px; font-style:normal}
.dmpp em .fxv{font-size:14px}
.dmpp em .best{margin:0}
.dmpp.on{background:var(--surface2); box-shadow:inset 0 0 0 2px var(--accent)}
.dmpp.dis{opacity:.45}
.dmpp.dis em{font-size:11.5px; color:var(--muted)}
.dmouts{padding:6px 2px 2px}
.dmgl{margin:4px 0 2px; font:600 11px/1.2 var(--f-head); letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.dmout{margin:0; padding:3px 0; font-size:12.5px; line-height:1.35; color:var(--muted)}
.dmout b{font:600 13.5px/1.2 var(--f-head); letter-spacing:.02em; color:var(--fg2)}
.dmnone{margin:6px 0 2px}
.dmfold{border-bottom:1px solid var(--line); margin-top:14px}
.dmfold > summary{display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:40px; padding:4px 2px; border-top:1px solid var(--line); font:600 12.5px/1.2 var(--f-head); letter-spacing:.08em; text-transform:uppercase; color:var(--fg2)}
.dmfold + .dmfold{margin-top:0}
.dmfold + .dmfold > summary{border-top:0}
.dmfold[open] > summary .chev{transform:rotate(180deg)}
.dmfold > .note{margin:0 0 6px}
.dmncr{display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 6px; padding:6px 2px; border-top:1px solid var(--line)}
.dmncr b{font:700 14.5px/1.2 var(--f-head); letter-spacing:.02em}
.dmncr small{flex-basis:100%; font-size:12.5px; line-height:1.35; color:var(--muted)}
.dmman{display:grid; gap:6px; padding:6px 0 10px}
.dmstep{display:flex; align-items:center; gap:6px}
.dmstep > span{flex:1; font:600 15px/1.2 var(--f-head); letter-spacing:.02em}
.dmstep > b{min-width:38px; text-align:center; font:700 16px var(--f-head)}
.dmstep button, .dmpf button{min-height:34px; min-width:36px; padding:0 10px; border-radius:6px; box-shadow:inset 0 0 0 1px var(--line); font:700 13px/1 var(--f-head); letter-spacing:.04em; color:var(--fg2)}
.dmstep button.rr.on, .dmpf button.on{background:var(--accent); color:var(--accent-ink); box-shadow:none}
.dmpf{display:flex; flex-wrap:wrap; gap:6px; padding:8px 0}
.dmtyg{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; padding:8px 0 2px}
.dmst{display:grid; grid-template-columns:34px minmax(0,1fr) 34px; align-items:center; gap:2px; padding:4px; border-radius:8px; background:var(--surface)}
.dmst > span{grid-column:1 / -1; font:600 10.5px/1.2 var(--f-head); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.dmst > b{text-align:center; font:700 18px/1 var(--f-head)}
.dmst button{min-height:36px; border-radius:6px; background:var(--surface2); font:700 18px/1 var(--f-head); text-align:center}
.dmst button:active{background:var(--line)}
/* the popups */
.dmbars{display:grid; gap:3px; margin:6px 0 4px}
.dmbar{display:grid; grid-template-columns:52px minmax(0,1fr) 40px; align-items:center; gap:8px; font:600 13px/1.2 var(--f-head); font-variant-numeric:tabular-nums}
.dmbar .k{color:var(--fg2)}
.dmbar .tr{height:10px; border-radius:0 4px 4px 0; background:var(--surface2)}
.dmbar i{display:block; height:100%; border-radius:0 4px 4px 0; background:var(--accent)}
.dmbar .v{text-align:right; color:var(--fg)}
.dmwn{margin-top:2px}
.dmwk{display:grid; margin-top:6px; font-variant-numeric:tabular-nums}
.dmwh, .dmr > summary, .dmr.out{display:grid; grid-template-columns:minmax(0,1fr) repeat(5, 38px); gap:0 4px; align-items:baseline}
.dmwh span{font:600 10.5px/1.2 var(--f-head); letter-spacing:.06em; text-transform:uppercase; color:var(--muted); text-align:right}
.dmr{border-bottom:1px solid var(--line)}
.dmr > summary, .dmr.out{padding:7px 2px; font:600 13px/1.3 var(--f-head); color:var(--fg2)}
.dmr > summary > span:not(.n){text-align:right}
.dmr .n{color:var(--fg); overflow-wrap:anywhere}
.dmr .n small{display:block; font:400 11.5px/1.3 var(--f-body); color:var(--muted)}
.dmr.out .n{grid-column:1 / -1}
.dmr[open] > summary .n{color:var(--accent)}
.dmr > .body{padding:0 2px 8px; font-size:13.5px; line-height:1.42}
.dmr > .body p{margin:0 0 5px}
.dmr > .body b{font-weight:700; color:var(--fg)}
.dmr.tot > summary{color:var(--fg); font-weight:700}
.dmhow{margin-top:14px; border-top:1px solid var(--line)}
.dmhow .dmh{margin:0 0 7px; font-size:13.5px}
.dmhow .dmh b{color:var(--fg2)}
.dmbk{display:flex; align-items:baseline; gap:10px; padding:8px 0; border-bottom:1px solid var(--line)}
.dmbk b{font:700 34px/1 var(--f-head); color:var(--accent)}
.dmbk + .dmbk b{color:var(--fg2); font-size:26px}
.dmbk span{font:700 15px/1.2 var(--f-head); letter-spacing:.02em}
.dmbk small{display:block; font:400 12.5px/1.3 var(--f-body); color:var(--muted)}
.dmopp{display:flex; align-items:center; gap:10px; margin:0 0 4px; font-size:13.5px; color:var(--fg2)}
.dmopp span{flex:1; min-width:0}
.dmq{margin:4px 0 10px}
.dmgrp .grp-h{margin-top:12px; padding-bottom:4px}
@media (max-width:359px){
  .dml1{grid-template-columns:38px minmax(0,1fr)}
  .dmvb{grid-template-columns:38px auto 1fr}
  .dmts{margin-left:44px}
  .dmtok b{font-size:19px}
  .dmverb button{padding:0 12px}
  .dmswap span{font-size:12px}
  .dmbig > b{font-size:40px}
  .dmlv{gap:0 8px}
  .dmlv .fx{min-width:44px}
  .dmtyg{grid-template-columns:repeat(2, minmax(0,1fr))}
}
/* rules questions */
.tbr{justify-self:end; display:flex; align-items:center; gap:2px}
.tbr .icon-btn{margin-right:-4px}
.askctx{font-size:12.5px; color:var(--muted); margin:0 0 8px}
.askway{margin:12px 0; padding:12px; border:1px solid var(--line); border-radius:10px}
.askway b{display:block; font:700 16px/1.2 var(--f-head); letter-spacing:.02em}
.askway .note{margin:4px 0 10px}
a.btn.askclaude{display:inline-flex; align-items:center; justify-content:center; text-decoration:none}
.askwait{display:flex; align-items:center; gap:9px; font-size:14px; color:var(--muted)}
.askwait.sm{font-size:12.5px; margin-top:4px}
.askspin{width:20px; height:20px; flex:none; color:var(--accent); animation:askspin 1.4s linear infinite, askpulse 1.4s ease-in-out infinite}
.askwait.sm .askspin{width:14px; height:14px}
@keyframes askspin{to{transform:rotate(360deg)}}
@keyframes askpulse{50%{opacity:.4}}
@media (prefers-reduced-motion: reduce){.askspin{animation:none}}
.btn.stop{background:var(--surface2); color:var(--fg)}
.askref{display:flex; align-items:center; gap:8px; margin:14px 0 4px; padding:8px 0; font:600 15px var(--f-head); letter-spacing:.02em; color:var(--accent)}
.askref .ic{width:18px; height:18px}
.askrefs{display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin:4px 0 8px}
.askrefs .pill{display:inline-flex; align-items:center; gap:2px}
.askrefs .x{padding:0 2px 0 6px; font-size:16px; line-height:1; color:var(--muted)}
.askon{display:block; font-size:12px; font-weight:500; opacity:.85; margin-bottom:2px}
.askm{margin:8px 0; padding:9px 11px; border-radius:10px; font-size:15px; line-height:1.45}
.askm.q{margin-left:15%; background:var(--accent); color:var(--accent-ink); font-weight:600}
.askm.a{margin-right:4%; background:var(--surface2)}
.askm.a .rt p{margin:0 0 6px}
.askm.a .qh{margin-top:8px}
.askm.a ol, .askm.a ul{margin:4px 0 6px; padding-left:20px}
.askerr{color:var(--bad, #e66); margin:0}
.askin{display:grid; grid-template-columns:1fr auto; gap:8px; align-items:end; margin-top:10px}
.askin textarea{width:100%; min-height:64px; resize:vertical; padding:9px 10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--fg); font:16px/1.35 var(--f-body)}
.askkey{display:grid; grid-template-columns:1fr auto; gap:8px; margin-top:8px}
.askkey input{min-height:44px; padding:0 10px; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--fg); font:16px var(--f-body)}
/* colour picker */
.thg{margin:10px 0 6px; font-size:12.5px; color:var(--muted)}
.thms{display:grid; grid-template-columns:repeat(auto-fill, minmax(92px, 1fr)); gap:8px}
.thm{display:grid; gap:4px; padding:5px; border-radius:8px; box-shadow:inset 0 0 0 1px var(--line); text-align:left}
.thm.on{box-shadow:inset 0 0 0 2px var(--accent)}
.thm:active{background:var(--surface)}
.thm .sw{position:relative; display:grid; gap:3px; padding:5px; border-radius:5px; box-shadow:inset 0 0 0 1px rgba(127,127,127,.25)}
.thm .sw i{height:11px; clip-path:polygon(4px 0, calc(100% - 4px) 0, 100% 4px, 100% 100%, 0 100%, 0 4px)}
.thm .sw em{position:absolute; right:8px; bottom:7px; width:9px; height:9px; border-radius:50%}
.thm .tn{font:600 12.5px/1.15 var(--f-head); letter-spacing:.02em; color:var(--fg2)}
.thm.on .tn{color:var(--fg)}
.lead{margin:12px 0 10px; font-size:14.5px; line-height:1.45; color:var(--fg2)}
/* the bar in five equal fifths, edge to edge (the bar's side padding taken back), each icon in the middle of its fifth */
.tabs{display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); margin:0 calc(-1 * max(16px, env(safe-area-inset-right, 0px))) 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px)))}
.tabs button{position:relative; display:grid; justify-items:center; gap:2px; min-height:50px; padding:5px 0 3px; border-radius:8px; font:700 11px/1 var(--f-head); letter-spacing:.06em; text-transform:uppercase; color:var(--muted); min-width:0}
/* the five cells drawn: a hairline between neighbours, the open tab's cell tinted, so the eye measures cells, not the gaps between words of different lengths */
.tabs button + button::before{content:''; position:absolute; left:0; top:12px; bottom:12px; border-left:1px solid var(--line)}
.tabs button.on{background:var(--surface)}
.tabs button.on::before, .tabs button.on + button::before{display:none}
.tabs button span{max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
@media (max-width:340px){ .tabs button{letter-spacing:.02em; font-size:10.5px} }
.tabs button .ic{width:22px; height:22px}
.tabs button.on{color:var(--accent)}
.tabs button:active{background:var(--surface)}
.flips{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:16px 0 4px}
.flip{min-height:48px; padding:6px 10px; border-radius:6px; background:var(--surface); font:700 14px/1.15 var(--f-head); letter-spacing:.03em; color:var(--fg2)}
.flip.p{text-align:left}
.flip.n{text-align:right; grid-column:2}
.ticks{display:inline-flex; align-items:center; gap:6px; margin:0 8px 0 0; vertical-align:-6px}
.ticks i{font:600 11px/1 var(--f-body); font-style:normal; color:var(--muted)}
.tick{display:inline-grid; place-items:center; width:30px; height:30px; border-radius:6px; box-shadow:inset 0 0 0 1.5px var(--line); font:700 15px/1 var(--f-body); color:var(--accent-ink)}
.tick.on{background:var(--accent); box-shadow:none}
.ab > summary .an .ticks{flex-basis:100%; margin:4px 0 2px; vertical-align:0}
.tl{display:flex; align-items:flex-start; gap:8px; padding:2px 0}
.tl > .ticks{flex:none; margin:0; vertical-align:0; min-width:66px}
.tl > span{flex:1; min-width:0; padding-top:1px}
.sec-h .textbtn{margin-left:auto}
.textbtn{min-height:40px; font:700 12.5px/1 var(--f-head); letter-spacing:.07em; text-transform:uppercase; color:var(--accent)}
.sec-h{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:16px 0 4px}
.sec-h h2{margin:0}
.sec-h .c{font:600 13px var(--f-head); color:var(--muted)}
.strat{border-bottom:1px solid var(--line)}
.strat > summary, .shead{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:10px; align-items:center; padding:7px 2px; min-height:48px}
.strat > summary:active, .xp > summary:active{background:var(--surface)}
.cp{width:32px; height:32px; border-radius:7px; background:var(--surface2); display:grid; place-content:center; text-align:center; font:700 17px/1 var(--f-head); font-variant-numeric:tabular-nums}
.cp small{display:block; font-size:9px; letter-spacing:.1em; color:var(--muted); margin-top:1px}
.cp.hot{background:var(--accent); color:var(--accent-ink)}
.cp.hot small{color:var(--accent-ink)}
.sh{display:grid; gap:1px; min-width:0}
.sh b{font:700 16.5px/1.15 var(--f-head); letter-spacing:.02em}
.sh span{font-size:12.5px; color:var(--muted)}
.sb{padding:0 2px 10px 44px; font-size:14.5px; line-height:1.45; display:grid; gap:5px}
.sb > div > .rt, .sb > div > .rt > p:first-child{display:inline}
.sheet .sb{padding:4px 0 0}
.rem{border-left:2px solid var(--accent); padding:2px 0 2px 8px; margin:6px 0; font-size:14px; line-height:1.4}
.dl > div{display:grid; gap:1px; padding:6px 2px; border-bottom:1px solid var(--line); font-size:13.5px; line-height:1.4}
.dl > div:first-child{border-top:1px solid var(--line)}
.dl .link{font:700 15.5px/1.2 var(--f-head); letter-spacing:.02em; justify-self:start; padding:2px 0 8px}
.dl i{font-style:normal; font:600 11px var(--f-head); letter-spacing:.08em; color:var(--muted); margin-right:2px}
.dl .sv{font:700 14.5px var(--f-head); font-variant-numeric:tabular-nums}

/* ---------- rules ---------- */
.xp{border-bottom:1px solid var(--line)}
.xp > summary{display:flex; align-items:center; gap:10px; min-height:44px; padding:7px 2px}
.xp > summary .xh{flex:1; min-width:0; display:grid; gap:1px}
.xp > summary b{font:700 16.5px/1.15 var(--f-head); letter-spacing:.02em}
.xp > summary .xh span{font-size:12.5px; color:var(--muted)}
.xp > .body{padding:0 2px 10px; font-size:14.5px; line-height:1.45}
.xp > .body .sub + .sub{margin-top:10px; padding-top:10px; border-top:1px solid var(--line)}
.xp > .body .sub b.nm{font:700 15.5px/1.2 var(--f-head); letter-spacing:.02em}
.xp > .body .usedby{margin-top:6px}

/* ---------- popup sheet ---------- */
.sheet-host{position:fixed; inset:0; z-index:60}
.sheet-back{position:absolute; inset:0; background:rgba(0,0,0,.55)}
.sheet{position:absolute; left:0; right:0; bottom:0; max-height:82%; display:flex; flex-direction:column; background:var(--surface);
  border-radius:16px 16px 0 0; box-shadow:var(--shadow); outline:none; transform:translateY(var(--drag, 0px)); transition:transform .18s ease}
.sheet.drag{transition:none}
.sh-in{flex:1 1 auto; min-height:0; overflow:auto; overscroll-behavior:contain; padding:8px max(18px, env(safe-area-inset-right, 0px)) 4px max(18px, env(safe-area-inset-left, 0px))}
.sh-foot{flex:none; padding:8px max(18px, env(safe-area-inset-right, 0px)) calc(12px + var(--safe-b)) max(18px, env(safe-area-inset-left, 0px)); border-top:1px solid var(--line)}
.sheet .grab{width:40px; height:4px; border-radius:2px; background:var(--line); margin:4px auto 10px}
.sheet h2{font:700 22px/1.1 var(--f-head); letter-spacing:.02em; margin:4px 0 8px}
.sback{min-height:36px; padding:0 2px; font:700 13px var(--f-head); letter-spacing:.06em; text-transform:uppercase; color:var(--accent)}
.sheet .rt{font-size:15px; line-height:1.45}
.sheet .usedby{margin-top:8px}
.sheet .close{display:flex; align-items:center; justify-content:center; width:100%; min-height:44px; border-radius:10px; background:var(--surface2);
  font:700 14px/1 var(--f-head); letter-spacing:.07em; text-transform:uppercase}
.sheet .close:active{background:var(--line)}
@media (min-width:700px){ .sheet{left:50%; right:auto; width:620px; transform:translateX(-50%) translateY(var(--drag, 0px)); bottom:24px; border-radius:16px} }

.toast{position:fixed; left:50%; bottom:calc(16px + max(var(--bb), var(--safe-b))); transform:translateX(-50%); z-index:70; background:var(--fg); color:var(--bg);
  font:700 15px/1.2 var(--f-head); letter-spacing:.04em; padding:10px 16px; border-radius:10px; opacity:0; pointer-events:none; transition:opacity .2s; max-width:86%; text-align:center}
.toast.show{opacity:1}
.toast.act{pointer-events:auto; display:flex; align-items:center; gap:12px}
.toast .tundo{font:700 13px/1 var(--f-head); letter-spacing:.06em; text-transform:uppercase; color:var(--accent); padding:8px 4px}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }

'use strict';
const D = window.WH_DATA;
const ONLY = D.armies.length === 1 ? D.armies[0] : null;   // one list: the app opens straight into it
const BUILD = window.WH_BUILD || '';      // set by build.js on the installable copy
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const keep = area => ({
  get(k, d){ try { const v = window[area].getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { window[area].setItem(k, JSON.stringify(v)); } catch(e){} }
});
const store = keep('localStorage'), session = keep('sessionStorage');
try { localStorage.removeItem('wh-layout'); } catch(e){}   // left by an earlier version

/* ---------- colour schemes ----------
   Gunmetal is the stylesheet's own look; the others replace some of its colours. The first group keeps the
   dark + orange app and changes the heading bands; the second changes the whole app. Saved on this phone. */
const THEME_VAR = { bg:'--bg', surface:'--surface', surface2:'--surface2', linec:'--line', fg:'--fg', fg2:'--fg2', muted:'--muted', accent:'--accent', accentink:'--accent-ink',
  xline:'--count-line', pline:'--pill-line', band:'--ds-band', bandfg:'--ds-band-fg', h2:'--ds-h2', h2fg:'--ds-h2-fg', col:'--ds-h2-col', head:'--ds-head', headfg:'--ds-head-fg' };
const THEME_DEF = { bg:'#161616', accent:'#ff8a2a', band:'#4c5056', h2:'#2c2e32' };   // Gunmetal, for the swatches
const THEMES = [
  { id:'gunmetal', name:'Gunmetal', v:{} },

function inertRule(name){

  return !!(r && r.needs && !army().units.some(u => matches(r.needs, u)));
}
// an ability that can't be used in this list: the data says why, or it is a Bondsman ability with no ARMIGER
const naReason = ab => ab.na || (/bondsman/i.test(ab.tag || '') && inertRule('Bondsman') ? 'No ARMIGER models in this list' : '');
// rules other units give this one (Ghazghkull's aura, the Dreadherder's re-rolls)
function auraMods(u){
  const out = [];
  for(const src of army().units) for(const m of src.aura || []){
    const self = src === u;
    if((self && m.notSelf) || !matches(m.needs, u)) continue;
    out.push(Object.assign({}, m, { when:self && m.selfWhen ? m.selfWhen : m.when, src }));
  }
  return out;
}
// everything that changes this unit's attacks: its own abilities, detachment rules, auras
// a rule worded for squads ("below Starting Strength") reads in wounds for a one-model unit (r.mod.single):
// {half} = the most wounds it can have left and still be below half-strength
const halfBelow = u => Math.ceil((parseInt(u.stats[0].W, 10) || 0) / 2) - 1;
const singleMod = (m, u) => m.single && modelCount(u) === 1 ? Object.assign({}, m, { when:m.single.when, note:m.single.note.replace('{half}', halfBelow(u)) }) : m;
function unitMods(u, kind){
  const det = unitDetRules(u).filter(r => r.mod).map(r => Object.assign({ from:r.name, rule:r.name }, singleMod(r.mod, u)));
  for(const [k, list] of [['ranged', u.ranged], ['melee', u.melee]]){
    const lance = [...new Set((list || []).filter(w => w.kw.some(x => /^lance/i.test(x))).map(w => w.group || w.name))];
    if(lance.length) det.push({ kind:k, when:'Made a charge move this turn', note:andList(lance) + ' +1 to wound', from:'Lance', rule:'Lance' });
  }
  if(hasKw(u, 'Towering') && !hasKw(u, 'Aircraft') && D.rules['Plunging Fire']) det.push({ kind:'ranged', when:'Visible target within 12" with models on ground level (not AIRCRAFT)', note:'BS improved by 1', from:'Plunging Fire', rule:'Plunging Fire' });
  const strat = allStratagems().filter(s => s.mod && eligible(s).includes(u)).map(s => Object.assign({ from:s.name, strat:s.id, cp:s.cp }, s.mod));
  return (u.mods || []).concat(det, auraMods(u), strat).filter(m => m.kind === kind || m.kind === 'all');
}
// phases and turn: turns can override the turn for one phase ("your Shooting phase or the Fight phase")
const phasesOf = x => x.phases || x.ph || [];
const phTurn = (x, p) => (x.turns && x.turns[p]) || x.turn || 'either';
// start-of-phase rules first, end-of-phase rules last
const timing = text => /^(once per [a-z ]+, )?(at )?(the )?start of/i.test(text || '') ? 0 : /^(once per [a-z ]+, )?(at )?(the )?end of/i.test(text || '') ? 2 : 1;
// "Movement · Their turn", "Any phase · Either turn", "Your Shooting / Fight (either turn)"
function whenTag(x){
  if(x.at) return x.at;
  const ph = phasesOf(x);
  if(!ph.length) return '';
  const t = ph.map(p => phTurn(x, p));
  if(t.every(v => v === t[0])) return (ph.length === PHASES.length ? 'Any phase' : ph.map(p => PHASE_NAME[p]).join(' / ')) + ' · ' + TURN_NAME[t[0]];
  return ph.map((p, i) => t[i] === 'your' ? 'Your ' + PHASE_NAME[p] : t[i] === 'opp' ? 'Their ' + PHASE_NAME[p] : PHASE_NAME[p] + ' (either turn)').join(' / ');
}
// weapons, counting a multi-profile weapon once
function weaponItems(list){
  const items = [];
  for(const w of list || []){
    const last = items[items.length - 1];
    if(w.group && last && last.group === w.group && last.who === w.who) last.profiles.push(w);
    else items.push({ group:w.group, who:w.who, n:w.n, profiles:[w] });
  }
  return items;
}
const weaponCount = (a, kind) => a.units.reduce((t, u) => t + weaponItems(u[kind]).length, 0);
// wargear New Recruit lists for the unit but on no models line (data.js `unplaced`): which models carry it is not said
const unplacedOf = u => (u.unplaced || []).map(name => { const x = [...(u.ranged || []), ...(u.melee || []), ...(u.abilities || [])].find(y => (y.group || y.name) === name) || {};
  const n = +x.n || 1; return { name, n, note:'New Recruit lists ' + (n > 1 ? 'them' : 'it') + ' for the ' + (x.who || u.name) + ', not which model' + (n > 1 ? 's carry them' : ' carries it') }; });
function nameTags(u, opts){
  const t = [];
  if(u.warlord) t.push('<span class="tg">Warlord' + (u.warlordOn ? ' (' + esc(u.warlordOn) + ')' : '') + '</span>');
  if(u.enhancement) t.push('<span class="tg">' + esc(u.enhancement + (u.enhOn ? ' (' + u.enhOn + ')' : '')) + '</span>');
  if(u.leads && !(opts && opts.noLeads)) t.push('<span class="tg m">+ ' + esc(partsAfter(u).join(' + ')) + '</span>');
  if(u.upgrade) t.push('<span class="tg">' + esc(u.upgrade) + '</span>');
  const tw = twinOf(u); if(tw && tw.n > 1) t.push('<span class="tg m">' + tw.i + ' of ' + tw.n + '</span>');
  if(u.copies > 1 && !(opts && opts.noCopies)) t.push('<span class="tg m">×' + esc(u.copies) + ' units</span>');
  return t.join('');
}
const abilityKey = ab => army().id + '|' + ab.name + '|' + ab.text;
// the units that took an enhancement; an UPGRADE (Supa-snazz Dakka) is on the unit it upgrades, the bodyguard
const holders = (a, name) => a.units.filter(u => u.enhancement === name || u.upgrade === name);
// which of several same-named units ("Chaos Terminators (1–2 of 3)"), or how many an entry is ("×2")
const unitNo = u => { const t = twinOf(u); return t && t.n > 1 ? ' (' + t.i + ' of ' + t.n + ')' : u.copies > 1 ? ' ×' + u.copies : ''; };
const holderName = (u, name) => u.upgrade === name && u.leads ? u.leads + ' (' + unitLabel(u) + unitNo(u) + ')' : u.enhOn && name === u.enhancement ? u.enhOn + ' (' + unitLabel(u) + unitNo(u) + ')' : unitLabel(u) + unitNo(u);

/* ---------- rules and rich text ---------- */
function ruleFor(label){
  const f = faction();
  let clean = String(label).replace(/^\[|\]$/g, '').replace(/\*$/, '').trim();
  for(const [re, key] of f.aliases || []) if(re.test(clean)){ clean = key; break; }
  const lc = clean.toLowerCase();
  const ar = f.armyRules.find(r => r.name.toLowerCase() === lc);
  if(ar) return { name:ar.name, key:ar.name, text:ar.text, table:ar.table, tableAt:ar.tableAt, missing:ar.missing, note:ar.note, src:f.name + ' army rule' };
  for(const d of detachments()) if(d.rule && d.rule.name.toLowerCase() === lc) return { name:d.rule.name, key:d.rule.name, text:d.rule.text, table:d.rule.table, tableAt:d.rule.tableAt, needs:d.rule.needs, note:d.rule.note, src:d.name + ' detachment rule' };
  const src = key => (D.ruleSrc || {})[key] || 'Core rule';   // the Orks terms say where they come from
  for(const [re, key] of D.ruleAliases) if(re.test(clean)) return { name:clean, key, text:D.rules[key], src:src(key) };
  if(D.rules[clean]) return { name:clean, key:clean, text:D.rules[clean], src:src(clean) };
  return null;
}
const ruleKey = label => (ruleFor(label) || {}).key;
const mentions = (text, key) => new RegExp('\\b' + key.replace(/[-]/g, '.') + '\\b', 'i').test(text);
// the units in this army a core rule applies to: unit rules, weapon keywords, ability text
const CONCEPT = new Set(D.concepts || []);   // general terms (charge, destroyed…) that every unit "uses"
function ruleUsers(key){
  if(CONCEPT.has(key)) return [];
  return army().units.filter(u => unitRules(u).some(r => ruleKey(r) === key) ||
    [...(u.ranged || []), ...(u.melee || [])].some(w => w.kw.some(k => ruleKey(k) === key) || (w.hunter && key === 'Hunter')) ||
    u.abilities.some(ab => mentions(ab.text, key)));
}
// the units that use a core rule, each saying where it has it when that is only in one of its
// abilities ("Big Mek · Dreadherder (Dreadherder)": its Lone Operative is in that enhancement)
function usersVia(label, key){
  const us = ruleUsers(key);
  if(!us.length) return '';
  const own = u => unitRules(u).some(r => ruleKey(r) === key) || [...(u.ranged || []), ...(u.melee || [])].some(w => w.kw.some(k => ruleKey(k) === key) || (w.hunter && key === 'Hunter'));
  return '<p class="usedby"><span class="il">' + label + '</span>' + us.map(u => { if(own(u)) return unitLink(u);
    const abs = u.abilities.filter(ab => mentions(ab.text, key)).map(ab => ab.name);
    return unitLink(u) + (abs.length ? ' <span class="from">(in ' + esc(abs.join(', ')) + ')</span>' : ''); }).join(', ') + '</p>';
}
// **bold** text; bold terms that name a rule (Deep Strike, riled up, …) open it when tapped; ~~struck~~ text
const inline = s => esc(s).replace(/~~(.+?)~~/g, '<s>$1</s>')
  .replace(/\*\*(.+?)\*\*/g, (m, t) => { const r = ruleFor(t); return r && r.key !== sheetRule ? '<b class="rl" role="button" tabindex="0" data-rule="' + t + '">' + t + '</b>' : '<b>' + t + '</b>'; });
function rt(text){
  const lines = String(text || '').split('\n');
  let html = '', list = [];
  const flush = () => { if(list.length){ html += '<ul>' + list.map(l => '<li>' + inline(l) + '</li>').join('') + '</ul>'; list = []; } };
  for(const raw of lines){
    const l = raw.trim();
    if(!l) continue;
    if(l.startsWith('- ')){ list.push(l.slice(2)); continue; }
    flush();
    html += /^\*[^*].*\*$/.test(l) ? '<p class="it">' + inline(l.slice(1, -1)) + '</p>' : '<p>' + inline(l) + '</p>';
  }
  flush();
  return '<div class="rt">' + html + '</div>';
}
const ttable = t => t.some(([k]) => String(k).length > 8)
  ? '<div class="tlist">' + t.map(([k, v]) => '<div><b>' + esc(k) + '</b>' + rt(v) + '</div>').join('') + '</div>'
  : '<div class="ttable">' + t.map(([k, v]) => '<span>' + esc(k) + '</span><span>' + inline(v) + '</span>').join('') + '</div>';
const unitLink = u => '<span class="link" role="button" tabindex="0" data-unit="' + esc(u.id) + '">' + esc(shortName(u)) + '</span>';
const usedBy = (label, units) => units.length ? '<p class="usedby"><span class="il">' + label + '</span>' + units.map(unitLink).join(', ') + '</p>' : '';

// home filters: one faction, one detachment, one disposition at a time, kept on this phone
// (shown once there are more than two lists)
const HF_KEYS = ['faction', 'det', 'disp'];
const HF_LABEL = { faction:'Faction', det:'Detachment', disp:'Disposition' };
const hfOf = (a, k) => k === 'faction' ? [factionOf(a).name] : k === 'det' ? detachmentsOf(a).map(d => d.name) : a.disposition ? [a.disposition] : [];
function homeFilter(){
  if(D.armies.length <= 2) return {};
  const f = store.get('wh-home-filter'), out = {};
  // a value no list has any more (a list was removed) is dropped
  if(isObj(f)) for(const k of HF_KEYS) if(typeof f[k] === 'string' && D.armies.some(a => hfOf(a, k).includes(f[k]))) out[k] = f[k];

const hfMatch = (a, f, skip) => HF_KEYS.every(k => k === skip || !f[k] || hfOf(a, k).includes(f[k]));

  (Object.keys(f).length ? '<button class="hfx" data-hfclear>Clear</button>' : '') + '</div>';

function showHomeFilter(k){
  const f = homeFilter(), fac = new Map();
  for(const a of D.armies) for(const v of hfOf(a, k)) if(!fac.has(v)) fac.set(v, factionOf(a).name);
  const vals = [...fac.keys()].sort((x, y) => (k === 'det' ? fac.get(x).localeCompare(fac.get(y)) : 0) || x.localeCompare(y));
  const opt = (v, label, sub) => { const n = D.armies.filter(a => hfMatch(a, f, k) && (!v || hfOf(a, k).includes(v))).length, on = (f[k] || '') === v;

      (sub ? '<span>' + esc(sub) + '</span>' : '') + '</span><span class="c">' + n + '</span>' + (on ? '<svg class="ic ok" aria-hidden="true"><use href="#i-check"/></svg>' : '<span class="ic"></span>') + '</button>'; };

// random army: a reel of names that slows down and stops on one of the lists the filters show
function rollArmy(){
  const pool = D.armies.filter(a => hfMatch(a, homeFilter()));
  if(pool.length < 2) return;
  const pick = pool[Math.floor(Math.random() * pool.length)], H = 64;
  const reel = Array.from({ length:26 }, (_, i) => pool[(Math.floor(Math.random() * pool.length) + i) % pool.length]);
  reel.push(pick, pool[(pool.indexOf(pick) + 1) % pool.length]);   // the pick, with a name under it
  const item = a => '<div class="ri"><b>' + esc(a.name) + '</b><span>' + esc(factionOf(a).name) + '</span></div>';
  openSheet('', 'Random army', '<div class="reel" aria-hidden="true"><div class="rs">' + item(pool[pool.length - 1]) + reel.map(item).join('') + '</div></div>' +
    '<p class="rres" aria-live="polite"></p><div class="racts" hidden><button class="btn" data-army="' + esc(pick.id) + '">Open ' + esc(pick.name) + '</button><button class="btn2" data-roll>Roll again</button></div>');
  const strip = $('#sheetIn .rs'), stopAt = -(reel.length - 2) * H;   // the pick sits in the middle row
  const done = () => { $('#sheetIn .reel').classList.add('hit'); $('#sheetIn .rres').textContent = pick.name + ' · ' + factionOf(pick).name; $('#sheetIn .racts').hidden = false; };
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ strip.style.transform = 'translateY(' + stopAt + 'px)'; done(); return; }
  strip.getBoundingClientRect();
  strip.style.transition = 'transform 2.4s cubic-bezier(.12,.62,.16,1)';
  strip.style.transform = 'translateY(' + stopAt + 'px)';
  strip.addEventListener('transitionend', done, { once:true });
}

   change: their InSv 4+ is better") and why it is ticked, unticked or greyed. A choice's effect is the matchup played
   again with that one choice changed, the same 10,000 games, so the number beside it is what the answer becomes when it
   is tapped. The working (calc.js explain) and the return blow ("And back?": in each game what survives strikes back,

   always/vs/defAlways), or when a situation the player ticked is its whole condition (DM_SIT); it starts greyed when
   the target rules it out, and is the player's to tick otherwise; a stratagem is never ticked for them. A rule counts
   only when every word of its footnote is understood (dmEffects, or the numbers the data records for it), and only for

  take(/re-?roll (?:the )?hit (?:rolls? )?and (?:the )?wound rolls?/g, () => { e.rrHit = 'all'; e.rrWound = 'all'; });

  take(/re-?roll (?:the )?hit rolls?/g, () => { e.rrHit = 'all'; });
  take(/re-?roll (?:the )?wound rolls?/g, () => { e.rrWound = 'all'; });

  take(/\+(\d+)" range/g, m => { e.range = (e.range || 0) + +m[1]; });   // every weapon is in range; this moves half range (24.25, 24.30)
  take(/\+(\d) a\b/g, m => { e.a = (e.a || 0) + +m[1]; });
  take(/\+(\d) s\b/g, m => { e.s = (e.s || 0) + +m[1]; });
  take(/\+(\d) ap\b|improve ap by (\d)/g, m => { e.ap = (e.ap || 0) + +(m[1] || m[2]); });
  take(/\+(\d) d\b/g, m => { e.d = (e.d || 0) + +m[1]; });
  take(/\[lethal hits\]/g, () => { e.lethal = true; });
  take(/\[sustained hits (\w+)\]/g, m => { e.sus = m[1].toUpperCase(); });
  take(/\[devastating wounds\]/g, () => { e.dev = true; });
  take(/\[ignores cover\]/g, () => { e.ignoresCover = true; });
  take(/\[twin-linked\]/g, () => { e.twin = true; });
  take(/\[lance\]/g, () => { e.lance = true; });
  take(/\[precision\]/g, () => { e.precision = true; });
  take(/can ignore any or all modifiers to bs and any or all modifiers to the hit roll/g, () => { e.ignoreHitMods = true; });
  take(/\[(?:assault|pistol|hazardous)\]/g, () => {});   // these change nothing in the numbers

  take(/until the end of the (?:turn|phase)|in your shooting phase|in the fight phase|this turn/g, () => {});   // when: the tick box says it

  t = t.replace(/\b(?:and|also|can|have|has|this unit s|ranged|melee|weapons|attacks|rolls)\b|[,;.·]/g, ' ').trim();
  return t || (!empty && !Object.keys(e).length) ? null : e;
}
// a "When targeted" line → numbers for the target, the same way
function dmDefence(text, kind, single){
  const t = String(text || '').replace(/^\d+CP [^:]+: /, '').trim().toLowerCase().replace(/[’']/g, '');
  let m;

  if((m = /^feel no pain (\d)\+ against mortal wounds$/.exec(t))) return { fnpMortal:+m[1] };
  if((m = /^(\d)\+ (?:insv|invulnerable save) against ranged attacks(?: only)?$/.exec(t))) return kind === 'ranged' ? { insv:+m[1] } : {};
  if((m = /^riled up: (\d)\+ inv$/.exec(t))) return { insv:+m[1] };
  if(/^attacks that target this unit have -1 ap$/.test(t)) return { apWorse:1 };
  if(/^fight phase: -1 damage to each attack allocated to it$/.test(t)) return kind === 'melee' ? { dMinus:1 } : {};
  if(single && /^-1 d to each attack allocated to this (?:model|unit)$/.test(t)) return { dMinus:1 };
  // Wrath Beyond Reason: the D of the ranged attacks is worse by 1 for that whole attack (dChar: their [DEVASTATING WOUNDS]
  // mortal wounds too, which the calculator does not do yet: dmCalc leaves it out then)
  if(/^their shooting phase: -1 d to ranged attacks that target it \(until that enemy unit has attacked\)$/.test(t)) return kind === 'ranged' ? { dMinus:1, dChar:true } : {};

const DM_MODEL_RULE = /\bthis model[’']s\b|\bequipped by (?:this model|the bearer)\b|\bthe bearer[’']s\b|\bthis model makes\b/i;

// one model of an attached unit (who), the weapons its words name, the part of an attached unit a "this model" rule
// is on (19.04), the models a models line names ("2× Nob w/ Kustom Krumpa and Paired Krumpas (Paired Krumpas)")

  if(sc.f){
    if(sc.f.kw && !it.profiles.some(p => p.kw.some(k => k.toUpperCase() === sc.f.kw))) return 0;
    if(sc.f.name && !name.toLowerCase().startsWith(sc.f.name)) return 0;
    if(sc.f.char && !(u.leads ? charsOf(u).some(c => c.name === part) : hasKw(u, 'Character'))) return 0;
  }
