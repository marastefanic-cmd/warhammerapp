// the target's models for calc.js: each stats row, how many models have it, its T, W, Sv and InSv, and whether it is
// a CHARACTER (alone in its allocation group, last) or a bodyguard model (its T counts first: 19.02)
function dmModels(u, kind){

  const lone = !u.leads && hasKw(u, 'Character');
  // an InSv marked * applies only to some attacks: against ranged attacks, when its ability says so (insvStar; dmCalc
  // applies it through that ability's line); Feel No Pain comes from the "when targeted" lines too
  const starRanged = u.abilities.some(ab => /\b(?:insv|invulnerable save) against ranged attacks\b/i.test(ab.text.replace(/\*\*/g, '')));
  const rows = u.stats.map(s => { const m = / ×(\d+)$/.exec(s.name), nm = s.name.replace(/ ×\d+$/, ''), v = parseInt(s.InSv, 10) || 7, star = /\*/.test(s.InSv);

  for(const list of groups.values()){ if(list.length < 2 || list.some(lv => val(lv) == null)) continue; const top = list.reduce((b, lv) => val(lv) > val(b) ? lv : b, list[0]); if(val(top) > 0 || (top.on && list.some(lv => val(lv) < 0))) mark(top, 'best'); }

// calc.js in a worker (the page stays quick to tap); where a worker can't start, between frames on the page itself
let dmWk = null;
function dmWorker(){
  if(dmWk !== null) return dmWk;
  dmWk = Promise.resolve(null);
  try {
    const el = document.querySelector('script[src*="calc.js"]');
    if(!el || typeof Worker === 'undefined' || !window.fetch || !window.Blob) return dmWk;
    dmWk = fetch(el.src).then(r => r.ok ? r.text() : Promise.reject(new Error('calc.js'))).then(src => new Promise(ok => {
      const w = new Worker(URL.createObjectURL(new Blob([src + '\n;self.onmessage = e => { const m = e.data; let out; try { out = m.ping ? 1 : m.parts ? WH_CALC.mix(m.parts, m.opts) : WH_CALC.run(m.input); } catch(err){ out = { error:String(err) }; } self.postMessage({ id:m.id, out }); };'], { type:'text/javascript' })));

      w.onerror = () => { for(const f of wait.values()) f(null); wait.clear(); ok(null); };

      call({ ping:1 }).then(x => { clearTimeout(t); ok(x === 1 ? { call } : null); });

// "How this is worked out": what the rules say about these numbers, and what the calculator does where they leave a choice
// or say nothing (each line names its rule, or says that the rules don't say)
function dmHow(c, st, r0){
  const r = r0 || c.r, R = c.R, g = c.input.groups, on = R.groups.filter(x => !x.out), gi = R.groups.map((x, i) => i).filter(i => !R.groups[i].out);
  if(!r) return '';
  const kw = re => gi.some(i => g[i].kw.some(k => re.test(k)));
  const L = [];
  L.push(['The working', 'each weapon’s averages are worked out exactly from the dice, step by step, against the models the attacks meet first and as if none of the damage were lost. Models destroyed, wounds lost and the chances are played out with the dice, because damage beyond a model’s wounds and attacks after the unit is destroyed are lost (05.04); the same picks always give the same numbers.']);
  L.push(['Ticked for you', 'a rule starts ticked only when the data records that it applies here: always, or because of the target’s keywords or T. A rule that depends on the table (an objective, a charge, a distance, a protocol or ability picked, a stratagem spent) starts unticked; one the target rules out is greyed with the reason. Every box can be changed, and the working names each rule it counts, and each one the printed values already include.']);
  L.push(['Weapons (04.03)', 'the rules let the attacker pick which weapon’s attacks are resolved next; the calculator takes them in the order listed, and rolls identical attacks together.']);
  L.push(['Saves and damage (05.03, 05.04)', 'save rolls are rolled together and used from the lowest; an attack that gets through damages the one model it was allocated to, so damage beyond that model’s wounds is lost; Feel No Pain is rolled for each wound (24.12).']);
  if(r.alloc.length > 1) L.push(['Allocation order (05.03)', 'one group for the models with the same W, Sv and InSv, one for each CHARACTER model, CHARACTER groups last. ' +

  if(c.models.some(m => m.bodyguard)) L.push(['Toughness (19.02)', 'the highest T among the bodyguard models still in the unit; once they are all destroyed, the highest T of the others.']);
  if(on.some(x => x.rrHit || x.rrWound || x.lethal))
    L.push(['Re-rolls and [LETHAL HITS] (01.05.02, 24.23)', 'the rules leave these to the attacker; the calculator re-rolls every failed roll it may, re-rolls a successful roll only to look for a critical result when that is worth more on average, and takes [LETHAL HITS] unless rolling to wound is worth more (a critical wound with [DEVASTATING WOUNDS]).']);
  if(on.some(x => x.dev) && c.tmod.dMinus) L.push(['[DEVASTATING WOUNDS] and -1 Damage (24.10, 04.02.02)', 'a critical wound ends that attack’s sequence and inflicts mortal wounds equal to its D; the attack is never allocated (that happens in step 1 of 05.04), so a -1 Damage that works when an attack is allocated does not change them. The calculator does not apply it to these mortal wounds.']);
  if(gi.some(i => g[i].kw.concat(g[i].mods.filter(m => m.sus).map(m => 'SUSTAINED HITS ' + m.sus)).some(k => /^(sustained hits|rapid fire|melta) \d*D\d/i.test(k))))
    L.push(['A dice roll in an ability ([SUSTAINED HITS D3], [RAPID FIRE D6+3])', 'the rules don’t say how often it is rolled; the calculator rolls [SUSTAINED HITS] for each critical hit, [RAPID FIRE] for each weapon and [MELTA] for each attack that inflicts damage.']);
  if(on.some(x => x.psychic)) L.push([on.some(x => x.psychicKw) ? '[PSYCHIC] (24.29)' : 'Ignoring modifiers (02.02.02)', 'an attack that can ignore any or all modifiers to BS and to the hit roll: the calculator ignores the ones that make it worse and keeps the others.']);
  if(gi.some(i => (+g[i].AP || 0) === 0 && g[i].mods.some(m => +m.ap > 0)) && c.tmod.apWorse) L.push(['AP (When Modifying Characteristics)', 'improved and worsened at once: the calculator adds the changes up first, then holds AP at 0 at worst (“after all modifiers”); worsening first, step by step, can read differently.']);
  if(c.ctx.snap && gi.some(i => g[i].kw.some(k => /^torrent/i.test(k)))) L.push(['[TORRENT] in snap shooting', 'the rules don’t say whether these attacks still hit automatically; the calculator lets them.']);
  if(c.ctx.precision) L.push(['[PRECISION] (24.28)', 'attacks with it go to ' + c.ctx.precision + ' while it is in the unit, the others as usual; their [DEVASTATING WOUNDS] mortal wounds go to it first (24.28.01).']);
  L.push(['Range (04.02)', 'every weapon is taken to be in range of the target; a rule that changes range counts only through half range.' + (c.ctx.halves && c.ctx.halves.length ? ' Half range ([RAPID FIRE] 24.30, [MELTA] 24.25) is the band picked above, worked out from the ranges after the ticked rules that change them: a weapon gets its bonus when its half range reaches it.' : '')]);

  if(kw(/^cleave\b/i)) L.push(['[CLEAVE] (24.06)', 'X more attack dice for every five models the target had before these attacks, when all of that weapon’s attacks target this one unit: the calculator takes it that they do.']);

/* ---------- search over everything in one army ---------- */
const KIND_ORDER = ['Units','Weapons','Stratagems','Abilities','Rules'];
// shorthand players type; a value with spaces must appear as that phrase
const SYNONYM = { their:'opponent', strat:'stratagem', strats:'stratagem', fnp:'feel no pain', inv:'invulnerable', invul:'invulnerable', invuln:'invulnerable',
  dev:'devastating', devs:'devastating', ld:'leadership', cqc:'close-quarters', lethals:'lethal hits', sus:'sustained hits', ds:'deep strike', 'lone-op':'lone operative', loneop:'lone operative', dp:'daemon prince', tfex:'tyrannofex' };
// lower-case, no apostrophes, and "waaagh"/"waagh" alike; hyphens are indexed both ways
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\*\*|~~/g, '').replace(/[’‘'`´]/g, '').replace(/a{2,}/g, 'a');
const hay = (...parts) => { const t = norm(parts.filter(Boolean).join(' ')); return t + ' ' + t.replace(/-/g, '') + ' ' + t.replace(/-/g, ' '); };
const statLineText = s => 'M ' + s.M + ' · T ' + s.T + ' · Sv ' + s.Sv + ' · W ' + s.W + ' · Ld ' + s.Ld + ' · OC ' + s.OC + (s.InSv !== '–' ? ' · Inv ' + s.InSv : '');
function weaponStatText(w, kind){
  return [kind === 'ranged' ? w.range : 'Melee', 'A ' + w.A, kind === 'ranged' ? 'BS ' + w.BS : 'WS ' + w.WS, 'S ' + w.S, 'AP ' + w.AP, 'D ' + w.D].join(' · ');
}
const indexCache = new Map();
const abilityIndex = new Map();
function searchIndex(){
  const a = army();
  if(indexCache.has(a.id)) return indexCache.get(a.id);
  const out = [];
  const add = e => { e.hay += ' ' + norm(e.title).replace(/[\s-]/g, ''); out.push(e); };
  for(const u of a.units){
    const st = u.stats.map(s => ['t' + s.T, 'w' + s.W, 'm' + s.M, 'sv' + s.Sv, 'base ' + s.base].join(' ')).join(' ');
    add({ kind:'Units', title:u.name, s1:u.stats.map(statLineText).join(' / '),
      sub:[u.role, u.pts + ' pts', u.warlord ? 'Warlord' : '', u.enhancement, u.leads ? attachText(u) : ''].filter(Boolean).join(' · '),
      hay:hay(u.name, u.short, u.role, u.kw.join(' '), u.models.join(' '), u.enhancement, u.warlord ? 'warlord' : '', unitRules(u).join(' '),
        u.abilities.map(ab => ab.def).join(' '), st, 'stats save toughness wounds move leadership', u.stats.some(s => s.InSv !== '–') ? 'invulnerable' : ''),
      act:{ unit:u.id } });
  }
  // weapons: identical profiles on twin units are listed once
  const wmap = new Map();
  for(const u of a.units) for(const kind of ['ranged','melee']) for(const w of u[kind] || []){
    const title = w.group ? w.group + ' – ' + w.name : w.name;
    const s1 = weaponStatText(w, kind);
    const key = title + '|' + s1 + '|' + u.name;
    const kws = (w.hunter ? [HUNTER_KW] : []).concat(w.kw);
    const vm = (u.mods || []).find(m => m.weapon === w.name && m.set);
    if(wmap.has(key)){ wmap.get(key).units.push(u); continue; }
    const e = { kind:'Weapons', title, s1, units:[u], kws, vm, who:w.who, hay:hay(title, kind, 'weapon', kws.join(' '), u.name, u.short, w.who), act:{ unit:u.id, sec:kind } };
    wmap.set(key, e); add(e);
  }
  for(const e of wmap.values()){
    e.sub = e.units.map(shortName).join(', ') + (e.who && e.who !== e.units[0].name ? ' (' + e.who + ')' : '') + (e.kws.length ? ' · ' + e.kws.join(', ') : '') +
      (e.vm ? ' · ' + Object.entries(e.vm.set).map(([k, v]) => k + ' ' + v).join(' ') + ' ' + e.vm.when : '');
  }
  for(const u of a.units) for(const ab of u.abilities){
    const key = abilityKey(ab);
    if(abilityIndex.has(key)){ abilityIndex.get(key).units.push(u); continue; }
    const e = { kind:'Abilities', title:ab.name, ab, units:[u], hay:hay(ab.name, 'ability', ab.text, ab.tag, ab.who, ab.def, u.name), act:{ ability:key } };
    abilityIndex.set(key, e); add(e);
  }
  for(const e of abilityIndex.values()) e.sub = unitNames(e.units) + (e.ab.tag ? ' · ' + e.ab.tag : '') + (e.ab.ph ? ' · ' + whenTag(e.ab) : '');
  for(const s of allStratagems(a)){
    add({ kind:'Stratagems', title:s.name, sub:s.cp + 'CP · ' + (s.src === 'Core' ? 'Core' : s.src) + ' · ' + stratWhenLine(s) + (eligible(s, a).length ? '' : ' · no unit in this list can use it'),
      hay:hay(s.name, 'stratagem', s.when, s.target, s.effect, s.limit, s.restrictions, s.src, s.src === 'Core' ? 'core' : 'detachment', s.phases.map(p => PHASE_NAME[p]).join(' '), TURN_NAME[s.turn], s.turn === 'opp' ? 'opponent' : ''), act:{ strat:s.id } });
  }
  const f = factionOf(a);
  const tableText = t => (t || []).map(r => r.join(' ')).join(' ');
  for(const r of f.armyRules) add({ kind:'Rules', title:r.name, sub:f.name + ' army rule' + (r.tag ? ' · ' + r.tag : ''), hay:hay(r.name, r.text, tableText(r.table), r.tag, 'army rule', (f.aliases || []).map(x => x[0].source).join(' ')), act:{ rule:r.name } });
  for(const d of detachmentsOf(a)){
    if(d.rule) add({ kind:'Rules', title:d.rule.name, sub:d.name + ' detachment rule', hay:hay(d.rule.name, d.rule.text, tableText(d.rule.table), d.name, 'detachment rule'), act:{ rule:d.rule.name } });
    for(const e of d.enhancements){
      const hs = holders(a, e.name);
      add({ kind:'Rules', title:e.name, sub:(e.upgrade ? 'Upgrade' : 'Enhancement') + ' · ' + d.name + (e.pts ? ' · ' + e.pts + ' pts' : '') + (hs.length ? ' · on ' + hs.map(u => holderName(u, e.name)).join(', ') : ' · not in this list'), hay:hay(e.name, e.text, d.name, 'enhancement', e.upgrade ? 'upgrade' : ''), act:{ enh:d.id + '|' + e.name } });
    }
  }
  for(const key of Object.keys(D.rules)) add({ kind:'Rules', title:key, sub:(D.ruleSrc || {})[key] || 'Core rule', hay:hay(key, D.rules[key], 'core rule keyword'), act:{ rule:key } });
  indexCache.set(a.id, out);
  return out;
}
// a search word close enough to a word in the text: a plural, or 1 typo (2 for long words)
function near(w, t){
  if(w.startsWith(t) || (t.length > 3 && t.endsWith('s') && w.startsWith(t.slice(0, -1)))) return true;
  const k = t.length >= 7 ? 2 : t.length >= 4 ? 1 : 0;
  if(!k || Math.abs(w.length - t.length) > k) return false;
  let prev = Array.from({ length:t.length + 1 }, (x, j) => j);
  for(let i = 1; i <= w.length; i++){
    const row = [i];
    for(let j = 1; j <= t.length; j++) row[j] = Math.min(prev[j] + 1, row[j - 1] + 1, prev[j - 1] + (w[i - 1] === t[j - 1] ? 0 : 1));
    if(Math.min(...row) > k) return false;
    prev = row;
  }
  return prev[t.length] <= k;
}
// wrap each search word found in the title in <mark>, escaping everything else
function highlight(text, toks){
  const parts = toks.filter(t => t.length > 1).map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  if(!parts.length) return esc(text);
  return String(text).split(new RegExp('(' + parts.join('|') + ')', 'gi')).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}
function renderFinder(){
  const res = $('#qres');
  if(!res) return;
  const q = (query[army().id] || '').trim();
  $('#armyMenu').hidden = !!q;
  $('#armyHead').hidden = !!q;
  if(!q){ res.innerHTML = ''; return; }
  // each word as typed, or its shorthand meaning ("their" also finds "opponent", and still "Thin Their Ranks")
  const toks = norm(q).split(/\s+/).filter(t => /[a-z0-9]/.test(t)).map(t => t.replace(/-/g, ''));
  const alts = toks.map(t => hasOwn(SYNONYM, t) ? [t, SYNONYM[t].replace(/-/g, '')] : [t]);
  const nq = toks.join(' ');
  if(!toks.length){ res.innerHTML = '<div class="empty">Type a name, keyword or rule.</div>'; return; }
  const hits = searchIndex().filter(e => alts.every(a => a.some(t => e.hay.includes(t)))).map(e => {
    const tl = norm(e.title).replace(/-/g, '');
    return Object.assign({ score: tl.startsWith(nq) || tl.split(' ').some(w => w.startsWith(nq)) ? 0 : tl.includes(nq) ? 1 : toks.every(t => tl.includes(t)) ? 2 : 3 }, e);
  });
  // nothing found: forgive a plural and a typo or two ("rubrics", "ghazkull")
  if(!hits.length) for(const e of searchIndex()){
    const words = e.words || (e.words = [...new Set(e.hay.split(/[^a-z0-9]+/).filter(Boolean))]);
    if(alts.every(a => a.some(t => words.some(w => near(w, t))))) hits.push(Object.assign({ score:4 }, e));
  }
  for(const [re, key] of faction().aliases || []) if(re.test(q)){
    const r = hits.find(e => e.kind === 'Rules' && e.act.rule === key) || searchIndex().find(e => e.kind === 'Rules' && e.act.rule === key);
    if(r){ const i = hits.indexOf(r); if(i >= 0) hits.splice(i, 1); hits.unshift(Object.assign({}, r, { score:-1 })); }
  }
  if(!hits.length){ res.innerHTML = '<div class="empty">Nothing in ' + esc(army().name) + ' matches “' + esc(q) + '”.</div>'; return; }
  const groups = KIND_ORDER.map(k => ({ k, list:hits.filter(e => e.kind === k).sort((x, y) => x.score - y.score) })).filter(g => g.list.length);
  groups.sort((x, y) => x.list[0].score - y.list[0].score || KIND_ORDER.indexOf(x.k) - KIND_ORDER.indexOf(y.k));
  const words = q.split(/\s+/);
  res.innerHTML = groups.map(g => {
    const limit = moreShown.has(g.k) ? Infinity : 6;
    return '<div class="rg"><div class="lbl">' + g.k + ' · ' + g.list.length + '</div>' +
      g.list.slice(0, limit).map(e => {
        const act = e.act;
        const attrs = act.strat ? 'data-strat="' + esc(act.strat) + '"' : act.rule ? 'data-rule="' + esc(act.rule) + '"' : act.ability ? 'data-ability="' + esc(act.ability) + '"' :
          act.enh ? 'data-enh="' + esc(act.enh) + '"' : 'data-unit="' + esc(act.unit) + '"' + (act.sec ? ' data-sec="' + esc(act.sec) + '"' : '');
        return '<button class="res" ' + attrs + '><b>' + highlight(e.title, words) + '</b>' + (e.s1 ? '<span class="s1">' + esc(e.s1) + '</span>' : '') + '<span>' + esc(e.sub) + '</span></button>';
      }).join('') +
      (g.list.length > limit ? '<button class="more" data-more="' + g.k + '">Show ' + (g.list.length - limit) + ' more</button>' : '') + '</div>';
  }).join('');
}

/* ---------- weapon tables ---------- */
const colHeader = kind => '<div class="wh ' + kind + '"><span class="n">Weapon</span>' + (kind === 'ranged' ? ['RNG','A','BS','S','AP','D'] : ['A','WS','S','AP','D']).map(c => '<span>' + c + '</span>').join('') + '</div>';
// where a footnote's rule comes from, as a link to its text
function modFrom(m, u){
  const link = (attr, val, label) => '<span class="link" role="button" tabindex="0" data-' + attr + '="' + esc(val) + '">' + esc(label) + '</span>';
  if(m.rule) return link('rule', m.rule, m.from);
  if(m.strat) return link('strat', m.strat, m.cp + 'CP ' + m.from);
  if(m.src && m.src !== u) return link('unit', m.src.id, m.from);   // the condition already names the unit
  const ab = (m.src || u).abilities.find(a => a.name === m.from);
  return ab ? link('ability', abilityKey(ab), m.from) : esc(m.from);
}
// AP -2 improved by 1 is AP -3
function weaponBlock(it, keys, mods, u){
  const cell = (v, cls) => '<span>' + (cls ? '<i class="' + cls + '">' + esc(v) + '</i>' : esc(v)) + '</span>';
  const wide = keys[0] === 'none';   // datasheet melee rows: no range column, the name can use it
  const row = (label, cells, p) => '<div class="wr' + (p ? ' p' : '') + '"><span class="n' + (wide ? ' n2' : '') + '">' + label + '</span>' + (wide ? cells.slice(1) : cells).join('') + '</div>';
  const gv = (w, k) => granted(w, k, u, esc(w[k]), (KEY_LABEL[k] || k) + ' ' + w[k]);
  const plainCells = w => keys.map(k => '<span>' + gv(w, k) + '</span>');
  // a keyword printed twice (Hunter's Eye's [IGNORES COVER] appended to a heavy flamer that has it): the added, last one is marked
  const kwl = w => (w.kw || []).length ? '<div class="kwl">' + w.kw.map((x, i) => w.from && w.from[x] && w.kw.lastIndexOf(x) === i ? '<span class="gk' + (wideGrant(w.from[x], u) ? ' w' : '') + '" data-rule="' + esc(x) + '"' + grantAttr(w.from[x], u, x) + '>' + esc(x) + '</span>'
    : '<span role="button" tabindex="0" data-rule="' + esc(x) + '">' + esc(x) + '</span>').join(', ') + '</div>' : '';
  // "Khornate eviscerator ×4": the count wraps with the last word, never alone
  const named = (name, n) => { if(!n) return esc(name); const i = name.lastIndexOf(' '); return esc(name.slice(0, i + 1)) + '<span class="nw">' + esc(name.slice(i + 1)) + '<span class="x">×' + esc(n) + '</span></span>'; };
  const prof = name => '<span class="ar">➤</span>' + esc(name);
  const w0 = it.profiles[0];
  // an ability that changes this weapon against some targets: one row, the value and the change in the cell
  // ("8 (+6)", as the rule says "+6 A"; a set value shows as "8/14")
  const vm = !it.group && mods.find(m => m.weapon === w0.name && m.set);

    const cells = keys.map(k => vm.set[k] == null ? '<span>' + gv(w0, k) + '</span>' : /^[+-]/.test(vm.set[k]) ? '<span>' + gv(w0, k) + '<i class="hb">(' + esc(vm.set[k]) + ')</i></span>'
      : '<span>' + gv(w0, k) + '<i class="alt">/' + esc(vm.set[k]) + '</i></span>');

    return row(named(w0.name, w0.n), cells) + kwl(w0) +
      '<div class="varc"><b>' + esc(changed) + '</b> ' + esc(vm.when) + ', ' + esc(vm.note) + ' <span class="from">(' + modFrom(vm, u) + ')</span></div>';
  }
  if(it.group){
    // Hunter weapons: the profile depends on the target; rules that add to Hunter attacks are built in
    const byTarget = it.profiles.some(p => p.hunter);
    const hunterMods = mods.filter(m => m.hunter);
    // several guns under one name, every one of them fired (Nazdreg's Kustom Blasta X): not a choice
    const all = it.profiles.every(p => p.fireAll);
    if(all) return '<div class="wn">' + named(it.group, it.n) + (it.carrier ? '<span class="cr">' + esc(it.carrier) + '</span>' : '') + '</div>' +
      it.profiles.map(p => row('<span class="ar">+</span>' + esc(p.name), plainCells(p), true) + kwl(p)).join('');
    return '<div class="wn">' + named(it.group, it.n) + (it.carrier ? '<span class="cr">' + esc(it.carrier) + '</span>' : '') + '</div>' +
      it.profiles.map(p => {
        if(!byTarget) return row(prof(p.name), plainCells(p), true) + kwl(p);
        if(!p.hunter) return row(prof(p.name), plainCells(p), true) + kwl(p);
        const cells = keys.map(k => { const d = hunterMods.reduce((t, m) => t + (m.hunter[k] || 0), 0); return d ? '<span>' + gv(p, k) + '<i class="hb">(+' + d + ')</i></span>' : '<span>' + gv(p, k) + '</span>'; });
        return row('<span class="ar">➤</span><span class="link" role="button" tabindex="0" data-rule="Hunter">' + esc(p.name) + '</span><span class="tq">MON/VEH only</span>', cells, true) + kwl(p);
      }).join('');
  }
  return row(named(w0.name, w0.n) + (it.carrier ? '<span class="cr">' + esc(it.carrier) + '</span>' : ''), plainCells(w0)) + kwl(w0);
}
// footnotes: rules with the same condition share one line; a footnote that changes only

function modLines(mods, u, hasHunter){

      unplacedOf(u).map(x => '<div class="pxl"><span></span><span class="pxm">' + esc(x.n + '× ' + x.name + ': ' + x.note) + '</span></div>').join('') + '</div>';
  });
  const sizes = [...total].sort((x, y) => (parseFloat(x[0]) || 999) - (parseFloat(y[0]) || 999));
  return '<p class="lbl grp-h">Bases to print</p><p class="pxt">' + sizes.map(([b, n]) => '<span><b>' + n + '×</b> ' + esc(b) + '</span>').join('') + '</p>' +
    '<p class="lbl grp-h">What to write on each base</p><div class="list">' + cards.join('') + '</div>' +
    '<p class="note">From the New Recruit list: model counts and loadouts per model, base sizes from the datasheets.</p>';
}

/* ---------- screen: before the battle ----------
   Everything decided or set up before the first turn, and every once-per-battle resource,
   gathered from the list: the paper has it spread over many pages. Every line opens its full text. */
// "deploy" as the step (Deploy Armies, deployed, deployment), not "deployment zone" (that is where, not when)
const PREGAME_RE = /before the battle|declare battle formations|read mission objectives|pre-?battle|\bdeploy(?!ment zone)|redeploy|infiltrat/i;
function screenPregame(){
  const a = army(), f = faction(), units = a.units;
  const row = (k, v) => v ? '<div class="pgr"><span class="pgk">' + k + '</span><span class="pgv">' + v + '</span></div>' : '';
  const sec = (title, body) => body ? '<div class="sec-h"><h2>' + title + '</h2></div><div class="pg">' + body + '</div>' : '';
  // the same ability on several units is one line: "Singular Purpose · Assimilator (280), Norn Emissary ×2"
  const group = list => { const m = new Map(); for(const [u, ab] of list){ const k = ab.name + '|' + ab.text; if(!m.has(k)) m.set(k, { ab, units:[] }); m.get(k).units.push(u); } return [...m.values()]; };
  const abLine = g => linkTo('ability', abilityKey(g.ab), g.ab.name) + ' <span class="from">· ' + esc(unitNames(g.units)) + '</span>';
  const rulesOf = units.length ? f.armyRules.filter(r => !inertRule(r.name)).map(r => ({ r, src:f.name + ' army rule' }))
    .concat(detachments().filter(d => d.rule).map(d => ({ r:d.rule, src:d.name }))) : [];
  const ruleLine = x => linkTo('rule', x.r.name, x.r.name) + ' <span class="from">· ' + esc(x.src) + '</span>';
  const nameLink = u => linkTo('unit', u.id, u.short || u.name);   // without its enhancement: the line says it
  const allAbs = units.flatMap(u => u.abilities.filter(ab => !naReason(ab)).map(ab => [u, ab]));
  // Deep Strike (24.09) and Scouts (24.31) work only if every model in the unit has them; u.partialRules names
  // the rules only some models of an attached unit have (Slaughterbound's Scouts 6": its Exalted Eightbound have none)
  const everyModel = (u, test) => unitRules(u).some(test) && !(u.partialRules || []).some(test);
  // rules resolved before Declare Battle Formations (Code Chivalric: end of the Read Mission Objectives step)
  const early = rulesOf.filter(x => /read mission objectives/i.test(x.r.text));

  // your list
  const warlord = units.filter(u => u.warlord);
  const enh = units.flatMap(u => [u.enhancement, u.upgrade].filter(Boolean).map(n => { const d = detachments().find(x => (x.enhancements || []).some(e => e.name === n)), e = d && d.enhancements.find(x => x.name === n);
    return (d ? linkTo('enh', d.id + '|' + n, n) : esc(n)) + (n === u.upgrade ? ' <span class="from">(upgrade)</span>' : '') + (e && e.pts ? ' <span class="from">' + e.pts + ' pts</span>' : '') + ' on ' + (n === u.enhancement && u.enhOn ? linkTo('unit', u.id, u.enhOn) : n === u.upgrade && u.leads ? linkTo('unit', u.id, u.leads) : linkTo('unit', u.id, (u.short || u.name) + unitNo(u))); }));
  const led = units.filter(u => u.leads).flatMap(u => charsOf(u).map((c, i) => (i ? linkTo('unit', u.id, c.name) : nameLink(u)) + (c.support ? ' supports ' : ' leads ') + esc(u.leads) + (u.copies > 1 ? ' <span class="from">×' + u.copies + ' units</span>' : '')));
  let h = sec('Your list',
    row('Warlord', warlord.map(u => u.warlordOn ? linkTo('unit', u.id, u.warlordOn) + ' <span class="from">(' + esc(unitLabel(u)) + ')</span>' : unitLink(u)).join(', ')) +
    row('Enhance&shy;ments', enh.join('<br>')) +
    row('Attached', led.join('<br>')) +
    row('Detach&shy;ments', detachments().map(d => (d.rule ? linkTo('rule', d.rule.name, d.name) : esc(d.name)) + (d.dp ? ' <span class="from">(' + d.dp + ' DP)</span>' : '')).join(', ') + (a.disposition ? '<br><span class="from">Disposition:</span> ' + esc(a.disposition) : '')) +
    // the other selections New Recruit prints under the army name, as printed ("Code Chivalric: Deed, Quality")
    Object.entries(a.config || {}).map(([k, v]) => row(esc(k), f.armyRules.some(r => r.name === k) ? linkTo('rule', k, v) : esc(v))).join('') +
    row('Points', esc(a.pointsUsed + ' / ' + a.points + ' · ' + a.battleSize)));
  // the army rules, folded: each opens to its text
  h += f.armyRules.length ? '<div class="sec-h"><h2>Army rules</h2></div><div class="abl">' + armyRuleRows(f) + '</div>' : '';

  const earlyAbs = group(allAbs.filter(([u, ab]) => /read mission objectives/i.test(ab.text)));
  h += sec('Read Mission Objectives step', row('Rules', early.map(ruleLine).join('<br>')) + row('Abilities', earlyAbs.map(abLine).join('<br>')));

  // declare battle formations: reserves and transports
  const ds = units.filter(u => everyModel(u, r => ruleKey(r) === 'Deep Strike'));
  const dsPts = ds.reduce((t, u) => t + (u.pts || 0) * (u.copies || 1), 0);
  const transports = units.filter(u => hasKw(u, 'Transport')).map(u => { const ab = u.abilities.find(x => /transport capacity/i.test(x.text)); return unitLink(u) + (ab ? ': <span class="from">' + inline(ab.text.replace(/(^|\n)\*([^*\n][^\n]*[^*\n])\*(?=\n|$)/g, '$1$2').replace(/\n(- )?/g, ' ')) + '</span>' : ''); });
  h += sec('Declare battle formations',
    row('Deep Strike', ds.map(u => (u.leads ? linkTo('unit', u.id, unitLabel(u)) : unitLink(u)) + ' <span class="from">' + u.pts + ' pts' + (u.copies > 1 ? ' each, ×' + u.copies : '') + '</span>').join('<br>') + (ds.length > 1 ? '<br><span class="from">All of them: ' + dsPts + ' pts</span>' : '')) +
    row('Transports', transports.join('<br>')));

  // deployment and pre-battle abilities
  const scouts = units.filter(u => everyModel(u, r => /^scouts|^infiltrators/i.test(r)));
  const pre = group(allAbs.filter(([u, ab]) => PREGAME_RE.test(ab.text) && !/start of the first battle round|read mission objectives/i.test(ab.text)));
  h += sec('Deployment and pre-battle abilities',
    row('Scouts', scouts.map(u => unitLink(u) + ' <span class="from">' + esc(unitRules(u).filter(r => /^scouts|^infiltrators/i.test(r)).join(', ')) + '</span>').join('<br>')) +
    row('Abilities', pre.map(abLine).join('<br>')) +
    row('Rules', rulesOf.filter(x => PREGAME_RE.test(x.r.text) && !early.includes(x)).map(ruleLine).join('<br>')));

  // decided at the start of the battle or of every battle round
  const first = group(allAbs.filter(([u, ab]) => /start of the first battle round/i.test(ab.text)));
  const round = rulesOf.filter(x => /start of (the|each|every) battle round/i.test(x.r.text)).map(ruleLine)
    .concat(group(allAbs.filter(([u, ab]) => /start of (the|each|every) battle round/i.test(ab.text) && !/start of the first battle round/i.test(ab.text))).map(abLine));
  const firstRules = rulesOf.filter(x => /start of the first battle round/i.test(x.r.text)).map(ruleLine);
  h += sec('Start of the battle round', row('First round', firstRules.concat(first.map(abLine)).join('<br>')) + row('Every round', round.join('<br>')));

  // uses per battle: the resources you spend, ticked off until New game
  // a rule that gives units a "(Once per battle, per unit)" ability (Higher Imperatives) is ticked on those units, not here
  const ruleOnce = r => perBattle(r) && !/per battle\b(?! round)[^.)]*\bper unit\b/i.test(r.text || '');
  const onceRules = f.armyRules.filter(r => !inertRule(r.name) && ruleOnce(r)).map(r => ({ r, src:f.name + ' army rule' }))
    .concat(detachments().filter(d => d.rule && ruleOnce(d.rule)).map(d => ({ r:d.rule, src:d.name })));
  const tl = (boxes, text) => '<div class="tl">' + boxes + '<span>' + text + '</span></div>';
  const ruleTicks = x => { const r = x.r, pb = perBattle(r, true);
    // "You can only select each of these abilities once per battle" (Kindred Sorcery): a box per option
    if(/\beach of these [a-z ]+ once per battle/i.test(r.text) && r.table) return '<div class="tl"><span>' + ruleLine(x) + ':</span></div>' + r.table.map(o => tl(ticks('r:' + r.name + ':' + o[0], 1, '', o[0]), esc(o[0]))).join('');
    return tl(ticks('r:' + r.name, pb.n, '', r.name), ruleLine(x)); };
  const onceAbs = group(allAbs.filter(([u, ab]) => perBattle(ab)));
  const abTicks = g => perBattle(g.ab).army ? tl(abilityTicks(g.ab, g.units[0]), abLine(g) + ' <span class="tg once">per army</span>')
    : g.units.flatMap(u => Array.from({ length:u.copies || 1 }, (_, i) => tl(ticks(copyKey(g.ab, u, i), perBattle(g.ab).n, '', g.ab.name + (u.copies > 1 ? ', Unit ' + (i + 1) : '')),
        linkTo('ability', abilityKey(g.ab), g.ab.name) + ' · ' + linkTo('unit', u.id, unitLabel(u)) + (u.copies > 1 ? ' <span class="from">· Unit ' + (i + 1) + '</span>' : '')))).join('');
  const onceStrats = allStratagems().filter(s => eligible(s).length && perBattle(s));
  h += sec('Uses per battle',
    row('Rules', onceRules.map(ruleTicks).join('')) +
    row('Abilities', onceAbs.map(abTicks).join('')) +
    row('Strata&shy;gems', onceStrats.map(s => tl(ticks('s:' + s.id, perBattle(s, true).n, '', s.name), linkTo('strat', s.id, s.cp + 'CP ' + s.name))).join('')));
  if(onceRules.length || onceAbs.length || onceStrats.length) h = h.replace(/(<div class="sec-h"><h2>Uses per battle<\/h2>)/, '$1<button class="textbtn" data-newgame>New game</button>');
  return h + '<p class="note">Gathered from this list’s datasheets and rules; each line opens the full text.</p>';
}

/* ---------- screen: rules & keywords ---------- */
const xp = (name, sub, tags, body, open) => '<details class="xp"' + (open ? ' open' : '') + '><summary><span class="xh"><b>' + esc(name) + '</b>' + (sub ? '<span>' + esc(sub) + '</span>' : '') + '</span>' +
  (tags || '') + chev + '</summary><div class="body">' + body + '</div></details>';
// the core rules a player looks up every game, from the Core Rules (07 The Battle Round, 08 Command
// Phase, 05 Attack Sequence; the dice in its tables are pictures, read from the printed page)
/* ---------- screen: rules ----------
   The rules of this list, laid out like a datasheet: a heading per section, a chip per
   detachment, one row per rule (its timing on the right, its text one tap away). The core
   rules the army uses are folded at the bottom, for reference. */
// a rule row: its name, and under it what kind of rule it is and when (the datasheet's second line)
function ruleRow(name, meta, body, cls){
  return '<details class="ab rr' + (cls ? ' ' + cls : '') + '"><summary><span class="an"><b>' + esc(name) + '</b>' + (meta ? '<span class="rs">' + meta + '</span>' : '') + '</span>' +
    chev + '</summary><div class="body">' + body + '</div></details>';
}
const metaLine = (...parts) => parts.filter(Boolean).join(' <span class="sep">·</span> ');
// a rules text with its table where the source prints it: tableAt = the number of text lines before it
// (Try Dat Button!: "…have the relevant rule(s):", the table, then the hazard-roll line)
function textWithTable(r){
  if(!r.table) return rt(r.text);
  const lines = String(r.text || '').split('\n'), at = r.tableAt == null ? lines.length : r.tableAt;
  return rt(lines.slice(0, at).join('\n')) + ttable(r.table) + (at < lines.length ? rt(lines.slice(at).join('\n')) : '');
}
// the army rules, each folded to its name, when it applies and whether any unit of this list has it
function armyRuleRows(f){
  return f.armyRules.map(r => {
    const once = r.tag && /^(once|twice) per /i.test(r.tag) ? r.tag : '';
    return ruleRow(r.name, metaLine(once ? '<span class="tg once">' + esc(once) + '</span>' : r.tag ? esc(r.tag) : '', r.ph ? esc(shortWhen(r)) : '', inertRule(r.name) ? 'no unit in this list it applies to' : ''),
      (r.note ? '<p class="note it">' + esc(r.note) + '</p>' : '') + textWithTable(r) + ((r.missing || []).length ? '<p class="note">Not in the app yet: the ' + esc(r.missing.join(' and ')) + ' (they need that Wahapedia page).</p>' : ''), inertRule(r.name) ? 'na' : '');
  }).join('');
}
function screenRules(){
  const f = faction(), a = army(), dets = detachments();
  const note = r => r.note ? '<p class="note it">' + esc(r.note) + '</p>' : '';
  const when = r => r.ph ? esc(shortWhen(r)) : '';
  const first = x => { const ph = phasesOf(x); return ph.length === PHASES.length ? 99 : PHASES.findIndex(([k]) => k === ph[0]); };
  let h = '<div class="rules"><div class="ds-meta"><span>' + esc(f.name + ' · ' + a.disposition) + '</span></div>';
  // army rules, and the faction's own terms this list uses (Pulse Jet Move)
  const terms = Object.keys(D.ruleSrc || {}).filter(k => /army rule/i.test(D.ruleSrc[k]) && ruleUsers(k).length);
  h += '<div class="dsec"><h2 class="lbl">Army rules</h2><div class="abl">' + armyRuleRows(f) + terms.map(k => ruleRow(k, metaLine(esc(D.ruleSrc[k].replace(/^.*?\((.*)\)$/, '$1'))), rt(D.rules[k]) + usedBy('Used by', ruleUsers(k)))).join('') + '</div></div>';
  // detachments: the rule, the enhancements this list takes (and who has them), the others, its stratagems
  h += '<div class="dsec"><h2 class="lbl">Detachments</h2>';
  for(const d of dets){
    const mine = d.enhancements.filter(e => holders(a, e.name).length), other = d.enhancements.filter(e => !holders(a, e.name).length);
    const gap = (d.missing || []).includes('enhancements') ? '<p class="note">The other ' + esc(d.name) + ' enhancements aren’t in the app yet: they need the Wahapedia page.</p>' : '';
    // in the Stratagems tab's order: phase order, the ones no unit can use last
    const strats = (d.stratagems || []).map((x, i) => [x, i]).sort((x, y) => (eligible(x[0]).length ? 0 : 1) - (eligible(y[0]).length ? 0 : 1) || first(x[0]) - first(y[0]) || x[1] - y[1]).map(x => x[0]);
    h += '<h3 class="who">' + esc(d.name) + '</h3><div class="abl">' +
      (d.rule ? ruleRow(d.rule.name, metaLine('Detachment rule', when(d.rule)),
        note(d.rule) + textWithTable(d.rule) + usedBy('Applies to', a.units.filter(u => matches(d.rule.needs, u)))) : '') +
      mine.map(e => { const hs = holders(a, e.name); return ruleRow(e.name, metaLine('<span class="tg">' + (e.upgrade ? 'Upgrade' : 'Enhancement') + '</span>', e.pts ? esc(e.pts) + ' pts' : '', 'on ' + esc(hs.map(u => holderName(u, e.name)).join(', '))),
        rt(e.text) + '<p class="usedby"><span class="il">On</span>' + hs.map(u => linkTo('unit', u.id, holderName(u, e.name))).join(', ') + '</p>'); }).join('') +
      (other.length ? ruleRow('Other enhancements', metaLine(other.length + ' not in this list'),
        other.map(e => '<div class="sub"><b class="nm">' + esc(e.name) + '</b>' + (e.pts ? ' <span class="tg m">' + esc(e.pts) + ' pts</span>' : '') + rt(e.text) + '</div>').join(''), 'oth') : '') +
      '</div><p class="dline rs"><span class="il">Stratagems</span>' + (strats.length ? strats.map(st => eligible(st).length ? linkTo('strat', st.id, st.name) : '<span class="none">' + linkTo('strat', st.id, st.name) + ' <span class="from">(no unit in this list)</span></span>').join(', ') : 'none (a rule and enhancements only)') + '</p>' + gap;
  }
  h += '</div>';
  // which unit has which core rule (Lone Operative, Deep Strike, Leader…): from its datasheet, or from one of its
  // abilities, quoted, since the ability says when. The rule's own text is one tap away, not written out here;
  // weapon keywords are on the weapons
  const used = new Map();
  const add = label => { const r = ruleFor(label); if(r && r.src === 'Core rule' && !used.has(r.key)) used.set(r.key, r); };
  for(const u of a.units){
    for(const r of unitRules(u)) add(r);
    for(const ab of u.abilities) for(const key of Object.keys(D.rules)) if(!CONCEPT.has(key) && mentions(ab.text, key)) add(key);
  }
  const weaponKw = new Set(a.units.flatMap(u => [...(u.ranged || []), ...(u.melee || [])].flatMap(w => w.kw.map(ruleKey).concat(w.hunter ? ['Hunter'] : []))));
  const oneLine = t => t.replace(/(^|\n)\*([^*\n][^\n]*[^*\n])\*(?=\n|$)/g, '$1$2').replace(/\n(- )?/g, ' ');
  // an attached unit is named whole; Leader and Support name the character who has it ("Warboss leads Breaka Boyz")
  const who = (u, key) => { if(!u.leads) return unitLink(u);
    const cs = key === 'Leader' || key === 'Support' ? charsOf(u).filter(c => c.support === (key === 'Support')) : [];
    return cs.length ? linkTo('unit', u.id, cs.map(c => c.name).join(' and ')) + ' ' + (key === 'Support' ? 'supports ' : 'leads ') + esc(u.leads) : linkTo('unit', u.id, unitLabel(u)); };
  const holdersOf = key => a.units.flatMap(u => {
    const own = unitRules(u).filter(r => ruleKey(r) === key);
    // "Deadly Demise D3", "Feel No Pain 5+": the value after the unit
    if(own.length) return [who(u, key) + own.filter(r => r.toLowerCase() !== key.toLowerCase()).map(r => ' <span class="from">' + esc(r.toLowerCase().startsWith(key.toLowerCase()) ? r.slice(key.length).trim() : r) + '</span>').join('')];
    // from an ability: the unit, then the ability and its words (they say when)
    const abs = u.abilities.filter(ab => mentions(ab.text, key));
    return abs.length ? [who(u, key) + abs.map(ab => { const na = naReason(ab);
      return '<span class="urq">' + linkTo('ability', abilityKey(ab), ab.name) + (na ? ' <i>(' + esc(na) + ')</i>' : '') + ': ' + inline(oneLine(ab.text)) + '</span>'; }).join('')] : [];
  });
  const ur = [...used.values()].filter(r => !weaponKw.has(r.key)).sort((x, y) => x.key.localeCompare(y.key));
  if(ur.length) h += '<div class="dsec"><h2 class="lbl">Unit rules</h2><div class="urs">' + ur.map(r => '<div class="urr"><span class="urn">' + linkTo('rule', r.key, r.key) + '</span>' +
    holdersOf(r.key).map(l => '<p class="uru">' + l + '</p>').join('') + '</div>').join('') + '</div></div>';
  return h + '</div>';
}

/* ---------- render ---------- */
function render(){
  if(cur.s === 'home' && ONLY) cur = Object.assign(plain(cur), { s:'army', army:ONLY.id });
  tabMemo[memoKey(cur.army, tabOf(cur.s))] = plain(cur);
  renderTop();
  const v = $('#view'), s = cur.s;
  let sub = '', bot = '';
  if(s === 'home') v.innerHTML = screenHome();
  else if(s === 'army') v.innerHTML = screenArmy();
  else if(s === 'units'){ v.innerHTML = screenUnits(); sub = unitsSubbar(); }
  else if(s === 'unit') v.innerHTML = screenUnit() + (unitById(cur.unit) ? unitFlip(unitById(cur.unit)) : '');
  else if(s === 'strats') v.innerHTML = screenStrats();
  else if(s === 'ranged' || s === 'melee'){ v.innerHTML = screenWeapons(s); sub = '<div class="wt ' + s + '">' + colHeader(s) + '</div>'; }
  else if(s === 'abilities') v.innerHTML = screenAbilities();
  else if(s === 'rules') v.innerHTML = screenRules();
  else if(s === 'bases') v.innerHTML = screenBases();
  else if(s === 'pregame') v.innerHTML = screenPregame();
  else if(s === 'settings') v.innerHTML = screenSettings();
  else if(s === 'damage') v.innerHTML = screenDamage();
  if(cur.army) bot = tabBar();
  setBar('subbar', sub);
  setBar('bbar', bot);
  measure();
  if(s === 'army'){
    const i = $('#armyQ');
    i.value = query[army().id] || '';
    const sync = () => { query[army().id] = i.value; moreShown.clear(); renderFinder(); saveSession(); };
    i.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); i.blur(); } });
    i.addEventListener('input', sync);
    i.addEventListener('search', sync);   // the clear button and Escape empty the box without an input event
    i.addEventListener('keydown', e => { if(e.key === 'Enter') i.blur(); });
    renderFinder();
    if(focusSearch){ focusSearch = false; i.focus(); i.select(); }
  }
  store.set('wh-last', plain(cur));
}
// re-render the same screen in place, keeping the scroll position
function rerender(){ const y = scrollY; render(); scrollTo(0, y); }
function jumpTo(id, instant){
  const sec = $('#sec-' + id);
  if(!sec) return;
  if(sec.tagName === 'DETAILS') sec.open = true;
  const nx = sec.nextElementSibling;
  if(nx && nx.matches('details.pf')) nx.open = true;   // "Ranged … all pistols" folded under the anchor
  measure();
  sec.scrollIntoView({ behavior:instant || matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start' });
}

/* ---------- popup sheet ---------- */
let sheetReturn = null, sheetRule = null, sheetNow = null;
const sheetStack = [];   // the popups under this one (a rule opened from a rule): "‹ Deep Strike" goes back
function openSheet(label, title, html, popped){
  const nested = !$('#sheetHost').hidden;
  navAt = performance.now();
  if(!nested){ sheetReturn = document.activeElement; sheetStack.length = 0; }
  else if(!popped && sheetNow) sheetStack.push(sheetNow);
  sheetNow = [label, title, html];
  const prev = sheetStack[sheetStack.length - 1];
  $('#sheetIn').innerHTML = '<div class="grab" aria-hidden="true"></div>' + (prev ? '<button class="sback" data-sback>‹ ' + esc(prev[1]) + '</button>' : '') +
    (label ? '<p class="lbl">' + label + '</p>' : '') + '<h2 id="sheetTitle">' + esc(title) + '</h2>' + html;
  $('#sheetHost').hidden = false;
  document.documentElement.classList.add('lock');
  $('#top').inert = true; $('#view').inert = true; $('#bbar').inert = true;
  $('#sheetIn').scrollTop = 0;
  $('#sheet').focus();
  try {
    if(!nested) history.replaceState(Object.assign(plain(cur), spot()), '');
    const st = Object.assign(plain(cur), { sheet:1 }); nested && history.state && history.state.sheet ? history.replaceState(st, '') : history.pushState(st, '');
  } catch(e){}
}
function hideSheet(){
  if($('#sheetHost').hidden) return;
  sheetStack.length = 0; sheetNow = null;
  $('#sheetHost').hidden = true;
  $('#sheet').style.removeProperty('--drag');
  document.documentElement.classList.remove('lock');
  $('#top').inert = false; $('#view').inert = false; $('#bbar').inert = false;
  if(sheetReturn && sheetReturn.isConnected) sheetReturn.focus({ preventScroll:true });
}
function closeSheet(){
  if($('#sheetHost').hidden) return;
  hideSheet();
  try { if(history.state && history.state.sheet) history.back(); } catch(e){}
}
function showRule(label){
  const r = ruleFor(label);
  if(!r){ toast('No rule text stored for ' + label); return; }
  const users = r.src === 'Core rule' ? ruleUsers(r.key) : r.needs ? army().units.filter(u => matches(r.needs, u)) : [];
  sheetRule = r.key;   // the rule's own name inside its text is not a link to itself
  const kws = army().units.flatMap(u => [...(u.ranged || []), ...(u.melee || [])].flatMap(w => w.kw)).join(' ').toLowerCase();
  const text = r.text.split('\n').filter(l => { const m = /^\*App note[^\n]*suffix “([^”]+)”/.exec(l); return !m || kws.includes(m[1].toLowerCase()); }).join('\n');
  const body = textWithTable({ text, table:r.table, tableAt:r.tableAt });
  sheetRule = null;
  const gap = (r.missing || []).length ? '<p class="note">Not in the app yet: the ' + esc(r.missing.join(' and ')) + '.</p>' : '';
  openSheet(esc(r.src), CONCEPT.has(r.key) ? r.key : r.name, body + (r.note ? '<p class="note it">' + esc(r.note) + '</p>' : '') + gap + (r.src === 'Core rule' ? usersVia('In this army', r.key) : usedBy('In this army', users)) + askRefBtn('rule', label, 'rule'));
}
// "Granted by": the rule(s) behind a marked value, their text, then the keyword's own rule
function grantSource(name, u){
  const ab = u && u.abilities.find(a => a.name === name);
  if(ab) return { name, what:[ab.who, ab.tag || 'datasheet ability'].filter(Boolean).join(' · '), text:ab.text };
  const r = ruleFor(name);
  return r ? { name:r.name, what:r.src, text:r.text, table:r.table, tableAt:r.tableAt } : { name, what:'', text:'' };
}
function showGrant(names, unitId, what, kw){
  // the rule that grants it is the headline; the keyword's own rule follows, smaller
  const u = army().units.find(x => x.id === unitId);
  const gs = names.map(n => grantSource(n, u));
  const src = gs.map(g => { const st = allStratagems().find(x => x.name === g.name);
    return '<div class="gsrc">' + (gs.length > 1 ? '<p class="gh"><b>' + esc(g.name) + '</b></p>' : '') + (g.what ? '<p class="gw2">' + esc(g.what) + '</p>' : '') +
    textWithTable(g) + (st ? '<p class="note">Not the ' + esc(st.cp) + 'CP ' + esc(st.name) + ' stratagem, which has the same name.</p>' : '') + '</div>'; }).join('');
  const r = kw ? ruleFor(kw) : null;
  const own = r ? '<div class="gown"><p class="gh"><b>' + esc(r.name) + '</b> <span class="tg m">' + esc(r.src) + '</span></p>' + rt(r.text) + (r.table ? ttable(r.table) : '') + '</div>' : '';
  openSheet(esc(what) + ' · granted by', gs.map(g => g.name).join(' + '), src + '<p class="note">' + (kw ? 'Already in the keywords shown' : 'Already in the value shown') + ' (as New Recruit and BSData list ' + (kw ? 'them' : 'it') + ').</p>' + own);
}
function showStrat(id){
  const s = allStratagems().find(x => x.id === id);
  if(s) openSheet(esc(s.cp + 'CP · ' + stratWhenLine(s)), s.name, '<div class="sb">' + stratBody(s) + '</div>' + askRefBtn('strat', s.id, 'stratagem'));
}
function showAbility(key){
  searchIndex();
  const e = abilityIndex.get(key);
  if(e) openSheet(esc(['Ability', e.ab.tag, e.ab.ph ? whenTag(e.ab) : ''].filter(Boolean).join(' · ')), e.ab.name, rt(e.ab.text) + usedBy('Unit', e.units) + askRefBtn('ability', key, 'ability'));
}
function showEnhancement(key){
  const [did, name] = key.split('|');
  const d = detachments().find(x => x.id === did), e = d && d.enhancements.find(x => x.name === name);
  if(!e) return;
  const hs = holders(army(), name);
  openSheet(esc((e.upgrade ? 'Upgrade' : 'Enhancement') + ' · ' + d.name + (e.pts ? ' · ' + e.pts + ' pts' : '')), e.name, rt(e.text) + (hs.length ? '<p class="usedby"><span class="il">On</span>' + hs.map(u => linkTo('unit', u.id, holderName(u, name))).join(', ') + '</p>' : '<p class="usedby">Not in this list.</p>') + askRefBtn('enh', key, (e.upgrade ? 'upgrade' : 'enhancement')));
}
// drag the sheet down to close it
(() => {
  const sh = $('#sheet');
  let y0 = null, dy = 0;
  sh.addEventListener('touchstart', e => { y0 = $('#sheetIn').scrollTop <= 0 ? e.touches[0].clientY : null; dy = 0; }, { passive:true });
  sh.addEventListener('touchmove', e => {
    if(y0 == null) return;
    dy = e.touches[0].clientY - y0;
    if(dy < 0){ y0 = null; dy = 0; sh.classList.remove('drag'); sh.style.removeProperty('--drag'); return; }
    sh.classList.add('drag'); sh.style.setProperty('--drag', dy + 'px');
  }, { passive:true });
  sh.addEventListener('touchend', () => {
    sh.classList.remove('drag');
    if(y0 != null && dy > 90) closeSheet(); else sh.style.removeProperty('--drag');
    y0 = null;
  });
  $('#sheetBack').addEventListener('touchmove', e => e.preventDefault(), { passive:false });
})();

let tt = null;
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.remove('act'); t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2200); }
// a toast with an Undo button (New game), shown long enough to reach it
let undoFn = null;
function toastUndo(m, fn){ const t = $('#toast'); undoFn = fn; t.innerHTML = esc(m) + '<button class="tundo" data-undo>Undo</button>'; t.classList.add('show', 'act'); clearTimeout(tt);
  tt = setTimeout(() => { t.classList.remove('show', 'act'); undoFn = null; }, 6000); }

// a quick double tap must not also hit whatever the new screen put under your finger
document.addEventListener('click', e => {
  if(performance.now() - navAt < 350 && !e.target.closest('[data-close]')){ e.preventDefault(); e.stopPropagation(); }
}, true);
document.addEventListener('click', e => {
  const el = e.target.closest('button, [role="button"]');
  if(!el) return;
  const inSheet = !!el.closest('#sheetHost');
  const ds = el.dataset;
  if(el.hasAttribute('data-close')){ closeSheet(); return; }
  if(el.hasAttribute('data-back')){ back(); return; }
  if(el.hasAttribute('data-find')){ focusSearch = true; go({ s:'army', army:army().id }); return; }
  if(el.hasAttribute('data-mine')){ toMine(); return; }
  if(el.hasAttribute('data-oppick')){ oppPicker(); return; }
  if(ds.oppset != null){ setOpp(army(), ds.oppset); closeSheet(); rerender(); return; }
  if(ds.army){ const next = { s:'army', army:ds.army };
    // a list opened from the home screen is yours; the opponent's list opened from yours is a look at theirs
    if(cur.s === 'home') { sess.mine = ds.army; sess.peekD = null; }
    if(el.hasAttribute('data-peek')) sess.peekD = cur.d || 0;
    saveSession();
    if(inSheet){ hideSheet(); go(next, 'sheet'); } else go(next); return; }   // an army opens on Find: search, Overview and every list
  if(el.hasAttribute('data-settings')){ go({ s:'settings' }); return; }
  if(ds.hfopen){ showHomeFilter(ds.hfopen); return; }
  if(ds.hf){ const i = ds.hf.indexOf('|'), k = ds.hf.slice(0, i), v = ds.hf.slice(i + 1), f = homeFilter();
    if(v) f[k] = v; else delete f[k];
    store.set('wh-home-filter', f); closeSheet(); rerender(); return; }
  if(el.hasAttribute('data-hfclear')){ store.set('wh-home-filter', {}); rerender(); return; }
  if(el.hasAttribute('data-roll')){ rollArmy(); return; }
  if(el.hasAttribute('data-ask')){ openAsk(); return; }
  if(el.hasAttribute('data-asksend')){ askSend(); return; }
  if(el.hasAttribute('data-askkeygo')){ hideSheet(); go({ s:'settings' }); const k = $('#askKey'); if(k){ k.scrollIntoView({ block:'center' }); k.focus(); } return; }
  if(el.hasAttribute('data-askstop')){ if(askBusy) askBusy.abort(); return; }
  if(ds.askref){ const i = ds.askref.indexOf('|'), k = ds.askref.slice(0, i), v = ds.askref.slice(i + 1);
    if(!askRefs.some(r => r.k === k && r.v === v && r.army === army().id)) askRefs.push({ k, v, army:army().id, label:askRefLabel(k, v) });
    if(askOn()) openAsk(); else { hideSheet(); openAsk(); } return; }
  if(ds.askunref != null){ askRefs.splice(+ds.askunref, 1); const rc = $('#askRefs'); if(rc) rc.innerHTML = askRefChips(); return; }
  if(el.hasAttribute('data-asknew')){ askConv = null; openAsk(); return; }
  if(el.hasAttribute('data-askkey')){ askKeySave(); return; }
  if(el.hasAttribute('data-askforget')){ const c = askCfg(); store.set('wh-ask', { model:c.model }); askConv = null; rerender(); toast('Key removed from this phone'); return; }
  if(ds.askmodel){ store.set('wh-ask', Object.assign(askCfg(), { model:ds.askmodel })); rerender(); return; }
  if(ds.dmpick){ dmPicker(ds.dmpick); return; }
  // the answer opens the working; "And back?" the return blow
  if(el.hasAttribute('data-dmwork')){ dmWorkSheet(); return; }
  if(el.hasAttribute('data-dmback')){ dmBackSheet(); return; }
  // they attack / you attack: the same two units the other way round, each way with its own choices
  if(el.hasAttribute('data-dmswap')){ const st = dmState(); if(dmSwap(st, dmPair(st))){ saveSession(); if(!$('#sheetHost').hidden) closeSheet(); render(); scrollTo(0, 0); } return; }
  // a choice in the list or a chip: changed in place, the answer redrawn where it is
  if(ds.dmlv != null){ const lv = DM_LV.get(ds.dmlv); if(lv){ lv.apply(dmState()); saveSession(); rerender(); } return; }
  if(el.hasAttribute('data-dmreset')){ const st = dmState(); for(const k of ['on', 'off', 'pick', 'man', 'val']) st[k] = {}; delete dmRank[dmPairKey(st)]; saveSession(); rerender(); return; }
  if(el.hasAttribute('data-dmmanclear')){ dmState().man = {}; saveSession(); rerender(); return; }
  if(ds.dmgo === 'nc'){ const d = $('#dmNc'), a = $('#dmAns'); if(d){ d.open = true; dmState().fold.nc = true; saveSession();
    scrollTo(0, d.getBoundingClientRect().top + scrollY - $('#top').getBoundingClientRect().bottom - (a ? a.offsetHeight + 12 : 0)); } return; }
  if(el.hasAttribute('data-dmoppclear')){ setOpp(army(), ''); closeSheet(); rerender(); return; }
  // your unit, or theirs: from any list, or typed (a target only)
  if(ds.dmunit){ const [k, a, id] = ds.dmunit.split('|'), st = dmState(), me1 = st.dir === 'me';
    if(k === 'mine'){ if(me1) st.atk = id; else st.tgt = id; }
    else if(a === 'typed'){ if(me1) st.tArmy = 'typed'; }
    else if(me1){ st.tArmy = a; st.tgt = id; } else { st.aArmy = a; st.atk = id; }
    saveSession(); closeSheet(); rerender(); return; }
  if(ds.dmty){ const [k, d] = ds.dmty.split('|'); dmTypedStep(dmState(), k, +d); saveSession(); rerender(); return; }
  if(ds.dmtkw){ const st = dmState(), t = dmTypedVals(st); st.typed.kw = Object.assign({}, t.kw, { [ds.dmtkw]:!t.kw[ds.dmtkw] }); saveSession(); rerender(); return; }
  if(ds.dmset || ds.dmman || ds.dmrr){
    const st = dmState();
    if(ds.dmset){ const [k, v] = ds.dmset.split('|'); st[k] = v; }
    // a save or Feel No Pain set by hand: none, 6+ … 2+ (plus is better)
    if(ds.dmman){ const [k, v] = ds.dmman.split('|');
      if(k === 'tInsv' || k === 'tFnp'){ const x = +st.man[k] || 7, y = +v > 0 ? x - 1 : x + 1; st.man[k] = y >= 7 ? 0 : Math.max(2, y); }
      else st.man[k] = Math.max(-3, Math.min(6, (+st.man[k] || 0) + +v)); }
    if(ds.dmrr){ const [k, v] = ds.dmrr.split('|'); st.man[k] = v; }
    saveSession(); rerender(); return;
  }
  if(ds.go){ go({ s:ds.go, army:army().id }); return; }
  if(ds.unit){
    const next = { s:'unit', army:army().id, unit:ds.unit };
    if(sameScreen(next, cur)){ if(inSheet) closeSheet(); if(ds.sec) jumpTo(ds.sec, true); else scrollTo(0, 0); return; }
    if(inSheet){ hideSheet(); go(next, 'sheet'); } else go(next);
    if(ds.sec) jumpTo(ds.sec, true);
    return;
  }
  if(ds.grant){ e.preventDefault(); showGrant(ds.grant.split('|'), ds.gu, ds.what, ds.rule || null); return; }
  if(ds.rule){ e.preventDefault(); showRule(ds.rule); return; }
  if(ds.strat){ e.preventDefault(); showStrat(ds.strat); return; }
  if(ds.ability){ showAbility(ds.ability); return; }
  if(ds.enh){ showEnhancement(ds.enh); return; }
  if(ds.more){ moreShown.add(ds.more); renderFinder(); return; }
  if(el.hasAttribute('data-sback') && sheetStack.length){ const [l, t, h] = sheetStack.pop(); openSheet(l, t, h, true); return; }
  if(el.hasAttribute('data-verified')){ showVerified(); return; }
  if(ds.themePick){ store.set('wh-theme', ds.themePick); applyTheme(); rerender(); return; }
  if(ds.tab){
    if(ds.tab === cur.s){ scrollTo(0, 0); return; }
    // another tab: back to the screen you left it on; the tab you are in: its first screen
    const mk = memoKey(army().id, ds.tab), memo = tabOf(cur.s) !== ds.tab && tabMemo[mk] && tabMemo[mk].s !== ds.tab ? tabMemo[mk] : null;
    const next = { s:ds.tab, army:army().id, then:memo }, up = (cur.d || 0) - (cur.root == null ? cur.d || 0 : cur.root);
    if(!isTab(cur.s)) tabMemo[memoKey(cur.army, tabOf(cur.s))] = Object.assign(plain(cur), spot());
    if(up > 0 && !EMBEDDED && history.state && history.state.d === cur.d){ tabTo = next; history.go(-up); return; }   // drop the screens under the old tab
    openTab(next); return;
  }
  if(ds.flip){ go({ s:'unit', army:army().id, unit:ds.flip, from:cur.from }, 'replace'); return; }
  if(ds.tick){
    e.preventDefault();   // a box on an ability row must not open or close it
    const u = usedSet(), k = ds.tick, on = !u.has(k);
    on ? u.add(k) : u.delete(k); store.set(usedKey(), [...u]);
    document.querySelectorAll('[data-tick="' + CSS.escape(k) + '"]').forEach(b => { b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); b.textContent = on ? '✓' : ''; });
    return;
  }
  if(el.hasAttribute('data-newgame')){ const was = [...usedSet()], key = usedKey(); store.set(key, []); rerender();
    toastUndo('New game: uses per battle cleared', () => { store.set(key, was); rerender(); }); return; }
  if(el.hasAttribute('data-undo')){ const f = undoFn; undoFn = null; $('#toast').classList.remove('show', 'act'); if(f){ f(); toast('Ticks restored'); } return; }
  if(el.hasAttribute('data-awake')){ awake.on = !awake.on; store.set('wh-awake', awake.on); if(awake.on) keepAwake(); else if(awake.lock){ awake.lock.release(); awake.lock = null; } rerender(); return; }
  if(el.hasAttribute('data-expand')){
    const cards = $$('#view details.strat');
    const openAll = cards.some(d => !d.open);
    cards.forEach(d => d.open = openAll);
    el.textContent = openAll ? 'Collapse all' : 'Expand all';
  }
});
// the damage calculator's tick boxes and a typed target's numbers
document.addEventListener('change', e => {
  const t = e.target;
  if(t.matches && t.matches('[data-dmtyped]')){ const st = dmState(), k = t.dataset.dmtyped, v = parseInt(t.value, 10);
    // Models, T and W at least 1 (at most 100, 30, 99); Sv, InSv and Feel No Pain 2+ to 6+, blank or anything else: none
    const top = { n:100, T:30, W:99 }[k];
    st.typed[k] = top ? Math.min(top, Math.max(1, v || DM_TYPED[k])) : !(v >= 2 && v <= 6) ? 0 : v;
    saveSession();
    // redrawn once the field is left; a typed field tapped next keeps the focus
    setTimeout(() => { const a = document.activeElement, next = a && a.dataset ? a.dataset.dmtyped : null; rerender();
      if(next){ const f = $('[data-dmtyped="' + next + '"]'); if(f) f.focus({ preventScroll:true }); } }, 0);
    return; }
  if(!t.matches || !t.matches('[data-dmw], [data-dmon]')) return;
  const st = dmState();
  if(t.dataset.dmw){
    st.off[t.dataset.dmw] = !t.checked;
    // a model fights with one melee weapon: the others its models line could pick are unticked
    if(t.checked && t.dataset.dmx) for(const k of JSON.parse(t.dataset.dmx)) st.off[k] = true;
  }
  else { st.on[t.dataset.dmon] = t.checked; if(t.checked) for(const k of DM_ONE_OF[t.dataset.dmon] || []) st.on[k] = false; }   // a box ticked for you can be unticked
  saveSession(); rerender();
});

/* ---------- install + live updates ---------- */
const INSTALLED = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const ON_SITE = /github\.io$|^localhost$|^127\.0\.0\.1$/.test(location.hostname);
const SITE_URL = 'https://marastefanic-cmd.github.io/warhammerapp/';
function installText(){
  if(INSTALLED) return 'Installed on this phone. It updates itself each time you open it.';
  if(ON_SITE) return 'Put it on your home screen: Safari → Share → Add to Home Screen.';
  return 'Phone app: open <a class="link" href="' + SITE_URL + '" target="_blank" rel="noopener">' + SITE_URL.replace('https://', '') + '</a> in Safari, then Share → Add to Home Screen.';
}
// the home-screen app has no browser back gesture: swipe in from the left edge to go back
if(INSTALLED){
  let sx = null, sy = 0;
  addEventListener('touchstart', e => { const t = e.touches[0]; sx = t.clientX < 24 && $('#sheetHost').hidden && cur.s !== 'home' ? t.clientX : null; sy = t.clientY; }, { passive:true });
  addEventListener('touchend', e => { if(sx == null) return; const t = e.changedTouches[0]; if(t.clientX - sx > 70 && Math.abs(t.clientY - sy) < 50) back(); sx = null; }, { passive:true });
}
try { if(ON_SITE && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch(e){}
// the installed copy compares its build stamp with the site's. On opening it reloads at once;
// later it waits until you are back on the army list or the menu, so it never moves you mid-read.
let updateReady = null;
// one reload per new version (a retry after two minutes, in case the first got a stale page);
// if nothing can be stored, never reload, rather than reload forever
const RELOAD_KEY = 'wh-reloaded-for';
function reloadedRecently(v){
  for(const k of ['sessionStorage','localStorage']){
    try { const r = JSON.parse(window[k].getItem(RELOAD_KEY) || 'null'); if(r && r.v === v && Date.now() - r.at < 120000) return true; } catch(e){}
  }
  return false;
}
function markReload(v){
  for(const k of ['sessionStorage','localStorage']){
    try { window[k].setItem(RELOAD_KEY, JSON.stringify({ v, at:Date.now() })); if(JSON.parse(window[k].getItem(RELOAD_KEY)).v === v) return true; } catch(e){}
  }
  return false;
}
function reloadNow(){
  if(!markReload(updateReady)){ updateReady = null; return; }
  try { history.replaceState(Object.assign(plain(cur), spot()), ''); } catch(e){}
  saveSession();
  location.reload();
}
async function checkForUpdate(atStart){
  if(!ON_SITE || !BUILD) return;
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache:'no-store' });
    if(!r.ok) return;
    const v = (await r.json()).version;
    if(!v || v === BUILD || reloadedRecently(v)) return;
    updateReady = v;
    if(atStart || (calm(cur) && $('#sheetHost').hidden && document.activeElement !== $('#armyQ'))) reloadNow();
  } catch(e){}
}
function saveSpot(){
  const sp = spot();
  try { if(!(history.state && history.state.sheet)) history.replaceState(Object.assign(plain(cur), sp), ''); } catch(e){}
  store.set('wh-last', Object.assign(plain(cur), sp));
}
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') checkForUpdate(false); else saveSpot(); });
addEventListener('pagehide', saveSpot);

/* ---------- boot ---------- */
try { history.scrollRestoration = 'manual'; } catch(e){}
// keep the current history entry if it is a screen (a reload), otherwise rebuild the last screen's chain
function start(snap){
  const st = history.state;
  if(snap && snap.open){ snap.open.forEach(id => openStrats.add(id)); Object.assign(query, snap.query || {}); }
  if(st && valid(st)){   // a reload: this entry is the screen (with a popup open, the screen under it)
    cur = plain(st);
    if(st.sheet){ try { history.replaceState(plain(cur), ''); } catch(e){} }
    render(); toSpot(st);
  }
  else if(snap && valid(snap.cur)){ restore(snap.cur); toSpot(snap); }
  else { const last = store.get('wh-last'); restore(valid(last) ? last : ONLY ? { s:'army', army:ONLY.id } : { s:'home' }); if(valid(last)) toSpot(last); }
  checkForUpdate(true);
  keepAwake();
}
const hot = window.claude && window.claude.hot;
if(hot && hot.snapshot){ try { hot.snapshot(() => ({ cur:plain(cur), y:scrollY, open:[...openStrats], query })); } catch(e){} }
if(hot && hot.ready) hot.ready(start); else start(hot && hot.data ? hot.data : null);
