  const group = list => { const m = new Map(); for(const [u, ab] of list){ const k = ab.name + '|' + ab.text; if(!m.has(k)) m.set(k, { ab, units:[] }); m.get(k).units.push(u); } return [...m.values()]; };
  const abLine = g => linkTo('ability', abilityKey(g.ab), g.ab.name) + ' <span class="from">· ' + esc(unitNames(g.units)) + '</span>';
  const rulesOf = units.length ? f.armyRules.filter(r => !inertRule(r.name)).map(r => ({ r, src:f.name + ' army rule' }))
    .concat(detachments().filter(d => d.rule).map(d => ({ r:d.rule, src:d.name }))) : [];
  const ruleLine = x => linkTo('rule', x.r.name, x.r.name) + ' <span class="from">· ' + esc(x.src) + '</span>';
  const nameLink = u => linkTo('unit', u.id, u.short || u.name);   // without its enhancement: the line says it
  const allAbs = units.flatMap(u => u.abilities.filter(ab => !naReason(ab)).map(ab => [u, ab]));
  // Deep Strike (24.09) and Scouts (24.31) work only if every model in the unit has them; u.partialRules names
  // the rules only some models of an attached unit have (Slaughterbound's Scouts 6": its Exalted Eightbound have none)
  const everyModel = (u, test) => unitRules(u).some(test) && !(u.partialRules || []).some(test);
  // rules resolved before Declare Battle Formations (Code Chivalric: end of the Read Mission Objectives step)
  const early = rulesOf.filter(x => /read mission objectives/i.test(x.r.text));

  // your list
  const warlord = units.filter(u => u.warlord);
  const enh = units.flatMap(u => [u.enhancement, u.upgrade].filter(Boolean).map(n => { const d = detachments().find(x => (x.enhancements || []).some(e => e.name === n)), e = d && d.enhancements.find(x => x.name === n);
    return (d ? linkTo('enh', d.id + '|' + n, n) : esc(n)) + (n === u.upgrade ? ' <span class="from">(upgrade)</span>' : '') + (e && e.pts ? ' <span class="from">' + e.pts + ' pts</span>' : '') + ' on ' + (n === u.enhancement && u.enhOn ? linkTo('unit', u.id, u.enhOn) : n === u.upgrade && u.leads ? linkTo('unit', u.id, u.leads) : nameLink(u)); }));
  const led = units.filter(u => u.leads).flatMap(u => charsOf(u).map((c, i) => (i ? linkTo('unit', u.id, c.name) : nameLink(u)) + (c.support ? ' supports ' : ' leads ') + esc(u.leads) + (u.copies > 1 ? ' <span class="from">×' + u.copies + ' units</span>' : '')));
  let h = sec('Your list',
    row('Warlord', warlord.map(u => u.warlordOn ? linkTo('unit', u.id, u.warlordOn) + ' <span class="from">(' + esc(unitLabel(u)) + ')</span>' : unitLink(u)).join(', ')) +
    row('Enhance&shy;ments', enh.join('<br>')) +
    row('Attached', led.join('<br>')) +
    row('Detach&shy;ments', esc(detachments().map(d => d.name + (d.dp ? ' (' + d.dp + ' DP)' : '')).join(', ')) + (a.disposition ? '<br><span class="from">Disposition:</span> ' + esc(a.disposition) : '')) +
    row('Points', esc(a.pointsUsed + ' / ' + a.points + ' · ' + a.battleSize)));

  const earlyAbs = group(allAbs.filter(([u, ab]) => /read mission objectives/i.test(ab.text)));
  h += sec('Read Mission Objectives step', row('Rules', early.map(ruleLine).join('<br>')) + row('Abilities', earlyAbs.map(abLine).join('<br>')));

  // declare battle formations: reserves and transports
  const ds = units.filter(u => everyModel(u, r => ruleKey(r) === 'Deep Strike'));
  const dsPts = ds.reduce((t, u) => t + (u.pts || 0) * (u.copies || 1), 0), half = Math.floor(a.points / 2);
  const transports = units.filter(u => hasKw(u, 'Transport')).map(u => { const ab = u.abilities.find(x => /transport capacity/i.test(x.text)); return unitLink(u) + (ab ? ': <span class="from">' + inline(ab.text.replace(/(^|\n)\*([^*\n][^\n]*[^*\n])\*(?=\n|$)/g, '$1$2').replace(/\n(- )?/g, ' ')) + '</span>' : ''); });
  h += sec('Declare battle formations',
    row('Reserves', linkTo('rule', 'Strategic Reserves', 'Strategic reserves') + ' (not FORTIFICATIONS): unless otherwise stated, up to ' + half + ' pts (50% of the ' + a.points + ' limit), counting units embarked within a TRANSPORT you place there. Unless otherwise stated, they can only arrive from the second battle round onwards, and any that have not arrived by the end of round 3 are destroyed (not repositioned units, nor units embarked within a TRANSPORT that arrived).' +
      (ds.length ? '<br><span class="from">Can ' + linkTo('rule', 'Deep Strike', 'Deep Strike') + ':</span> ' + ds.map(u => unitLink(u) + ' <span class="from">' + u.pts + ' pts' + (u.copies > 1 ? ' each' : '') + '</span>').join(', ') + (ds.length > 1 ? ' <span class="from">(all: ' + dsPts + ' pts)</span>' : '') : '')) +
    row('Transports', transports.join('<br>')));

  // deployment and pre-battle abilities
  const scouts = units.filter(u => everyModel(u, r => /^scouts|^infiltrators/i.test(r)));
  const pre = group(allAbs.filter(([u, ab]) => PREGAME_RE.test(ab.text) && !/start of the first battle round|read mission objectives/i.test(ab.text)));
  h += sec('Deployment and pre-battle abilities',
    row('Scouts', scouts.map(u => unitLink(u) + ' <span class="from">' + esc(unitRules(u).filter(r => /^scouts|^infiltrators/i.test(r)).join(', ')) + '</span>').join('<br>')) +
    row('Abilities', pre.map(abLine).join('<br>')) +
    row('Rules', rulesOf.filter(x => PREGAME_RE.test(x.r.text) && !early.includes(x)).map(ruleLine).join('<br>')));

  // decided at the start of the battle or of every battle round
  const first = group(allAbs.filter(([u, ab]) => /start of the first battle round/i.test(ab.text)));
  const round = rulesOf.filter(x => /start of (the|each|every) battle round/i.test(x.r.text)).map(ruleLine)
    .concat(group(allAbs.filter(([u, ab]) => /start of (the|each|every) battle round/i.test(ab.text) && !/start of the first battle round/i.test(ab.text))).map(abLine));
  const firstRules = rulesOf.filter(x => /start of the first battle round/i.test(x.r.text)).map(ruleLine);
  h += sec('Start of the battle round', row('First round', firstRules.concat(first.map(abLine)).join('<br>')) + row('Every round', round.join('<br>')));

  // uses per battle: the resources you spend, ticked off until New game
  // a rule that gives units a "(Once per battle, per unit)" ability (Higher Imperatives) is ticked on those units, not here
  const ruleOnce = r => perBattle(r) && !/per battle\b(?! round)[^.)]*\bper unit\b/i.test(r.text || '');
  const onceRules = f.armyRules.filter(r => !inertRule(r.name) && ruleOnce(r)).map(r => ({ r, src:f.name + ' army rule' }))
    .concat(detachments().filter(d => d.rule && ruleOnce(d.rule)).map(d => ({ r:d.rule, src:d.name })));
  const tl = (boxes, text) => '<div class="tl">' + boxes + '<span>' + text + '</span></div>';
  const ruleTicks = x => { const r = x.r, pb = perBattle(r, true);
    // "You can only select each of these abilities once per battle" (Kindred Sorcery): a box per option
    if(/\beach of these [a-z ]+ once per battle/i.test(r.text) && r.table) return '<div class="tl"><span>' + ruleLine(x) + ':</span></div>' + r.table.map(o => tl(ticks('r:' + r.name + ':' + o[0], 1, '', o[0]), esc(o[0]))).join('');
    return tl(ticks('r:' + r.name, pb.n, '', r.name), ruleLine(x)); };
  const onceAbs = group(allAbs.filter(([u, ab]) => perBattle(ab)));
  const abTicks = g => perBattle(g.ab).army ? tl(abilityTicks(g.ab, g.units[0]), abLine(g) + ' <span class="tg once">per army</span>')
    : g.units.flatMap(u => Array.from({ length:u.copies || 1 }, (_, i) => tl(ticks(copyKey(g.ab, u, i), perBattle(g.ab).n, '', g.ab.name + (u.copies > 1 ? ', Unit ' + (i + 1) : '')),
        linkTo('ability', abilityKey(g.ab), g.ab.name) + ' · ' + linkTo('unit', u.id, unitLabel(u)) + (u.copies > 1 ? ' <span class="from">· Unit ' + (i + 1) + '</span>' : '')))).join('');
  const onceStrats = allStratagems().filter(s => eligible(s).length && perBattle(s));
  h += sec('Uses per battle',
    row('Rules', onceRules.map(ruleTicks).join('')) +
    row('Abilities', onceAbs.map(abTicks).join('')) +
    row('Strata&shy;gems', onceStrats.map(s => tl(ticks('s:' + s.id, perBattle(s, true).n, '', s.name), linkTo('strat', s.id, s.cp + 'CP ' + s.name))).join('')));
  if(onceRules.length || onceAbs.length || onceStrats.length) h = h.replace(/(<div class="sec-h"><h2>Uses per battle<\/h2>)/, '$1<button class="textbtn" data-newgame>New game</button>');
  return h + '<p class="note">Gathered from this list’s datasheets and rules; each line opens the full text.</p>';
}

/* ---------- screen: rules & keywords ---------- */
const xp = (name, sub, tags, body, open) => '<details class="xp"' + (open ? ' open' : '') + '><summary><span class="xh"><b>' + esc(name) + '</b>' + (sub ? '<span>' + esc(sub) + '</span>' : '') + '</span>' +
  (tags || '') + chev + '</summary><div class="body">' + body + '</div></details>';
// the core rules a player looks up every game, from the Core Rules (07 The Battle Round, 08 Command
// Phase, 05 Attack Sequence; the dice in its tables are pictures, read from the printed page)
function quickRef(){
  const tr = rows => '<div class="qtab">' + rows.map(([k, v]) => '<span>' + k + '</span><span>' + v + '</span>').join('') + '</div>';
  return xp('Quick reference', 'Turn order · Command phase · hit, wound and save rolls', '',
    '<p class="qh">Battle round (07)</p><p>Start of battle round → both players take a turn (the mission says who goes first) → end of battle round.</p>' +
    '<p class="qh">Each turn (07.02)</p><p>Start of turn → Command → Movement → Shooting → Charge → Fight → end of turn.</p>' +
    '<p class="qh">Command phase (08)</p><ol class="qol"><li>Start-of-phase rules.</li><li>Gain Core CP: both players gain 1CP.</li>' +
      '<li>' + linkTo('rule', 'Battle-shock', 'Battle-shock') + ': a roll for each of your units that is battle-shocked or at or below ' + linkTo('rule', 'Starting Strength', 'half-strength') + '.</li>' +
      '<li>Command abilities.</li><li>End-of-phase rules.</li></ol>' +
    '<p class="qh">Hit roll (05.01)</p>' + tr([['Unmodified 1', 'fails'], ['Unmodified 6', 'critical hit'], ['≥ BS / WS', 'hit']]) +
    '<p class="qh">Wound roll (05.02)</p>' + tr([['Unmodified 1', 'fails'], ['Unmodified 6', 'critical wound'], ['S ≥ 2× T', '2+'], ['S > T', '3+'], ['S = T', '4+'], ['S < T', '5+'], ['S ≤ ½ T', '6+']]) +
    '<p class="qh">Save roll (05.03, 05.04)</p>' + tr([['Unmodified 1', 'damage'], ['≥ InSv', 'saved (AP does not apply)'], ['≥ Sv after AP', 'saved'], ['Otherwise', 'the model loses D wounds']]) +
    '<p class="note">Allocation order (05.03): a non-CHARACTER group containing a model that has lost one or more wounds must be first; no CHARACTER group can be earlier than a non-CHARACTER group; CHARACTER groups containing a model that has lost one or more wounds must be earlier than CHARACTER groups containing no wounded models.</p>', false);
}
/* ---------- screen: rules ----------
   The rules of this list, laid out like a datasheet: a heading per section, a chip per
   detachment, one row per rule (its timing on the right, its text one tap away). The core
   rules the army uses are folded at the bottom, for reference. */
// a rule row: its name, and under it what kind of rule it is and when (the datasheet's second line)
function ruleRow(name, meta, body, cls){
  return '<details class="ab rr' + (cls ? ' ' + cls : '') + '"><summary><span class="an"><b>' + esc(name) + '</b>' + (meta ? '<span class="rs">' + meta + '</span>' : '') + '</span>' +
    chev + '</summary><div class="body">' + body + '</div></details>';
}
const metaLine = (...parts) => parts.filter(Boolean).join(' <span class="sep">·</span> ');
// a rules text with its table where the source prints it: tableAt = the number of text lines before it
// (Try Dat Button!: "…have the relevant rule(s):", the table, then the hazard-roll line)
function textWithTable(r){
  if(!r.table) return rt(r.text);
  const lines = String(r.text || '').split('\n'), at = r.tableAt == null ? lines.length : r.tableAt;
  return rt(lines.slice(0, at).join('\n')) + ttable(r.table) + (at < lines.length ? rt(lines.slice(at).join('\n')) : '');
}
function screenRules(){
  const f = faction(), a = army(), dets = detachments();
  const note = r => r.note ? '<p class="note it">' + esc(r.note) + '</p>' : '';
  const when = r => r.ph ? esc(shortWhen(r)) : '';
  const first = x => { const ph = phasesOf(x); return ph.length === PHASES.length ? 99 : PHASES.findIndex(([k]) => k === ph[0]); };
  let h = '<div class="rules"><div class="ds-meta"><span>' + esc(f.name + ' · ' + a.disposition) + '</span></div>';
  // army rules, and the faction's own terms this list uses (Pulse Jet Move)
  const terms = Object.keys(D.ruleSrc || {}).filter(k => /army rule/i.test(D.ruleSrc[k]) && ruleUsers(k).length);
  h += '<div class="dsec"><h2 class="lbl">Army rules</h2><div class="abl">' + f.armyRules.map(r => {
    const once = r.tag && /^(once|twice) per /i.test(r.tag) ? r.tag : '';
    return ruleRow(r.name, metaLine(once ? '<span class="tg once">' + esc(once) + '</span>' : r.tag ? esc(r.tag) : '', when(r), inertRule(r.name) ? 'no unit in this list it applies to' : ''),
      note(r) + textWithTable(r) + ((r.missing || []).length ? '<p class="note">Not in the app yet: the ' + esc(r.missing.join(' and ')) + ' (they need that Wahapedia page).</p>' : ''), inertRule(r.name) ? 'na' : '');
  }).join('') + terms.map(k => ruleRow(k, metaLine(esc(D.ruleSrc[k].replace(/^.*?\((.*)\)$/, '$1'))), rt(D.rules[k]) + usedBy('Used by', ruleUsers(k)))).join('') + '</div></div>';
  // detachments: the rule, the enhancements this list takes (and who has them), the others, its stratagems
  h += '<div class="dsec"><h2 class="lbl">Detachments</h2>';
  for(const d of dets){
    const mine = d.enhancements.filter(e => holders(a, e.name).length), other = d.enhancements.filter(e => !holders(a, e.name).length);
    const gap = (d.missing || []).includes('enhancements') ? '<p class="note">The other ' + esc(d.name) + ' enhancements aren’t in the app yet: they need the Wahapedia page.</p>' : '';
    // in the Stratagems tab's order: phase order, the ones no unit can use last
    const strats = (d.stratagems || []).map((x, i) => [x, i]).sort((x, y) => (eligible(x[0]).length ? 0 : 1) - (eligible(y[0]).length ? 0 : 1) || first(x[0]) - first(y[0]) || x[1] - y[1]).map(x => x[0]);
    h += '<h3 class="who">' + esc(d.name) + '</h3><div class="abl">' +
      (d.rule ? ruleRow(d.rule.name, metaLine('Detachment rule', when(d.rule)),
        note(d.rule) + textWithTable(d.rule) + usedBy('Applies to', a.units.filter(u => matches(d.rule.needs, u)))) : '') +
      mine.map(e => { const hs = holders(a, e.name); return ruleRow(e.name, metaLine('<span class="tg">' + (e.upgrade ? 'Upgrade' : 'Enhancement') + '</span>', e.pts ? esc(e.pts) + ' pts' : '', 'on ' + esc(hs.map(u => holderName(u, e.name)).join(', '))),
        rt(e.text) + '<p class="usedby"><span class="il">On</span>' + hs.map(u => linkTo('unit', u.id, holderName(u, e.name))).join(', ') + '</p>'); }).join('') +
      (other.length ? ruleRow('Other enhancements', metaLine(other.length + ' not in this list'),
        other.map(e => '<div class="sub"><b class="nm">' + esc(e.name) + '</b>' + (e.pts ? ' <span class="tg m">' + esc(e.pts) + ' pts</span>' : '') + rt(e.text) + '</div>').join(''), 'oth') : '') +
      '</div><p class="dline rs"><span class="il">Stratagems</span>' + (strats.length ? strats.map(st => eligible(st).length ? linkTo('strat', st.id, st.name) : '<span class="none">' + linkTo('strat', st.id, st.name) + ' <span class="from">(no unit in this list)</span></span>').join(', ') : 'none (a rule and enhancements only)') + '</p>' + gap;
  }
  h += '</div>';
  // the core rules and weapon keywords this army uses, each listed once (folded: players know them)
  const used = new Map();
  const add = (label, kind) => {
    const r = ruleFor(label);
    if(!r || r.src !== 'Core rule') return;
    const e = used.get(r.key) || { r, kind, labels:new Set() };
    if(kind === 'weapon') e.kind = 'weapon';
    if(label.toLowerCase() !== r.key.toLowerCase()) e.labels.add(label);
    used.set(r.key, e);
  };
  for(const u of a.units){
    for(const r of unitRules(u)) add(r, 'ability');
    for(const w of [...(u.ranged || []), ...(u.melee || [])]){ for(const k of w.kw) add(k, 'weapon'); if(w.hunter) add('Hunter', 'weapon'); }
    for(const ab of u.abilities) for(const key of Object.keys(D.rules)) if(!CONCEPT.has(key) && mentions(ab.text, key)) add(key, 'ability');
  }
  const gloss = kind => [...used.values()].filter(e => e.kind === kind).sort((x, y) => x.r.key.localeCompare(y.r.key));
  const glossRows = list => list.map(e => xp(e.r.key, e.kind === 'ability' ? unitNames(ruleUsers(e.r.key)) : (e.labels.size ? [...e.labels].sort().join(', ') : ''), '', rt(e.r.text) + usersVia('In this army', e.r.key), false)).join('');
  const ur = gloss('ability'), wk = gloss('weapon');
  h += '<div class="dsec"><h2 class="lbl">Core rules</h2><div class="abl">' +
    quickRef() +
    (ur.length ? ruleRow('Unit rules', metaLine(ur.length + ' used by this list'), '<div class="list">' + glossRows(ur) + '</div>') : '') +
    (wk.length ? ruleRow('Weapon keywords', metaLine(wk.length + ' used by this list'), '<div class="list">' + glossRows(wk) + '</div>') : '') + '</div></div>';
  return h + '</div>';
}

/* ---------- render ---------- */
function render(){
  if(cur.s === 'home' && ONLY) cur = Object.assign(plain(cur), { s:'units', army:ONLY.id });
  tabMemo[memoKey(cur.army, tabOf(cur.s))] = plain(cur);
  renderTop();
  const v = $('#view'), s = cur.s;
  let sub = '', bot = '';
  if(s === 'home') v.innerHTML = screenHome();
  else if(s === 'army') v.innerHTML = screenArmy();
  else if(s === 'units'){ v.innerHTML = screenUnits(); sub = unitsSubbar(); }
  else if(s === 'unit') v.innerHTML = screenUnit() + (unitById(cur.unit) ? unitFlip(unitById(cur.unit)) : '');
  else if(s === 'strats') v.innerHTML = screenStrats();
  else if(s === 'ranged' || s === 'melee'){ v.innerHTML = screenWeapons(s); sub = '<div class="wt ' + s + '">' + colHeader(s) + '</div>'; }
  else if(s === 'abilities') v.innerHTML = screenAbilities();
  else if(s === 'rules') v.innerHTML = screenRules();
  else if(s === 'bases') v.innerHTML = screenBases();
  else if(s === 'pregame') v.innerHTML = screenPregame();
  if(cur.army) bot = tabBar();
  setBar('subbar', sub);
  setBar('bbar', bot);
  measure();
  if(s === 'army'){
    const i = $('#armyQ');
    i.value = query[army().id] || '';
    const sync = () => { query[army().id] = i.value; moreShown.clear(); renderFinder(); saveSession(); };
    i.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); i.blur(); } });
    i.addEventListener('input', sync);
    i.addEventListener('search', sync);   // the clear button and Escape empty the box without an input event
    i.addEventListener('keydown', e => { if(e.key === 'Enter') i.blur(); });
    renderFinder();
    if(focusSearch){ focusSearch = false; i.focus(); i.select(); }
  }
  store.set('wh-last', plain(cur));
}
// re-render the same screen in place, keeping the scroll position
function rerender(){ const y = scrollY; render(); scrollTo(0, y); }
function jumpTo(id, instant){
  const sec = $('#sec-' + id);
  if(!sec) return;
  if(sec.tagName === 'DETAILS') sec.open = true;
  const nx = sec.nextElementSibling;
  if(nx && nx.matches('details.pf')) nx.open = true;   // "Ranged … all pistols" folded under the anchor
  measure();
  sec.scrollIntoView({ behavior:instant || matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start' });
}

/* ---------- popup sheet ---------- */
let sheetReturn = null, sheetRule = null, sheetNow = null;
const sheetStack = [];   // the popups under this one (a rule opened from a rule): "‹ Deep Strike" goes back
function openSheet(label, title, html, popped){
  const nested = !$('#sheetHost').hidden;
  navAt = performance.now();
  if(!nested){ sheetReturn = document.activeElement; sheetStack.length = 0; }
  else if(!popped && sheetNow) sheetStack.push(sheetNow);
  sheetNow = [label, title, html];
  const prev = sheetStack[sheetStack.length - 1];
  $('#sheetIn').innerHTML = '<div class="grab" aria-hidden="true"></div>' + (prev ? '<button class="sback" data-sback>‹ ' + esc(prev[1]) + '</button>' : '') +
    (label ? '<p class="lbl">' + label + '</p>' : '') + '<h2 id="sheetTitle">' + esc(title) + '</h2>' + html;
  $('#sheetHost').hidden = false;
  document.documentElement.classList.add('lock');
  $('#top').inert = true; $('#view').inert = true; $('#bbar').inert = true;
  $('#sheetIn').scrollTop = 0;
  $('#sheet').focus();
  try {
    if(!nested) history.replaceState(Object.assign(plain(cur), spot()), '');
    const st = Object.assign(plain(cur), { sheet:1 }); nested && history.state && history.state.sheet ? history.replaceState(st, '') : history.pushState(st, '');
  } catch(e){}
}
function hideSheet(){
  if($('#sheetHost').hidden) return;
  sheetStack.length = 0; sheetNow = null;
  $('#sheetHost').hidden = true;
  $('#sheet').style.removeProperty('--drag');
  document.documentElement.classList.remove('lock');
  $('#top').inert = false; $('#view').inert = false; $('#bbar').inert = false;
  if(sheetReturn && sheetReturn.isConnected) sheetReturn.focus({ preventScroll:true });
}
function closeSheet(){
  if($('#sheetHost').hidden) return;
  hideSheet();
  try { if(history.state && history.state.sheet) history.back(); } catch(e){}
}
function showRule(label){
  const r = ruleFor(label);
  if(!r){ toast('No rule text stored for ' + label); return; }
  const users = r.src === 'Core rule' ? ruleUsers(r.key) : r.needs ? army().units.filter(u => matches(r.needs, u)) : [];
  sheetRule = r.key;   // the rule's own name inside its text is not a link to itself
  const kws = army().units.flatMap(u => [...(u.ranged || []), ...(u.melee || [])].flatMap(w => w.kw)).join(' ').toLowerCase();
  const text = r.text.split('\n').filter(l => { const m = /^\*App note[^\n]*suffix “([^”]+)”/.exec(l); return !m || kws.includes(m[1].toLowerCase()); }).join('\n');
  const body = textWithTable({ text, table:r.table, tableAt:r.tableAt });
  sheetRule = null;
  const gap = (r.missing || []).length ? '<p class="note">Not in the app yet: the ' + esc(r.missing.join(' and ')) + '.</p>' : '';
  openSheet(esc(r.src), CONCEPT.has(r.key) ? r.key : r.name, body + (r.note ? '<p class="note it">' + esc(r.note) + '</p>' : '') + gap + (r.src === 'Core rule' ? usersVia('In this army', r.key) : usedBy('In this army', users)));
}
// "Granted by": the rule(s) behind a marked value, their text, then the keyword's own rule
function grantSource(name, u){
  const ab = u && u.abilities.find(a => a.name === name);
  if(ab) return { name, what:[ab.who, ab.tag || 'datasheet ability'].filter(Boolean).join(' · '), text:ab.text };
  const r = ruleFor(name);
  return r ? { name:r.name, what:r.src, text:r.text, table:r.table, tableAt:r.tableAt } : { name, what:'', text:'' };
}
function showGrant(names, unitId, what, kw){
  // the rule that grants it is the headline; the keyword's own rule follows, smaller
  const u = army().units.find(x => x.id === unitId);
  const gs = names.map(n => grantSource(n, u));
  const src = gs.map(g => { const st = allStratagems().find(x => x.name === g.name);
    return '<div class="gsrc">' + (gs.length > 1 ? '<p class="gh"><b>' + esc(g.name) + '</b></p>' : '') + (g.what ? '<p class="gw2">' + esc(g.what) + '</p>' : '') +
    textWithTable(g) + (st ? '<p class="note">Not the ' + esc(st.cp) + 'CP ' + esc(st.name) + ' stratagem, which has the same name.</p>' : '') + '</div>'; }).join('');
  const r = kw ? ruleFor(kw) : null;
  const own = r ? '<div class="gown"><p class="gh"><b>' + esc(r.name) + '</b> <span class="tg m">' + esc(r.src) + '</span></p>' + rt(r.text) + (r.table ? ttable(r.table) : '') + '</div>' : '';
  openSheet(esc(what) + ' · granted by', gs.map(g => g.name).join(' + '), src + '<p class="note">' + (kw ? 'Already in the keywords shown' : 'Already in the value shown') + ' (as New Recruit and BSData list ' + (kw ? 'them' : 'it') + ').</p>' + own);
}
function showStrat(id){
  const s = allStratagems().find(x => x.id === id);
  if(s) openSheet(esc(s.cp + 'CP · ' + stratWhenLine(s)), s.name, '<div class="sb">' + stratBody(s) + '</div>');
}
function showAbility(key){
  searchIndex();
  const e = abilityIndex.get(key);
  if(e) openSheet(esc(['Ability', e.ab.tag, e.ab.ph ? whenTag(e.ab) : ''].filter(Boolean).join(' · ')), e.ab.name, rt(e.ab.text) + usedBy('Unit', e.units));
}
function showEnhancement(key){
  const [did, name] = key.split('|');
  const d = detachments().find(x => x.id === did), e = d && d.enhancements.find(x => x.name === name);
  if(!e) return;
  const hs = holders(army(), name);
  openSheet(esc((e.upgrade ? 'Upgrade' : 'Enhancement') + ' · ' + d.name + (e.pts ? ' · ' + e.pts + ' pts' : '')), e.name, rt(e.text) + (hs.length ? '<p class="usedby"><span class="il">On</span>' + hs.map(u => linkTo('unit', u.id, holderName(u, name))).join(', ') + '</p>' : '<p class="usedby">Not in this list.</p>'));
}
// drag the sheet down to close it
(() => {
  const sh = $('#sheet');
  let y0 = null, dy = 0;
  sh.addEventListener('touchstart', e => { y0 = $('#sheetIn').scrollTop <= 0 ? e.touches[0].clientY : null; dy = 0; }, { passive:true });
  sh.addEventListener('touchmove', e => {
    if(y0 == null) return;
    dy = e.touches[0].clientY - y0;
    if(dy < 0){ y0 = null; dy = 0; sh.classList.remove('drag'); sh.style.removeProperty('--drag'); return; }
    sh.classList.add('drag'); sh.style.setProperty('--drag', dy + 'px');
  }, { passive:true });
  sh.addEventListener('touchend', () => {
    sh.classList.remove('drag');
    if(y0 != null && dy > 90) closeSheet(); else sh.style.removeProperty('--drag');
    y0 = null;
  });
  $('#sheetBack').addEventListener('touchmove', e => e.preventDefault(), { passive:false });
})();

let tt = null;
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.remove('act'); t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2200); }
// a toast with an Undo button (New game), shown long enough to reach it
let undoFn = null;
function toastUndo(m, fn){ const t = $('#toast'); undoFn = fn; t.innerHTML = esc(m) + '<button class="tundo" data-undo>Undo</button>'; t.classList.add('show', 'act'); clearTimeout(tt);
  tt = setTimeout(() => { t.classList.remove('show', 'act'); undoFn = null; }, 6000); }

/* ---------- events ---------- */
// a quick double tap must not also hit whatever the new screen put under your finger
document.addEventListener('click', e => {
  if(performance.now() - navAt < 350 && !e.target.closest('[data-close]')){ e.preventDefault(); e.stopPropagation(); }
}, true);
document.addEventListener('click', e => {
  const el = e.target.closest('button, [role="button"]');
  if(!el) return;
  const inSheet = !!el.closest('#sheetHost');
  const ds = el.dataset;
  if(el.hasAttribute('data-close')){ closeSheet(); return; }
  if(el.hasAttribute('data-back')){ back(); return; }
  if(el.hasAttribute('data-find')){ focusSearch = true; go({ s:'army', army:army().id }); return; }
  if(ds.army){ go({ s:'units', army:ds.army }); return; }   // an army opens on its Units: what matters at the table
  if(ds.go){ go({ s:ds.go, army:army().id }); return; }
  if(ds.unit){
    const next = { s:'unit', army:army().id, unit:ds.unit };
    if(sameScreen(next, cur)){ if(inSheet) closeSheet(); if(ds.sec) jumpTo(ds.sec, true); else scrollTo(0, 0); return; }
    if(inSheet){ hideSheet(); go(next, 'sheet'); } else go(next);
    if(ds.sec) jumpTo(ds.sec, true);
    return;
  }
  if(ds.grant){ e.preventDefault(); showGrant(ds.grant.split('|'), ds.gu, ds.what, ds.rule || null); return; }
  if(ds.rule){ e.preventDefault(); showRule(ds.rule); return; }
  if(ds.strat){ e.preventDefault(); showStrat(ds.strat); return; }
  if(ds.ability){ showAbility(ds.ability); return; }
  if(ds.enh){ showEnhancement(ds.enh); return; }
  if(ds.kw){ showKeywords(ds.kw); return; }
  if(ds.more){ moreShown.add(ds.more); renderFinder(); return; }
  if(el.hasAttribute('data-sback') && sheetStack.length){ const [l, t, h] = sheetStack.pop(); openSheet(l, t, h, true); return; }
  if(el.hasAttribute('data-verified')){ showVerified(); return; }
  if(ds.tab){
    if(ds.tab === cur.s){ scrollTo(0, 0); return; }
    // another tab: back to the screen you left it on; the tab you are in: its first screen
    const mk = memoKey(army().id, ds.tab), memo = tabOf(cur.s) !== ds.tab && tabMemo[mk] && tabMemo[mk].s !== ds.tab ? tabMemo[mk] : null;
    const next = { s:ds.tab, army:army().id, then:memo }, up = (cur.d || 0) - (cur.root == null ? cur.d || 0 : cur.root);
    if(!isTab(cur.s)) tabMemo[memoKey(cur.army, tabOf(cur.s))] = Object.assign(plain(cur), spot());
    if(up > 0 && !EMBEDDED && history.state && history.state.d === cur.d){ tabTo = next; history.go(-up); return; }   // drop the screens under the old tab
    openTab(next); return;
  }
  if(ds.flip){ go({ s:'unit', army:army().id, unit:ds.flip, from:cur.from }, 'replace'); return; }
  if(ds.tick){
    e.preventDefault();   // a box on an ability row must not open or close it
    const u = usedSet(), k = ds.tick, on = !u.has(k);
    on ? u.add(k) : u.delete(k); store.set(usedKey(), [...u]);
    document.querySelectorAll('[data-tick="' + CSS.escape(k) + '"]').forEach(b => { b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); b.textContent = on ? '✓' : ''; });
    return;
  }
  if(el.hasAttribute('data-newgame')){ const was = [...usedSet()], key = usedKey(); store.set(key, []); rerender();
    toastUndo('New game: uses per battle cleared', () => { store.set(key, was); rerender(); }); return; }
  if(el.hasAttribute('data-undo')){ const f = undoFn; undoFn = null; $('#toast').classList.remove('show', 'act'); if(f){ f(); toast('Ticks restored'); } return; }
  if(el.hasAttribute('data-awake')){ awake.on = !awake.on; store.set('wh-awake', awake.on); if(awake.on) keepAwake(); else if(awake.lock){ awake.lock.release(); awake.lock = null; } rerender(); return; }
  if(el.hasAttribute('data-expand')){
    const cards = $$('#view details.strat');
    const openAll = cards.some(d => !d.open);
    cards.forEach(d => d.open = openAll);
    el.textContent = openAll ? 'Collapse all' : 'Expand all';
  }
});
// remember expanded stratagem cards
document.addEventListener('toggle', e => {
  const d = e.target;
  if(!d.dataset) return;
  if(d.dataset.stratId){
    if(d.open) openStrats.add(d.dataset.stratId); else openStrats.delete(d.dataset.stratId);
    saveSession();
    const x = $('#view [data-expand]');
    if(x) x.textContent = $$('#view details.strat').every(c => c.open) ? 'Collapse all' : 'Expand all';
  }
}, true);
$('#sheetBack').addEventListener('click', closeSheet);
addEventListener('keydown', e => {
  const t = e.target;
  if((e.key === 'Enter' || e.key === ' ') && t.matches && t.matches('[role="button"]')){ e.preventDefault(); t.click(); return; }
  if(e.key !== 'Escape') return;
  if(t.matches && t.matches('input, textarea')){ t.blur(); return; }
  if(!$('#sheetHost').hidden) closeSheet(); else if(cur.s !== 'home') back();
});
addEventListener('resize', measure);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
document.addEventListener('touchstart', () => {}, { passive:true });   // lets :active styles show on iOS

/* ---------- install + live updates ---------- */
const INSTALLED = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const ON_SITE = /github\.io$|^localhost$|^127\.0\.0\.1$/.test(location.hostname);
const SITE_URL = 'https://marastefanic-cmd.github.io/warhammerapp/';
function installText(){
  if(INSTALLED) return 'Installed on this phone. It updates itself each time you open it.';
  if(ON_SITE) return 'Put it on your home screen: Safari → Share → Add to Home Screen.';
  return 'Phone app: open <a class="link" href="' + SITE_URL + '" target="_blank" rel="noopener">' + SITE_URL.replace('https://', '') + '</a> in Safari, then Share → Add to Home Screen.';
}
// the home-screen app has no browser back gesture: swipe in from the left edge to go back
if(INSTALLED){
  let sx = null, sy = 0;
  addEventListener('touchstart', e => { const t = e.touches[0]; sx = t.clientX < 24 && $('#sheetHost').hidden && cur.s !== 'home' ? t.clientX : null; sy = t.clientY; }, { passive:true });
  addEventListener('touchend', e => { if(sx == null) return; const t = e.changedTouches[0]; if(t.clientX - sx > 70 && Math.abs(t.clientY - sy) < 50) back(); sx = null; }, { passive:true });
}
try { if(ON_SITE && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch(e){}
// the installed copy compares its build stamp with the site's. On opening it reloads at once;
// later it waits until you are back on the army list or the menu, so it never moves you mid-read.
let updateReady = null;
// one reload per new version (a retry after two minutes, in case the first got a stale page);
// if nothing can be stored, never reload, rather than reload forever
const RELOAD_KEY = 'wh-reloaded-for';
function reloadedRecently(v){
  for(const k of ['sessionStorage','localStorage']){
    try { const r = JSON.parse(window[k].getItem(RELOAD_KEY) || 'null'); if(r && r.v === v && Date.now() - r.at < 120000) return true; } catch(e){}
  }
  return false;
}
function markReload(v){
  for(const k of ['sessionStorage','localStorage']){
    try { window[k].setItem(RELOAD_KEY, JSON.stringify({ v, at:Date.now() })); if(JSON.parse(window[k].getItem(RELOAD_KEY)).v === v) return true; } catch(e){}
  }
  return false;
}
function reloadNow(){
  if(!markReload(updateReady)){ updateReady = null; return; }
  try { history.replaceState(Object.assign(plain(cur), spot()), ''); } catch(e){}
  saveSession();
  location.reload();
}
async function checkForUpdate(atStart){
  if(!ON_SITE || !BUILD) return;
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache:'no-store' });
    if(!r.ok) return;
    const v = (await r.json()).version;
    if(!v || v === BUILD || reloadedRecently(v)) return;
    updateReady = v;
    if(atStart || (calm(cur) && $('#sheetHost').hidden && document.activeElement !== $('#armyQ'))) reloadNow();
  } catch(e){}
}
function saveSpot(){
  const sp = spot();
  try { if(!(history.state && history.state.sheet)) history.replaceState(Object.assign(plain(cur), sp), ''); } catch(e){}
  store.set('wh-last', Object.assign(plain(cur), sp));
}
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') checkForUpdate(false); else saveSpot(); });
addEventListener('pagehide', saveSpot);

/* ---------- boot ---------- */
try { history.scrollRestoration = 'manual'; } catch(e){}
// keep the current history entry if it is a screen (a reload), otherwise rebuild the last screen's chain
function start(snap){
  const st = history.state;
  if(snap && snap.open){ snap.open.forEach(id => openStrats.add(id)); Object.assign(query, snap.query || {}); }
  if(st && valid(st)){   // a reload: this entry is the screen (with a popup open, the screen under it)
    cur = plain(st);
    if(st.sheet){ try { history.replaceState(plain(cur), ''); } catch(e){} }
    render(); toSpot(st);
  }
  else if(snap && valid(snap.cur)){ restore(snap.cur); toSpot(snap); }
  else { const last = store.get('wh-last'); restore(valid(last) ? last : ONLY ? { s:'units', army:ONLY.id } : { s:'home' }); if(valid(last)) toSpot(last); }
  checkForUpdate(true);
  keepAwake();
}
const hot = window.claude && window.claude.hot;
if(hot && hot.snapshot){ try { hot.snapshot(() => ({ cur:plain(cur), y:scrollY, open:[...openStrats], query })); } catch(e){} }
if(hot && hot.ready) hot.ready(start); else start(hot && hot.data ? hot.data : null);
</script>
