<style>
/* Waaagh Codex: a drill-down reference sheet for one army list.
   Tabs: Pre-game | Units | Stratagems | Rules | Find (search + menu: Ranged, Melee, Abilities,
   Bases); Units -> unit datasheet, which fits one screen with the long text folded away. A sticky
   top bar (back, centred title, search) can carry column labels; each tab remembers its screen. One dark graphite look; orange marks what you can tap
   and what matters. */
:root{
  color-scheme: dark;
  --bg:#161616;
  --surface:#1f1f1f;     /* multi-profile weapons, cards */
  --surface2:#2a2a2a;    /* bands, selected controls */
  --line:#363636;
  --fg:#ededed;
  --fg2:#c4c4c4;         /* weapon keywords */
  --muted:#9c9c9c;
  --accent:#ff8a2a;      /* orange */
  --accent-ink:#1c0d00;  /* text on orange */
  --shadow:0 10px 30px rgba(0,0,0,.5);
  --f-head:'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  --f-body:'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --hdr:53px;            /* measured height of the sticky top bar */
  --bb:0px;              /* measured height of the bottom bar (0 when there is none) */
  --top:calc(env(safe-area-inset-top, 0px) + var(--hdr));
  --safe-b:env(safe-area-inset-bottom, 0px);
}

*{box-sizing:border-box}
html,body{margin:0}
html{touch-action:manipulation}
html.lock, html.lock body{overflow:hidden}
[hidden]{display:none !important}
body{
  background:var(--bg); color:var(--fg);
  font:16px/1.45 var(--f-body);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-bottom:calc(32px + max(var(--bb), var(--safe-b)));
  -webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;
}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); z-index:30; background:var(--bg)}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; text-align:inherit}
input{font:inherit; color:var(--fg)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
b{font-weight:700}
s{text-decoration-thickness:2px; text-decoration-color:var(--accent)}
h1,h2,h3,p{margin:0}
.wrap{max-width:720px; margin:0 auto}
.num{font-variant-numeric:tabular-nums}
[role="button"]{cursor:pointer}

/* ---------- type roles ---------- */
.lbl{font:600 11px/1.2 var(--f-head); letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.note{font-size:13px; line-height:1.4; color:var(--muted); margin-top:10px}
.note.it{font-style:italic; margin-top:0}
.tg{font:600 12px/1.2 var(--f-body); color:var(--accent); white-space:nowrap}
.tg.m{color:var(--muted)}
.link{color:var(--fg); text-decoration:underline dotted; text-decoration-color:var(--accent); text-underline-offset:3px; padding:2px 0 8px}
.link:active{color:var(--accent)}
.chev{width:18px; height:18px; flex:none; color:var(--muted); transition:transform .15s ease}
details[open] > summary .chev{transform:rotate(180deg)}
.go{width:18px; height:18px; flex:none; color:var(--muted); transform:rotate(-90deg)}
summary{list-style:none; cursor:pointer}
summary::-webkit-details-marker{display:none}
.rt p{margin:0 0 5px} .rt p:last-child{margin-bottom:0}
.rt ul{margin:2px 0 5px; padding-left:18px} .rt li{margin:1px 0}
.rt .it{font-style:italic; color:var(--muted)}
b.rl{padding:1px 0 9px; text-decoration:underline dotted; text-decoration-color:var(--accent); text-underline-offset:3px}
.ttable{display:grid; grid-template-columns:auto 1fr; gap:3px 12px; margin-top:6px}
.ttable span:nth-child(odd){font:700 15px var(--f-head); color:var(--accent)}
.tlist{margin-top:6px; display:grid; gap:6px}
.tlist > div{border-left:2px solid var(--line); padding-left:8px}
.tlist b{font:700 15px/1.2 var(--f-head); letter-spacing:.02em; color:var(--fg)}
.tlist > div > b:first-child{color:var(--accent)}
.empty{padding:20px 12px; text-align:center; color:var(--muted)}
.il{font:600 11px/1 var(--f-head); letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-right:6px}
.usedby{font-size:13.5px; color:var(--muted)}
.pg{border-top:1px solid var(--line)}
.pgr{display:grid; grid-template-columns:92px minmax(0,1fr); gap:0 10px; padding:7px 2px 6px; border-bottom:1px solid var(--line)}
.pgk{font:600 11.5px/1.35 var(--f-head); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); padding-top:3px; hyphens:manual}
.pgv{font-size:14.5px; line-height:1.55; min-width:0}
.pgv .from{color:var(--muted)}

/* ---------- top bar ---------- */
.top{position:sticky; top:env(safe-area-inset-top, 0px); z-index:20; background:var(--bg); border-bottom:1px solid var(--line);
  margin:0 calc(-1 * max(16px, env(safe-area-inset-right, 0px))) 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding:0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px))}
.top-in{max-width:720px; margin:0 auto; display:grid; grid-template-columns:minmax(64px,1fr) auto minmax(64px,1fr); align-items:center; gap:8px; min-height:52px}
.back{justify-self:start; display:flex; align-items:center; gap:2px; min-height:44px; max-width:100%; min-width:0; padding-right:6px;
  color:var(--accent); font:700 15px/1 var(--f-head); letter-spacing:.06em; text-transform:uppercase}
.back:active{opacity:.6}
.back svg{width:20px; height:20px; flex:none; margin-left:-4px}
.back span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ttl{min-width:0; max-width:58vw; text-align:center; font:700 clamp(15px, 4.6vw, 18px)/1.05 var(--f-head); letter-spacing:.03em; overflow:hidden; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2}
.icon-btn{justify-self:end; width:44px; height:44px; display:grid; place-items:center; color:var(--fg); margin-right:-10px}
.icon-btn:active{color:var(--accent)}
.icon-btn svg{width:20px; height:20px}
.subbar{padding-bottom:5px}

/* ---------- bottom bar: stratagem filters ---------- */
.bbar{position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--bg); border-top:1px solid var(--line);
  padding:6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + var(--safe-b)) max(16px, env(safe-area-inset-left, 0px))}

/* ---------- lists ---------- */
.list{border-top:1px solid var(--line)}
.row{display:flex; align-items:center; gap:12px; width:100%; min-height:48px; padding:9px 2px; border-bottom:1px solid var(--line); text-align:left}
.row:active, .urow:active, .res:active, .band:active{background:var(--surface)}
.row .ic{width:20px; height:20px; flex:none; color:var(--muted)}
.row .rb{flex:1; min-width:0; display:grid; gap:1px}
.row .rb b{font:700 17px/1.15 var(--f-head); letter-spacing:.02em}
.row .rb span{font-size:13px; color:var(--muted)}
.row .c{font:600 14px var(--f-head); color:var(--muted); font-variant-numeric:tabular-nums}
.grp-h{margin:16px 0 4px}
.pxt{display:flex; flex-wrap:wrap; gap:4px 14px; font:600 15px/1.4 var(--f-head); font-variant-numeric:tabular-nums}
.pxt b{color:var(--accent)}
.px{padding:7px 2px 6px; border-bottom:1px solid var(--line)}
.pxh{display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 8px; margin-bottom:2px}
.pxh .link{font:700 16px/1.2 var(--f-head); letter-spacing:.02em}
.pxl{display:grid; grid-template-columns:96px minmax(0,1fr); gap:6px; font-size:14px; line-height:1.35; padding:1px 0}
.pxn{font:600 14px/1.35 var(--f-head); font-variant-numeric:tabular-nums; color:var(--fg2)}
.pxn b{color:var(--fg)}
.pxm.std{color:var(--muted)}
.pxm i{font-style:normal; color:var(--muted); font-size:12.5px}
.arow{padding:10px 2px 11px}
.arow .rb{gap:5px}
.arow .rb b{display:flex; align-items:baseline; gap:10px; font-size:19px}
.arow .apts{font:600 13px var(--f-head); color:var(--muted); letter-spacing:.02em}
.tags{display:flex; flex-wrap:wrap; gap:4px}
.row .rb .t{font:700 12px/1 var(--f-head); letter-spacing:.06em; text-transform:uppercase; color:var(--fg2); background:var(--surface2); border-radius:5px; padding:4px 6px 3px}
.row .rb .t.f{color:var(--accent-ink); background:var(--accent)}
.row .rb .t.d{color:var(--muted); background:none; box-shadow:inset 0 0 0 1px var(--line)}
.army-sub{font-size:13.5px; line-height:1.4; color:var(--muted)}

/* ---------- search ---------- */
.search{display:flex; align-items:center; gap:8px; margin:12px 0 4px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:0 12px}
.search:focus-within{border-color:var(--accent)}
.search svg{width:18px; height:18px; color:var(--muted); flex:none}
.search input{flex:1; min-width:0; border:0; background:none; padding:11px 0; outline:none}
.search input::placeholder{color:var(--muted)}
.rg{margin-top:12px}
.rg .lbl{padding-bottom:4px; border-bottom:1px solid var(--line)}
.res{display:grid; gap:1px; width:100%; text-align:left; padding:8px 2px; border-bottom:1px solid var(--line)}
.res b{font:700 16.5px/1.15 var(--f-head); letter-spacing:.02em}
.res .s1{font:700 14px/1.3 var(--f-head); letter-spacing:.02em; font-variant-numeric:tabular-nums}
.res span{font-size:13px; line-height:1.35; color:var(--muted)}
.res mark{background:none; color:var(--accent)}
.more{width:100%; min-height:40px; text-align:left; padding:0 2px; font:700 13px var(--f-head); letter-spacing:.06em; text-transform:uppercase; color:var(--accent)}

/* ---------- unit list: a roster table, column labels once in the top bar ---------- */
.urow{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:0 10px; align-items:baseline; width:100%; text-align:left; padding:6px 2px 5px; border-bottom:1px solid var(--line)}
.urow .un{display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 8px; min-width:0}
.urow .un b{font:700 16.5px/1.15 var(--f-head); letter-spacing:.02em}
.urow .un .x{margin-left:0}
.nw{white-space:nowrap}
.urow .pts{font:600 15px var(--f-head); color:var(--muted); font-variant-numeric:tabular-nums}
.urow .meta{grid-column:1 / -1; font-size:12.5px; color:var(--muted); line-height:1.3}
.sline, .uh{display:grid; grid-template-columns:repeat(7, minmax(0, 44px))}
.sline{grid-column:1 / -1; font:700 15px/1.25 var(--f-head); font-variant-numeric:tabular-nums}
.slab{grid-column:1 / -1; display:flex; align-items:center; margin-top:7px; font:700 13px/1.2 var(--f-head); letter-spacing:.07em; text-transform:uppercase; color:var(--fg)}
.slab .x{margin-left:7px; padding:1px 5px 0; font-size:13px}
.urow .un .lead{font:700 16.5px/1.15 var(--f-head); letter-spacing:.02em; color:var(--fg2)}
.urow.att .sline{padding-left:0}
.uh{padding:0 2px; font:600 11px/1 var(--f-head); letter-spacing:.1em; color:var(--muted); text-transform:uppercase}

/* ---------- datasheet ---------- */
.ds-meta{display:flex; flex-wrap:wrap; gap:2px 10px; align-items:baseline; padding:8px 0 6px; font-size:13px; color:var(--muted)}
.statwrap{scroll-margin-top:calc(var(--top) + 4px)}
.st{display:grid; align-items:stretch; border-radius:6px; overflow:hidden; background:var(--surface)}
.st > span{text-align:center; padding:5px 0; font:700 18px/1 var(--f-head); border-top:1px solid var(--line); min-width:0; font-variant-numeric:tabular-nums}
.st > span.h{font:600 11px/1 var(--f-head); letter-spacing:.1em; color:var(--muted); border-top:0; padding:6px 0 4px; background:var(--surface2)}
.st > span.n{text-align:left; padding-left:8px; font:600 14px/1.15 var(--f-head); display:flex; align-items:center; letter-spacing:.01em}
.def{margin-top:6px; border-left:2px solid var(--accent); padding:1px 0 1px 8px; font-size:13px; line-height:1.4}
.def.dmg{border-left-color:var(--muted)}
.dsl{margin-top:5px; font-size:12.5px; color:var(--muted); line-height:1.35}
.dsec{margin-top:12px}
.dsec > .lbl{padding-bottom:3px}
.dline{padding:5px 2px; border-bottom:1px solid var(--line); font-size:14px; line-height:1.5}
.dline .sep{color:var(--muted)}
.lbn{margin-left:8px; text-transform:none; letter-spacing:.02em; font:500 11.5px/1.2 var(--f-head)}
.lbn .link{color:var(--muted)}
.dline .link{white-space:nowrap}
.dsec > .dline:first-child{border-top:1px solid var(--line)}
.dsec + .dsec{margin-top:0}
.dsec + .dsec > .dline:first-child{border-top:0}
/* one-line rows that open: abilities, keywords */
.abl{border-top:1px solid var(--line)}
.ab.pf{border-bottom:1px solid var(--line)}
.ab.pf > summary{min-height:34px}
.ab.pf .pfl{font-size:12.5px; color:var(--fg2)}
.ab.pf .wh.both{position:static; box-shadow:none}
.ab{border-bottom:1px solid var(--line)}
.ab > summary{display:flex; align-items:center; gap:8px; min-height:34px; padding:3px 2px}
.ab > summary:active{background:var(--surface)}
.ab > summary .an{flex:1 1 55%; min-width:0; display:flex; flex-wrap:wrap; align-items:baseline; gap:0 8px}

<script>
'use strict';
const D = window.WH_DATA;
const ONLY = D.armies.length === 1 ? D.armies[0] : null;   // one list: the app opens straight into it
const BUILD = window.WH_BUILD || '';      // set by build.js on the installable copy
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const keep = area => ({
  get(k, d){ try { const v = window[area].getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { window[area].setItem(k, JSON.stringify(v)); } catch(e){} }
});
const store = keep('localStorage'), session = keep('sessionStorage');
try { localStorage.removeItem('wh-layout'); } catch(e){}   // left by an earlier version

const PHASES = [['command','Command','Cmd'], ['movement','Movement','Move'], ['shooting','Shooting','Shoot'], ['charge','Charge','Charge'], ['fight','Fight','Fight']];
const PHASE_NAME = Object.fromEntries(PHASES.map(([k, l]) => [k, l]));
const TURN_NAME = { your:'Your turn', opp:'Their turn', either:'Either turn' };
const ROLE_ORDER = ['Epic Hero','Character','Battleline','Infantry','Mounted','Beast','Swarm','Monster','Vehicle','Dedicated Transport','Fortification','Other'];
const ROLE_LABEL = { 'Epic Hero':'Epic Heroes', 'Character':'Characters', 'Battleline':'Battleline', 'Infantry':'Infantry', 'Mounted':'Mounted', 'Beast':'Beasts', 'Swarm':'Swarms',
  'Monster':'Monsters', 'Vehicle':'Vehicles', 'Dedicated Transport':'Dedicated Transports', 'Fortification':'Fortifications', 'Other':'Other' };
const SCREEN_TITLE = { pregame:'Pre-game', units:'Units', strats:'Stratagems', ranged:'Ranged weapons', melee:'Melee weapons', abilities:'Abilities', rules:'Rules', bases:'Bases & proxies' };
const BACK_TITLE = { pregame:'Pre-game', ranged:'Ranged', melee:'Melee', rules:'Rules', bases:'Bases' };
const HUNTER_KW = 'HUNTER: MONSTER/VEHICLE';
const KEY_LABEL = { range:'RNG', A:'A', BS:'BS', WS:'WS', S:'S', AP:'AP', D:'D' };
// a value or keyword that a rule of the list changes (w.from / s.from, derived from BSData and checked
// against New Recruit's "(…)" marks): accent colour and "+"; tapping it says which rule
const grantAttr = (names, u, what) => ' role="button" tabindex="0" data-grant="' + esc([].concat(names).join('|')) + '" data-gu="' + esc(u.id) + '" data-what="' + esc(what) + '"';
const wideGrant = (names, u) => [].concat(names).every(n => !u.abilities.some(a => a.name === n));
const granted = (x, k, u, html, what) => x.from && x.from[k] ? '<b class="gv' + (wideGrant(x.from[k], u) ? ' w' : '') + '"' + grantAttr(x.from[k], u, what) + '>' + html + '</b>' : html;
const hasGrants = u => [...(u.ranged || []), ...(u.melee || []), ...u.stats].some(x => x.from && Object.keys(x.from).length);
const chev = '<svg class="chev" aria-hidden="true"><use href="#i-down"/></svg>';
const arrow = '<svg class="go" aria-hidden="true"><use href="#i-down"/></svg>';

/* ---------- state ---------- */
const isObj = v => !!v && typeof v === 'object' && !Array.isArray(v);
const hasOwn = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
// filters, open cards and search text last for this session, so an update reload keeps them
const sess = isObj(session.get('wh-session')) ? session.get('wh-session') : {};
const openStrats = new Set(Array.isArray(sess.open) ? sess.open : []);
const query = Object.assign({}, isObj(sess.query) ? sess.query : {});
const saveSession = () => session.set('wh-session', { open:[...openStrats], query });
const moreShown = new Set();                 // search groups you expanded
let focusSearch = false;

/* ---------- tabs ----------
   Tabs at the bottom of every army screen (Pre-game · Units · Turn · Rules · Find), ‹ › between
   datasheets, and tick boxes for the uses a rule allows per battle, kept until New game. */
// the tabs, and which one the current screen belongs to
const TABS = [['pregame', 'i-flag', 'Pre-game'], ['units', 'i-units', 'Units'], ['strats', 'i-cards', 'Stratagems'], ['rules', 'i-book', 'Rules'], ['army', 'i-search', 'Find']];
const isTab = s => TABS.some(([k]) => k === s);
const tabOf = s => ({ unit:'units', bases:'pregame', ranged:'army', melee:'army', abilities:'army' })[s] || s;
const tabBar = () => '<div class="tabs">' + TABS.map(([s, ic, label]) => '<button data-tab="' + s + '"' + (tabOf(cur.s) === s ? ' class="on" aria-current="page"' : '') + '><svg class="ic" aria-hidden="true"><use href="#' + ic + '"/></svg><span>' + label + '</span></button>').join('') + '</div>';
// uses per battle ticked off in this game (Bomb Squig: twice per battle, per unit), per army, until New game
const usedKey = () => 'wh-used-' + (cur.army || '');
const usedSet = () => new Set(Array.isArray(store.get(usedKey())) ? store.get(usedKey()) : []);
// how many uses per battle the printed limit allows, and whether they are the army's or each unit's
function perBattle(x, armyWide){
  const t = [x.tag, x.limit, x.restrictions, x.text, x.effect].filter(Boolean).join(' ');
  const m = /\b(once|twice|three times) per battle\b(?! round)/i.exec(t);
  if(!m) return null;
  return { n:{ once:1, twice:2, 'three times':3 }[m[1].toLowerCase()],
    army:!!armyWide || /per battle\b(?! round)[^.)]*\bper army\b/i.test(t) || /\bone (model|unit) from your army with this ability\b/i.test(t) };
}
// what: the rule's name, for screen readers ("Bomb Squig used, 1 of 2")
const ticks = (key, n, label, what) => { const used = usedSet();
  return '<span class="ticks">' + (label ? '<i>' + esc(label) + '</i>' : '') + Array.from({ length:n }, (_, i) => { const k = key + '#' + i, on = used.has(k);
    return '<button class="tick' + (on ? ' on' : '') + '" data-tick="' + esc(k) + '" aria-pressed="' + on + '" aria-label="' + esc((what ? what + ' used' : 'Used') + (label ? ', ' + label : '') + (n > 1 ? ', ' + (i + 1) + ' of ' + n : '')) + '">' + (on ? '✓' : '') + '</button>'; }).join('') + '</span>'; };
// an ability's boxes on one unit: the army's set, or one set per unit (each copy of a ×N unit)
function abilityTicks(ab, u){
  const pb = perBattle(ab);
  if(!pb || !u || naReason(ab)) return '';
  if(pb.army) return ticks('a:' + ab.name, pb.n, '', ab.name);
  const c = u.copies || 1;
  return Array.from({ length:c }, (_, i) => ticks(copyKey(ab, u, i), pb.n, c > 1 ? 'Unit ' + (i + 1) : '', ab.name)).join('');
}
const copyKey = (ab, u, i) => 'a:' + ab.name + '|' + u.id + ((u.copies || 1) > 1 ? '.' + i : '');
// the units in the order of the Units list, for ‹ › on a datasheet
function unitFlip(u){
  const order = ROLE_ORDER.flatMap(r => army().units.filter(x => (ROLE_ORDER.includes(x.role) ? x.role : 'Other') === r));
  const i = order.indexOf(u), prev = order[i - 1], next = order[i + 1];
  const b = (x, cls, label) => x ? '<button class="flip ' + cls + '" data-flip="' + esc(x.id) + '">' + label + '</button>' : '<span></span>';
  return '<div class="flips">' + b(prev, 'p', '‹ ' + esc(shortName(prev || {}))) + b(next, 'n', esc(shortName(next || {})) + ' ›') + '</div>';
}

/* ---------- navigation ----------
   A screen is { s, army, unit } plus d (its depth) and from (what Back returns to).
   Every step forward is a history entry, so the phone's back gesture walks back up. */
let cur = { s:'home', d:0 };
const plain = c => ({ s:c.s, army:c.army, unit:c.unit, d:c.d || 0, from:c.from, root:c.root });
const sameScreen = (a, b) => a && b && a.s === b.s && a.army === b.army && a.unit === b.unit;
const calm = c => c.s === 'home' || c.s === 'army';   // screens where an update reload loses nothing
// the open folds of the screen, by position (a screen renders the same each time), and putting them back
const openFolds = () => [...document.querySelectorAll('#view details')].map((d, i) => d.open ? i : -1).filter(i => i >= 0);
const reopen = list => { const all = document.querySelectorAll('#view details'); for(const i of list || []) if(all[i]) all[i].open = true; };
const spot = () => ({ y:scrollY, open:openFolds() });
const toSpot = st => { reopen(st && st.open); scrollTo(0, (st && st.y) || 0); };
function parentOf(c){
  if(c.s === 'unit') return { s:'units', army:c.army };
  if(c.s === 'home') return null;
  if(isTab(c.s)) return ONLY ? null : { s:'home' };
  if(c.s === 'bases') return { s:'pregame', army:c.army };
  return { s:'army', army:c.army };
}
function titleOf(c){
  if(c.s === 'home') return 'Armies';
  if(c.s === 'strats') return 'Stratagems';
  if(c.s === 'army') return (armyById(c.army) || {}).name || '';
  if(c.s === 'unit') return ((armyById(c.army) || { units:[] }).units.find(u => u.id === c.unit) || {}).name || '';
  return SCREEN_TITLE[c.s] || '';
}
const backTitle = c => c ? BACK_TITLE[c.s] || titleOf(c) : '';
function valid(c){
  if(!c || !c.s) return false;
  if(c.s === 'home') return true;
  const a = armyById(c.army);
  if(!a) return false;
  if(c.s === 'unit') return a.units.some(u => u.id === c.unit);
  return c.s === 'army' || hasOwn(SCREEN_TITLE, c.s);
}
// mode: push (default) | 'sheet' (replaces an open popup's entry) | 'replace' (no history to go back to)
let navAt = -1e9;   // when the screen last changed under your finger
function go(next, mode){
  navAt = performance.now();
  if(mode !== 'sheet'){ try { history.replaceState(Object.assign(plain(cur), spot()), ''); } catch(e){} }
  const d = mode === 'replace' ? (cur.d || 0) : (cur.d || 0) + 1;
  const from = mode === 'replace' ? (next.from || (next.s === 'home' ? undefined : backTitle(parentOf(next)))) : backTitle(cur);
  const root = isTab(next.s) ? d : next.army === cur.army ? cur.root : undefined;   // the depth of this screen's tab
  if(next.army !== cur.army) moreShown.clear();
  cur = Object.assign(plain(next), { d, from, root });
  try { mode ? history.replaceState(plain(cur), '') : history.pushState(plain(cur), ''); } catch(e){}
  if(updateReady && calm(cur)){ reloadNow(); return; }
  render(); scrollTo(0, 0);
}
let tabTo = null;   // the tab tapped on a screen below another tab; set while history steps back to that tab
const tabMemo = {};  // the last screen of each tab of each army (Units → the datasheet you were on), with its scroll spot
const memoKey = (armyId, tab) => (armyId || '') + '|' + tab;
// a tab's first screen, then the screen you were on in it (pushed, so Back returns to the first screen)
function openTab(t){
  const then = t.then; delete t.then;
  go(t, 'replace');
  if(then && valid(then)){ const keep = Object.assign({}, then); go(Object.assign(plain(then), { from:undefined })); toSpot(keep); }
}
function back(){
  if((cur.d || 0) > 0 && history.state && history.state.d === cur.d && !history.state.sheet){ history.back(); return; }
  const up = parentOf(cur);
  if(up) go(up, 'replace');
}
addEventListener('popstate', e => {
  const st = e.state;
  if(st && st.sheet){ if($('#sheetHost').hidden) history.back(); return; }   // stepped forward onto a closed popup: skip it
  hideSheet();
  navAt = performance.now();
  if(tabTo){ const t = tabTo; tabTo = null; if(valid(st)) cur = plain(st); openTab(t); return; }
  if(!valid(st)){ cur = ONLY ? { s:'units', army:ONLY.id, d:0 } : { s:'home', d:0 }; render(); return; }
  if(sameScreen(st, cur)){ cur.d = st.d || 0; cur.from = st.from; renderTop(); return; }   // only a popup closed
  cur = plain(st);
  if(updateReady && calm(cur)){ reloadNow(); return; }
  render(); toSpot(st);
});
// rebuild the history chain for a screen, so Back works after reopening the app
const EMBEDDED = (() => { try { return window.top !== window.self; } catch(e){ return true; } })();
function restore(target){
  if(EMBEDDED){   // inside the Claude app: don't add entries to the host page's history
    cur = Object.assign(plain(target), { d:0, from:target.s === 'home' ? undefined : backTitle(parentOf(target)) });
    try { history.replaceState(plain(cur), ''); } catch(e){}
    render(); return;
  }
  const chain = [];
  for(let c = target; c; c = parentOf(c)) chain.unshift(plain(c));
  chain.forEach((c, i) => { c.d = i; c.from = i ? backTitle(chain[i - 1]) : undefined; c.root = isTab(c.s) ? i : i ? chain[i - 1].root : undefined; });
  try { history.replaceState(chain[0], ''); for(const c of chain.slice(1)) history.pushState(c, ''); } catch(e){}
  cur = chain[chain.length - 1];
  render();
}

/* ---------- army helpers ---------- */
const armyById = id => D.armies.find(a => a.id === id);
const army = () => armyById(cur.army) || D.armies[0];
const factionOf = a => D.factions[a.faction];
const faction = () => factionOf(army());
const detachmentsOf = a => a.detachments.map(id => Object.assign({ id }, factionOf(a).detachments[id])).filter(d => d.name);
const detachments = () => detachmentsOf(army());
const unitById = id => army().units.find(u => u.id === id);
const hasKw = (u, k) => u.kw.some(x => x.toLowerCase() === k.toLowerCase());
function matches(n, u){
  if(!n) return true;
  if(n.all && !n.all.every(k => hasKw(u, k))) return false;
  if(n.any && !n.any.some(k => hasKw(u, k))) return false;
  if(n.none && n.none.some(k => hasKw(u, k))) return false;
  if(n.unless && matches(n.unless, u)) return false;
  if(n.attached && !u.leads) return false;   // "a friendly attached … unit": one with a leader or support character
  return true;
}
const eligible = (s, a) => (a || army()).units.filter(u => matches(s.needs, u));
function allStratagems(a){
  a = a || army();
  const out = [];
  for(const d of detachmentsOf(a)) for(const s of d.stratagems) out.push(Object.assign({ src:d.name }, s));
  for(const s of D.coreStratagems) out.push(Object.assign({ src:'Core' }, s));
  return out;
}
const usableStrats = a => allStratagems(a).filter(s => eligible(s, a).length);
// units that share a name: the unit they are attached to, then which one ("Mek + Tankbustas (1 of 2)"),
// counted in list order (New Recruit's)
const sameName = (a, b) => (a.short || a.name) === (b.short || b.name) && (a.enhancement || '') === (b.enhancement || '');
function twinOf(u){
  const A = army();
  if(!A || !A.units.includes(u)) return null;
  const same = A.units.filter(x => sameName(x, u));
  if(same.length < 2) return null;
  const twins = same.filter(x => (x.leads || '') === (u.leads || '') && (x.upgrade || '') === (u.upgrade || ''));
  return { lead:u.leads || '', i:twins.indexOf(u) + 1, n:twins.length };
}
const twinLabel = u => { const t = twinOf(u); return !t ? '' : (t.lead ? ' + ' + t.lead : '') + (t.n > 1 ? ' (' + t.i + ' of ' + t.n + ')' : ''); };
const shortName = u => (u.short || u.name) + (u.enhancement && !u.enhOn ? ' · ' + u.enhancement : '') + twinLabel(u);   // an enhancement on another character (enhOn) is not this name's
const unitCount = a => a.units.reduce((t, u) => t + (u.copies || 1), 0);
// "Big Mek ×2, Killa Kans": unit names for a one-line summary
function unitNames(units){
  const n = new Map();
  for(const u of units){ const k = u.short || u.name; n.set(k, (n.get(k) || 0) + 1); }
  return [...n].map(([k, c]) => k + (c > 1 ? ' ×' + c : '')).join(', ');
}
// detachment rules that apply to a unit (by keyword)
const unitDetRules = u => detachments().filter(d => d.rule && d.rule.needs && matches(d.rule.needs, u)).map(d => d.rule);
const allUnitRules = u => u.rules.concat(unitDetRules(u).map(r => r.name).filter(n => !u.rules.includes(n)));
const unitRules = u => allUnitRules(u).filter(r => !inertRule(r));   // the ones that do something in this list
// an army rule that needs units this army doesn't have, e.g. Bondsman with no ARMIGER models
function inertRule(name){
  const r = faction().armyRules.find(x => x.name === name);
  return !!(r && r.needs && !army().units.some(u => matches(r.needs, u)));
}
// an ability that can't be used in this list: the data says why, or it is a Bondsman ability with no ARMIGER
const naReason = ab => ab.na || (/bondsman/i.test(ab.tag || '') && inertRule('Bondsman') ? 'No ARMIGER models in this list' : '');
// rules other units give this one (Ghazghkull's aura, the Dreadherder's re-rolls)
function auraMods(u){
  const out = [];
  for(const src of army().units) for(const m of src.aura || []){
    const self = src === u;
    if((self && m.notSelf) || !matches(m.needs, u)) continue;
    out.push(Object.assign({}, m, { when:self && m.selfWhen ? m.selfWhen : m.when, src }));
  }
  return out;
}
// everything that changes this unit's attacks: its own abilities, detachment rules, auras
// a rule worded for squads ("below Starting Strength") reads in wounds for a one-model unit (r.mod.single):
// {half} = the most wounds it can have left and still be below half-strength
const halfBelow = u => Math.ceil((parseInt(u.stats[0].W, 10) || 0) / 2) - 1;
const singleMod = (m, u) => m.single && modelCount(u) === 1 ? Object.assign({}, m, { when:m.single.when, note:m.single.note.replace('{half}', halfBelow(u)) }) : m;
function unitMods(u, kind){
  const det = unitDetRules(u).filter(r => r.mod).map(r => Object.assign({ from:r.name, rule:r.name }, singleMod(r.mod, u)));
  for(const [k, list] of [['ranged', u.ranged], ['melee', u.melee]]){
    const lance = [...new Set((list || []).filter(w => w.kw.some(x => /^lance/i.test(x))).map(w => w.group || w.name))];
    if(lance.length) det.push({ kind:k, when:'Made a charge move this turn', note:andList(lance) + ' +1 to wound', from:'Lance', rule:'Lance' });
  }
  if(hasKw(u, 'Towering') && !hasKw(u, 'Aircraft') && D.rules['Plunging Fire']) det.push({ kind:'ranged', when:'Visible target within 12" with models on ground level (not AIRCRAFT)', note:'BS improved by 1', from:'Plunging Fire', rule:'Plunging Fire' });
  const strat = allStratagems().filter(s => s.mod && eligible(s).includes(u)).map(s => Object.assign({ from:s.name, strat:s.id, cp:s.cp }, s.mod));
  return (u.mods || []).concat(det, auraMods(u), strat).filter(m => m.kind === kind || m.kind === 'all');
}
// phases and turn: turns can override the turn for one phase ("your Shooting phase or the Fight phase")
const phasesOf = x => x.phases || x.ph || [];
const phTurn = (x, p) => (x.turns && x.turns[p]) || x.turn || 'either';
// start-of-phase rules first, end-of-phase rules last
const timing = text => /^(once per [a-z ]+, )?(at )?(the )?start of/i.test(text || '') ? 0 : /^(once per [a-z ]+, )?(at )?(the )?end of/i.test(text || '') ? 2 : 1;
// "Movement · Their turn", "Any phase · Either turn", "Your Shooting / Fight (either turn)"
function whenTag(x){
  if(x.at) return x.at;
  const ph = phasesOf(x);
  if(!ph.length) return '';
  const t = ph.map(p => phTurn(x, p));
  if(t.every(v => v === t[0])) return (ph.length === PHASES.length ? 'Any phase' : ph.map(p => PHASE_NAME[p]).join(' / ')) + ' · ' + TURN_NAME[t[0]];
  return ph.map((p, i) => t[i] === 'your' ? 'Your ' + PHASE_NAME[p] : t[i] === 'opp' ? 'Their ' + PHASE_NAME[p] : PHASE_NAME[p] + ' (either turn)').join(' / ');
}
// weapons, counting a multi-profile weapon once
function weaponItems(list){
  const items = [];
  for(const w of list || []){
    const last = items[items.length - 1];
    if(w.group && last && last.group === w.group && last.who === w.who) last.profiles.push(w);
    else items.push({ group:w.group, who:w.who, n:w.n, profiles:[w] });
  }
  return items;
}
const weaponCount = (a, kind) => a.units.reduce((t, u) => t + weaponItems(u[kind]).length, 0);
function nameTags(u, opts){
  const t = [];
  if(u.warlord) t.push('<span class="tg">Warlord' + (u.warlordOn ? ' (' + esc(u.warlordOn) + ')' : '') + '</span>');

}
const abilityKey = ab => army().id + '|' + ab.name + '|' + ab.text;
// the units that took an enhancement; an UPGRADE (Supa-snazz Dakka) is on the unit it upgrades, the bodyguard
const holders = (a, name) => a.units.filter(u => u.enhancement === name || u.upgrade === name);
const holderName = (u, name) => u.upgrade === name && u.leads ? u.leads + ' (' + unitLabel(u) + ')' : u.enhOn && name === u.enhancement ? u.enhOn + ' (' + unitLabel(u) + ')' : unitLabel(u);

/* ---------- rules and rich text ---------- */
function ruleFor(label){
  const f = faction();
  let clean = String(label).replace(/^\[|\]$/g, '').replace(/\*$/, '').trim();
  for(const [re, key] of f.aliases || []) if(re.test(clean)){ clean = key; break; }
  const lc = clean.toLowerCase();
  const ar = f.armyRules.find(r => r.name.toLowerCase() === lc);
  if(ar) return { name:ar.name, key:ar.name, text:ar.text, table:ar.table, tableAt:ar.tableAt, missing:ar.missing, note:ar.note, src:f.name + ' army rule' };
  for(const d of detachments()) if(d.rule && d.rule.name.toLowerCase() === lc) return { name:d.rule.name, key:d.rule.name, text:d.rule.text, table:d.rule.table, tableAt:d.rule.tableAt, needs:d.rule.needs, note:d.rule.note, src:d.name + ' detachment rule' };
  const src = key => (D.ruleSrc || {})[key] || 'Core rule';   // the Orks terms say where they come from
  for(const [re, key] of D.ruleAliases) if(re.test(clean)) return { name:clean, key, text:D.rules[key], src:src(key) };
  if(D.rules[clean]) return { name:clean, key:clean, text:D.rules[clean], src:src(clean) };
  return null;
}
const ruleKey = label => (ruleFor(label) || {}).key;
const mentions = (text, key) => new RegExp('\\b' + key.replace(/[-]/g, '.') + '\\b', 'i').test(text);
// the units in this army a core rule applies to: unit rules, weapon keywords, ability text
const CONCEPT = new Set(D.concepts || []);   // general terms (charge, destroyed…) that every unit "uses"
function ruleUsers(key){
  if(CONCEPT.has(key)) return [];
  return army().units.filter(u => unitRules(u).some(r => ruleKey(r) === key) ||
    [...(u.ranged || []), ...(u.melee || [])].some(w => w.kw.some(k => ruleKey(k) === key) || (w.hunter && key === 'Hunter')) ||
    u.abilities.some(ab => mentions(ab.text, key)));
}
// the units that use a core rule, each saying where it has it when that is only in one of its
// abilities ("Big Mek · Dreadherder (Dreadherder)": its Lone Operative is in that enhancement)
function usersVia(label, key){
  const us = ruleUsers(key);
  if(!us.length) return '';
  const own = u => unitRules(u).some(r => ruleKey(r) === key) || [...(u.ranged || []), ...(u.melee || [])].some(w => w.kw.some(k => ruleKey(k) === key) || (w.hunter && key === 'Hunter'));
  return '<p class="usedby"><span class="il">' + label + '</span>' + us.map(u => { if(own(u)) return unitLink(u);
    const abs = u.abilities.filter(ab => mentions(ab.text, key)).map(ab => ab.name);
    return unitLink(u) + (abs.length ? ' <span class="from">(in ' + esc(abs.join(', ')) + ')</span>' : ''); }).join(', ') + '</p>';
}
// **bold** text; bold terms that name a rule (Deep Strike, riled up, …) open it when tapped; ~~struck~~ text
const inline = s => esc(s).replace(/~~(.+?)~~/g, '<s>$1</s>')
  .replace(/\*\*(.+?)\*\*/g, (m, t) => { const r = ruleFor(t); return r && r.key !== sheetRule ? '<b class="rl" role="button" tabindex="0" data-rule="' + t + '">' + t + '</b>' : '<b>' + t + '</b>'; });
function rt(text){
  const lines = String(text || '').split('\n');
  let html = '', list = [];
  const flush = () => { if(list.length){ html += '<ul>' + list.map(l => '<li>' + inline(l) + '</li>').join('') + '</ul>'; list = []; } };
  for(const raw of lines){
    const l = raw.trim();
    if(!l) continue;
    if(l.startsWith('- ')){ list.push(l.slice(2)); continue; }
    flush();
    html += /^\*[^*].*\*$/.test(l) ? '<p class="it">' + inline(l.slice(1, -1)) + '</p>' : '<p>' + inline(l) + '</p>';
  }
  flush();
  return '<div class="rt">' + html + '</div>';
}
const ttable = t => t.some(([k]) => String(k).length > 8)
  ? '<div class="tlist">' + t.map(([k, v]) => '<div><b>' + esc(k) + '</b>' + rt(v) + '</div>').join('') + '</div>'

const unitLink = u => '<span class="link" role="button" tabindex="0" data-unit="' + esc(u.id) + '">' + esc(shortName(u)) + '</span>';
const usedBy = (label, units) => units.length ? '<p class="usedby"><span class="il">' + label + '</span>' + units.map(unitLink).join(', ') + '</p>' : '';

/* ---------- search over everything in one army ---------- */
const KIND_ORDER = ['Units','Weapons','Stratagems','Abilities','Rules'];
// shorthand players type; a value with spaces must appear as that phrase
const SYNONYM = { their:'opponent', strat:'stratagem', strats:'stratagem', fnp:'feel no pain', inv:'invulnerable', invul:'invulnerable', invuln:'invulnerable',
  dev:'devastating', devs:'devastating', ld:'leadership', cqc:'close-quarters', lethals:'lethal hits', sus:'sustained hits', ds:'deep strike', 'lone-op':'lone operative', loneop:'lone operative', dp:'daemon prince', tfex:'tyrannofex' };
// lower-case, no apostrophes, and "waaagh"/"waagh" alike; hyphens are indexed both ways
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\*\*|~~/g, '').replace(/[’‘'`´]/g, '').replace(/a{2,}/g, 'a');
const hay = (...parts) => { const t = norm(parts.filter(Boolean).join(' ')); return t + ' ' + t.replace(/-/g, '') + ' ' + t.replace(/-/g, ' '); };
const statLineText = s => 'M ' + s.M + ' · T ' + s.T + ' · Sv ' + s.Sv + ' · W ' + s.W + ' · Ld ' + s.Ld + ' · OC ' + s.OC + (s.InSv !== '–' ? ' · Inv ' + s.InSv : '');
function weaponStatText(w, kind){
  return [kind === 'ranged' ? w.range : 'Melee', 'A ' + w.A, kind === 'ranged' ? 'BS ' + w.BS : 'WS ' + w.WS, 'S ' + w.S, 'AP ' + w.AP, 'D ' + w.D].join(' · ');
}
const indexCache = new Map();
const abilityIndex = new Map();
function searchIndex(){
  const a = army();
  if(indexCache.has(a.id)) return indexCache.get(a.id);
  const out = [];
  const add = e => { e.hay += ' ' + norm(e.title).replace(/[\s-]/g, ''); out.push(e); };
  for(const u of a.units){
    const st = u.stats.map(s => ['t' + s.T, 'w' + s.W, 'm' + s.M, 'sv' + s.Sv, 'base ' + s.base].join(' ')).join(' ');
    add({ kind:'Units', title:u.name, s1:u.stats.map(statLineText).join(' / '),
      sub:[u.role, u.pts + ' pts', u.warlord ? 'Warlord' : '', u.enhancement, u.leads ? attachText(u) : ''].filter(Boolean).join(' · '),
      hay:hay(u.name, u.short, u.role, u.kw.join(' '), u.models.join(' '), u.enhancement, u.warlord ? 'warlord' : '', unitRules(u).join(' '),
        u.abilities.map(ab => ab.def).join(' '), st, 'stats save toughness wounds move leadership', u.stats.some(s => s.InSv !== '–') ? 'invulnerable' : ''),
      act:{ unit:u.id } });
  }
  // weapons: identical profiles on twin units are listed once
  const wmap = new Map();
  for(const u of a.units) for(const kind of ['ranged','melee']) for(const w of u[kind] || []){
    const title = w.group ? w.group + ' – ' + w.name : w.name;
    const s1 = weaponStatText(w, kind);
    const key = title + '|' + s1 + '|' + u.name;
    const kws = (w.hunter ? [HUNTER_KW] : []).concat(w.kw);
    const vm = (u.mods || []).find(m => m.weapon === w.name && m.set);
    if(wmap.has(key)){ wmap.get(key).units.push(u); continue; }
    const e = { kind:'Weapons', title, s1, units:[u], kws, vm, who:w.who, hay:hay(title, kind, 'weapon', kws.join(' '), u.name, u.short, w.who), act:{ unit:u.id, sec:kind } };
    wmap.set(key, e); add(e);
  }
  for(const e of wmap.values()){
    e.sub = e.units.map(shortName).join(', ') + (e.who && e.who !== e.units[0].name ? ' (' + e.who + ')' : '') + (e.kws.length ? ' · ' + e.kws.join(', ') : '') +
      (e.vm ? ' · ' + Object.entries(e.vm.set).map(([k, v]) => k + ' ' + v).join(' ') + ' ' + e.vm.when : '');
  }
  for(const u of a.units) for(const ab of u.abilities){
    const key = abilityKey(ab);
    if(abilityIndex.has(key)){ abilityIndex.get(key).units.push(u); continue; }
    const e = { kind:'Abilities', title:ab.name, ab, units:[u], hay:hay(ab.name, 'ability', ab.text, ab.tag, ab.who, ab.def, u.name), act:{ ability:key } };
    abilityIndex.set(key, e); add(e);
  }
  for(const e of abilityIndex.values()) e.sub = unitNames(e.units) + (e.ab.tag ? ' · ' + e.ab.tag : '') + (e.ab.ph ? ' · ' + whenTag(e.ab) : '');
  for(const s of allStratagems(a)){
    add({ kind:'Stratagems', title:s.name, sub:s.cp + 'CP · ' + (s.src === 'Core' ? 'Core' : s.src) + ' · ' + stratWhenLine(s) + (eligible(s, a).length ? '' : ' · no unit in this list can use it'),
      hay:hay(s.name, 'stratagem', s.when, s.target, s.effect, s.limit, s.restrictions, s.src, s.src === 'Core' ? 'core' : 'detachment', s.phases.map(p => PHASE_NAME[p]).join(' '), TURN_NAME[s.turn], s.turn === 'opp' ? 'opponent' : ''), act:{ strat:s.id } });
  }
  const f = factionOf(a);
  const tableText = t => (t || []).map(r => r.join(' ')).join(' ');
  for(const r of f.armyRules) add({ kind:'Rules', title:r.name, sub:f.name + ' army rule' + (r.tag ? ' · ' + r.tag : ''), hay:hay(r.name, r.text, tableText(r.table), r.tag, 'army rule', (f.aliases || []).map(x => x[0].source).join(' ')), act:{ rule:r.name } });
  for(const d of detachmentsOf(a)){
    if(d.rule) add({ kind:'Rules', title:d.rule.name, sub:d.name + ' detachment rule', hay:hay(d.rule.name, d.rule.text, tableText(d.rule.table), d.name, 'detachment rule'), act:{ rule:d.rule.name } });
    for(const e of d.enhancements){
      const hs = holders(a, e.name);
      add({ kind:'Rules', title:e.name, sub:(e.upgrade ? 'Upgrade' : 'Enhancement') + ' · ' + d.name + (e.pts ? ' · ' + e.pts + ' pts' : '') + (hs.length ? ' · on ' + hs.map(u => holderName(u, e.name)).join(', ') : ' · not in this list'), hay:hay(e.name, e.text, d.name, 'enhancement', e.upgrade ? 'upgrade' : ''), act:{ enh:d.id + '|' + e.name } });
    }
  }
  for(const key of Object.keys(D.rules)) add({ kind:'Rules', title:key, sub:(D.ruleSrc || {})[key] || 'Core rule', hay:hay(key, D.rules[key], 'core rule keyword'), act:{ rule:key } });
  indexCache.set(a.id, out);
  return out;
}
// a search word close enough to a word in the text: a plural, or 1 typo (2 for long words)
function near(w, t){
  if(w.startsWith(t) || (t.length > 3 && t.endsWith('s') && w.startsWith(t.slice(0, -1)))) return true;
  const k = t.length >= 7 ? 2 : t.length >= 4 ? 1 : 0;
  if(!k || Math.abs(w.length - t.length) > k) return false;
  let prev = Array.from({ length:t.length + 1 }, (x, j) => j);
  for(let i = 1; i <= w.length; i++){
    const row = [i];
    for(let j = 1; j <= t.length; j++) row[j] = Math.min(prev[j] + 1, row[j - 1] + 1, prev[j - 1] + (w[i - 1] === t[j - 1] ? 0 : 1));
    if(Math.min(...row) > k) return false;
    prev = row;
  }
  return prev[t.length] <= k;
}
// wrap each search word found in the title in <mark>, escaping everything else
function highlight(text, toks){
  const parts = toks.filter(t => t.length > 1).map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  if(!parts.length) return esc(text);
  return String(text).split(new RegExp('(' + parts.join('|') + ')', 'gi')).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}
function renderFinder(){
  const res = $('#qres');
  if(!res) return;
  const q = (query[army().id] || '').trim();
  $('#armyMenu').hidden = !!q;
  $('#armyHead').hidden = !!q;
  if(!q){ res.innerHTML = ''; return; }
  // each word as typed, or its shorthand meaning ("their" also finds "opponent", and still "Thin Their Ranks")
  const toks = norm(q).split(/\s+/).filter(t => /[a-z0-9]/.test(t)).map(t => t.replace(/-/g, ''));
  const alts = toks.map(t => hasOwn(SYNONYM, t) ? [t, SYNONYM[t].replace(/-/g, '')] : [t]);
  const nq = toks.join(' ');
  if(!toks.length){ res.innerHTML = '<div class="empty">Type a name, keyword or rule.</div>'; return; }
  const hits = searchIndex().filter(e => alts.every(a => a.some(t => e.hay.includes(t)))).map(e => {
    const tl = norm(e.title).replace(/-/g, '');
    return Object.assign({ score: tl.startsWith(nq) || tl.split(' ').some(w => w.startsWith(nq)) ? 0 : tl.includes(nq) ? 1 : toks.every(t => tl.includes(t)) ? 2 : 3 }, e);
  });
  // nothing found: forgive a plural and a typo or two ("rubrics", "ghazkull")
  if(!hits.length) for(const e of searchIndex()){
    const words = e.words || (e.words = [...new Set(e.hay.split(/[^a-z0-9]+/).filter(Boolean))]);
    if(alts.every(a => a.some(t => words.some(w => near(w, t))))) hits.push(Object.assign({ score:4 }, e));
  }
  for(const [re, key] of faction().aliases || []) if(re.test(q)){
    const r = hits.find(e => e.kind === 'Rules' && e.act.rule === key) || searchIndex().find(e => e.kind === 'Rules' && e.act.rule === key);
    if(r){ const i = hits.indexOf(r); if(i >= 0) hits.splice(i, 1); hits.unshift(Object.assign({}, r, { score:-1 })); }
  }
  if(!hits.length){ res.innerHTML = '<div class="empty">Nothing in ' + esc(army().name) + ' matches “' + esc(q) + '”.</div>'; return; }
  const groups = KIND_ORDER.map(k => ({ k, list:hits.filter(e => e.kind === k).sort((x, y) => x.score - y.score) })).filter(g => g.list.length);
  groups.sort((x, y) => x.list[0].score - y.list[0].score || KIND_ORDER.indexOf(x.k) - KIND_ORDER.indexOf(y.k));
  const words = q.split(/\s+/);
  res.innerHTML = groups.map(g => {
    const limit = moreShown.has(g.k) ? Infinity : 6;
    return '<div class="rg"><div class="lbl">' + g.k + ' · ' + g.list.length + '</div>' +
      g.list.slice(0, limit).map(e => {
        const act = e.act;
        const attrs = act.strat ? 'data-strat="' + esc(act.strat) + '"' : act.rule ? 'data-rule="' + esc(act.rule) + '"' : act.ability ? 'data-ability="' + esc(act.ability) + '"' :
          act.enh ? 'data-enh="' + esc(act.enh) + '"' : 'data-unit="' + esc(act.unit) + '"' + (act.sec ? ' data-sec="' + esc(act.sec) + '"' : '');
        return '<button class="res" ' + attrs + '><b>' + highlight(e.title, words) + '</b>' + (e.s1 ? '<span class="s1">' + esc(e.s1) + '</span>' : '') + '<span>' + esc(e.sub) + '</span></button>';
      }).join('') +
      (g.list.length > limit ? '<button class="more" data-more="' + g.k + '">Show ' + (g.list.length - limit) + ' more</button>' : '') + '</div>';
  }).join('');
}

const UNIT_COLS = ['M','T','SV','W','LD','OC','INV'];
const unitsSubbar = () => '<div class="uh">' + UNIT_COLS.map(c => '<span>' + c + '</span>').join('') + '</div>';
// an attached unit: one line per model profile, each named, with how many models have it
function statLine(u){
  const line = s => '<span class="sline">' + ['M','T','Sv','W','Ld','OC','InSv'].map(k => '<span>' + (s.from && s.from[k] ? '<i class="gvl">' + esc(s[k]) + '</i>' : esc(s[k])) + '</span>').join('') + '</span>';
  if(!u.leads || u.stats.length < 2) return line(u.stats[0]);
  return u.stats.map(s => '<span class="slab">' + esc(s.name).replace(/ ×(\d+)$/, '<span class="x">×$1</span>') + '</span>' + line(s)).join('');
}
function screenUnits(){
  const a = army(), groups = {};
  for(const u of a.units){ const r = ROLE_ORDER.includes(u.role) ? u.role : 'Other'; (groups[r] = groups[r] || []).push(u); }
  return ROLE_ORDER.filter(r => groups[r]).map(r => '<div class="lbl grp-h">' + ROLE_LABEL[r] + '</div><div class="list">' + groups[r].map(u => {
    // one model type: its count goes after the name ("Gretchin ×10"), like a weapon count
    const one = u.models.length === 1 && u.models[0].match(/^(\d+)× /);
    const n = one && one[1] !== '1' ? '<span class="x">×' + one[1] + '</span>' : '';
    const lead = u.leads ? '<span class="lead">+ ' + esc(partsAfter(u).join(' + ')) + '</span>' : '';   // an attached unit names its other parts as loud as its leader
    return '<button class="urow' + (u.leads ? ' att' : '') + '" data-unit="' + esc(u.id) + '"><span class="un"><b>' + esc(u.name) + '</b>' + n + nameTags(u, { noLeads:true }) + lead + '</span>' +
      '<span class="pts">' + esc(u.pts) + (u.copies > 1 ? ' ea' : '') + '</span>' +
      (!one && !u.leads ? '<span class="meta">' + esc(u.models.join(', ')) + '</span>' : '') + statLine(u) + '</button>';
  }).join('') + '</div>').join('');
}

/* ---------- weapon tables ---------- */
const colHeader = kind => '<div class="wh ' + kind + '"><span class="n">Weapon</span>' + (kind === 'ranged' ? ['RNG','A','BS','S','AP','D'] : ['A','WS','S','AP','D']).map(c => '<span>' + c + '</span>').join('') + '</div>';
// where a footnote's rule comes from, as a link to its text
function modFrom(m, u){
  const link = (attr, val, label) => '<span class="link" role="button" tabindex="0" data-' + attr + '="' + esc(val) + '">' + esc(label) + '</span>';
  if(m.rule) return link('rule', m.rule, m.from);
  if(m.strat) return link('strat', m.strat, m.cp + 'CP ' + m.from);
  if(m.src && m.src !== u) return link('unit', m.src.id, m.from);   // the condition already names the unit
  const ab = (m.src || u).abilities.find(a => a.name === m.from);
  return ab ? link('ability', abilityKey(ab), m.from) : esc(m.from);
}
// AP -2 improved by 1 is AP -3
function weaponBlock(it, keys, mods, u){
  const cell = (v, cls) => '<span>' + (cls ? '<i class="' + cls + '">' + esc(v) + '</i>' : esc(v)) + '</span>';
  const wide = keys[0] === 'none';   // datasheet melee rows: no range column, the name can use it
  const row = (label, cells, p) => '<div class="wr' + (p ? ' p' : '') + '"><span class="n' + (wide ? ' n2' : '') + '">' + label + '</span>' + (wide ? cells.slice(1) : cells).join('') + '</div>';
  const gv = (w, k) => granted(w, k, u, esc(w[k]), (KEY_LABEL[k] || k) + ' ' + w[k]);
  const plainCells = w => keys.map(k => '<span>' + gv(w, k) + '</span>');
  const kwl = w => (w.kw || []).length ? '<div class="kwl">' + w.kw.map(x => w.from && w.from[x] ? '<span class="gk' + (wideGrant(w.from[x], u) ? ' w' : '') + '" data-rule="' + esc(x) + '"' + grantAttr(w.from[x], u, x) + '>' + esc(x) + '</span>'
    : '<span role="button" tabindex="0" data-rule="' + esc(x) + '">' + esc(x) + '</span>').join(', ') + '</div>' : '';
  // "Khornate eviscerator ×4": the count wraps with the last word, never alone
  const named = (name, n) => { if(!n) return esc(name); const i = name.lastIndexOf(' '); return esc(name.slice(0, i + 1)) + '<span class="nw">' + esc(name.slice(i + 1)) + '<span class="x">×' + esc(n) + '</span></span>'; };
  const prof = name => '<span class="ar">➤</span>' + esc(name);
  const w0 = it.profiles[0];
  // an ability that changes this weapon against some targets: one row, the value and the change in the cell
  // ("8 (+6)", as the rule says "+6 A"; a set value shows as "8/14")
  const vm = !it.group && mods.find(m => m.weapon === w0.name && m.set);
  if(vm){
    const cells = keys.map(k => vm.set[k] == null ? '<span>' + gv(w0, k) + '</span>' : /^[+-]/.test(vm.set[k]) ? '<span>' + gv(w0, k) + '<i class="hb">(' + esc(vm.set[k]) + ')</i></span>'
      : '<span>' + gv(w0, k) + '<i class="alt">/' + esc(vm.set[k]) + '</i></span>');
    const changed = keys.filter(k => vm.set[k] != null).map(k => KEY_LABEL[k] + ' ' + vm.set[k]).join(', ');
    return row(named(w0.name, w0.n), cells) + kwl(w0) +
      '<div class="varc"><b>' + esc(changed) + '</b> ' + esc(vm.when) + ', ' + esc(vm.note) + ' <span class="from">(' + modFrom(vm, u) + ')</span></div>';
  }
  if(it.group){
    // Hunter weapons: the profile depends on the target; rules that add to Hunter attacks are built in
    const byTarget = it.profiles.some(p => p.hunter);
    const hunterMods = mods.filter(m => m.hunter);
    // several guns under one name, every one of them fired (Nazdreg's Kustom Blasta X): not a choice
    const all = it.profiles.every(p => p.fireAll);
    if(all) return '<div class="wn">' + named(it.group, it.n) + '<small class="uv fa" role="button" tabindex="0" data-rule="Select Weapons">all ' + it.profiles.length + ' can fire</small></div>' +
      it.profiles.map(p => row('<span class="ar">+</span>' + esc(p.name), plainCells(p), true) + kwl(p)).join('');
    return '<div class="wn">' + named(it.group, it.n) + (it.carrier ? '<span class="cr">' + esc(it.carrier) + '</span>' : '') + '<small class="uv" role="button" tabindex="0" data-rule="Select Weapons">' + 'pick one profile' + '</small></div>' +
      it.profiles.map(p => {
        if(!byTarget) return row(prof(p.name), plainCells(p), true) + kwl(p);
        if(!p.hunter) return row(prof(p.name), plainCells(p), true) + kwl(p);
        const cells = keys.map(k => { const d = hunterMods.reduce((t, m) => t + (m.hunter[k] || 0), 0); return d ? '<span>' + gv(p, k) + '<i class="hb">(+' + d + ')</i></span>' : '<span>' + gv(p, k) + '</span>'; });
        return row('<span class="ar">➤</span><span class="link" role="button" tabindex="0" data-rule="Hunter">' + esc(p.name) + '</span><span class="tq">MON/VEH only</span>', cells, true) + kwl(p);
      }).join('');
  }
  return row(named(w0.name, w0.n) + (it.carrier ? '<span class="cr">' + esc(it.carrier) + '</span>' : ''), plainCells(w0)) + kwl(w0);
}
// footnotes: rules with the same condition share one line; a footnote that changes only
// ranged or only melee attacks on a sheet with both says which
// rules and abilities first; stratagems after a thin line per detachment ("Stratagems · Shoota Boyz")
function modLines(mods, u, hasHunter){
  const dets = detachments();
  const detOf = id => { const d = dets.find(x => (x.stratagems || []).some(s => s.id === id)); return d ? d.name : 'Core'; };
  const parts = [[null, mods.filter(m => !m.strat)]];
  for(const m of mods.filter(m => m.strat)){ const k = detOf(m.strat); let p = parts.find(x => x[0] === k); if(!p) parts.push(p = [k, []]); p[1].push(m); }
  const at = k => k === 'Core' ? dets.length : dets.findIndex(d => d.name === k);
  parts.sort((x, y) => (x[0] == null ? -1 : at(x[0])) - (y[0] == null ? -1 : at(y[0])));
  return parts.map(([det, list]) => list.length ? (det ? '<div class="msep">Stratagems · ' + esc(det) + '</div>' : '') + modGroupLines(list, u, hasHunter) : '').join('');
}
function modGroupLines(mods, u, hasHunter){
  const groups = new Map();
  for(const m of mods){ const k = norm(m.when); if(!groups.has(k)) groups.set(k, { when:m.when, items:[] }); groups.get(k).items.push(m); }
  return [...groups.values()].map(g => {
    const named = g.items.length === 1 && g.when.indexOf(g.items[0].from) >= 0 ? g.items[0] : null;
    const when = named ? esc(g.when).replace(esc(named.from), modFrom(named, u)) : esc(g.when);
    return '<div class="mod">' + (g.items.every(m => m.scope === g.items[0].scope) && g.items[0].scope ? '<i class="sc">' + g.items[0].scope + '</i>' : '') +
      '<b>' + when + ':</b> ' + g.items.map(m => (m.scope && !g.items.every(x => x.scope === m.scope) ? '<i class="sc">' + m.scope + '</i>' : '') + (m.who ? esc(m.who) + ' ' : '') + esc(m.note) +
      (m.hunter && hasHunter ? ' (the (+' + Object.values(m.hunter)[0] + ') on the Hunter rows; add it to the other weapons too)' : '') + (m === named ? '' : ' <span class="from">(' + modFrom(m, u) + ')</span>')).join(' · ') + '</div>';
  }).join('');
}
const RANGED_KEYS = ['range','A','BS','S','AP','D'], MELEE_KEYS = ['A','WS','S','AP','D'];
/* Which weapons a model uses together and which are a choice (core rules):
   - ranged: a model shoots with all its ranged weapons, except that a model that is not a
     MONSTER or VEHICLE uses either its close-quarters (pistol) weapons or its other ones
   - melee: a model fights with one melee weapon, plus all of its [EXTRA ATTACKS] weapons
   - a weapon with several profiles: one profile per attack (shown as a shaded block)
   The gear lists in data.js say which models line carries which weapons. */
const itemName = it => it.group || it.profiles[0].name;
const isEA = it => it.profiles.some(w => (w.kw || []).some(k => /^extra attacks/i.test(k)));
const isCQ = it => it.profiles.some(w => (w.kw || []).some(k => /^(close-quarters|pistol)/i.test(k)));
const orList = n => n.length < 2 ? n.join('') : n.slice(0, -1).join(', ') + ' or ' + n[n.length - 1];
const andList = n => n.length < 2 ? n.join('') : n.slice(0, -1).join(', ') + ' and ' + n[n.length - 1];
// the verb opens the Select Weapons rule; with a model's name it reads "Aspiring Sorcerer picks one to shoot:"
function useSentence(set, kind, u, who){
  const nm = list => list.map(it => esc(itemName(it)));
  const v = (lead, third) => (who ? '<b class="m">' + esc(who) + '</b> ' : '') + '<b class="uv" role="button" tabindex="0" data-rule="Select Weapons">' + (who ? third : lead) + '</b>';
  if(kind === 'ranged'){
    const cq = set.filter(isCQ), rest = set.filter(it => !isCQ(it)), big = hasKw(u, 'Monster') ? 'MONSTER' : hasKw(u, 'Vehicle') ? 'VEHICLE' : '';
    // 24.07: one or more [CLOSE-QUARTERS] weapons, or one or more of the others (not MONSTER/VEHICLE models)
    const some = l => l.length > 1 ? 'one or more of ' + andList(nm(l)) : nm(l)[0];
    const cqLink = linkTo('rule', 'Close-quarters', 'Close-quarters');
    if(cq.length && rest.length && !big)
      return v('Can shoot with', 'can shoot with') + ' ' + some(cq) + ' <b>or</b> ' + some(rest) + ', not both (' + cqLink + '); in close-quarters shooting, ' + andList(nm(cq)) + ' only.';
    const guns = modelCount(u) === 1 ? set.reduce((t, it) => t + (+it.n || 1), 0) : set.length;   // a Forgefiend's 2 Hades + 1 cannon
    const w = guns === 2 ? 'one or both' : 'one or more of these';
    return v('Can shoot with ' + w, 'can shoot with ' + w) + (cq.length && rest.length ? ' (' + cqLink + ' does not limit ' + big + ' models)' : '') + '.';
  }
  const ea = set.filter(isEA), other = set.filter(it => !isEA(it));
  const extra = ea.length ? ', <b>plus</b> ' + andList(nm(ea)) + ' on top (extra attacks)' : '';
  if(other.length > 1) return v('Pick one to fight with:', 'picks one to fight with:') + ' ' + orList(nm(other)) + extra + '.';
  if(other.length === 1){ const w = ea.length === 1 ? 'both' : 'all of these'; return v('Fights with ' + w + ':', 'fights with ' + w + ':') + ' ' + nm(other)[0] + extra + '.'; }
  return v('Fights with all of these', 'fights with all of these') + ' (extra attacks).';
}
// the line under a weapons heading that says which of them a model uses
function useLine(items, kind, u, who){
  if(items.length < 2 || !u.gear) return '';
  // in an attached unit, only the models lines of the part that carries these (a character, or the bodyguard)
  const own = i => who == null || whoOfLine(u, i) === who;
  const mine = u.gear.map((g, i) => i).filter(own);   // every models line of this part, with these weapons or not
  // a line's name without " w/…", unless another line shares it (Tankbusta w/ Two Busta Rokkit Launchas)
  const short = i => u.models[i].replace(/^\d+× /, '').replace(/ w\/.*$/, '');
  const nameOf = i => mine.some(j => j !== i && short(j) === short(i)) ? u.models[i].replace(/^\d+× /, '') : short(i);
  // a model with two of one weapon has it twice in its set
  const lines = mine.map(i => ({ i, who:nameOf(i), set:items.flatMap(it => Array(u.gear[i].filter(x => x === itemName(it)).length).fill(it)) })).filter(l => l.set.length);
  const everyLine = lines.length === mine.length;   // "every model" / "per model" only when every models line has some
  const none = everyLine ? '' : '<p class="use"><b class="m">' + andList(mine.filter(i => !lines.some(l => l.i === i)).map(i => esc(nameOf(i)))) + ':</b> none of these.</p>';
  const multi = lines.filter(l => l.set.length > 1);
  // a weapon only one model has, in a squad of mixed loadouts: name that model (the champion's pistol)
  if(lines.length > 1) for(const it of items){ const ls = lines.filter(l => l.set.includes(it)); if(!it.n && !it.carrier && ls.length === 1 && /^1× /.test(u.models[ls[0].i]) && ls[0].set.filter(x => x === it).length === 1) it.carrier = short(ls[0].i); }
  if(!multi.length){
    if(lines.length < 2) return none;
    for(const it of items){ const ls = lines.filter(l => l.set.includes(it)); if(!it.n && ls.length === 1) it.carrier = short(ls[0].i); }   // name the one models line that has it
    return '<p class="use"><b class="m">' + (everyLine ? 'One of these per model' : 'At most one of these per model') + '</b> · ×N = how many the unit has.</p>' + none;
  }
  const key = l => l.set.map(itemName).join('|');
  if(everyLine && multi.length === lines.length && multi.every(l => key(l) === key(multi[0]))) return '<p class="use">' + useSentence(multi[0].set, kind, u) + '</p>';
  const others = multi.length < lines.length;
  if(kind === 'ranged' && !others && everyLine && multi.every(l => /data-rule="Select Weapons">Can shoot with one or (both|more of these)/.test(useSentence(l.set, kind, u))))
    return '<p class="use"><b class="uv" role="button" tabindex="0" data-rule="Select Weapons">Every model can shoot with one or more of its guns</b>.</p>';
  // one sentence per models line that has several (two lines with the same pair are both named)
  return multi.map(l => '<p class="use">' + useSentence(l.set, kind, u, l.who) + '</p>').join('') +
    (others ? '<p class="use"><b class="m">The others:</b> one each (×N = how many the unit has).</p>' : '') + none;
}
function weaponRows(list, keys, mods, u, kind){
  const items = weaponItems(list);
  const whos = [...new Set(items.map(it => it.who || ''))];
  let h = '';
  for(const who of whos){
    const mine = items.filter(it => (it.who || '') === who);
    if(kind === 'melee') mine.sort((x, y) => (isEA(x) ? 1 : 0) - (isEA(y) ? 1 : 0));   // the main weapon first, as the sentence says
    const ul = useLine(mine, kind, u, u.leads && whos.length > 1 ? who : null);
    if(whos.length > 1 && ul.startsWith('<p class="use">') && ul.indexOf('<p', 2) < 0) h += ul.replace('<p class="use">', '<p class="use gw"><span class="who">' + esc(who) + '</span>');
    else h += (whos.length > 1 ? '<div class="who">' + esc(who) + '</div>' : '') + ul;
    for(const it of mine) h += '<div class="wb' + (it.group && !it.profiles.every(p => p.fireAll) ? ' g' : '') + '">' + weaponBlock(it, keys, mods, u) + '</div>';   // shaded = pick one
  }
  return h;
}
// one kind of weapon for one unit (the Ranged and Melee screens)
function weaponTable(list, kind, mods, u){
  // the same footnote from several units (three Meks' Clever Know-wotz) once, as on the datasheet
  const seen = new Set(), notes = mods.filter(m => !(m.weapon && m.set)).filter(m => { const k = [m.from, m.when, m.note].join('|'); return !seen.has(k) && seen.add(k); });
  const hasHunter = (list || []).some(w => w.hunter) && mods.some(m => m.hunter);
  return '<div class="wt ' + kind + '">' + weaponRows(list, kind === 'ranged' ? RANGED_KEYS : MELEE_KEYS, mods, u, kind) +
    (notes.length ? '<div class="mods">' + modLines(notes, u, hasHunter) + '</div>' : '') + '</div>';
}
// the datasheet: ranged and melee in one table with the same columns, each footnote once
function unitWeapons(u){
  const r = u.ranged || [], m = u.melee || [];
  if(!r.length && !m.length) return '';
  const mr = r.length ? unitMods(u, 'ranged') : [], mm = m.length ? unitMods(u, 'melee') : [];
  const head = (id, label, cols, wide) => '<div class="anc" id="sec-' + id + '"></div><div class="wh both"><span class="n' + (wide ? ' n2' : '') + '">' + label + '</span>' + cols.map(c => '<span>' + c + '</span>').join('') + '</div>';
  let h = '<div class="wt both"><!--A-->';
  const rItems = weaponItems(r);
  const pistols = m.length && rItems.length > 1 && rItems.every(isCQ);
  if(pistols){
    const n = new Map();
    for(const it of rItems) n.set(itemName(it), (n.get(itemName(it)) || 0) + (it.n || 1));
    h += '<div class="anc" id="sec-ranged"></div><details class="ab pf"><summary><span class="an"><b class="kh">Ranged</b><span class="pfl">' +
      esc([...n].map(([k, c]) => k + (c > 1 ? ' ×' + c : '')).join(', ')) + ' · all pistols</span></span>' + chev + '</summary>' +
      '<div class="wh both"><span class="n"></span>' + ['RNG','A','BS','S','AP','D'].map(c => '<span>' + c + '</span>').join('') + '</div>' + weaponRows(r, RANGED_KEYS, mr, u, 'ranged') + '</details>';
  } else if(r.length) h += head('ranged', 'Ranged', ['RNG','A','BS','S','AP','D']) + weaponRows(r, RANGED_KEYS, mr, u, 'ranged');
  if(r.length) h += '<!--R-->';
  if(m.length) h += head('melee', 'Melee', ['A','WS','S','AP','D'], true) + weaponRows(m, ['none'].concat(MELEE_KEYS), mm, u, 'melee') + '<!--M-->';
  const key = x => [x.from, x.when, x.note].join('|');
  const inR = new Set(mr.map(key)), inM = new Set(mm.map(key)), seen = new Set(), notes = [];
  const damaged = new Set(u.abilities.filter(ab => ab.damaged).map(ab => ab.name));
  for(const x of mr.concat(mm)){
    const k = key(x);
    if((x.weapon && x.set) || seen.has(k) || damaged.has(x.from)) continue;
    seen.add(k);
    notes.push(Object.assign({}, x, { scope: !r.length || !m.length || (inR.has(k) && inM.has(k)) ? '' : inR.has(k) ? 'Ranged' : 'Melee' }));
  }
  const hasHunter = m.some(w => w.hunter) && mm.some(x => x.hunter);
  // in an attached unit a footnote counts for every model (19.04): say so, or it reads as the last chip's
  const block = (list, label) => !list.length ? '' : (u.leads && !label ? '<div class="who">Whole unit</div>' : '') +
    '<div class="mods' + (label ? ' all' : '') + '">' + (label ? '<span class="il">' + label + '</span>' : '') + modLines(list, u, hasHunter) + '</div>';
  const byWhen = new Map();
  for(const x of notes){ const k = norm(x.when); byWhen.set(k, (byWhen.get(k) || []).concat(x)); }
  const only = sc => [...byWhen.values()].filter(g => g.every(x => x.scope === sc)).flat().map(x => Object.assign({}, x, { scope:'' }));
  const rest = [...byWhen.values()].filter(g => !g.every(x => x.scope && x.scope === g[0].scope)).flat();
  // footnotes for ranged and melee attacks alike go first, so neither phase's reader skips them
  const both = r.length && m.length;
  return h.replace('<!--A-->', both ? block(rest, u.leads ? 'All attacks · whole unit' : 'All attacks') : '').replace('<!--R-->', block(only('Ranged'))).replace('<!--M-->', block(only('Melee'))) + (both ? '' : block(rest)) + '</div>';
}

/* ---------- screen: datasheet ----------
   Everything a player checks mid-game fits on one screen: stats, what protects the unit,
   every weapon and the rules that change its attacks, then one line per ability, the
   unit's rules and stratagems. The full text of anything is one tap away. */
// "Their Movement", "Your Shooting · Fight", "Any phase"
function shortWhen(x){
  const ph = phasesOf(x);
  if(!ph.length) return '';
  if(ph.length === PHASES.length) return 'Any phase';
  return ph.map(p => ({ your:'Your ', opp:'Their ' }[phTurn(x, p)] || '') + PHASE_NAME[p]).join(' · ');
}
// one line per ability: its name and when it triggers; tap to read it
// "Once per battle", "Once per battle round, per army": a limited use is part of the row, not hidden in it
// (from the tag, a "(Once per …)" in the text, or a text that starts "Once per …,")
const onceTag = ab => {
  if(/^(once|twice) per /i.test(ab.tag || '')) return ab.tag.replace(/ · .*$/, '');   // as BSData prints it
  const t = ab.text || '', army = /\bone (model|unit) from your army with this ability\b/i.test(t);
  for(const src of [ab.tag || '', (/\((once per [^)]+)\)/i.exec(t) || [])[1] || '', (/^once per [^,.]+(, per (army|unit))?/i.exec(t) || [])[0] || '']){
    const m = /once per (battle round|battle|phase|turn)(, per (army|unit))?/i.exec(src);
    if(m) return m[0].replace(/^o/, 'O') + (!m[2] && army ? ', per army' : '');
  }
  return '';
};
// abilities of one model (the leader, the champion) or one choice ("Crimson King: pick one") sit
// under its chip, like the weapons; the unit's own come first
function abilityRows(abs, u){
  const whos = [...new Set(abs.map(ab => ab.who || ''))].sort((x, y) => (x ? 1 : 0) - (y ? 1 : 0));
  if(whos.length > 1 || whos[0]) return whos.map(w => (w ? '<div class="who">' + esc(w) + '</div>' : '') + abilityList(abs.filter(ab => (ab.who || '') === w), u)).join('');
  return abilityList(abs, u);
}
function abilityList(abs, u){

/* ---------- screen: bases & proxies ----------
   For proxy models on the right bases: how many bases of each size the army needs, and per
   unit one line per kind of model with what to write on its base. The most common model of a
   squad is "standard"; the others say what they have that it doesn't (a weapon, an icon, the
   champion). Leaders and single models get their name, enhancement and Warlord. */
const modelCount = u => u.models.reduce((t, m) => t + (parseInt(m, 10) || 1), 0);

  const nm = norm(baseName(name));

  const nc = charsOf(u).length;
  if(u.leads && line >= nc && !rows.some(r => r.n === nm)) rows = rows.filter(r => !u.models.slice(0, nc).some(m => r.n === norm(baseName(lineParts(m).name))));
  const pre = (a, b) => { let i = 0; while(i < a.length && a[i] === b[i]) i++; return i; };
  const hit = rows.find(r => r.n === nm) || rows.find(r => nm.startsWith(r.n) || r.n.startsWith(nm)) || rows.slice().sort((x, y) => pre(y.n, nm) - pre(x.n, nm))[0];

  const lines = u.models.map((m, i) => Object.assign(lineParts(m), { gear:(u.gear || [])[i] || [], base:baseOf(u, lineParts(m).name, i) }));
  // the Warlord and the enhancement on the character that has them (warlordOn / enhOn), else the first
  const on = (field, i) => u[field] ? whoOfLine(u, i) === u[field] : i === 0;
  const tagOf = i => [u.warlord && on('warlordOn', i) ? 'Warlord' : '', u.enhancement && on('enhOn', i) ? u.enhancement : ''].filter(Boolean);
  // the unit's short name is the first character's only

  if(lines.length === 1 && lines[0].n === 1) return [Object.assign(lines[0], { mark:own(lines[0], tagOf(0), 0), lead:true })];
  const nc = u.leads ? charsOf(u).length : 0;

  lines.slice(0, nc).forEach((l, i) => Object.assign(l, { mark:own(l, tagOf(i), i), lead:true }));
  const std = body.slice().sort((x, y) => y.n - x.n)[0];

    const more = [...new Set(l.gear)].filter(g => cnt(l.gear, g) > cnt(std.gear, g)).map(g => cnt(l.gear, g) > 1 ? cnt(l.gear, g) + '× ' + g : g);
    // a line named as the standard one: also what it has less of (a Boy with only a Slugga is not "standard")
    const less = named ? [] : [...new Set(std.gear)].filter(g => cnt(l.gear, g) < cnt(std.gear, g)).map(g => cnt(l.gear, g) ? cnt(l.gear, g) + '× ' + g : 'no ' + g);

      lines.map(l => '<div class="pxl"><span class="pxn">' + l.n + '× <b>' + esc(/\d/.test(l.base) ? l.base : 'no base') + '</b></span><span class="pxm' + (l.std ? ' std' : '') + '">' + esc(l.mark) +
